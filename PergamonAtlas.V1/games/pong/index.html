  <style>
    .ph-shell {
      max-width: 100%;
      margin: 0 auto;
    }

    .ttt-hero {
      --hero-gold: #bf7d08;
      --hero-gold-bright: #e2ad35;

      /* Safe responsive grid */
      display: grid;
      position: relative;
      box-sizing: border-box;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      grid-template-columns: minmax(0, 190px) minmax(0, 68px) minmax(0, 1fr) minmax(0, 300px);
      align-items: center;
      min-height: 210px;
      padding: 20px 36px;

      
      background:
        radial-gradient(circle at 18% 50%, rgba(184, 136, 26, 0.06), transparent 29%),
        radial-gradient(circle at 54% 48%, rgba(255, 255, 255, 0.032), transparent 31%),
        linear-gradient(135deg, #111 0%, #151515 45%, #0d0d0d 100%);
      border: 1.5px solid rgba(191, 125, 8, 0.95);
      border-radius: 20px;
      box-shadow:
        inset 0 0 0 1px rgba(184, 136, 26, 0.16),
        inset 0 0 0 8px rgba(0, 0, 0, 0.16),
        inset 0 0 40px rgba(255, 255, 255, 0.028),
        0 8px 22px rgba(0, 0, 0, 0.56);
    }

    .ttt-hero::after {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 7px;
      border: 1px solid rgba(191, 125, 8, 0.62);
      border-radius: 14px;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.035), transparent 12%, transparent 88%, rgba(255,255,255,0.035)),
        repeating-linear-gradient(105deg, rgba(255,255,255,0.016) 0 1px, transparent 1px 5px);
      pointer-events: none;
    }

    .ttt-hero .game-hero-corner { display: none; }

    /* min-width: 0 on every direct child so columns can truly shrink */
    .ttt-hero > * {
      position: relative;
      z-index: 2;
      min-width: 0;
    }

    /* Emblem — place-self: center gives equal left/right spacing inside the column */
    .ttt-hero .game-hero-emblem {
      place-self: center;
      width: 182px;
      height: 182px;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      overflow: visible;
      margin: 0;
    }

    .ttt-hero .game-hero-emblem img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 0 8px rgba(184, 136, 26, 0.18));
    }

    /* Sep fills its column height */
    .ttt-hero .game-hero-sep {
      align-self: stretch;
      width: 100%;
      font-size: 22px;
      color: var(--hero-gold-bright);
    }

    .ttt-hero .game-hero-sep::before,
    .ttt-hero .game-hero-sep::after {
      background: rgba(191, 125, 8, 0.86);
    }

    .ttt-hero .game-hero-sep::before { top: 24px; height: calc(50% - 36px); }
    .ttt-hero .game-hero-sep::after  { bottom: 24px; height: calc(50% - 36px); }

    /* Title — overflow: hidden prevents any bleed into adjacent columns */
    .ttt-hero .game-hero-title {
      overflow: hidden;
      min-width: 0;
      padding: 0 24px 4px;
      container-type: inline-size;
    }

    .ttt-hero .game-hero-title h2 {
      margin: 0 0 18px;
      font-size: clamp(32px, 9cqi, 68px);
      color: #f7f7f7;
      text-shadow: 0 2px 0 rgba(0,0,0,0.65), 0 0 14px rgba(255,255,255,0.18);
      overflow: hidden;
    }

    .ttt-hero .game-hero-sub {
      gap: 18px;
      color: var(--hero-gold-bright);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.15em;
    }

    .ttt-hero .game-hero-sub-line {
      flex: 1;
      max-width: 100px;
      background: rgba(191, 125, 8, 0.95);
      position: relative;
    }

    .ttt-hero .game-hero-sub-line::before,
    .ttt-hero .game-hero-sub-line::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 5px;
      height: 5px;
      background: var(--hero-gold-bright);
      border-radius: 50%;
      transform: translateY(-50%);
    }

    .ttt-hero .game-hero-sub-line::before { left: 0; }
    .ttt-hero .game-hero-sub-line::after  { right: 0; }

    /* Artifact — fills its column, never overflows */
    .ttt-artifact {
      align-self: center;
      width: 100%;
      min-height: 82px;
      border: 1px solid rgba(191, 125, 8, 0.95);
      border-radius: 8px;
      color: #f7f7f7;
      text-decoration: none;
      display: grid;
      grid-template-columns: 40px 1fr;
      align-items: center;
      column-gap: 12px;
      padding: 10px 20px;
      position: relative;
      background: rgba(8, 8, 8, 0.26);
      box-shadow: inset 0 0 16px rgba(184, 136, 26, 0.04);
    }

    .ttt-artifact::before,
    .ttt-artifact::after,
    .ttt-artifact-inner::before,
    .ttt-artifact-inner::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--hero-gold);
      border-style: solid;
      pointer-events: none;
    }

    .ttt-artifact::before       { top: 4px;    left: 4px;   border-width: 1px 0 0 1px; }
    .ttt-artifact::after        { top: 4px;    right: 4px;  border-width: 1px 1px 0 0; }
    .ttt-artifact-inner::before { bottom: 4px; left: 4px;   border-width: 0 0 1px 1px; }
    .ttt-artifact-inner::after  { bottom: 4px; right: 4px;  border-width: 0 1px 1px 0; }

    .ttt-artifact-icon {
      width: 34px;
      height: 34px;
      color: var(--hero-gold-bright);
    }

    .ttt-artifact-inner {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .ttt-artifact-text {
      min-width: 0;
      overflow: hidden;
    }

    .ttt-artifact-label {
      color: var(--hero-gold-bright);
      display: block;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .ttt-artifact-code {
      color: #f7f7f7;
      display: block;
      font-size: 20px;
      line-height: 1;
      text-shadow: 0 1px 0 rgba(0,0,0,0.65), 0 0 10px rgba(255,255,255,0.12);
      white-space: nowrap;
      overflow-wrap: anywhere;
    }

    .ttt-artifact:hover {
      background: rgba(184, 136, 26, 0.08);
      box-shadow: inset 0 0 20px rgba(184, 136, 26, 0.08), 0 0 16px rgba(184, 136, 26, 0.13);
    }

    .ph-card {
      background: white;
      border: 2px solid #000;
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      text-align: center;
    }

    .ph-grid {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      gap: 10px;
      margin: 0 auto 28px;
      width: fit-content;
      background: #111;
      border-radius: 14px;
      padding: 10px;
    }

    .ph-cell {
      width: 80px;
      height: 80px;
      background: #f4f4f4;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
      font-size: 36px;
      font-weight: 700;
      color: #111;
    }

    .ph-cell.dim { color: #ccc; }

    .ph-label {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      margin: 0 0 10px;
      font-family: Georgia, serif;
    }

    .ph-sub {
      font-size: 16px;
      color: #555;
      line-height: 1.7;
      margin: 0 0 24px;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    @media (max-width: 600px) {
      .ph-card { padding: 28px 20px; }

      .ph-grid { grid-template-columns: repeat(3, 64px); }

      .ph-cell {
        width: 64px;
        height: 64px;
        font-size: 28px;
      }
    }

    /* ── ≤1300px: compact 4-column ─────────────────────────── */
    @media (max-width: 1300px) {
      .ttt-hero {
        grid-template-columns: minmax(0, 152px) minmax(0, 52px) minmax(0, 1fr) minmax(0, 240px);
        min-height: 186px;
        padding: 18px 28px;
      }

      .ttt-hero .game-hero-emblem {
        width: 148px;
        height: 148px;
      }

      .ttt-hero .game-hero-sep { font-size: 18px; }
      .ttt-hero .game-hero-sep::before { top: 20px; height: calc(50% - 30px); }
      .ttt-hero .game-hero-sep::after  { bottom: 20px; height: calc(50% - 30px); }

      .ttt-hero .game-hero-title { padding: 0 16px 2px; }

      .ttt-hero .game-hero-title h2 {
        font-size: clamp(24px, 9cqi, 48px);
        margin-bottom: 14px;
      }

      .ttt-hero .game-hero-sub { font-size: 12px; gap: 12px; }
      .ttt-hero .game-hero-sub-line { max-width: 72px; }

      .ttt-artifact { min-height: 68px; grid-template-columns: 32px 1fr; column-gap: 10px; }
      .ttt-artifact-icon { width: 26px; height: 26px; }
      .ttt-artifact-label { font-size: 11px; }
      .ttt-artifact-code { font-size: 17px; }
    }

    /* ── ≤1200px: artifact moves below before the row gets crowded ── */
    @media (max-width: 1200px) {
      .ttt-hero {
        grid-template-columns: minmax(0, 134px) minmax(0, 42px) minmax(0, 1fr);
        grid-template-rows: auto auto;
        min-height: 0;
        height: auto;
        padding: 16px 20px;
        align-items: center;
        border-radius: 16px;
      }

      .ttt-hero::after { inset: 5px; border-radius: 11px; }

      .ttt-hero .game-hero-emblem {
        width: 114px;
        height: 114px;
        grid-column: 1;
        grid-row: 1;
        place-self: center;
      }

      .ttt-hero .game-hero-sep {
        grid-column: 2;
        grid-row: 1;
        font-size: 16px;
      }

      .ttt-hero .game-hero-sep::before { top: 20px; height: calc(50% - 28px); }
      .ttt-hero .game-hero-sep::after  { bottom: 20px; height: calc(50% - 28px); }

      .ttt-hero .game-hero-title {
        grid-column: 3;
        grid-row: 1;
        padding: 6px 0 8px;
        text-align: center;
      }

      .ttt-hero .game-hero-title h2 {
        font-size: clamp(22px, 9cqi, 46px);
        margin-bottom: 10px;
      }

      .ttt-hero .game-hero-sub { font-size: 11px; gap: 10px; }
      .ttt-hero .game-hero-sub-line { max-width: 56px; }

      .ttt-artifact {
        grid-column: 1 / 4;
        grid-row: 2;
        width: 100%;
        min-height: 66px;
        margin-top: 12px;
        grid-template-columns: 36px 1fr;
        column-gap: 10px;
        padding: 10px 18px;
      }

      .ttt-artifact-icon { width: 30px; height: 30px; }
      .ttt-artifact-label { font-size: 12px; margin-bottom: 5px; }
      .ttt-artifact-code { font-size: 19px; }
    }

    /* ── ≤560px: 2-column stack ─────────────────────────────── */
    @media (max-width: 560px) {
      .ttt-hero {
        grid-template-columns: minmax(0, 76px) minmax(0, 1fr);
        grid-template-rows: auto auto;
        padding: 14px 16px;
        border-radius: 14px;
      }

      .ttt-hero .game-hero-emblem {
        width: 76px;
        height: 76px;
        grid-column: 1;
        grid-row: 1;
      }

      .ttt-hero .game-hero-sep { display: none; }

      .ttt-hero .game-hero-title {
        grid-column: 2;
        grid-row: 1;
        padding: 0 0 8px;
        text-align: center;
      }

      .ttt-hero .game-hero-title h2 {
        font-size: clamp(16px, 9cqi, 30px);
        margin-bottom: 8px;
      }

      .ttt-hero .game-hero-sub {
        font-size: 9px;
        gap: 8px;
      }

      .ttt-hero .game-hero-sub-line { max-width: 36px; }

      .ttt-artifact {
        grid-column: 1 / 3;
        grid-row: 2;
        width: 100%;
        margin-top: 12px;
        min-height: 58px;
        grid-template-columns: 30px 1fr;
        column-gap: 10px;
        padding: 9px 14px;
      }

      .ttt-artifact-icon { width: 26px; height: 26px; }
      .ttt-artifact-label { font-size: 10px; }
      .ttt-artifact-code {
        font-size: clamp(13px, 4vw, 17px);
        line-height: 1.15;
        white-space: normal;
      }
    }

    @media (max-width: 390px) {
      .ttt-hero {
        grid-template-columns: minmax(0, 60px) minmax(0, 1fr);
        padding: 12px;
      }

      .ttt-hero .game-hero-emblem {
        width: 60px;
        height: 60px;
      }

      .ttt-hero .game-hero-title h2 {
        font-size: 21px;
      }

      .ttt-hero .game-hero-sub {
        font-size: 8px;
        gap: 6px;
      }

      .ttt-hero .game-hero-sub-line {
        max-width: 22px;
      }

      .ttt-artifact {
        grid-template-columns: 26px minmax(0, 1fr);
        padding: 9px 12px;
      }
    }

    /* ── Catalog art (from games/index.html) ── */
    .ph-art { width: fit-content; margin: 0 auto 28px; background: #111; border-radius: 14px; padding: 10px; }
    .feat-preview-frame { width: 230px; height: 230px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    /* ── TTT mini ── */
    .cat-ttt { display: grid; grid-template-columns: repeat(3, 40px); gap: 6px; background: #111; border-radius: 10px; padding: 8px; border: 2px solid #2a2a2a; }
    .cat-ttt-cell { width: 40px; height: 40px; background: #f4f4f4; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-size: 18px; font-weight: 700; color: #111; }
    .cat-ttt-cell.dim { color: #ccc; }

    /* ── Connect Four mini ── */
    .cat-cf { display: grid; grid-template-columns: repeat(7, 22px); gap: 4px; background: #1f6fab; border-radius: 8px; padding: 6px; }
    .cat-cf-disc { width: 22px; height: 22px; background: rgba(255,255,255,0.08); border-radius: 50%; }
    .cat-cf-disc.r { background: #e63946; }
    .cat-cf-disc.y { background: #f4d03f; }

    /* ── Chess mini ── */
    .cat-ch { display: inline-grid; grid-template-columns: repeat(8, 20px); gap: 0; border: 2px solid #1a1a1a; border-radius: 3px; overflow: hidden; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
    .cat-ch-sq { width: 20px; height: 20px; }
    .cat-ch-sq.light { background: #f0d9b5; }
    .cat-ch-sq.dark  { background: #b58863; }

    /* ── Battleship mini ── */
    .cat-bt { display: grid; grid-template-columns: repeat(10, 14px); gap: 2px; background: #13578a; border-radius: 8px; padding: 5px; }
    .cat-bt-cell { width: 14px; height: 14px; border-radius: 2px; background: rgba(255,255,255,0.05); }
    .cat-bt-cell.ship { background: #6b7280; }
    .cat-bt-cell.hit  { background: #dc2626; }
    .cat-bt-cell.miss { background: #5aa0cc; }

    /* ── Blackjack mini (3×2 card grid) ── */
    .cat-bj2 { display: grid; grid-template-columns: repeat(3, 38px); gap: 5px; background: #1a1a1a; border-radius: 8px; padding: 4px; transform: scale(1.4); }
    .cat-bj2-card { width: 38px; height: 56px; border-radius: 4px; border: 1px solid #ccc; background: white; box-shadow: 0 2px 5px rgba(0,0,0,.3); display: flex; flex-direction: column; justify-content: space-between; padding: 2px 3px; font-family: Georgia, serif; font-size: 10px; font-weight: 700; line-height: 1.2; box-sizing: border-box; }
    .cat-bj2-card.fd { background: #1a3a6b; background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.06) 0 2px, transparent 2px 8px); border-color: #1a3a6b; }
    .cat-bj2-card.r { color: #c0392b; }
    .cat-bj2-card.b { color: #111; }
    .cat-bj2-bot { transform: rotate(180deg); }

    /* ── Snake mini ── */
    .cat-sn { display: grid; grid-template-columns: repeat(12, 15px); gap: 2px; background: #111; border-radius: 8px; padding: 6px; border: 2px solid #2a2a2a; transform: scale(0.9); }
    .cat-sn-cell { width: 15px; height: 15px; border-radius: 3px; background: #1e1e1e; }
    .cat-sn-cell.body { background: #8a611c; }
    .cat-sn-cell.head { background: #f0d39b; }
    .cat-sn-cell.food { background: #e74c3c; border-radius: 50%; }

    /* ── Breakout mini (5×6 brick grid) ── */
    .cat-bk2 { display: inline-flex; flex-direction: column; background: #111; border: 2px solid #2a2a2a; border-radius: 8px; padding: 5px; transform: scale(1.5); }
    .cat-bk2-bricks { display: grid; grid-template-columns: repeat(5, 20px); gap: 3px; }
    .cat-bk2-brick { height: 9px; border-radius: 2px; }
    .cat-bk2-brick.r0 { background: #e74c3c; }
    .cat-bk2-brick.r1 { background: #e67e22; }
    .cat-bk2-brick.r2 { background: #f1c40f; }
    .cat-bk2-brick.r3 { background: #2ecc71; }
    .cat-bk2-brick.r4 { background: #3498db; }
    .cat-bk2-brick.r5 { background: #9b59b6; }
    .cat-bk2-brick.dead { background: transparent; }
    .cat-bk2-field { position: relative; width: 112px; height: 40px; margin-top: 5px; }
    .cat-bk2-ball { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: white; box-shadow: 0 0 4px rgba(255,255,255,0.5); }
    .cat-bk2-paddle { position: absolute; height: 6px; border-radius: 3px; background: #f0d39b; bottom: 0; }

    /* ── Pong mini ── */
    .cat-pong { position: relative; width: 130px; height: 110px; background: #111; border: 2px solid #2a2a2a; border-radius: 6px; overflow: hidden; box-sizing: border-box; transform: scale(1.5); }
    .cat-pong-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.25) 0 6px, transparent 6px 12px); }
    .cat-pong-paddle { position: absolute; width: 6px; height: 28px; background: #f0d39b; border-radius: 3px; }
    .cat-pong-left  { left: 8px; top: 30px; }
    .cat-pong-right { right: 8px; top: 52px; }
    .cat-pong-ball { position: absolute; width: 8px; height: 8px; background: white; border-radius: 50%; left: 62px; top: 48px; box-shadow: 0 0 6px rgba(255,255,255,0.6); }
    .cat-pong-score { position: absolute; top: 6px; font-family: Georgia, serif; font-size: 18px; font-weight: 700; color: rgba(255,255,255,0.4); }
    .cat-pong-score.left  { left: 38px; }
    .cat-pong-score.right { right: 38px; }

    /* ── All Games grid ── */
    .games-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
    .game-card { background: white; border: 2px solid #000; border-radius: 14px; padding: 18px 16px; text-decoration: none; color: inherit; box-shadow: 0 4px 14px rgba(0,0,0,.08); transition: transform .18s, box-shadow .18s, border-color .18s; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
    .game-card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(0,0,0,.12); border-color: #8a611c; }
    .game-icon { font-size: 34px; line-height: 1; }
    .game-card h3 { margin: 0; font-size: 17px; color: #111; font-weight: 700; }

    @media(max-width:1050px) { .games-grid { grid-template-columns: repeat(3,1fr); } }
    @media(max-width:700px)  { .games-grid { grid-template-columns: repeat(2,1fr); } .featured-grid { grid-template-columns: repeat(2,1fr); } }
    @media(max-width:400px)  { .games-grid { grid-template-columns: 1fr; } .featured-grid { grid-template-columns: 1fr; } }
  </style>
