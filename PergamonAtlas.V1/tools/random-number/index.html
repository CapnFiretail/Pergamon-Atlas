  <script>
    loadSnippets('Tools');

    let history = [];
    let usedNumbers = new Set();

    function getRand(min, max) {
      const noRepeat=document.getElementById('optNoRepeat').checked;
      const evenOnly=document.getElementById('optEven').checked;
      const oddOnly=document.getElementById('optOdd').checked;

      let pool = [];
      for(let i=min;i<=max;i++){
        if(evenOnly&&i%2!==0) continue;
        if(oddOnly&&i%2!==1) continue;
        if(noRepeat&&usedNumbers.has(i)) continue;
        pool.push(i);
      }
      if(!pool.length) return null;
      const n=pool[Math.floor(Math.random()*pool.length)];
      if(noRepeat) usedNumbers.add(n);
      return n;
    }

    function generateSingle() {
      const min=parseInt(document.getElementById('minVal').value);
      const max=parseInt(document.getElementById('maxVal').value);
      if(isNaN(min)||isNaN(max)||min>max){return;}
      const n=getRand(min,max);
      if(n===null){usedNumbers.clear();alert('All numbers used! Resetting.');return;}
      document.getElementById('bigNum').textContent=n;
      const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      history.unshift({val:n,time:t});
      if(history.length>50)history.pop();
      renderHistory();
    }

    function generateMulti() {
      const min=parseInt(document.getElementById('minVal').value);
      const max=parseInt(document.getElementById('maxVal').value);
      const count=Math.min(1000,parseInt(document.getElementById('count').value)||5);
      if(isNaN(min)||isNaN(max)||min>max) return;
      const results=[];
      for(let i=0;i<count;i++){
        const n=getRand(min,max);
        if(n===null)break;
        results.push(n);
      }
      const out=document.getElementById('multiOutput');
      out.style.display='block';
      out.textContent=results.join(', ');
      const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      history.unshift({val:'['+results.slice(0,5).join(',')+results.length>5?'…'+']':']',time:t});
      if(history.length>50)history.pop();
      renderHistory();
    }

    function renderHistory() {
      const list=document.getElementById('histList');
      if(!history.length){list.innerHTML='<div style="color:#aaa;font-size:14px">No rolls yet.</div>';return;}
      list.innerHTML=history.map(h=>`<div class="hist-item"><span>${h.val}</span><span class="hist-time">${h.time}</span></div>`).join('');
    }
  </script>
