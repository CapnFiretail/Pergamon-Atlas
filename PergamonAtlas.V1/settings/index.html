<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pergamon Atlas | Settings</title>
  <script src="/scripts/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Roboto+Slab:wght@700;800&display=swap">
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/layout.css">
  <link rel="stylesheet" href="/styles/settings.css">
  <link rel="stylesheet" href="/operation/styles/footer.css">
</head>
<body>
<div class="pa-page">
  <script src="/scripts/layout.js"></script>
  <div class="pa-layout">
    <main class="pa-main settings-main">
      <div class="settings">
        <h1 class="settings-title">Settings</h1>
        <p class="settings-intro">Choose how PergamonAtlas looks on this device.</p>

        <section class="settings-card" aria-labelledby="mode-heading">
          <h2 class="settings-heading" id="mode-heading">Display mode</h2>
          <div class="mode-options" role="radiogroup" aria-labelledby="mode-heading">
            <label class="mode-option">
              <input type="radio" name="mode" value="dark">
              <svg class="pa-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
              <span>Dark</span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="light">
              <svg class="pa-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              <span>Light</span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="system">
              <svg class="pa-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
              <span>System</span>
            </label>
          </div>
          <p class="settings-note" id="mode-note"></p>
        </section>

        <section class="settings-card" aria-labelledby="palette-heading">
          <h2 class="settings-heading" id="palette-heading">Color palette</h2>
          <p class="settings-note" id="palette-note"></p>
          <div class="palette-grid" id="palette-grid"></div>
          <a class="settings-cta" id="palette-cta" href="/account/" hidden>Sign in or create an account to unlock every palette</a>
        </section>

        <p class="settings-storage" id="settings-storage">Saved in this browser only. Your preferences don’t sync to other devices yet.</p>
      </div>
    </main>
  </div>

  <div id="footer-placeholder"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/operation/scripts/auth/supabase-config.js"></script>
<script src="/operation/scripts/auth/supabase.js"></script>
<script src="/operation/scripts/auth/auth.js"></script>
<script src="/scripts/settings.js"></script>
<script src="/operation/scripts/atlas.js"></script>
<script>loadSnippets('Settings');</script>
</body>
</html>
