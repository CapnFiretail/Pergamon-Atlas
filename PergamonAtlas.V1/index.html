<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pergamon Atlas</title>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111111;
      --rule: #e5e5e5;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111111; --ink: #f4f4f4; --rule: #2a2a2a; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, serif;
    }
    .site-header {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 16px;
      border-bottom: 1px solid var(--rule);
    }
    .site-header a {
      color: inherit;
      text-decoration: none;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/">Pergamon Atlas</a>
  </header>
</body>
</html>
