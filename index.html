    /* === Homepage V1 — Admin View hero + Featured Today ===================
       Foundation for a much larger homepage later (featured tools/games,
       catalog quick access, discovery, personalization, IRIS). Structure
       and styling reuse the site's existing dark-card/gold-accent language
       (see .hero-card/.game-hero in main.css) rather than a one-off look —
       these are chrome components, not admin-Appearance-toggle content, so
       (unlike the Tools/Games catalog cards) they don't theme via
       PergamonVisibility.currentAppearance(). ===================== */

    .atlas-hero{
      display:flex;
      align-items:stretch;
      gap:40px;
      margin-bottom:40px;
    }

    .atlas-hero-left{
      flex:1 1 480px;
      min-width:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .atlas-hero-title{
      margin:0 0 12px 0;
      font-size:clamp(40px,6vw,64px);
      line-height:1.05;
      color:#8a611c;
    }

    .atlas-hero-subtitle{
      margin:0 0 28px 0;
      font-size:clamp(17px,2vw,20px);
      color:#444;
    }

    .atlas-hero-search{
      position:relative;
      display:flex;
      align-items:center;
      max-width:560px;
    }

    .atlas-hero-search-icon{
      position:absolute;
      left:20px;
      top:50%;
      transform:translateY(-50%);
      display:flex;
      color:#d6d6d6;
      pointer-events:none;
    }

    .atlas-hero-search input{
      width:100%;
      box-sizing:border-box;
      background:#1b1b1b;
      color:white;
      border:1.5px solid #8a611c;
      outline:none;
      border-radius:999px;
      padding:18px 24px 18px 54px;
      font-size:17px;
      font-family:Georgia, serif;
      transition:border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .atlas-hero-search input::placeholder{
      color:#d8c39a;
      opacity:0.85;
    }

    .atlas-hero-search input:focus{
      background:#202020;
      border-color:#c28a2b;
      box-shadow:0 0 0 3px rgba(194,138,43,0.18);
    }

    .atlas-hero-right{
      flex:1 1 380px;
      min-width:0;
      display:flex;
    }

    /* Placeholder only — swap for real hero art/illustration later. */
    .atlas-hero-placeholder{
      position:relative;
      flex:1;
      min-height:280px;
      background:#131313;
      border:1px solid rgba(184,136,26,0.4);
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .atlas-hero-placeholder svg{
      color:rgba(184,136,26,0.5);
    }

    .atlas-hero-placeholder-label{
      position:absolute;
      right:16px;
      bottom:14px;
      font-size:11px;
      letter-spacing:0.12em;
      text-transform:uppercase;
      color:rgba(255,255,255,0.35);
      font-family:'Courier New', monospace;
    }

    /* Section eyebrow + trailing rule — same pattern as games/index.html's
       .section-label, reused here rather than redefined differently. */
    .section-label{
      display:flex;
      align-items:center;
      gap:12px;
      font-size:12px;
      font-weight:700;
      letter-spacing:0.14em;
      text-transform:uppercase;
      color:#8a611c;
      margin:0 0 16px;
    }

    .section-label::after{
      content:"";
      flex:1;
      height:1px;
      background:#cbb488;
    }

    .featured-today-section{
      margin-bottom:32px;
    }

    .featured-card{
      display:flex;
      align-items:stretch;
      gap:28px;
      background:#131313;
      border:1px solid rgba(184,136,26,0.4);
      border-radius:16px;
      padding:24px;
      text-decoration:none;
      color:inherit;
      transition:transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .featured-card:hover{
      transform:translateY(-3px);
      border-color:#c28a2b;
      box-shadow:0 10px 28px rgba(0,0,0,0.35);
    }

    .featured-card-thumb{
      flex:0 0 220px;
      min-height:150px;
      background:#0d0d0d;
      border:1px solid rgba(184,136,26,0.28);
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .featured-card-thumb svg{
      color:rgba(184,136,26,0.5);
    }

    .featured-card-body{
      flex:1;
      min-width:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .featured-card-eyebrow{
      font-size:12px;
      font-weight:700;
      letter-spacing:0.12em;
      text-transform:uppercase;
      color:#c28a2b;
      margin-bottom:8px;

    .featured-card-title{

      font-size:clamp(22px,3vw,28px);
      color:white;
    }

    .featured-card-desc{
      margin:0 0 20px 0;
      font-size:16px;
      line-height:1.6;
      color:#c9c9c9;
      max-width:560px;
    }

    .featured-card-cta{
      align-self:flex-start;
      display:inline-flex;
      align-items:center;
      gap:8px;
      border:1.5px solid rgba(184,136,26,0.8);
      background:transparent;
      color:rgba(184,136,26,0.9);
      border-radius:999px;
      padding:10px 20px;
      font-family:Georgia, serif;
      font-size:13px;
      letter-spacing:0.08em;
      text-transform:uppercase;
      white-space:nowrap;
      transition:background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .featured-card-cta:hover{
      background:rgba(184,136,26,0.1);
      color:#e8c050;
      box-shadow:0 0 18px rgba(184,136,26,0.22);
    }

    @media (max-width:900px){

      }

    @media (max-width:700px){

      }

        width:100%;
        height:160px;

    }

  <script>
    // Featured Today — V1 renders a single placeholder entry from a plain
    // object. Later this becomes a pick from real Atlas artifacts
    // (entries.js) and can rotate on a schedule without this render
    // function itself needing to change.
    function renderFeaturedArtifact(artifact, containerId){
      const el = document.getElementById(containerId);
      if (!el || !artifact) return;

      el.innerHTML = `
        <a class="featured-card" href="${artifact.path}">
          <div class="featured-card-thumb">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <circle cx="8" cy="9.5" r="1.6"/>
              <path d="M3 17l5.5-5.5a1.5 1.5 0 012.1 0L15 16"/>
              <path d="M13 15l2.4-2.4a1.5 1.5 0 012.1 0L21 16"/>
            </svg>
          </div>
          <div class="featured-card-body">
            <span class="featured-card-eyebrow">Featured Artifact</span>
            <h3 class="featured-card-title">${artifact.title}</h3>
            <p class="featured-card-desc">${artifact.description}</p>
            <span class="featured-card-cta">Explore &#8594;</span>
          </div>
        </a>`;
    }

    const FEATURED_ARTIFACT = {
      title: 'Artifact Title',
      description: 'A short description of the featured artifact goes here.',
      path: '/tools'
    };

    renderFeaturedArtifact(FEATURED_ARTIFACT, 'featured-artifact-slot');

    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
