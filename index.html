<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612"
     crossorigin="anonymous"></script>

  <title>Pergamon Atlas | Home</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    /* =========================
       GLOBAL PAGE STYLES
    ========================== */
    body{
      margin:0;
      font-family:Georgia, serif;
      background-color:#e9e9e9;
    }

    /* =========================
       TOP HEADER / NAV BAR
    ========================== */
    .topbar{
      background-color:#000;
      color:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 30px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:18px;
    }

    .logo-box{
      width:128px;
      height:100px;
      background-color:#222;
      border:2px solid black;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .logo-box img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .brand h1{
      margin:0;
      font-size:64px;
      font-weight:bold;
    }

    .suggest-btn{
      background-color:white;
      color:black;
      border:none;
      padding:12px 20px;
      font-size:18px;
      cursor:pointer;
      border-radius:8px;
    }

    .suggest-btn:hover{
      background-color:#ddd;
    }

    /* =========================
       PAGE LAYOUT
    ========================== */
    .layout{
      display:flex;
      min-height:calc(100vh - 140px);
    }

    /* =========================
       SIDEBAR
    ========================== */
    .sidebar{
      width:220px;
      background-color:#111;
      padding-top:20px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .sidebar a{
      color:white;
      text-decoration:none;
      padding:16px 24px;
      font-size:24px;
      display:block;
      width:100%;
      box-sizing:border-box;
    }

    .sidebar a:hover{
      background-color:#222;
    }

    /* =========================
       SIDEBAR AD SPACE
    ========================== */
    .ad-box{
      width:90%;
      margin:25px auto;
      padding:20px;
      background:#ffffff;
      border-radius:10px;
      border:2px solid #ffffff;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:120px;
      box-sizing:border-box;
      opacity: 0.85;
    }

    .ad-box ins{
      display:block;
      width:100%;
      max-width:100%;
      background-color:#ffffff;
    }

    /* =========================
       MAIN CONTENT AREA
    ========================== */
    .main-content{
      flex:1;
      padding:30px;
      background-color:#e9e9e9;
    }

    .welcome-box{
      background-color:white;
      padding:30px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.12);
    }

    .text{
      background-color:white;
      padding:30px;
      margin-top:20px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.12);
    }
  </style>
</head>

<body>

  <!-- =========================
       TOP HEADER
  ========================== -->
  <div class="topbar">
    <div class="brand">
      <div class="logo-box">
        <img src="/images/logo.png" alt="Pergamon Atlas Logo">
      </div>
      <h1>Pergamon Atlas</h1>
    </div>

    <button class="suggest-btn">Website Suggestions</button>
  </div>

  <!-- =========================
       PAGE LAYOUT
  ========================== -->
  <div class="layout">

    <!-- Sidebar Navigation -->
    <div class="sidebar">
      <a href="/">Home</a>
      <a href="/tools">Tools</a>
      <a href="/games">Games</a>
      <a href="/help">Help</a>

      <div class="ad-box">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-4717716734064612"
             data-ad-slot="8448245585"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="welcome-box">
        <h2>Welcome to Pergamon Atlas</h2>
        <p>Your library of simple, useful tools.</p>
      </div>

      <div class="text">
        <h2>Test</h2>
        <p>test</p>
      </div>
    </div>

  </div>

  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>

</body>
</html>
