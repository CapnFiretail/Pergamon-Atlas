<!DOCTYPE html>
<html>
<head>
  <title>Pergamon Atlas</title>
  <meta charset="UTF-8">

  <style>
    body {
      font-family: Hussar, sans-serif;
      margin: 0;
      background: #f4f4f4;
      color: #111;
    }

    .header {
      text-align: center;
      padding: 80px 20px 60px;
      background: white;
    }

    .header h1 {
      font-size: 56px;
      margin-bottom: 12px;
    }

    .header p {
      font-size: 20px;
      color: #666;
      margin-bottom: 30px;
    }

    .header-links a {
      display: inline-block;
      margin: 0 10px;
      padding: 12px 20px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .primary-button {
      background: black;
      color: white;
    }

    .secondary-button {
      background: #eaeaea;
      color: black;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Pergamon Atlas</h1>
    <p>The Internet’s Library of Tools</p>

    <div class="header-links">
      <a class="primary-button" href="/">Browse Tools</a>
      <a class="secondary-button" href="/">Suggest a Tool</a>
    </div>
  </div>

</body>
</html>
