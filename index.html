<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612"
    crossorigin="anonymous"></script>

  <title>Pergamon Atlas | Home</title>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/styles/header.css">
  <link rel="stylesheet" href="/styles/sidebar.css">
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/footer.css">
  <link rel="stylesheet" href="/styles/updates.css">

  <style>
    .hero-section{ margin-bottom:32px; }

    .hero-card{
      background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);
      color:white;
      border:3px solid #c28a2b;
      border-radius:18px;
      padding:32px;
      box-shadow:0 8px 24px rgba(0,0,0,0.18);
    }

    .hero-eyebrow{
      margin:0 0 10px 0;
      color:#c28a2b;
      font-size:15px;
      letter-spacing:1px;
      text-transform:uppercase;
    }

    .hero-card h2{
      margin:0 0 16px 0;
      font-size:clamp(34px,5vw,56px);
    }

    .hero-text{
      margin:0;
      max-width:760px;
      font-size:19px;
      line-height:1.7;
      color:#f0f0f0;
    }

    .hero-buttons{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      margin-top:24px;
    }

    .atlas-button{
      text-decoration:none;
      font-weight:bold;
      padding:12px 20px;
      border-radius:10px;
      border:2px solid #000;
    }

    .primary-button{ background:#c28a2b; color:#111; }
    .secondary-button{ background:transparent; color:white; border-color:#c28a2b; }

    .feature-section{ margin-bottom:32px; }

    .feature-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
    }

    .feature-box{
      text-decoration:none;
      color:inherit;
      background:#fff;
      border:2px solid #000;
      border-radius:14px;
      padding:24px;
    }

    .feature-box:hover{
      transform:translateY(-4px);
      border-color:#c28a2b;
    }

    .suggestions-section{ margin-bottom:32px; }

    .suggestions-card{
      background:#fff;
      border:2px solid #000;
      border-radius:14px;
      padding:28px;
    }

    .suggestions-link{
      display:inline-block;
      padding:12px 20px;
      border-radius:10px;
      border:2px solid #000;
      background:#c28a2b;
      color:#111;
      text-decoration:none;
      font-weight:bold;
    }

    @media (max-width:768px){
      .feature-grid{ grid-template-columns:1fr; }
      .hero-buttons{ flex-direction:column; }
      .atlas-button{ width:100%; text-align:center; }
    }
  </style>
</head>

<body>

<div id="header-placeholder"></div>

<div class="layout">
<div id="sidebar-placeholder"></div>

<main class="main-content">

<!-- HERO -->
<section class="hero-section">
  <div class="hero-card">
    <p class="hero-eyebrow">A growing digital world</p>
    <h2>Welcome to Pergamon Atlas</h2>
    <p class="hero-text">The Internet's Living Library</p>

    <div class="hero-buttons">
      <a href="/tools" class="atlas-button primary-button">Explore Tools</a>
      <a href="/games" class="atlas-button secondary-button">Play Games</a>
    </div>
  </div>
</section>

<!-- EXPLORE -->
<section class="feature-section">
  <div class="section-header">
    <h2>Explore</h2>
    <p>Start exploring the atlas.</p>
  </div>

  <div class="feature-grid">
    <a href="/tools" class="feature-box"><h3>Tools</h3></a>
    <a href="/games" class="feature-box"><h3>Games</h3></a>
    <a href="/pages/help" class="feature-box"><h3>Suggestions</h3></a>
  </div>
</section>

<!-- UPDATES -->
<section class="updates-section">
  <div class="section-header">
    <h2>Atlas Updates</h2>
    <p>Latest progress.</p>
  </div>

  <div id="updates-placeholder" class="updates-wrap"></div>

  <div style="margin-top:18px;">
    <a href="/pages/updates" class="suggestions-link">View Full Update Log</a>
  </div>
</section>

<!-- SUGGESTIONS -->
<section class="suggestions-section">
  <div class="suggestions-card">
    <h2>Shape the Atlas</h2>
    <p>Help decide what gets built next.</p>
    <a href="/pages/help" class="suggestions-link">Leave a Suggestion</a>
  </div>
</section>

</main>
</div>

<div id="footer-placeholder"></div>

<script src="/data/updates.js"></script>

<script>
function renderUpdates(updates, containerId, limit=null){
  const container=document.getElementById(containerId);
  const list=limit?updates.slice(0,limit):updates;

  container.innerHTML=list.map(u=>`
    <article class="update-card">
      <div class="update-meta">
        <span class="update-date">${u.date}</span>
        <span class="update-tag">${u.tag}</span>
      </div>
      <h3>${u.title}</h3>
      ${u.text?`<p>${u.text}</p>`:""}
      ${u.list?`<ul class="update-list">${u.list.map(i=>`<li>${i}</li>`).join("")}</ul>`:""}
    </article>
  `).join("");
}

renderUpdates(atlasUpdates,'updates-placeholder',3);
</script>

</body>
</html>
