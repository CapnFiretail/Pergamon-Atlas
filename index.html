<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612"
    crossorigin="anonymous"></script>

  <title>Pergamon Atlas | Home</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/styles/header.css">
  <link rel="stylesheet" href="/styles/sidebar.css">
</head>

<body>

  <!-- =========================
       HEADER (LOADED)
  ========================== -->
  <div id="header-placeholder"></div>

  <!-- =========================
       PAGE LAYOUT
  ========================== -->
  <div class="layout">

    <!-- =========================
         SIDEBAR (LOADED)
    ========================== -->
    <div id="sidebar-placeholder"></div>

    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main class="main-content">
    </main>

  </div>

  <!-- =========================
       LOAD SNIPPETS
  ========================== -->
  <script>
    // Load Header
    fetch('/snippets/header.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;

        // Set page-specific title
        document.querySelector('.header-title').textContent = "Pergamon Atlas";
      });

    // Load Sidebar
    fetch('/snippets/sidebar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('sidebar-placeholder').innerHTML = data;
      });

    // Ads
    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>

</body>
</html>
