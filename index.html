<!DOCTYPE html>
<html lang="en">
<head>

  <!-- =========================
       PAGE META INFORMATION
  ========================== -->
  <title>Pergamon Atlas | Home</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>

  /* =========================
     GLOBAL PAGE STYLES
  ========================== */
  body{
    margin:0;
    font-family: Georgia, serif;
    background-color:#e9e9e9;
  }

  /* =========================
     TOP HEADER / NAV BAR
  ========================== */
  .topbar{
    background-color:#000;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 30px;
  }

  /* Brand container (logo + title) */
  .brand{
    display:flex;
    align-items:center;
    gap:18px;
  }

  /* Logo placeholder box */
  .logo-box{
    width:128px;
    height:100px;
    background-color:#222;
    border:2px solid black;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    color:white;
    overflow:hidden;
  }  

.logo-box img{
  width:100%;
  height:100%;
  object-fit:scale-down;
}

  /* Site title */
  .brand h1{
    margin:0;
    font-size:64px;
    font-weight:bold;
  }

  /* Suggestion button */
  .suggest-btn{
    background-color:white;
    color:black;
    border:none;
    padding:12px 20px;
    font-size:18px;
    cursor:pointer;
    border-radius:8px;
  }

  .suggest-btn:hover{
    background-color:#ddd;
  }

  /* =========================
     PAGE LAYOUT
     Sidebar + Main Content
  ========================== */
  .layout{
    display:flex;
    min-height:calc(100vh - 110px);
  }

  /* =========================
     SIDEBAR NAVIGATION
  ========================== */
  .sidebar{
    width:220px;
    background-color:#111;
    padding-top:20px;
    display:flex;
    flex-direction:column;
  }

  /* Sidebar links */
  .sidebar a{
    color:white;
    text-decoration:none;
    padding:16px 24px;
    font-size:24px;
    display:block;
  }

  .sidebar a:hover{
    background-color:#222;
  }

  /* =========================
     SIDEBAR AD SPACE
  ========================== */
  .ad-box{
    width:90%;
    height:200px;
    margin-top:20px;
    background-color:#333;
    color:white;
    padding:20px 1px;
    border-radius:8px;
    text-align:center;
    font-size:18px;
    border:2px solid white;
    margin-left:auto;
    margin-right:auto;
  }

  /* =========================
     MAIN CONTENT AREA
  ========================== */
  .main-content{
    flex:1;
    padding:30px;
    background-color:#e9e9e9;
  }

  /* Welcome message box */
  .welcome-box{
    background-color:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
  }

  </style>
</head>

<body>

  <!-- =========================
       TOP HEADER
  ========================== -->
  <div class="topbar">

    <div class="brand">
      <div class="logo-box">
        <img src="/images/logo.png" alt="Pergamon Atlas Logo">
      </div>
      <h1>Pergamon Atlas</h1>
    </div>

    <button class="suggest-btn">Website Suggestions</button>

  </div>

  <!-- =========================
       PAGE LAYOUT
  ========================== -->
  <div class="layout">

    <!-- Sidebar Navigation -->
    <div class="sidebar">

      <a href="/">Home</a>
      <a href="/tools">Tools</a>
      <a href="/games">Games</a>
      <a href="/help">Help</a>

      <div class="ad-box">Ad Space</div>

    </div>

    <!-- Main Content -->
    <div class="main-content">

      <div class="welcome-box">
        <h2>Welcome to Pergamon Atlas</h2>
        <p>Your library of simple, useful tools.</p>
      </div>

    </div>

  </div>

</body>
</html>
