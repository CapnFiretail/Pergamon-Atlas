  <style>
    .public-hero{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;

      padding:48px 24px;

      color:#8a611c;
      letter-spacing:0.5px;
    }

    .public-hero-tagline{

      color:#666;
    }

    /* === Homepage V7 — Admin View dark hero: Quick Access + Featured Today =
       First Pergamon Atlas page to use a dark visual language. This
       iteration removed the homepage hero search field (the global header
       search is unchanged) and put a compact Quick Access card row in its
       place, and slimmed the hero image to a thin editorial banner so the
       hero reads as a short horizontal band. Scoped
       exclusively to this page: body.pa-admin-dark is added by this page's
       own script (see the DOMContentLoaded handler near the bottom) only
       after PergamonVisibility resolves view === 'admin' — the selector
       below only ever matches when that class is present, so no shared
       stylesheet changes and no other Atlas page is affected. Default
       (class absent) keeps today's light .main-content, so guests/users
       and the moment before JS resolves both fail safely to light.
       Colors reuse the dark-mode tokens already established for the
       Tools/Games catalog cards' Admin Appearance (see
       #tc-list[data-theme="dark"] in tools/index.html) rather than a new
       palette: ivory #f5efe2, muted #a3a3a3, gold accent #e0b34a. This is
       a fixed design for the admin homepage, independent of that
       Light/Dark Appearance *preference* (Settings), which stays scoped
       to the catalog cards it already governs. ========================= */

    body.pa-admin-dark .main-content{
      background:#121110;
    }

    /* Shared framed-panel treatment — both the hero and the Featured
       Today card use this so the homepage reads as one designed
       composition rather than loose content on a dark field: a surface
       one step lighter than the page background, a thin gold-tinted
       border, and a restrained radius (no big rounded "SaaS card"). */
    .pa-panel{
      border:1px solid rgba(224,179,74,0.18);
      background:#161310;
      border-radius:10px;
    }

    .atlas-hero{
      display:flex;
      flex-direction:column;
      gap:26px;
      padding:28px 40px;
      margin-bottom:28px;
    }

    /* Top band: identity text on the left, thin banner image on the right.
       Its height is driven by the text block — the image is capped and
       centered so it never forces the hero taller (see .atlas-hero-image). */
    .atlas-hero-top{
      display:flex;
      align-items:center;
      gap:48px;
    }

    .atlas-hero-left{
      flex:1.5 1 380px;
      min-width:0;
    }

    .atlas-hero-eyebrow{
      display:block;
      margin:0 0 10px;
      font-size:13px;
      font-weight:700;
      letter-spacing:0.26em;
      text-transform:uppercase;
      color:#e0b34a;
    }

    .atlas-hero-title{
      margin:0 0 8px 0;
      font-size:clamp(44px,5.2vw,64px);
      line-height:1.05;
      color:#f5efe2;
    }

    .atlas-hero-subtitle{
      margin:0;
      font-size:clamp(19px,1.8vw,22px);
      color:#a3a3a3;
    }

    /* Quick Access — a compact row of navigation cards that replaces the
       old homepage hero search field (search still lives in the global
       header). Sits inside the hero panel, below the identity band, so it
       reads as part of the hero composition rather than a separate
       section. Each card: gold sidebar-style icon · title + one-line
       description · a chevron that nudges right on hover. Reuses .pa-panel
       for the surface and the sidebar's existing inline SVG icons — no new
       icon library. */
    .quick-access{
      display:flex;
      gap:14px;
    }

    .qa-card{
      flex:1 1 0;
      min-width:0;
      display:flex;
      align-items:center;
      gap:14px;
      padding:15px 18px;
      text-decoration:none;
      transition:border-color 0.2s ease, background-color 0.2s ease;
    }

    .qa-card:hover{
      border-color:rgba(224,179,74,0.55);
      background:#1a1611;
    }

    .qa-card-icon{
      flex:0 0 auto;
      display:flex;
      color:#e0b34a;
    }

    .qa-card-body{
      flex:1;
      min-width:0;
    }

    .qa-card-title{
      display:block;
      font-size:15px;
      color:#f5efe2;
      margin-bottom:2px;
    }

    .qa-card-desc{
      display:block;
      font-size:12.5px;
      line-height:1.4;
      color:#a3a3a3;
    }

    .qa-card-chevron{
      flex:0 0 auto;
      display:flex;
      color:#8f877a;
      transition:color 0.2s ease, transform 0.2s ease;
    }

    .qa-card:hover .qa-card-chevron{
      color:#e0b34a;
      transform:translateX(2px);
    }

    .atlas-hero-right{
      flex:1 1 300px;
      min-width:0;
      display:flex;
    }

    /* Reserved space only — replace this div's content with a real
       <img src="..." alt="..."> (or set a background-image on it) once
       real hero art is ready. No icon/label/gradient by design; it exists
       purely to hold the layout's proportions until then.
       Deliberately a wide, thin editorial banner: a low aspect-ratio plus
       a max-height cap and align-self:center mean the image sizes from the
       column width but stops well short of the text height, so the hero
       stays a short horizontal band rather than a tall illustration. */
    .atlas-hero-image{
      flex:1;
      aspect-ratio:3.2 / 1;
      max-height:132px;
      align-self:center;
      background:#1c1c1a;
      border-radius:8px;
    }

    /* Section eyebrow + trailing rule. */
    .section-label{
      display:flex;
      align-items:center;
      gap:14px;
      font-size:12px;
      font-weight:700;
      letter-spacing:0.24em;
      text-transform:uppercase;
      color:#e0b34a;
      margin:0 0 16px;
    }

    .section-label::after{
      content:"";
      flex:1;
      height:1px;
      background:rgba(224,179,74,0.25);
    }

    .featured-today-section{
      margin-bottom:24px;
    }

    .featured-card{
      display:flex;
      align-items:center;
      gap:24px;
      padding:24px 28px;
      text-decoration:none;
      color:inherit;
    }

    /* Chess Forge thumbnail. Same box as before, but now filled with the
       exact checkerboard component the Games catalog already uses to
       represent Chess Forge (see .cat-ch/.cat-ch-sq in games/index.html)
       instead of a plain placeholder — reusing the real existing asset
       rather than sourcing/generating one. Copied here (not shared via a
       stylesheet) since this codebase already scopes these small catalog
       components per-page, same as .section-label above. Oversized and
       centered/clipped to fill the box the way object-fit: cover would
       for a real image, so it still works at any breakpoint's thumbnail
       aspect ratio (see the ≤600px override below). */
    .featured-card-thumb{
      position:relative;
      overflow:hidden;
      flex:0 0 140px;
      aspect-ratio:4 / 3;
      background:#1c1c1a;
      border-radius:6px;
    }

    .featured-card-thumb .cat-ch{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      width:200%;
      height:200%;
      display:grid;
      grid-template-columns:repeat(8, 1fr);
      grid-template-rows:repeat(8, 1fr);
    }

    .featured-card-thumb .cat-ch-sq.light{ background:#f0d9b5; }
    .featured-card-thumb .cat-ch-sq.dark{ background:#b58863; }

    .featured-card-body{
      flex:1;
      min-width:0;
    }

    .featured-card-eyebrow{
      display:block;
      font-size:11px;
      font-weight:700;
      letter-spacing:0.18em;
      text-transform:uppercase;
      color:#e0b34a;
      margin-bottom:6px;
    }

    .featured-card-title{
      margin:0 0 6px 0;
      font-size:clamp(19px,2vw,23px);
      color:#f5efe2;
    }

    .featured-card-desc{
      margin:0 0 14px 0;
      font-size:14px;
      line-height:1.55;
      color:#a3a3a3;
      max-width:520px;
    }

    .featured-card-cta{
      display:inline-flex;
      align-items:center;
      gap:7px;
      border:1px solid rgba(224,179,74,0.5);
      background:transparent;
      color:#e0b34a;
      border-radius:999px;
      padding:7px 15px;
      font-family:Georgia, serif;
      font-size:11px;
      letter-spacing:0.06em;
      text-transform:uppercase;
      white-space:nowrap;
      transition:background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .featured-card:hover .featured-card-cta{
      background:rgba(224,179,74,0.1);
      border-color:#e0b34a;
      color:#f0c161;
    }

    @media (max-width:900px){
      .atlas-hero{
        gap:24px;
        padding:24px 20px;
      }

      /* Collapse the identity band to a single column. .atlas-hero-left/
         -right's flex-basis values mean WIDTH in the desktop row above —
         stacked, those same values would be read as a HEIGHT (column
         mode's main axis): the text block stretches past its content (a
         dead gap before the image) and the image fights its aspect-ratio.
         Reset both to size from actual content instead. */
      .atlas-hero-top{
        flex-direction:column;
        align-items:stretch;
        gap:22px;
      }

      .atlas-hero-left,
      .atlas-hero-right{
        flex:none;
      }

      .atlas-hero-image{
        width:100%;
        max-height:180px;
      }

      /* Cards wrap to a 2-up grid, then a single column on narrow phones. */
      .quick-access{
        flex-wrap:wrap;
      }

      .qa-card{
        flex:1 1 calc(50% - 7px);
      }
    }

    @media (max-width:560px){
      .qa-card{
        flex-basis:100%;
      }
    }

    @media (max-width:600px){
      .featured-card{
        flex-direction:column;
        align-items:stretch;
        padding:20px;
      }

      .featured-card-thumb{
        flex:none;
        width:100%;
        aspect-ratio:16 / 9;
      }
    }

    /* === end Homepage V7 ==================================================== */

  </style>

  <script>
    // Featured Today — V1 renders a single placeholder entry from a plain
    // object. Later this becomes a pick from real Atlas artifacts
    // (entries.js) and can rotate on a schedule without this render
    // function itself needing to change.
    // Builds the same 8x8 checkerboard markup the Games catalog already
    // uses to represent Chess Forge (see .cat-ch in games/index.html) —
    // reusing that existing component rather than sourcing/generating an
    // image. Swap this out (or make it artifact-driven) once a real
    // artifact thumbnail image exists.
    function chessboardSquares(){
      let html = '';
      for (let r = 0; r < 8; r++){
        for (let c = 0; c < 8; c++){
          html += `<div class="cat-ch-sq ${(r + c) % 2 === 0 ? 'dark' : 'light'}"></div>`;
        }
      }
      return html;
    }

    function renderFeaturedArtifact(artifact, containerId){
      const el = document.getElementById(containerId);
      if (!el || !artifact) return;

      el.innerHTML = `
        <a class="featured-card pa-panel" href="${artifact.path}">
          <div class="featured-card-thumb">
            <div class="cat-ch">${chessboardSquares()}</div>
          </div>
          <div class="featured-card-body">
            <span class="featured-card-eyebrow">Featured Artifact</span>
            <h3 class="featured-card-title">${artifact.title}</h3>
            <p class="featured-card-desc">${artifact.description}</p>
            <span class="featured-card-cta">Explore &#8594;</span>
          </div>
        </a>`;
    }

    const FEATURED_ARTIFACT = {
      title: 'Chess Forge',
      description: 'Play. Learn. Improve. A new way to experience chess on the Atlas.',
      path: '/chess-forge/'
    };

    renderFeaturedArtifact(FEATURED_ARTIFACT, 'featured-artifact-slot');

    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>

<script>
  // Switches between the minimal public homepage and the full
  // developmental homepage based on the resolved Public/Admin view. The
  // sidebar/header/footer placeholders already get this via atlas.js;
  // this page's own body content needs the same call since it isn't
  // inside one of those placeholders.
  //
  // applyNavVisibility() resolves to the current view ('admin'/'public');
  // toggling body.pa-admin-dark on it is what scopes this page's dark
  // homepage styling (see the "Homepage V2" block above) to an actual
  // resolved admin session in Admin View — never guests/users, and never
  // before this resolves, so it fails safely to today's light look.
  document.addEventListener('DOMContentLoaded', function () {
    waitForPergamonVisibility().then(function (pv) {
      if (!pv) return;
      pv.applyNavVisibility(document).then(function (view) {
        document.body.classList.toggle('pa-admin-dark', view === 'admin');
      });
    });
  });
</script>
