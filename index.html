<!DOCTYPE html>
<html>
<head>
  <title>Pergamon Atlas | Home</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      font-family: Georgia, serif;
      background-color:#e9e9e9;
    }

    /* Top header */
    .topbar{
      background-color:#000;
      color:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 30px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:18px;
    }

    .logo-box{
      width:70px;
      height:70px;
      background-color:#222;
      border:2px solid white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      color:white;
    }

    .brand h1{
      margin:0;
      font-size:64px;
      font-weight:bold;
    }

    .suggest-btn{
      background-color:white;
      color:black;
      border:none;
      padding:12px 20px;
      font-size:18px;
      cursor:pointer;
      border-radius:8px;
    }

    .suggest-btn:hover{
      background-color:#ddd;
    }

    /* Page layout */
    .layout{
      display:flex;
      min-height:calc(100vh - 110px);
    }

    /* Sidebar */
    .sidebar{
      width:220px;
      background-color:#111;
      padding-top:20px;
      display:flex;
      flex-direction:column;
    }

    .sidebar a{
      color:white;
      text-decoration:none;
      padding:16px 24px;
      font-size:24px;
      display:block;
    }

    .sidebar a:hover{
      background-color:#222;
    }
    /* Ad Box*/
    .ad-box{
      width:90%;
      height:300px;
      margin-top:40px;
      background-color: #333333;
      color: white;
      padding: 40px 10px;
      border-radius:8px;
      text-align: center;
      font-size:18px;
      border:2px solid white;
      margin-left:auto;
      margin-right:auto;
    }
    
    /* Main content */
    .main-content{
      flex:1;
      padding:30px;
      background-color:#e9e9e9;
    }

    .welcome-box{
      background-color:white;
      padding:30px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.12);
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <div class="logo-box">LOGO</div>
      <h1>Pergamon Atlas</h1>
    </div>

    <button class="suggest-btn">Suggest a Tool</button>
  </div>

  <div class="layout">
    <div class="sidebar">
      <a href="home">Home</a>
      <a href="tools">Tools</a>
      <a href="games">Games</a>
      <a href="help">Help</a>
      <div class="ad box">Ad Space</div>
    </div>

    <div class="main-content">
      <div class="welcome-box">
        <h2>Welcome to Pergamon Atlas</h2>
        <p>Your library of simple, useful tools.</p>
      </div>
    </div>
  </div>

</body>
</html>
