<!DOCTYPE html>
<html lang="en">
<head>
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612"
    crossorigin="anonymous"></script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pergamon Atlas | Suggestions</title>

  <style>
    body{
      margin:0;
      font-family:Georgia, serif;
      background-color:#e9e9e9;
      color:#111;
    }

    /* HEADER */
    .topbar{
      background-color:#000;
      color:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 30px;
      gap:20px;
      flex-wrap:nowrap;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:18px;
      min-width:0;
      flex:1;
    }

    .logo-box{
      width:128px;
      height:100px;
      background:#222;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      flex-shrink:0;
    }

    .logo-box img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .brand h1{
      margin:0;
      font-size:clamp(24px, 3.1vw, 56px);
      font-weight:bold;
      line-height:1.05;
      white-space:nowrap;
    }

    .header-actions{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .search-wrap{
      position:relative;
    }

    .search-wrap::before{
      content:"⌕";
      position:absolute;
      left:12px;
      top:50%;
      transform:translateY(-50%);
      color:#bfa04a;
    }

    .search-bar{
      width:clamp(170px, 18vw, 270px);
      background:#111;
      color:white;
      border:1px solid rgba(201,163,74,0.35);
      border-radius:999px;
      padding:10px 16px 10px 32px;
    }

    .account-btn{
      background:linear-gradient(135deg, #171717, #0d0d0d);
      color:#f8e8b0;
      border:1px solid rgba(201,163,74,0.55);
      padding:10px 18px;
      border-radius:999px;
      text-decoration:none;
      font-weight:bold;
      white-space:nowrap;
    }

    /* LAYOUT */
    .layout{
      display:flex;
      min-height:calc(100vh - 140px);
    }

    .sidebar{
      width:220px;
      background:#111;
      padding-top:20px;
      display:flex;
      flex-direction:column;
    }

    .sidebar a{
      color:white;
      text-decoration:none;
      padding:16px 24px;
      font-size:24px;
    }

    .sidebar a:hover{
      background:#222;
    }

    .main-content{
      flex:1;
      padding:30px;
    }

    .hero-box,
    .section-box{
      background:white;
      padding:30px;
      border-radius:12px;
      margin-bottom:25px;
      box-shadow:0 2px 8px rgba(0,0,0,0.12);
    }

    .hero-box h2{
      margin-top:0;
      font-size:42px;
    }

    .hero-box p{
      font-size:20px;
    }

    /* FORM */
    .form-group{
      margin-bottom:18px;
    }

    .form-group label{
      display:block;
      margin-bottom:6px;
      font-weight:bold;
    }

    .form-group input,
    .form-group textarea,
    .form-group select{
      width:100%;
      padding:12px;
      border-radius:8px;
      border:1px solid #ccc;
      font-family:inherit;
      font-size:15px;
      box-sizing:border-box;
    }

    textarea{
      resize:vertical;
      min-height:120px;
    }

    .submit-btn{
      background:#000;
      color:white;
      padding:12px 20px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-size:16px;
    }

    .submit-btn:hover{
      background:#222;
    }

    /* MOBILE */
    @media (max-width:900px){
      .layout{
        flex-direction:column;
      }

      .sidebar{
        width:100%;
      }

      .sidebar a{
        text-align:center;
        font-size:20px;
      }
    }

    @media (max-width:600px){
      .topbar{
        flex-direction:column;
        align-items:flex-start;
      }

      .header-actions{
        display:none;
      }

      .brand h1{
        font-size:28px;
        white-space:normal;
      }

      .main-content{
        padding:16px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="topbar">
    <div class="brand">
      <div class="logo-box">
        <img src="/images/logo.png" alt="Logo">
      </div>
      <h1>Pergamon Atlas | Suggestions</h1>
    </div>

    <div class="header-actions">
      <div class="search-wrap">
        <input class="search-bar" placeholder="Search the Atlas...">
      </div>
      <a href="/account-page" class="account-btn">Account</a>
    </div>
  </div>

  <!-- LAYOUT -->
  <div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <a href="/">Home</a>
      <a href="/tools">Tools</a>
      <a href="/games">Games</a>
      <a href="/help">Help</a>
    </div>

    <!-- MAIN -->
    <div class="main-content">

      <div class="hero-box">
        <h2>Suggest Something for the Atlas</h2>
        <p>
          Have an idea for a tool, feature, or improvement? Drop it below — this atlas grows from ideas like yours.
        </p>
      </div>

      <div class="section-box">

        <div class="form-group">
          <label>Name (optional)</label>
          <input type="text">
        </div>

        <div class="form-group">
          <label>Type of Suggestion</label>
          <select>
            <option>Tool Idea</option>
            <option>Feature Request</option>
            <option>Bug / Fix</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Your Idea</label>
          <textarea></textarea>
        </div>

        <button class="submit-btn">Submit</button>

      </div>

    </div>
  </div>

</body>
</html>
