<!DOCTYPE html>
<html lang="en">
<head>
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612"
    crossorigin="anonymous"></script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pergamon Atlas | Accounts</title>

 
</head>

<body>

  <!-- HEADER -->
  <div class="topbar">
    <div class="brand">
      <div class="logo-box">
        <img src="/images/logo.png" alt="Logo">
      </div>
      <h1>Pergamon Atlas | Accounts</h1>
    </div>

    <div class="header-actions">
      <div class="search-wrap">
        <input class="search-bar" placeholder="Search the Atlas...">
      </div>
      <a href="/account-page" class="account-btn">Account</a>
    </div>
  </div>

  <!-- LAYOUT -->
  <div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <a href="/">Home</a>
      <a href="/tools">Tools</a>
      <a href="/games">Games</a>
      <a href="/help">Help</a>
    </div>

    <!-- MAIN -->
    <div class="main-content">

      <div class="hero-box">
        <h2>Suggest Something for the Atlas</h2>
        <p>
          Have an idea for a tool, feature, or improvement? Drop it below — this atlas grows from ideas like yours.
        </p>
      </div>

      <div class="section-box">

        <div class="form-group">
          <label>Name (optional)</label>
          <input type="text">
        </div>

        <div class="form-group">
          <label>Type of Suggestion</label>
          <select>
            <option>Tool Idea</option>
            <option>Feature Request</option>
            <option>Bug / Fix</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Your Idea</label>
          <textarea></textarea>
        </div>

        <button class="submit-btn">Submit</button>

      </div>

    </div>
  </div>

</body>
</html>
