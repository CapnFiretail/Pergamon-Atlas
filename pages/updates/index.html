<script src="/data/updates.js"></script>

<script>
function renderUpdates(updates, containerId){
  const container=document.getElementById(containerId);

  container.innerHTML=updates.map(u=>`
    <article class="update-card">
      <div class="update-meta">
        <span class="update-date">${u.date}</span>
        <span class="update-tag">${u.tag}</span>
      </div>
      <h3>${u.title}</h3>
      ${u.text?`<p>${u.text}</p>`:""}
      ${u.list?`<ul class="update-list">${u.list.map(i=>`<li>${i}</li>`).join("")}</ul>`:""}
    </article>
  `).join("");
}

renderUpdates(atlasUpdates,'all-updates-placeholder');
</script>
