<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>JSON Formatter</h2>
        <p>Paste raw JSON to format, validate, minify, and explore it instantly.</p>
      </div>
      <div class="toolbar">
        <button class="tool-btn" onclick="format()">Format / Prettify</button>
        <button class="tool-btn" onclick="minify()">Minify</button>
        <button class="tool-btn" onclick="validate()">Validate</button>
        <button class="tool-btn" onclick="clearAll()">Clear</button>
        <button class="tool-btn" onclick="loadSample()">Load Sample</button>
      </div>
      <div id="errorBar" class="error-bar"></div>
      <div class="editor-layout">
        <div class="editor-pane">
          <div class="pane-header">
            Input
            <div class="pane-btns">
              <button class="pane-btn" onclick="copyInput()">Copy</button>
              <button class="pane-btn gold" onclick="format()">Format →</button>
            </div>
          </div>
          <textarea class="code" id="inputArea" placeholder='Paste your JSON here...' oninput="autoFormat()"></textarea>
        </div>

          <div class="pane-header">
            Output
            <div class="pane-btns">
              <button class="pane-btn" onclick="copyOutput()">Copy</button>
            </div>

          <div class="output-area" id="outputArea"></div>
        </div>
      </div>

<script src="/operation/scripts/atlas.js"></script>

  <script>
    loadSnippets('Tools');

    function showError(msg) {
      const bar = document.getElementById('errorBar');
      if (msg) { bar.textContent = msg; bar.style.display='block'; }
      else bar.style.display='none';
    }

    function syntaxHighlight(json) {
      return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, match => {
        if (/^"/.test(match)) {
          if (/:$/.test(match)) return '<span class="key">'+match+'</span>';
          return '<span class="str">'+match+'</span>';
        } else if (/true|false/.test(match)) return '<span class="bool">'+match+'</span>';
        else if (/null/.test(match)) return '<span class="null">'+match+'</span>';
        return '<span class="num">'+match+'</span>';
      });
    }

    function format() {
      const input = document.getElementById('inputArea').value.trim();
      if (!input) return;
      try {
        const parsed = JSON.parse(input);
        const formatted = JSON.stringify(parsed, null, 2);
        document.getElementById('outputArea').innerHTML = syntaxHighlight(formatted.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));
        document.getElementById('outputArea').className = 'output-area';
        showError('');
      } catch(e) {
        showError('JSON Error: ' + e.message);
        document.getElementById('outputArea').textContent = '';
      }
    }

    function minify() {
      const input = document.getElementById('inputArea').value.trim();
      if (!input) return;
      try {
        const parsed = JSON.parse(input);
        const mini = JSON.stringify(parsed);
        document.getElementById('outputArea').textContent = mini;
        document.getElementById('outputArea').className = 'output-area';
        showError('');
      } catch(e) { showError('JSON Error: ' + e.message); }
    }

    function validate() {
      const input = document.getElementById('inputArea').value.trim();
      if (!input) return;
      try {
        JSON.parse(input);
        showError('');
        document.getElementById('outputArea').textContent = '✓ Valid JSON';
        document.getElementById('outputArea').className = 'output-area';
      } catch(e) { showError('✗ Invalid JSON: ' + e.message); document.getElementById('outputArea').textContent=''; }
    }

    function clearAll() {
      document.getElementById('inputArea').value = '';
      document.getElementById('outputArea').innerHTML = '';
      showError('');
    }

    function copyInput() { navigator.clipboard.writeText(document.getElementById('inputArea').value); }
    function copyOutput() { navigator.clipboard.writeText(document.getElementById('outputArea').textContent); }

    let autoTimer;
    function autoFormat() { clearTimeout(autoTimer); autoTimer = setTimeout(format, 600); }

    function loadSample() {
      document.getElementById('inputArea').value = `{"name":"Pergamon Atlas","version":"1.0","tools":[{"id":1,"name":"JSON Formatter","category":"utilities","active":true},{"id":2,"name":"Word Counter","category":"text","active":true}],"meta":{"created":"2026","author":"atlas","pages":60}}`;
      format();
    }
  </script>
