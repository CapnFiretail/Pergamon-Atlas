  <script>
  function analyze(){
    const text=document.getElementById('inputText').value;
    const chars=text.length;
    const noSpaces=text.replace(/\s/g,'').length;
    const words=text.trim()===''?0:text.trim().split(/\s+/).length;
    const sentences=text.trim()===''?0:(text.match(/[.!?]+/g)||[]).length;
    const paras=text.trim()===''?0:text.trim().split(/\n\s*\n/).length;
    const lines=text.trim()===''?0:text.split('\n').length;
    const readTime=words/238;
    const speakTime=words/130;

    document.getElementById('sChars').textContent=chars;
    document.getElementById('sNoSpaces').textContent=noSpaces;
    document.getElementById('sWords').textContent=words;
    document.getElementById('sSentences').textContent=sentences;
    document.getElementById('sParas').textContent=paras;
    document.getElementById('sLines').textContent=lines;
    document.getElementById('sReadTime').textContent=readTime<1?Math.round(readTime*60)+'s':readTime.toFixed(1)+'m';
    document.getElementById('sSpeakTime').textContent=speakTime<1?Math.round(speakTime*60)+'s':speakTime.toFixed(1)+'m';

    const limit=parseInt(document.getElementById('limitInput').value)||0;
    if(limit>0){
      const pct=Math.min(100,(chars/limit)*100);
      const bar=document.getElementById('limitBar');
      bar.style.width=pct+'%';
      bar.className='limit-bar'+(pct>=100?' over':pct>=80?' warn':'');
      const rem=limit-chars;
      document.getElementById('limitStatus').textContent=rem>=0?rem+' left':Math.abs(rem)+' over';
      document.getElementById('limitStatus').style.color=rem<0?'#c0392b':rem<limit*.2?'#e0a020':'#555';
    }else{
      document.getElementById('limitBar').style.width='0%';
      document.getElementById('limitStatus').textContent='';
    }

    buildFreq(text);
  }

  function buildFreq(text){
    const words=text.toLowerCase().match(/\b[a-z']{2,}\b/g)||[];
    const freq={};
    words.forEach(w=>{freq[w]=(freq[w]||0)+1;});
    const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,15);
    const max=sorted[0]?.[1]||1;
    const tbody=document.getElementById('freqBody');
    if(sorted.length===0){tbody.innerHTML='<tr><td colspan="3" style="color:#aaa;font-size:13px">No words yet.</td></tr>';return;}
    tbody.innerHTML=sorted.map(([w,c])=>`<tr><td>${w}</td><td>${c}</td><td><span class="freq-bar" style="width:${Math.round(c/max*120)}px"></span></td></tr>`).join('');
  }

  function clearText(){document.getElementById('inputText').value='';analyze();}
  function copyText(){navigator.clipboard.writeText(document.getElementById('inputText').value).catch(()=>{});}
  function toUpper(){const t=document.getElementById('inputText');t.value=t.value.toUpperCase();analyze();}
  function toLower(){const t=document.getElementById('inputText');t.value=t.value.toLowerCase();analyze();}
  function trimSpaces(){const t=document.getElementById('inputText');t.value=t.value.replace(/\s+/g,' ').trim();analyze();}

  analyze();
  </script>
