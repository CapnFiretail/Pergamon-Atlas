  <script>
    loadSnippets('Games');

    const GRID=20, CELL=20;
    const canvas=document.getElementById('c');
    const ctx=canvas.getContext('2d');
    let snake,food,dx,dy,score,gameLoop,paused,speed,best;

    best=parseInt(localStorage.getItem('snake_best')||0);
    document.getElementById('bestVal').textContent=best;
    speed=150;

    function setSpeed(ms,lbl,btn){speed=ms;document.querySelectorAll('.spd-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}

    function startGame(){
      clearInterval(gameLoop);
      snake=[{x:10,y:10}];dx=1;dy=0;score=0;paused=false;
      placeFood();
      draw();
      gameLoop=setInterval(update,speed);
      document.getElementById('startBtn').textContent='Restart';
    }

    function placeFood(){
      do{food={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)};}
      while(snake.some(s=>s.x===food.x&&s.y===food.y));
    }

    function dir(x,y){
      if(x!==0&&dx===0){dx=x;dy=0;}
      else if(y!==0&&dy===0){dx=0;dy=y;}
    }

    function togglePause(){paused=!paused;}

    function update(){
      if(paused) return;
      const head={x:snake[0].x+dx,y:snake[0].y+dy};
      if(head.x<0||head.x>=GRID||head.y<0||head.y>=GRID||snake.some(s=>s.x===head.x&&s.y===head.y)){
        clearInterval(gameLoop);
        ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,400,400);
        ctx.fillStyle='#f0d39b';ctx.font='bold 32px monospace';ctx.textAlign='center';
        ctx.fillText('Game Over!',200,180);
        ctx.font='20px Georgia';ctx.fillText('Score: '+score,200,220);
        ctx.fillText('Click Start to retry',200,260);
        return;
      }
      snake.unshift(head);
      if(head.x===food.x&&head.y===food.y){
        score++;document.getElementById('scoreVal').textContent=score;
        document.getElementById('lenVal').textContent=snake.length;
        if(score>best){best=score;localStorage.setItem('snake_best',best);document.getElementById('bestVal').textContent=best;}
        placeFood();
      } else snake.pop();
      draw();
    }

    function draw(){
      ctx.fillStyle='#1a1a1a';ctx.fillRect(0,0,400,400);
      ctx.fillStyle='#222';
      for(let x=0;x<GRID;x++)for(let y=0;y<GRID;y++){ctx.beginPath();ctx.arc(x*CELL+CELL/2,y*CELL+CELL/2,1,0,Math.PI*2);ctx.fill();}
      ctx.fillStyle='#e74c3c';ctx.beginPath();ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2);ctx.fill();
      snake.forEach((s,i)=>{
        ctx.fillStyle=i===0?'#f0d39b':'#8a611c';
        ctx.beginPath();ctx.roundRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2,4);ctx.fill();
      });
    }

    document.addEventListener('keydown',e=>{
      if(e.key==='ArrowLeft'||e.key==='a') {e.preventDefault();dir(-1,0);}
      if(e.key==='ArrowRight'||e.key==='d') {e.preventDefault();dir(1,0);}
      if(e.key==='ArrowUp'||e.key==='w') {e.preventDefault();dir(0,-1);}
      if(e.key==='ArrowDown'||e.key==='s') {e.preventDefault();dir(0,1);}
      if(e.key===' ') {e.preventDefault();togglePause();}
    });

    ctx.fillStyle='#1a1a1a';ctx.fillRect(0,0,400,400);
    ctx.fillStyle='#f0d39b';ctx.font='bold 22px Georgia';ctx.textAlign='center';
    ctx.fillText('Press Start to play',200,200);
  </script>
