<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="game-hero">
        <h2>Higher or Lower</h2>
        <p>Guess if the next number is higher or lower. How long can your streak go?</p>
      </div>
      <div class="panel">
        <div class="range-select">
          <label>Range:</label>
          <select id="rangeSelect" onchange="newGame()">
            <option value="10">1 – 10</option>
            <option value="20" selected>1 – 20</option>
            <option value="50">1 – 50</option>
            <option value="100">1 – 100</option>
          </select>
        </div>
        <div class="info-row">
          <span>Score: <span class="score-val" id="score">0</span></span>
          <span>Streak: <span class="score-val" id="streak">0</span></span>
        </div>
        <div class="card-wrap">
          <div id="currentNum" class="card-num">?</div>
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="btn-row">
          <button class="hl-btn lower" id="btnLower" onclick="guess('lower')">⬇ Lower</button>
          <button class="hl-btn higher" id="btnHigher" onclick="guess('higher')">⬆ Higher</button>
        </div>
        <button class="next-btn" id="nextBtn" onclick="nextRound()" style="display:none">Next →</button>
        <div class="best-score" id="bestScore">Best streak: 0</div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/operation/scripts/atlas.js"></script>
  <script>
    loadSnippets('Games');

    let current, next, score, streak, best, max, gameOver;

    function newGame() {
      max = parseInt(document.getElementById('rangeSelect').value);
      score = 0; streak = 0; best = parseInt(localStorage.getItem('hl_best')||0); gameOver = false;
      current = rand(); next = null;
      document.getElementById('currentNum').textContent = current;
      document.getElementById('score').textContent = 0;
      document.getElementById('streak').textContent = 0;
      document.getElementById('bestScore').textContent = 'Best streak: ' + best;
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('nextBtn').style.display = 'none';
      setButtons(true);
    }

    function rand() { return Math.floor(Math.random()*max)+1; }

    function setButtons(on) {
      document.getElementById('btnLower').disabled = !on;
      document.getElementById('btnHigher').disabled = !on;
    }

    function guess(dir) {
      next = rand();
      const fb = document.getElementById('feedback');
      const correct = (dir==='higher'&&next>current)||(dir==='lower'&&next<current)||(next===current);

      if(correct||next===current) {
        score++;streak++;
        if(streak>best){best=streak;localStorage.setItem('hl_best',best);document.getElementById('bestScore').textContent='Best streak: '+best;}
        fb.className='feedback win';
        fb.textContent = next===current ? `It was ${next} — same! Counts as correct.` : `Correct! It was ${next}.`;
      } else {
        fb.className='feedback lose';
        fb.textContent = `Wrong! It was ${next}. Your streak: ${streak}.`;
        streak=0; gameOver=true;
      }

      document.getElementById('score').textContent=score;
      document.getElementById('streak').textContent=streak;
      current = next;
      document.getElementById('currentNum').textContent = current;
      setButtons(false);

      if(gameOver) {
        document.getElementById('nextBtn').textContent='Play Again';
        document.getElementById('nextBtn').onclick = newGame;
      } else {
        document.getElementById('nextBtn').textContent='Next →';
        document.getElementById('nextBtn').onclick = nextRound;
      }
      document.getElementById('nextBtn').style.display='inline-block';
    }

    function nextRound() {
      document.getElementById('feedback').textContent='';
      document.getElementById('nextBtn').style.display='none';
      setButtons(true);
      gameOver=false;
    }

    newGame();
  </script>
