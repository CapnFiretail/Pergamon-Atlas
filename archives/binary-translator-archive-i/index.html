  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Binary Translator</h2>
        <p>Translate text to binary and binary back to text. See each character as 8-bit code.</p>
      </div>
      <div class="panel">
        <div class="mode-tabs">
          <button class="mode-tab active" id="tabTB" onclick="setMode('tb')">Text → Binary</button>
          <button class="mode-tab" id="tabBT" onclick="setMode('bt')">Binary → Text</button>
        </div>

        <div id="sectionTB">
          <h3>Enter Text</h3>
          <div class="ta-wrap">
            <textarea id="tbInput" placeholder="Type or paste text here..." oninput="textToBinary()"></textarea>
          </div>
          <h3>Binary Output</h3>
          <div class="ta-wrap">
            <textarea id="tbOutput" readonly></textarea>
            <button class="copy-btn" onclick="navigator.clipboard.writeText(document.getElementById('tbOutput').value)">Copy</button>
          </div>
          <h3 style="margin-top:14px">Bit Breakdown</h3>
          <div class="bits-display" id="bitsDisplay"></div>
        </div>

        <div id="sectionBT" style="display:none">
          <h3>Enter Binary</h3>
          <div class="ta-wrap">
            <textarea id="btInput" placeholder="01001000 01100101 01101100 01101100 01101111" oninput="binaryToText()"></textarea>
          </div>
          <div id="btError" class="error"></div>
          <h3>Text Output</h3>
          <div class="ta-wrap">
            <textarea id="btOutput" readonly></textarea>
            <button class="copy-btn" onclick="navigator.clipboard.writeText(document.getElementById('btOutput').value)">Copy</button>

<script src="/operation/scripts/atlas.js"></script>


  <script>
    loadSnippets('Tools');

    function setMode(m) {
      document.getElementById('sectionTB').style.display=m==='tb'?'block':'none';
      document.getElementById('sectionBT').style.display=m==='bt'?'block':'none';
      document.getElementById('tabTB').classList.toggle('active',m==='tb');
      document.getElementById('tabBT').classList.toggle('active',m==='bt');
    }

    function textToBinary() {
      const txt=document.getElementById('tbInput').value;
      const binary=txt.split('').map(c=>c.charCodeAt(0).toString(2).padStart(8,'0')).join(' ');
      document.getElementById('tbOutput').value=binary;
      const disp=document.getElementById('bitsDisplay');
      disp.innerHTML=txt.slice(0,64).split('').map(c=>{
        const code=c.charCodeAt(0);
        return `<div class="byte-box"><div class="byte-bits">${code.toString(2).padStart(8,'0')}</div><div class="byte-char">'${c==' '?'⎵':c.replace(/</g,'&lt;')}'</div><div class="byte-dec">${code}</div></div>`;
      }).join('');
      if(txt.length>64) disp.innerHTML+='<div style="color:#aaa;font-size:13px;align-self:center">…'+（txt.length-64)+' more chars</div>';
    }

    function binaryToText() {
      const bin=document.getElementById('btInput').value.trim();
      document.getElementById('btError').textContent='';
      if(!bin){document.getElementById('btOutput').value='';return;}
      const bytes=bin.replace(/[^01\s]/g,'').trim().split(/\s+/);
      const invalid=bytes.filter(b=>!/^[01]{8}$/.test(b));
      if(invalid.length){document.getElementById('btError').textContent='Invalid binary sequences: '+invalid.slice(0,5).join(', ');return;}
      try {
        const text=bytes.map(b=>String.fromCharCode(parseInt(b,2))).join('');
        document.getElementById('btOutput').value=text;
      } catch(e){document.getElementById('btError').textContent='Conversion error';}
    }
  </script>
