<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Base64 Encoder / Decoder</h2>
        <p>Encode text or files to Base64, or decode Base64 back to text or images.</p>
      </div>
      <div class="panel">
        <div class="mode-tabs">
          <button class="mode-tab active" id="tabEncode" onclick="setMode('encode')">Encode</button>
          <button class="mode-tab" id="tabDecode" onclick="setMode('decode')">Decode</button>
          <button class="mode-tab" id="tabFile" onclick="setMode('file')">File to Base64</button>
        </div>

        <div id="sectionEncode">
          <h3>Text to Base64</h3>
          <div class="ta-wrap">
            <textarea id="encInput" placeholder="Enter text to encode..." oninput="encodeB64()"></textarea>
          </div>
          <h3>Result</h3>
          <div class="ta-wrap">
            <textarea id="encOutput" readonly></textarea>
            <button class="copy-btn" onclick="copyEl('encOutput')">Copy</button>
          </div>
        </div>

        <div id="sectionDecode" style="display:none">
          <h3>Base64 to Text</h3>
          <div class="ta-wrap">
            <textarea id="decInput" placeholder="Paste Base64 string here..." oninput="decodeB64()"></textarea>
          </div>
          <div id="decError" class="error-msg"></div>
          <h3>Result</h3>
          <div class="ta-wrap">
            <textarea id="decOutput" readonly></textarea>
            <button class="copy-btn" onclick="copyEl('decOutput')">Copy</button>
          </div>
        </div>

        <div id="sectionFile" style="display:none">
          <h3>File to Base64</h3>
          <div class="file-section" onclick="document.getElementById('fileInput').click()">
            <div style="font-size:32px;margin-bottom:8px">📁</div>
            <div>Click to select a file (image, text, etc.)</div>
            <input type="file" id="fileInput" onchange="fileToBase64()">
          </div>
          <div id="fileResult" style="margin-top:16px"></div>
        </div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/operation/scripts/atlas.js"></script>
  <script>
    loadSnippets('Tools');

    function setMode(m) {
      ['Encode','Decode','File'].forEach(s=>{
        document.getElementById('section'+s).style.display = s.toLowerCase()===m?'block':'none';
        document.getElementById('tab'+s).classList.toggle('active', s.toLowerCase()===m);
      });
    }

    function encodeB64() {
      try {
        document.getElementById('encOutput').value = btoa(unescape(encodeURIComponent(document.getElementById('encInput').value)));
      } catch(e) { document.getElementById('encOutput').value = 'Encoding error'; }
    }

    function decodeB64() {
      const inp = document.getElementById('decInput').value.trim();
      const err = document.getElementById('decError');
      if (!inp) { document.getElementById('decOutput').value=''; err.textContent=''; return; }
      try {
        document.getElementById('decOutput').value = decodeURIComponent(escape(atob(inp)));
        err.textContent = '';
      } catch(e) { err.textContent = 'Invalid Base64 string'; document.getElementById('decOutput').value=''; }
    }

    function fileToBase64() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const b64 = e.target.result;
        const isImg = file.type.startsWith('image/');
        let html = `<div style="margin-bottom:12px"><strong>${file.name}</strong> (${(file.size/1024).toFixed(1)} KB, ${file.type||'unknown'})</div>`;
        if (isImg) html += `<img src="${b64}" class="img-preview">`;
        html += `<div style="position:relative;margin-top:12px"><textarea style="width:100%;height:120px;font-family:monospace;font-size:12px;padding:12px;border:1.5px solid #ccc;border-radius:10px;box-sizing:border-box" readonly>${b64}</textarea>
          <button style="position:absolute;top:10px;right:10px;background:#111;color:white;border:none;border-radius:7px;padding:6px 12px;font-size:13px;cursor:pointer" onclick="navigator.clipboard.writeText('${b64.replace(/'/g,"\\'")}')">Copy</button></div>`;
        document.getElementById('fileResult').innerHTML = html;
      };
      reader.readAsDataURL(file);
    }

    function copyEl(id) { navigator.clipboard.writeText(document.getElementById(id).value); }
  </script>
