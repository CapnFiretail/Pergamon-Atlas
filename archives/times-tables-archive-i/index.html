<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Times Tables</h2>
        <p>Study the multiplication chart or drill yourself with a timed quiz.</p>
      </div>
      <div class="mode-tabs">
        <button class="mode-tab active" id="tabChart" onclick="setMode('chart')">Chart</button>
        <button class="mode-tab" id="tabQuiz" onclick="setMode('quiz')">Quiz</button>
      </div>

      <div id="chartSection">
        <div class="panel">
          <h3>Multiplication Table (1–12)</h3>
          <div style="overflow-x:auto"><table class="chart-table" id="chartTable"></table></div>
        </div>
      </div>

      <div id="quizSection" style="display:none">
        <div class="panel">
          <h3>Setup</h3>
          <div class="quiz-setup">
            <div class="field"><label>Table (or All)</label>
              <select id="quizTable">
                <option value="all">All (1–12)</option>
                ${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}s</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>Questions</label>
              <select id="quizCount">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="30">30</option>
                <option value="50">50</option>
              </select>
            </div>
            <button class="atlas-btn" onclick="startQuiz()">Start Quiz</button>
          </div>
          <div id="quizArea" style="display:none">
            <div class="question-box">
              <div class="q-text" id="qText"></div>
              <div class="q-progress" id="qProgress"></div>
            </div>
            <input class="answer-input" type="number" id="answerInput" placeholder="?" autocomplete="off" oninput="checkAnswer()">
            <div class="feedback" id="feedback"></div>
            <div class="score-row">
              <div class="score-chip"><div class="n" id="qCorrect">0</div><div class="l">Correct</div></div>
              <div class="score-chip"><div class="n" id="qWrong">0</div><div class="l">Wrong</div></div>
              <div class="score-chip"><div class="n" id="qStreak">0</div><div class="l">Streak</div></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/operation/scripts/atlas.js"></script>
  <script>
    loadSnippets('Tools');

    function buildChart() {
      const table = document.getElementById('chartTable');
      let html = '<thead><tr><th>×</th>';
      for (let i=1;i<=12;i++) html+='<th>'+i+'</th>';
      html += '</tr></thead><tbody>';
      for (let i=1;i<=12;i++) {
        html += '<tr class="header-row"><td>'+i+'</td>';
        for (let j=1;j<=12;j++) html+=`<td onclick="highlight(${i},${j})">${i*j}</td>`;
        html += '</tr>';
      }
      html += '</tbody>';
      table.innerHTML = html;
    }

    function highlight(r,c) {
      document.querySelectorAll('.chart-table td').forEach((td,idx)=>{
        const row=Math.floor(idx/13), col=idx%13;
        td.classList.toggle('highlight', row===r&&col===c);
      });
    }

    function setMode(m) {
      document.getElementById('chartSection').style.display=m==='chart'?'block':'none';
      document.getElementById('quizSection').style.display=m==='quiz'?'block':'none';
      document.getElementById('tabChart').classList.toggle('active',m==='chart');
      document.getElementById('tabQuiz').classList.toggle('active',m==='quiz');
    }

    let questions = [], qIdx = 0, correct = 0, wrong = 0, streak = 0;

    function startQuiz() {
      const tableVal = document.getElementById('quizTable').value;
      const count = parseInt(document.getElementById('quizCount').value);
      const qs = [];
      for (let k=0;k<count;k++) {
        const a = tableVal==='all' ? Math.floor(Math.random()*12)+1 : parseInt(tableVal);
        const b = Math.floor(Math.random()*12)+1;
        qs.push({a,b,answer:a*b});
      }
      questions=qs; qIdx=0; correct=0; wrong=0; streak=0;
      document.getElementById('quizArea').style.display='block';
      document.getElementById('qCorrect').textContent='0';
      document.getElementById('qWrong').textContent='0';
      document.getElementById('qStreak').textContent='0';
      showQ();
    }

    function showQ() {
      if(qIdx>=questions.length){finishQuiz();return;}
      const q=questions[qIdx];
      document.getElementById('qText').textContent=q.a+' × '+q.b+' = ?';
      document.getElementById('qProgress').textContent=(qIdx+1)+' / '+questions.length;
      document.getElementById('answerInput').value='';
      document.getElementById('answerInput').className='answer-input';
      document.getElementById('feedback').textContent='';
      document.getElementById('feedback').className='feedback';
      document.getElementById('answerInput').focus();
    }

    function checkAnswer() {
      const val=parseInt(document.getElementById('answerInput').value);
      if(isNaN(val)) return;
      const q=questions[qIdx];
      const inp=document.getElementById('answerInput');
      if(val===q.answer){
        inp.className='answer-input correct';
        document.getElementById('feedback').textContent='✓ Correct!';
        document.getElementById('feedback').className='feedback correct';
        correct++; streak++;
        document.getElementById('qCorrect').textContent=correct;
        document.getElementById('qStreak').textContent=streak;
        setTimeout(()=>{qIdx++;showQ();},600);
      } else if(document.getElementById('answerInput').value.length>String(q.answer).length) {
        inp.className='answer-input wrong';
        document.getElementById('feedback').textContent='✗ Answer: '+q.answer;
        document.getElementById('feedback').className='feedback wrong';
        wrong++; streak=0;
        document.getElementById('qWrong').textContent=wrong;
        document.getElementById('qStreak').textContent=0;
        setTimeout(()=>{qIdx++;showQ();},1200);
      }
    }

    function finishQuiz() {
      document.getElementById('quizArea').innerHTML = `
        <div style="text-align:center;padding:28px 0">
          <div style="font-size:54px;font-weight:800;color:#c28a2b">${Math.round(correct/(correct+wrong)*100)}%</div>
          <div style="font-size:16px;color:#555;margin-top:8px">${correct} correct, ${wrong} wrong</div>
          <button class="atlas-btn" style="margin-top:18px" onclick="startQuiz()">Try Again</button>
        </div>`;
    }

    buildChart();
  </script>
