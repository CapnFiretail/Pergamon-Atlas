  <script>
    loadSnippets('Games');

    const cv=document.getElementById('c'),ctx=cv.getContext('2d');
    const W=500,H=320,PAD_W=10,PAD_H=60,BALL=8;
    let p1y,p2y,bx,by,bdx,bdy,s1,s2,raf,paused,running,mode;
    let p1up=false,p1dn=false,p2up=false,p2dn=false;
    const SPEED=4,AI_SPEED=3.2;
    mode='ai';

    function setMode(m){mode=m;document.getElementById('btnAI').classList.toggle('active',m==='ai');document.getElementById('btn2p').classList.toggle('active',m==='2p');document.getElementById('p2ctrl').style.display=m==='2p'?'flex':'none';if(running)startGame();}

    function startGame(){
      p1y=H/2-PAD_H/2;p2y=H/2-PAD_H/2;
      bx=W/2;by=H/2;
      const ang=(Math.random()*.6-.3);
      bdx=(Math.random()<.5?1:-1)*SPEED*Math.cos(ang);
      bdy=SPEED*Math.sin(ang);
      s1=0;s2=0;paused=false;running=true;
      cancelAnimationFrame(raf);
      document.getElementById('startBtn').textContent='Restart';
      loop();
    }

    function togglePause(){paused=!paused;if(!paused&&running)loop();}

    function loop(){
      if(paused||!running) return;
      update();draw();
      raf=requestAnimationFrame(loop);
    }

    const PAD_SPEED=5;
    function update(){
      if(p1up&&p1y>0) p1y-=PAD_SPEED;
      if(p1dn&&p1y<H-PAD_H) p1y+=PAD_SPEED;
      if(mode==='2p'){
        if(p2up&&p2y>0) p2y-=PAD_SPEED;
        if(p2dn&&p2y<H-PAD_H) p2y+=PAD_SPEED;
      } else {
        const center=p2y+PAD_H/2;
        if(center<by-4&&p2y<H-PAD_H) p2y+=AI_SPEED;
        else if(center>by+4&&p2y>0) p2y-=AI_SPEED;
      }
      bx+=bdx;by+=bdy;
      if(by<=BALL||by>=H-BALL){bdy=-bdy;by=by<=BALL?BALL:H-BALL;}
      if(bx<=PAD_W+BALL&&by>=p1y&&by<=p1y+PAD_H){bdx=Math.abs(bdx);const rel=(by-(p1y+PAD_H/2))/(PAD_H/2);bdy=rel*SPEED*1.2;speedUp();}
      if(bx>=W-PAD_W-BALL&&by>=p2y&&by<=p2y+PAD_H){bdx=-Math.abs(bdx);const rel=(by-(p2y+PAD_H/2))/(PAD_H/2);bdy=rel*SPEED*1.2;speedUp();}
      if(bx<0){s2++;reset();}
      if(bx>W){s1++;reset();}
    }

    function speedUp(){const spd=Math.sqrt(bdx*bdx+bdy*bdy);if(spd<10){bdx*=1.05;bdy*=1.05;}}

    function reset(){
      bx=W/2;by=H/2;
      const ang=(Math.random()*.6-.3);
      bdx=(Math.random()<.5?1:-1)*SPEED*Math.cos(ang);
      bdy=SPEED*Math.sin(ang);
    }

    function draw(){
      ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
      ctx.setLineDash([8,8]);ctx.strokeStyle='#333';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#f0d39b';ctx.font='bold 36px monospace';ctx.textAlign='center';
      ctx.fillText(s1,W/4,48);ctx.fillText(s2,W*3/4,48);
      ctx.fillStyle='#f0d39b';
      ctx.fillRect(0,p1y,PAD_W,PAD_H);
      ctx.fillRect(W-PAD_W,p2y,PAD_W,PAD_H);
      ctx.beginPath();ctx.arc(bx,by,BALL,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();
    }

    document.addEventListener('keydown',e=>{
      if(e.key==='w') p1up=true;
      if(e.key==='s') p1dn=true;
      if(e.key==='ArrowUp'){e.preventDefault();p2up=true;}
      if(e.key==='ArrowDown'){e.preventDefault();p2dn=true;}
    });
    document.addEventListener('keyup',e=>{
      if(e.key==='w') p1up=false;
      if(e.key==='s') p1dn=false;
      if(e.key==='ArrowUp') p2up=false;
      if(e.key==='ArrowDown') p2dn=false;
    });

    document.getElementById('p2ctrl').style.display='none';
    ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f0d39b';ctx.font='bold 20px Georgia';ctx.textAlign='center';
    ctx.fillText('Press Start to play',W/2,H/2);
  </script>
