  <script>
    loadSnippets('Tools');

    function hexToHsl(hex) {
      let r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
      const max=Math.max(r,g,b), min=Math.min(r,g,b);
      let h,s,l=(max+min)/2;
      if(max===min){h=s=0;}else{
        const d=max-min; s=l>.5?d/(2-max-min):d/(max+min);
        switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4;}
        h/=6;
      }
      return [Math.round(h*360), Math.round(s*100), Math.round(l*100)];
    }

    function hslToHex(h,s,l) {
      s/=100; l/=100;
      const a=s*Math.min(l,1-l);
      const f=n=>{const k=(n+h/30)%12; return l-a*Math.max(Math.min(k-3,9-k,1),-1);};
      const toH=x=>Math.round(255*f(x)).toString(16).padStart(2,'0');
      return '#'+toH(0)+toH(8)+toH(4);
    }

    function hslToRgb(h,s,l) {
      s/=100; l/=100;
      const a=s*Math.min(l,1-l);
      const f=n=>{const k=(n+h/30)%12; return Math.round(255*(l-a*Math.max(Math.min(k-3,9-k,1),-1)));};
      return [f(0),f(8),f(4)];
    }

    function getSchemeColors(hex, scheme) {
      const [h,s,l] = hexToHsl(hex);
      switch(scheme) {
        case 'analogous': return [hslToHex((h-30+360)%360,s,l),hslToHex((h-15+360)%360,s,l),hex,hslToHex((h+15)%360,s,l),hslToHex((h+30)%360,s,l)];
        case 'complementary': return [hex,hslToHex(h,s,Math.min(l+15,90)),hslToHex((h+180)%360,s,l),hslToHex((h+180)%360,s,Math.max(l-15,10)),hslToHex((h+180)%360,s,Math.min(l+20,90))];
        case 'triadic': return [hex,hslToHex(h,s,Math.min(l+15,90)),hslToHex((h+120)%360,s,l),hslToHex((h+120)%360,s,Math.min(l+15,90)),hslToHex((h+240)%360,s,l)];
        case 'split': return [hex,hslToHex((h+150)%360,s,l),hslToHex((h+150)%360,s,Math.min(l+15,90)),hslToHex((h+210)%360,s,l),hslToHex((h+210)%360,s,Math.min(l+15,90))];
        case 'tetradic': return [hex,hslToHex((h+90)%360,s,l),hslToHex((h+180)%360,s,l),hslToHex((h+270)%360,s,l),hslToHex(h,Math.max(s-20,10),Math.min(l+20,90))];
        case 'monochromatic': return [hslToHex(h,s,Math.max(l-30,5)),hslToHex(h,s,Math.max(l-15,5)),hex,hslToHex(h,s,Math.min(l+15,95)),hslToHex(h,s,Math.min(l+30,95))];
        case 'shades': return [hslToHex(h,s,Math.max(l-35,5)),hslToHex(h,s,Math.max(l-17,5)),hex,hslToHex(h,s,Math.min(l+17,95)),hslToHex(h,s,Math.min(l+35,95))];
        default: return [hex,hex,hex,hex,hex];
      }
    }

    function luminance(hex) {
      const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
      return 0.2126*r+0.7152*g+0.0722*b;
    }

    function generate() {
      const hex = document.getElementById('hexInput').value;
      if (!/^#[0-9A-Fa-f]{6}$/.test(hex)) return;
      const scheme = document.getElementById('scheme').value;
      const colors = getSchemeColors(hex, scheme);

      const display = document.getElementById('paletteDisplay');
      display.innerHTML = '';
      colors.forEach(c => {
        const swatch = document.createElement('div');
        swatch.className = 'swatch';
        swatch.style.background = c;
        swatch.style.flex = '1';
        const textColor = luminance(c) > 0.4 ? '#111' : '#fff';
        const [r,g,b] = hslToRgb(...hexToHsl(c));
        swatch.innerHTML = `<div class="swatch-hex" style="color:#111">${c.toUpperCase()}</div>`;
        swatch.title = 'Click to copy';
        swatch.onclick = () => { navigator.clipboard.writeText(c.toUpperCase()); swatch.querySelector('.swatch-hex').textContent = 'Copied!'; setTimeout(()=>swatch.querySelector('.swatch-hex').textContent=c.toUpperCase(),1200); };
        display.appendChild(swatch);
      });

      const list = document.getElementById('paletteList');
      list.innerHTML = '';
      colors.forEach(c => {
        const [r,g,b] = hslToRgb(...hexToHsl(c));
        const row = document.createElement('div');
        row.className = 'palette-row';
        row.innerHTML = `<div class="swatch-mini" style="background:${c}"></div><div class="swatch-info"><div class="hex">${c.toUpperCase()}</div><div class="rgb">rgb(${r}, ${g}, ${b})</div></div><button class="copy-hex" onclick="navigator.clipboard.writeText('${c.toUpperCase()}');this.textContent='Copied!';setTimeout(()=>this.textContent='Copy',1200)">Copy</button>`;
        list.appendChild(row);
      });
    }

    function syncHex() {
      document.getElementById('hexInput').value = document.getElementById('colorPicker').value;
      generate();
    }
    function syncPicker() {
      const val = document.getElementById('hexInput').value;
      if (/^#[0-9A-Fa-f]{6}$/.test(val)) { document.getElementById('colorPicker').value = val; generate(); }
    }
    function randomize() {
      const h=Math.floor(Math.random()*360), s=40+Math.floor(Math.random()*40), l=35+Math.floor(Math.random()*30);
      const hex = hslToHex(h,s,l);
      document.getElementById('colorPicker').value = hex;
      document.getElementById('hexInput').value = hex;
      generate();
    }
    generate();
  </script>
