  <script>
    loadSnippets('Tools');

    const vals = [1000,900,500,400,100,90,50,40,10,9,5,4,1];
    const syms = ['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];

    function toRoman(n) {
      if(n<1||n>3999) return null;
      let result='';
      for(let i=0;i<vals.length;i++){
        while(n>=vals[i]){result+=syms[i];n-=vals[i];}
      }
      return result;
    }

    function fromRomanStr(s) {
      const map={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};
      s=s.toUpperCase().replace(/\s/g,'');
      let result=0;
      for(let i=0;i<s.length;i++){
        const cur=map[s[i]];
        const nxt=map[s[i+1]];
        if(!cur) return null;
        if(nxt&&nxt>cur){result+=nxt-cur;i++;}
        else result+=cur;
      }
      return result;
    }

    function fromDec() {
      const n = parseInt(document.getElementById('decInput').value);
      const err = document.getElementById('errMsg');
      if(isNaN(n)||n<1||n>3999){err.textContent='Enter a number between 1 and 3,999';document.getElementById('romInput').value='';return;}
      err.textContent='';
      document.getElementById('romInput').value = toRoman(n);
    }

    function fromRoman() {
      const s = document.getElementById('romInput').value.trim();
      const err = document.getElementById('errMsg');
      if(!s){err.textContent='';document.getElementById('decInput').value='';return;}
      const n = fromRomanStr(s);
      if(n===null||n<1||n>3999){err.textContent='Invalid Roman numeral';document.getElementById('decInput').value='';return;}
      err.textContent='';
      document.getElementById('decInput').value = n;
    }

    function setDec(n) {
      document.getElementById('decInput').value = n;
      fromDec();
    }
  </script>
