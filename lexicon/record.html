<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612" crossorigin="anonymous"></script>
  <title>Pergamon Atlas | Lexicon</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/operation/styles/header.css">
  <link rel="stylesheet" href="/operation/styles/sidebar.css">
  <link rel="stylesheet" href="/operation/styles/main.css">
  <link rel="stylesheet" href="/operation/styles/footer.css">
  <link rel="stylesheet" href="/operation/styles/lexicon.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content" id="mainContent">
      <!-- Populated by JS -->
    </main>
  </div>
  <div id="footer-placeholder"></div>

  <script src="/operation/scripts/atlas.js"></script>
  <script src="/data/lexicon.js"></script>
  <script src="/data/pergamon-address.js"></script>
  <script src="/data/entries.js"></script>
  <script src="/data/atlas-reference.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slug   = (params.get('word') || '').toLowerCase().trim();

    const data    = window.lexiconData;
    const entries = data.entries;
    const sorted  = [...entries].sort((a, b) => a.word.localeCompare(b.word));
    let   entry   = entries.find(e => e.slug === slug || e.word.toLowerCase() === slug);

    // ── User edits (localStorage overlay) ────────────
    const LEX_EDITS_KEY = 'lex_user_edits_v1';
    function lexLoadEdits() {
      try { return JSON.parse(localStorage.getItem(LEX_EDITS_KEY) || '{}'); }
      catch(e) { return {}; }
    }
    function lexSaveEdits(obj) { localStorage.setItem(LEX_EDITS_KEY, JSON.stringify(obj)); }

    if (entry) {
      const userEdit = lexLoadEdits()[entry.word];
      if (userEdit) {
        entry = Object.assign({}, entry);
        if (userEdit.definitions && userEdit.definitions.length) entry.definitions = userEdit.definitions;
        if (userEdit.example) entry.example = userEdit.example;
      }
    }

    // Update page title once we know the word
    if (entry) {
      document.title = 'Pergamon Atlas | ' + entry.word + ' — The Lexicon';

      // Inject atlas-meta so atlas-reference.js can render the reference section
      const atlasMeta = document.createElement('script');
      atlasMeta.type = 'application/json';
      atlasMeta.id = 'atlas-meta';
      atlasMeta.textContent = JSON.stringify({
        name: entry.word,
        date: entry.date || '2026-05-17',
        time: '00:00:00',
        chamber: entry.atlas.chamber,
        seed: entry.atlas.seed,
        coords: entry.atlas.coords,
        address: entry.atlas.address
      });
      document.head.appendChild(atlasMeta);
    }

    loadSnippets(entry ? entry.word + ' — The Lexicon' : 'The Lexicon');

    function toRoman(n) {
      const vals = [1000,900,500,400,100,90,50,40,10,9,5,4,1];
      const syms = ['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
      let out = '';
      for (let i = 0; i < vals.length; i++) {
        while (n >= vals[i]) { out += syms[i]; n -= vals[i]; }
      }
      return out;
    }

    function h(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function tagLink(word, type) {
      const e = entries.find(x => x.word === word || x.slug === word);
      const href = '/lexicon/record.html?word=' + encodeURIComponent(word);
      return `<a class="lex-tag ${h(type)}" href="${href}">${h(word)}</a>`;
    }

    function tagsOrEmpty(arr, type, emptyLabel) {
      if (!arr || arr.length === 0) {
        return `<span class="lex-tag empty">${h(emptyLabel)}</span>`;
      }
      return arr.map(w => tagLink(w, type)).join('');
    }

    const main = document.getElementById('mainContent');

    if (!entry) {
      main.innerHTML = `
        <div class="lex-not-found">
          <h2>Record Not Found</h2>
          <p>No indexed entry for <strong>"${h(slug || 'that word')}"</strong> was located in the Lexicon.</p>
          <a class="lex-random-btn" href="/lexicon/">← Return to the Lexicon</a>
        </div>
      `;
    } else {

      const cluster  = data.clusters[entry.cluster] || entry.cluster;
      const siblings = entries
        .filter(e => e.cluster === entry.cluster && e.word !== entry.word)
        .slice(0, 6);

      // Connection panels — only rendered when non-empty
      const synHTML = (entry.synonyms && entry.synonyms.length)
        ? `<div class="lex-panel" style="margin-bottom:0"><p class="lex-panel-label">Synonyms</p><div class="lex-tags">${entry.synonyms.map(w => tagLink(w, 'synonym')).join('')}</div></div>`
        : '';
      const antHTML = (entry.antonyms && entry.antonyms.length)
        ? `<div class="lex-panel" style="margin-bottom:0"><p class="lex-panel-label">Antonyms</p><div class="lex-tags">${entry.antonyms.map(w => tagLink(w, 'antonym')).join('')}</div></div>`
        : '';
      const connectionsHTML = (synHTML || antHTML)
        ? `<div class="lex-connections-grid" style="margin-bottom:16px">${synHTML}${antHTML}</div>`
        : '';

      const nearbyHTML = siblings.length
        ? `<p class="section-label" style="margin-top:32px">Nearby Records</p>
           <p class="lex-nearby-desc">Adjacent Atlas records occupying nearby coordinates.</p>
           <div class="lex-cluster-grid">
             ${siblings.map(s => `
               <a class="lex-cluster-card" href="/lexicon/record.html?word=${encodeURIComponent(s.word)}">
                 <span class="lex-cluster-card-word">${h(s.word)}</span>
                 <span class="lex-cluster-card-pos">${h(s.pos)}</span>
                 <span class="lex-cluster-card-addr">${h(s.atlas.address)}</span>
               </a>
             `).join('')}
           </div>`
        : '';

      main.innerHTML = `

        <!-- Word Hero -->
        <div class="lex-word-hero">

          <div class="lex-hero-wordblock">
            <h1>${h(entry.word)}</h1>
            <p class="lex-word-pronunciation">${h(entry.pronunciation)}&ensp;·&ensp;${h(entry.pos)}&ensp;·&ensp;English</p>
            <button onclick="openLexEdit()" type="button" style="margin-top:10px;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(0,0,0,0.18);background:rgba(0,0,0,0.04);color:#555;font-family:Georgia,serif;font-size:11px;letter-spacing:.06em;padding:5px 12px;border-radius:5px;cursor:pointer;text-decoration:none;transition:background .15s">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              Edit Entry
            </button>
          </div>

          <a href="/atlas-navigation/" class="lex-hero-artifact" aria-label="Atlas navigation">
            <span class="lex-hero-artifact-inner"></span>
            <svg class="lex-hero-artifact-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <path d="M24 4 40 13v22L24 44 8 35V13L24 4Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
              <path d="M8 13 24 22l16-9M24 22v22" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M16 17.5 24 13l8 4.5M16 30.5l8 4.5 8-4.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="lex-hero-artifact-text">
              <span class="lex-hero-artifact-label">Atlas Address</span>
              <span class="lex-hero-artifact-code">${h(entry.atlas.address)}</span>
            </span>
          </a>

        </div>

        <!-- Definition -->
        <div class="lex-panel">
          <p class="lex-panel-label">Definition${(entry.definitions || []).length > 1 ? 's' : ''}</p>
          ${(() => {
            const defs = entry.definitions || (entry.definition ? [entry.definition] : []);
            if (defs.length <= 1) {
              return `<p class="lex-definition-text">${h(defs[0] || '')}</p>`;
            }
            return `<ol class="lex-definition-list">
              ${defs.map((d, i) => `
                <li class="lex-definition-item">
                  <span class="lex-def-numeral">${toRoman(i + 1)}.</span>
                  <span class="lex-def-text">${h(d)}</span>
                </li>
              `).join('')}
            </ol>`;
          })()}
        </div>

        <!-- Example -->
        <div class="lex-panel">
          <p class="lex-panel-label">Example Usage</p>
          <p class="lex-example-text">${h(entry.example)}</p>
        </div>

        ${connectionsHTML}
        ${nearbyHTML}

      `;

      // ── Append edit panel ───────────────────────
      main.insertAdjacentHTML('beforeend', `
        <div id="lexEditPanel" style="display:none;margin-top:32px">
          <p class="section-label">Edit Entry</p>
          <div class="lex-panel">
            <div style="margin-bottom:16px">
              <label style="font-family:Georgia,serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8a611c;display:block;margin-bottom:8px">
                Definitions <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#aaa">(one per line)</span>
              </label>
              <textarea id="lexEditDefs" rows="4" style="width:100%;box-sizing:border-box;font-family:Georgia,serif;font-size:14px;line-height:1.6;padding:10px 12px;border:1.5px solid #ddd;border-radius:6px;resize:vertical;color:#2c1a00"></textarea>
            </div>
            <div style="margin-bottom:20px">
              <label style="font-family:Georgia,serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8a611c;display:block;margin-bottom:8px">Example Usage</label>
              <input id="lexEditExample" type="text" style="width:100%;box-sizing:border-box;font-family:Georgia,serif;font-size:14px;padding:10px 12px;border:1.5px solid #ddd;border-radius:6px;color:#2c1a00">
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap">
              <button onclick="saveLexEdit()" style="font-family:Georgia,serif;font-size:12px;padding:9px 20px;background:#2c1a00;color:#fff;border:none;border-radius:6px;cursor:pointer">Save Changes</button>
              <button onclick="closeLexEdit()" style="font-family:Georgia,serif;font-size:12px;padding:9px 20px;background:#fff;color:#666;border:1.5px solid #ccc;border-radius:6px;cursor:pointer">Cancel</button>
              <button onclick="clearLexEdit()" style="font-family:Georgia,serif;font-size:12px;padding:9px 20px;background:#fff;color:#c00;border:1.5px solid #f0c0c0;border-radius:6px;cursor:pointer;margin-left:auto">Remove My Edits</button>
            </div>
          </div>
        </div>
      `);
    }

    window.openLexEdit = function() {
      var panel = document.getElementById('lexEditPanel');
      if (!panel) return;
      var defs = (entry.definitions || (entry.definition ? [entry.definition] : [])).join('\n');
      document.getElementById('lexEditDefs').value    = defs;
      document.getElementById('lexEditExample').value = entry.example || '';
      panel.style.display = 'block';
      panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    window.closeLexEdit = function() {
      var panel = document.getElementById('lexEditPanel');
      if (panel) panel.style.display = 'none';
    };

    window.saveLexEdit = function() {
      var defsRaw = (document.getElementById('lexEditDefs').value || '').split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
      var example = (document.getElementById('lexEditExample').value || '').trim();
      var allEdits = lexLoadEdits();
      allEdits[entry.word] = { definitions: defsRaw, example: example, dateEdited: new Date().toISOString().slice(0,10) };
      lexSaveEdits(allEdits);
      window.location.reload();
    };

    window.clearLexEdit = function() {
      if (!confirm('Remove your personal edits for "' + entry.word + '"?')) return;
      var allEdits = lexLoadEdits();
      delete allEdits[entry.word];
      lexSaveEdits(allEdits);
      window.location.reload();
    };
  </script>
</body>
</html>
