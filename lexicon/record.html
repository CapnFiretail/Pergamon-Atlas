<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612" crossorigin="anonymous"></script>
  <title>Pergamon Atlas | Lexicon</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/operation/styles/header.css">
  <link rel="stylesheet" href="/operation/styles/sidebar.css">
  <link rel="stylesheet" href="/operation/styles/main.css">
  <link rel="stylesheet" href="/operation/styles/footer.css">
  <link rel="stylesheet" href="/operation/styles/lexicon.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content" id="mainContent">
      <!-- Populated by JS -->
    </main>
  </div>
  <div id="footer-placeholder"></div>

  <script src="/operation/scripts/atlas.js"></script>
  <script src="/data/lexicon.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slug   = (params.get('word') || '').toLowerCase().trim();

    const data    = window.lexiconData;
    const entries = data.entries;
    const sorted  = [...entries].sort((a, b) => a.word.localeCompare(b.word));
    const entry   = entries.find(e => e.slug === slug || e.word.toLowerCase() === slug);

    // Update page title once we know the word
    if (entry) {
      document.title = 'Pergamon Atlas | ' + entry.word + ' — The Lexicon';
    }

    loadSnippets(entry ? entry.word + ' — The Lexicon' : 'The Lexicon');

    function h(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function tagLink(word, type) {
      const e = entries.find(x => x.word === word || x.slug === word);
      const href = '/lexicon/record.html?word=' + encodeURIComponent(word);
      return `<a class="lex-tag ${h(type)}" href="${href}">${h(word)}</a>`;
    }

    function tagsOrEmpty(arr, type, emptyLabel) {
      if (!arr || arr.length === 0) {
        return `<span class="lex-tag empty">${h(emptyLabel)}</span>`;
      }
      return arr.map(w => tagLink(w, type)).join('');
    }

    const main = document.getElementById('mainContent');

    if (!entry) {
      main.innerHTML = `
        <div class="lex-not-found">
          <h2>Record Not Found</h2>
          <p>No indexed entry for <strong>"${h(slug || 'that word')}"</strong> was located in the Lexicon.</p>
          <a class="lex-random-btn" href="/lexicon/">← Return to the Lexicon</a>
        </div>
      `;
    } else {

      const idx     = sorted.findIndex(e => e.word === entry.word);
      const prev    = idx > 0              ? sorted[idx - 1] : null;
      const next    = idx < sorted.length - 1 ? sorted[idx + 1] : null;
      const cluster = data.clusters[entry.cluster] || entry.cluster;

      // Cluster siblings (same cluster, not self, up to 6)
      const siblings = entries
        .filter(e => e.cluster === entry.cluster && e.word !== entry.word)
        .slice(0, 6);

      function navCard(e, dir) {
        if (!e) return `<div></div>`;
        const arrow = dir === 'prev' ? '←' : '→';
        const dirLabel = dir === 'prev' ? 'Previous' : 'Next';
        if (dir === 'prev') {
          return `
            <a class="lex-nav-prev" href="/lexicon/record.html?word=${encodeURIComponent(e.word)}">
              <span class="lex-nav-arrow">${arrow}</span>
              <span>
                <span class="lex-nav-dir">${dirLabel}</span>
                <span class="lex-nav-word">${h(e.word)}</span>
                <span class="lex-nav-pos">${h(e.pos)}</span>
              </span>
            </a>`;
        }
        return `
          <a class="lex-nav-next" href="/lexicon/record.html?word=${encodeURIComponent(e.word)}">
            <span>
              <span class="lex-nav-dir">${dirLabel}</span>
              <span class="lex-nav-word">${h(e.word)}</span>
              <span class="lex-nav-pos">${h(e.pos)}</span>
            </span>
            <span class="lex-nav-arrow">${arrow}</span>
          </a>`;
      }

      const clusterHTML = siblings.length > 0
        ? `<div class="lex-cluster-grid">
            ${siblings.map(s => `
              <a class="lex-cluster-card" href="/lexicon/record.html?word=${encodeURIComponent(s.word)}">
                <span class="lex-cluster-card-word">${h(s.word)}</span>
                <span class="lex-cluster-card-pos">${h(s.pos)}</span>
              </a>
            `).join('')}
           </div>`
        : `<p style="color:#888;font-family:Georgia,serif;font-size:14px;margin:0">No other entries in this cluster yet.</p>`;

      main.innerHTML = `

        <!-- Back link -->
        <p style="margin:0 0 16px;font-family:Georgia,serif;font-size:14px;">
          <a href="/lexicon/" style="color:#8a611c;text-decoration:none;">← The Lexicon</a>
        </p>

        <!-- Word Hero -->
        <div class="lex-word-hero">

          <div class="lex-hero-wordblock">
            <h1>${h(entry.word)}</h1>
            <p class="lex-word-pronunciation">${h(entry.pronunciation)}&ensp;·&ensp;${h(entry.syllables)}</p>
            <div class="lex-word-meta-row">
              <span class="lex-meta-chip pos">${h(entry.pos)}</span>
            </div>
          </div>

          <a href="/atlas-navigation/" class="lex-hero-artifact" aria-label="Atlas navigation">
            <span class="lex-hero-artifact-inner"></span>
            <svg class="lex-hero-artifact-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <path d="M24 4 40 13v22L24 44 8 35V13L24 4Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
              <path d="M8 13 24 22l16-9M24 22v22" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M16 17.5 24 13l8 4.5M16 30.5l8 4.5 8-4.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="lex-hero-artifact-text">
              <span class="lex-hero-artifact-label">Atlas Address</span>
              <span class="lex-hero-artifact-code">${h(entry.atlas.address)}</span>
            </span>
          </a>

        </div>

        <!-- Definition -->
        <div class="lex-panel">
          <p class="lex-panel-label">Definition</p>
          <p class="lex-definition-text">${h(entry.definition)}</p>
        </div>

        <!-- Example -->
        <div class="lex-panel">
          <p class="lex-panel-label">Example Usage</p>
          <p class="lex-example-text">${h(entry.example)}</p>
        </div>

        <!-- Synonyms + Antonyms -->
        <div class="lex-connections-grid">
          <div class="lex-panel" style="margin-bottom:0">
            <p class="lex-panel-label">Synonyms</p>
            <div class="lex-tags">
              ${tagsOrEmpty(entry.synonyms, 'synonym', 'none recorded')}
            </div>
          </div>
          <div class="lex-panel" style="margin-bottom:0">
            <p class="lex-panel-label">Antonyms</p>
            <div class="lex-tags">
              ${tagsOrEmpty(entry.antonyms, 'antonym', 'none recorded')}
            </div>
          </div>
        </div>

        <!-- Related -->
        <div class="lex-panel" style="margin-top:16px">
          <p class="lex-panel-label">Related Entries</p>
          <div class="lex-tags">
            ${tagsOrEmpty(entry.related, 'related', 'none recorded')}
          </div>
        </div>

        <!-- Navigation -->
        <div class="lex-nav" style="margin-top:24px">
          <div class="lex-nav-inner">
            ${navCard(prev, 'prev')}
            <div class="lex-nav-divider"></div>
            ${navCard(next, 'next')}
          </div>
        </div>

        <!-- Cluster -->
        <p class="section-label" style="margin-top:32px">${h(cluster)} — Nearby Records</p>
        ${clusterHTML}

        <!-- Coords footnote -->
        <p style="margin:24px 0 0;font-family:Georgia,serif;font-size:12px;color:#aaa;letter-spacing:0.04em;">
          Indexed entry &middot; Coords (${entry.atlas.coords.x}, ${entry.atlas.coords.y}, ${entry.atlas.coords.z}) &middot; Registered within Pergamon Atlas
        </p>

      `;
    }
  </script>
</body>
</html>
