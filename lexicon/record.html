<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612" crossorigin="anonymous"></script>
  <title>Pergamon Atlas | Lexicon</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/operation/styles/header.css">
  <link rel="stylesheet" href="/operation/styles/sidebar.css">
  <link rel="stylesheet" href="/operation/styles/main.css">
  <link rel="stylesheet" href="/operation/styles/footer.css">
  <link rel="stylesheet" href="/operation/styles/lexicon.css">
</head>
<body class="lex-page">
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content" id="mainContent">
      <!-- Populated by JS -->
    </main>
  </div>
  <div id="footer-placeholder"></div>

  <script src="/operation/scripts/atlas.js"></script>
  <script src="/data/lexicon.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slug   = (params.get('word') || '').toLowerCase().trim();

    const entries = window.lexiconData.entries;
    const sorted  = [...entries].sort((a, b) => a.word.localeCompare(b.word));
    const entry   = entries.find(e => e.slug === slug || e.word.toLowerCase() === slug);

    if (entry) {
      document.title = 'Pergamon Atlas | ' + entry.word + ' — The Lexicon';
    }

    loadSnippets(entry ? entry.word + ' — The Lexicon' : 'The Lexicon');

    function h(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function connLink(word) {
      const href = '/lexicon/record.html?word=' + encodeURIComponent(word);
      return `<a class="lex-conn-link" href="${href}">${h(word)}</a>`;
    }

    function connList(arr) {
      if (!arr || arr.length === 0) return '<span style="color:rgba(255,255,255,0.15);font-style:italic;">—</span>';
      return arr.map(connLink).join('<span class="lex-conn-sep">·</span>');
    }

    const NUMERALS = ['I.', 'II.', 'III.', 'IV.', 'V.'];

    const main = document.getElementById('mainContent');

    if (!entry) {
      main.innerHTML = `
        <div class="lex-not-found">
          <h2>Record Not Found</h2>
          <p>No indexed entry for <strong>"${h(slug || 'that word')}"</strong> was located in the Lexicon.</p>
          <a class="lex-random-btn" href="/lexicon/">← Return to the Lexicon</a>
        </div>
      `;
    } else {
      const idx  = sorted.findIndex(e => e.word === entry.word);
      const prev = idx > 0                 ? sorted[idx - 1] : null;
      const next = idx < sorted.length - 1 ? sorted[idx + 1] : null;

      const nearby = entries
        .filter(e => e.cluster === entry.cluster && e.word !== entry.word)
        .slice(0, 6);

      const defsHTML = (entry.definitions || []).map((def, i) => `
        <div class="lex-def-item">
          <span class="lex-numeral">${NUMERALS[i] || (i + 1) + '.'}</span>
          <p class="lex-def-text">${h(def)}</p>
        </div>
      `).join('');

      const prevLink = prev
        ? `<a class="lex-nav-link" href="/lexicon/record.html?word=${encodeURIComponent(prev.word)}">← ${h(prev.word)}</a>`
        : `<span></span>`;
      const nextLink = next
        ? `<a class="lex-nav-link next" href="/lexicon/record.html?word=${encodeURIComponent(next.word)}">${h(next.word)} →</a>`
        : `<span></span>`;

      const nearbyHTML = nearby.length > 0 ? `
        <div class="lex-meta-row">
          <span class="lex-meta-key">Nearby Records</span>
          <span class="lex-meta-val">${connList(nearby.map(e => e.word))}</span>
        </div>` : '';

      main.innerHTML = `
        <div class="lex-record-wrap">

          <a class="lex-back" href="/lexicon/">← The Lexicon</a>

          <div class="lex-word-header">
            <h1>${h(entry.word)}</h1>
            <div class="lex-word-meta">
              <span class="lex-word-pronunciation">${h(entry.pronunciation)}</span>
              <span class="lex-word-meta-dot">·</span>
              <span class="lex-word-pos">${h(entry.pos)}</span>
            </div>
          </div>

          <div class="lex-defs">
            ${defsHTML}
          </div>

          <div class="lex-meta-grid">
            <div class="lex-meta-row">
              <span class="lex-meta-key">Atlas Reference</span>
              <span class="lex-meta-val code">${h(entry.atlas.address)}</span>
            </div>
            ${entry.related && entry.related.length > 0 ? `
            <div class="lex-meta-row">
              <span class="lex-meta-key">Related Entries</span>
              <span class="lex-meta-val">${connList(entry.related)}</span>
            </div>` : ''}
            ${nearbyHTML}
          </div>

          <div class="lex-nav-bar">
            ${prevLink}
            <span class="lex-nav-center">The Lexicon</span>
            ${nextLink}
          </div>

        </div>
      `;
    }
  </script>
</body>
</html>
