<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612" crossorigin="anonymous"></script>
  <title>Pergamon Atlas | The Lexicon</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Lexicon — a catalog of language within Pergamon Atlas. Every word is an indexed entry with an Atlas address, semantic connections, and neighboring records.">
  <script type="application/json" id="atlas-meta">
{
  "name": "The Lexicon",
  "date": "2026-05-17",
  "time": "00:00:00",
  "chamber": "PG",
  "seed": 2345678901,
  "code_seed": 1779177600,
  "coords": { "x": 1234567, "y": -2345678, "z": 3456789 },
  "address": "LEXIC-ON000-INDEX"
}
</script>
  <link rel="stylesheet" href="/operation/styles/header.css">
  <link rel="stylesheet" href="/operation/styles/sidebar.css">
  <link rel="stylesheet" href="/operation/styles/main.css">
  <link rel="stylesheet" href="/operation/styles/footer.css">
  <link rel="stylesheet" href="/operation/styles/lexicon.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">

      <!-- Hero -->
      <section class="game-hero catalog-hero">
        <span class="game-hero-corner tl"></span>
        <span class="game-hero-corner tr"></span>
        <span class="game-hero-corner bl"></span>
        <span class="game-hero-corner br"></span>
        <div class="game-hero-emblem">
          <img src="/operation/images/lexicon-logo.png" alt="Lexicon Logo">
        </div>
        <div class="game-hero-sep">&#10022;</div>
        <div class="game-hero-title">
          <h2>The Lexicon</h2>
          <div class="game-hero-sub">
            <span class="game-hero-sub-line"></span>
            <span>Pergamon Catalogs</span>
            <span class="game-hero-sub-line"></span>
          </div>
        </div>
      </section>

      <!-- Tab Bar -->
      <div class="lex-tabs">
        <button class="lex-tab-btn active" id="tabBtnLexicon">English Lexicon</button>
        <button class="lex-tab-btn" id="tabBtnRegister">French Lexicon</button>
      </div>

      <!-- Lexicon Tab -->
      <div id="tab-lexicon">

        <!-- Search + Random -->
        <div class="lex-search-row">
          <div class="lex-search-wrap">
            <span class="lex-search-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            </span>
            <input
              type="text"
              class="lex-search-input"
              id="lexSearch"
              placeholder="Search the Lexicon..."
              autocomplete="off"
              spellcheck="false"
            >
          </div>
          <button class="lex-random-btn" id="randomEntryBtn" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
            Random Entry
          </button>
        </div>

        <!-- Featured -->
        <p class="section-label">Featured Records</p>
        <div class="lex-featured-grid" id="featuredGrid"></div>

        <!-- Alphabet bar -->
        <div class="section-gap"></div>
        <p class="section-label">Browse by Letter</p>
        <div class="lex-alpha-bar" id="alphaBar"></div>

        <!-- Word list -->
        <div class="lex-word-list" id="wordList"></div>
        <div class="lex-no-results" id="noResults">No records found for that search.</div>

      </div>

      <!-- French Lexicon Tab -->
      <div id="tab-register" style="display:none">

        <!-- Search + Random + New Entry -->
        <div class="lex-search-row">
          <div class="lex-search-wrap">
            <span class="lex-search-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            </span>
            <input type="text" class="lex-search-input" id="flSearch" placeholder="Search the French Lexicon..." autocomplete="off" spellcheck="false">
          </div>
          <button class="lex-random-btn" id="flRandomBtn" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
            Random Entry
          </button>
          <a class="lex-random-btn" href="/french-lexicon/" style="text-decoration:none">+ New Entry</a>
        </div>

        <!-- Recent Records -->
        <p class="section-label" id="flFeaturedLabel">Recent Records</p>
        <div class="lex-featured-grid" id="flFeaturedGrid"></div>

        <!-- Browse by Letter -->
        <div class="section-gap" id="flAlphaGap"></div>
        <p class="section-label" id="flAlphaLabel">Browse by Letter</p>
        <div class="lex-alpha-bar" id="flAlphaBar"></div>

        <!-- Word list -->
        <div class="lex-word-list" id="flList"></div>
        <div class="fr-empty" id="flEmpty" style="display:none">
          <strong>No entries yet</strong>
          Add your first French word using the New Entry button above.
        </div>
        <div class="lex-no-results" id="flNoResults" style="display:none">No entries match that search.</div>

      </div>

    </main>
  </div>
  <div id="footer-placeholder"></div>

  <script src="/operation/scripts/atlas.js"></script>
  <script src="/data/lexicon.js"></script>
  <script src="/data/french-lexicon.js"></script>
  <script>
    loadSnippets('The Lexicon');

    const FEATURED_WORDS = ['ocean', 'fire', 'time', 'archive', 'silence'];

    function getDef(e) {
      if (e.definitions && e.definitions.length) return e.definitions[0];
      return e.definition || '';
    }

    const entries = window.lexiconData.entries;
    const sorted  = [...entries].sort((a, b) => a.word.localeCompare(b.word));

    // ── Featured grid ──────────────────────────────
    const fg = document.getElementById('featuredGrid');
    FEATURED_WORDS.forEach(w => {
      const e = entries.find(x => x.word === w);
      if (!e) return;
      const card = document.createElement('a');
      card.href = '/lexicon/record.html?word=' + encodeURIComponent(e.word);
      card.className = 'lex-feat-card';
      card.innerHTML = `
        <p class="lex-feat-word">${e.word}</p>
        <p class="lex-feat-pos">${e.pos}</p>
        <p class="lex-feat-snippet">${getDef(e)}</p>
      `;
      fg.appendChild(card);
    });

    // ── Alphabet bar ───────────────────────────────
    const letters = [...new Set(sorted.map(e => e.word[0].toUpperCase()))];
    const allLetters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const alphaBar = document.getElementById('alphaBar');

    allLetters.forEach(L => {
      const btn = document.createElement('button');
      btn.className = 'lex-alpha-btn';
      btn.textContent = L;
      if (!letters.includes(L)) {
        btn.disabled = true;
      } else {
        btn.addEventListener('click', () => {
          document.getElementById('lexSearch').value = '';
          renderList(sorted);
          document.querySelectorAll('.lex-alpha-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          requestAnimationFrame(() => {
            const section = document.getElementById('section-' + L);
            if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
        });
      }
      alphaBar.appendChild(btn);
    });

    // ── Word list ──────────────────────────────────
    const wordList = document.getElementById('wordList');
    const noResults = document.getElementById('noResults');

    function truncateDef(def, max = 90) {
      return def.length > max ? def.slice(0, max).trimEnd() + '…' : def;
    }

    function renderList(items) {
      wordList.innerHTML = '';
      noResults.style.display = 'none';

      if (items.length === 0) {
        wordList.style.display = 'none';
        noResults.style.display = 'block';
        return;
      }

      wordList.style.display = 'block';

      const groups = {};
      items.forEach(e => {
        const L = e.word[0].toUpperCase();
        if (!groups[L]) groups[L] = [];
        groups[L].push(e);
      });

      Object.keys(groups).sort().forEach(L => {
        const section = document.createElement('div');
        section.className = 'lex-letter-section';
        section.id = 'section-' + L;

        const header = document.createElement('div');
        header.className = 'lex-letter-header';
        header.textContent = L;
        section.appendChild(header);

        groups[L].forEach(e => {
          const row = document.createElement('a');
          row.href = '/lexicon/record.html?word=' + encodeURIComponent(e.word);
          row.className = 'lex-word-row';
          row.innerHTML = `
            <span class="lex-row-word">${e.word}</span>
            <span class="lex-row-pos">${e.pos}</span>
            <span class="lex-row-dot">·</span>
            <span class="lex-row-def">${truncateDef(getDef(e))}</span>
          `;
          section.appendChild(row);
        });

        wordList.appendChild(section);
      });
    }

    renderList(sorted);

    // ── Search ─────────────────────────────────────
    const searchInput = document.getElementById('lexSearch');

    function doSearch(q) {
      q = q.trim().toLowerCase();
      document.querySelectorAll('.lex-alpha-btn').forEach(b => b.classList.remove('active'));

      if (!q) {
        renderList(sorted);
        return;
      }

      const filtered = sorted.filter(e =>
        e.word.toLowerCase().includes(q) ||
        getDef(e).toLowerCase().includes(q)
      );
      renderList(filtered);
    }

    searchInput.addEventListener('input', () => doSearch(searchInput.value));

    searchInput.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const q = searchInput.value.trim().toLowerCase();
      if (!q) return;
      const exact = entries.find(x => x.word.toLowerCase() === q);
      if (exact) {
        window.location.href = '/lexicon/record.html?word=' + encodeURIComponent(exact.word);
      }
    });

    // ── Random entry ───────────────────────────────
    document.getElementById('randomEntryBtn').addEventListener('click', () => {
      const e = entries[Math.floor(Math.random() * entries.length)];
      window.location.href = '/lexicon/record.html?word=' + encodeURIComponent(e.word);
    });

    // ══════════════════════════════════════════════
    // TAB SWITCHING
    // ══════════════════════════════════════════════

    const tabLexEl  = document.getElementById('tab-lexicon');
    const tabRegEl  = document.getElementById('tab-register');
    const tabBtnLex = document.getElementById('tabBtnLexicon');
    const tabBtnReg = document.getElementById('tabBtnRegister');

    function switchTab(tab) {
      if (tab === 'register') {
        tabLexEl.style.display  = 'none';
        tabRegEl.style.display  = 'block';
        tabBtnLex.classList.remove('active');
        tabBtnReg.classList.add('active');
        flRenderTab();
      } else {
        tabLexEl.style.display  = 'block';
        tabRegEl.style.display  = 'none';
        tabBtnLex.classList.add('active');
        tabBtnReg.classList.remove('active');
      }
    }

    tabBtnLex.addEventListener('click', () => switchTab('lexicon'));
    tabBtnReg.addEventListener('click', () => switchTab('register'));

    // Only open French tab when explicitly requested via ?tab=french
    if (new URLSearchParams(window.location.search).get('tab') === 'french') switchTab('register');

    // ══════════════════════════════════════════════
    // FRENCH LEXICON TAB
    // ══════════════════════════════════════════════

    const FL_KEY      = 'fl_entries_v1';
    const FL_SEED_KEY = 'fl_seeded_count';

    function flLoad() {
      try { return JSON.parse(localStorage.getItem(FL_KEY) || '[]'); }
      catch(e) { return []; }
    }

    function flSeedFromFile() {
      var fileEntries = (window.frenchLexiconData && window.frenchLexiconData.entries) || [];
      var lastCount   = parseInt(localStorage.getItem(FL_SEED_KEY) || '0', 10);
      if (fileEntries.length <= lastCount) return;
      var existing    = flLoad();
      var existingIds = new Set(existing.map(function(e) { return e.id; }));
      var toAdd       = fileEntries.filter(function(e) { return !existingIds.has(e.id); });
      if (toAdd.length > 0) localStorage.setItem(FL_KEY, JSON.stringify(toAdd.concat(existing)));
      localStorage.setItem(FL_SEED_KEY, fileEntries.length.toString());
    }

    function flEsc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function flRowHTML(e) {
      return '<div class="lex-word-row">' +
        '<a class="fl-row-link" href="/french-lexicon/record.html?id=' + flEsc(e.id) + '">' +
          '<span class="lex-row-word">' + flEsc(e.word || '') + '</span>' +
          (e.pronunciation ? '<span class="lex-row-pos">[' + flEsc(e.pronunciation) + ']</span>' : '') +
          '<span class="lex-row-dot">·</span>' +
          '<span class="lex-row-def">' + flEsc(e.translation || e.primary || '') + '</span>' +
        '</a>' +
        '<a class="fl-row-edit" href="/french-lexicon/?edit=' + flEsc(e.id) + '" title="Edit">' +
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
        '</a>' +
      '</div>';
    }

    function flRenderTab() {
      flSeedFromFile();
      var all    = flLoad();
      var sorted = all.slice().sort(function(a,b){ return (a.word||'').localeCompare(b.word||''); });
      var q      = ((document.getElementById('flSearch') || {}).value || '').trim().toLowerCase();
      var items  = q ? sorted.filter(function(e) {
        return (e.word||'').toLowerCase().includes(q) ||
               (e.translation||e.primary||'').toLowerCase().includes(q);
      }) : sorted;

      var listEl     = document.getElementById('flList');
      var emptyEl    = document.getElementById('flEmpty');
      var noResEl    = document.getElementById('flNoResults');
      var featGrid   = document.getElementById('flFeaturedGrid');
      var featLabel  = document.getElementById('flFeaturedLabel');
      var alphaBar   = document.getElementById('flAlphaBar');
      var alphaLabel = document.getElementById('flAlphaLabel');
      var alphaGap   = document.getElementById('flAlphaGap');

      listEl.innerHTML  = '';
      listEl.style.display  = 'none';
      emptyEl.style.display = 'none';
      noResEl.style.display = 'none';

      if (all.length === 0) {
        emptyEl.style.display = 'block';
        featGrid.innerHTML = ''; featLabel.style.display = featGrid.style.display = 'none';
        alphaBar.innerHTML = ''; alphaLabel.style.display = alphaGap.style.display = alphaBar.style.display = 'none';
        return;
      }

      // Recent Records (5 newest, shown only when not searching)
      if (!q) {
        featLabel.style.display = featGrid.style.display = '';
        var recent = all.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }).slice(0,5);
        featGrid.innerHTML = recent.map(function(e) {
          return '<a class="lex-feat-card" href="/french-lexicon/record.html?id=' + flEsc(e.id) + '">' +
            '<p class="lex-feat-word">' + flEsc(e.word||'') + '</p>' +
            '<p class="lex-feat-pos">' + flEsc(e.pos||'') + '</p>' +
            '<p class="lex-feat-snippet">' + flEsc(e.translation||e.primary||'') + '</p>' +
          '</a>';
        }).join('');
      } else {
        featLabel.style.display = featGrid.style.display = 'none';
      }

      // Alphabet bar (only when browsing, not searching)
      if (!q && items.length > 0) {
        alphaGap.style.display = alphaLabel.style.display = alphaBar.style.display = '';
        var letters = new Set(items.map(function(e){ return (e.word||'A')[0].toUpperCase(); }));
        alphaBar.innerHTML = '';
        'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(function(L) {
          var btn = document.createElement('button');
          btn.className = 'lex-alpha-btn';
          btn.textContent = L;
          if (!letters.has(L)) {
            btn.disabled = true;
          } else {
            btn.addEventListener('click', function() {
              document.getElementById('flSearch').value = '';
              document.querySelectorAll('#flAlphaBar .lex-alpha-btn').forEach(function(b){ b.classList.remove('active'); });
              btn.classList.add('active');
              flRenderTab();
              requestAnimationFrame(function() {
                var sec = document.getElementById('fl-sec-' + L);
                if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
              });
            });
          }
          alphaBar.appendChild(btn);
        });
      } else {
        alphaGap.style.display = alphaLabel.style.display = alphaBar.style.display = 'none';
      }

      if (items.length === 0) { noResEl.style.display = 'block'; return; }

      listEl.style.display = 'block';

      if (q) {
        listEl.innerHTML = items.map(flRowHTML).join('');
      } else {
        var groups = {};
        items.forEach(function(e) {
          var L = (e.word||'A')[0].toUpperCase();
          if (!groups[L]) groups[L] = [];
          groups[L].push(e);
        });
        listEl.innerHTML = Object.keys(groups).sort().map(function(L) {
          return '<div class="lex-letter-section" id="fl-sec-' + L + '">' +
            '<div class="lex-letter-header">' + L + '</div>' +
            groups[L].map(flRowHTML).join('') +
          '</div>';
        }).join('');
      }
    }

    flSeedFromFile();

    document.getElementById('flSearch').addEventListener('input', flRenderTab);

    document.getElementById('flRandomBtn').addEventListener('click', function() {
      var all = flLoad();
      if (!all.length) return;
      var e = all[Math.floor(Math.random() * all.length)];
      window.location.href = '/french-lexicon/record.html?id=' + encodeURIComponent(e.id);
    });
  </script>
</body>
</html>
