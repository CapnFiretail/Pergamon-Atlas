<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612" crossorigin="anonymous"></script>
  <title>Pergamon Atlas | The Lexicon</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Lexicon — a catalog of language within Pergamon Atlas. Every word is an indexed entry with an Atlas address, semantic connections, and neighboring records.">
  <script type="application/json" id="atlas-meta">
{
  "name": "The Lexicon",
  "date": "2026-05-17",
  "time": "00:00:00",
  "chamber": "PG",
  "seed": 2345678901,
  "code_seed": 1779177600,
  "coords": { "x": 1234567, "y": -2345678, "z": 3456789 },
  "address": "LEXIC-ON000-INDEX"
}
</script>
  <link rel="stylesheet" href="/operation/styles/header.css">
  <link rel="stylesheet" href="/operation/styles/sidebar.css">
  <link rel="stylesheet" href="/operation/styles/main.css">
  <link rel="stylesheet" href="/operation/styles/footer.css">
  <link rel="stylesheet" href="/operation/styles/lexicon.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">

      <!-- Hero -->
      <section class="game-hero catalog-hero">
        <span class="game-hero-corner tl"></span>
        <span class="game-hero-corner tr"></span>
        <span class="game-hero-corner bl"></span>
        <span class="game-hero-corner br"></span>
        <div class="game-hero-emblem">
          <img src="/operation/images/lexicon-logo.png" alt="Lexicon Logo">
        </div>
        <div class="game-hero-sep">&#10022;</div>
        <div class="game-hero-title">
          <h2>The Lexicon</h2>
          <div class="game-hero-sub">
            <span class="game-hero-sub-line"></span>
            <span>Pergamon Catalogs</span>
            <span class="game-hero-sub-line"></span>
          </div>
        </div>
      </section>

      <!-- Tab Bar -->
      <div class="lex-tabs">
        <button class="lex-tab-btn active" id="tabBtnLexicon">Lexicon</button>
        <button class="lex-tab-btn" id="tabBtnRegister">French Register</button>
      </div>

      <!-- Lexicon Tab -->
      <div id="tab-lexicon">

        <!-- Search + Random -->
        <div class="lex-search-row">
          <div class="lex-search-wrap">
            <span class="lex-search-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            </span>
            <input
              type="text"
              class="lex-search-input"
              id="lexSearch"
              placeholder="Search the Lexicon..."
              autocomplete="off"
              spellcheck="false"
            >
          </div>
          <button class="lex-random-btn" id="randomEntryBtn" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
            Random Entry
          </button>
        </div>

        <!-- Featured -->
        <p class="section-label">Featured Records</p>
        <div class="lex-featured-grid" id="featuredGrid"></div>

        <!-- Alphabet bar -->
        <div class="section-gap"></div>
        <p class="section-label">Browse by Letter</p>
        <div class="lex-alpha-bar" id="alphaBar"></div>

        <!-- Word list -->
        <div class="lex-word-list" id="wordList"></div>
        <div class="lex-no-results" id="noResults">No records found for that search.</div>

      </div>

      <!-- French Register Tab -->
      <div id="tab-register" style="display:none">

        <!-- Add Entry Form -->
        <div class="fr-form-card">
          <div class="fr-form-title">New Entry</div>
          <div class="fr-form-grid">
            <div class="fr-form-group">
              <label class="fr-form-label" for="frFrench">French</label>
              <input type="text" class="fr-form-input" id="frFrench" placeholder="e.g. bonjour" autocomplete="off" spellcheck="false" lang="fr">
            </div>
            <div class="fr-form-group">
              <label class="fr-form-label" for="frEnglish">English</label>
              <input type="text" class="fr-form-input" id="frEnglish" placeholder="e.g. good morning" autocomplete="off">
            </div>
            <div class="fr-form-group full">
              <label class="fr-form-label" for="frNote">Note <span class="fr-label-opt">(optional)</span></label>
              <input type="text" class="fr-form-input" id="frNote" placeholder="context, usage, memory hook..." autocomplete="off">
            </div>
            <div class="fr-form-group full">
              <button class="fr-form-btn" id="frSubmit" type="button">Add to Register</button>
            </div>
          </div>
          <div class="fr-form-error" id="frError" style="display:none"></div>
        </div>

        <!-- Search + count -->
        <div class="fr-control-row">
          <div class="lex-search-wrap" style="max-width:440px">
            <span class="lex-search-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            </span>
            <input type="text" class="lex-search-input" id="frSearch" placeholder="Search entries..." autocomplete="off" spellcheck="false">
          </div>
          <span class="fr-count" id="frCount"></span>
          <button class="lex-random-btn" id="frExportBtn" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export Register
          </button>
        </div>

        <!-- Ledger -->
        <div class="fr-ledger" id="frLedger" style="display:none">
          <div class="fr-ledger-header">
            <span>French</span>
            <span>English</span>
            <span>Added</span>
            <span></span>
          </div>
          <div id="frRows"></div>
        </div>
        <div class="fr-empty" id="frEmpty" style="display:none">
          <strong>No entries recorded yet</strong>
          Add your first French word or phrase using the form above.
        </div>
        <div class="lex-no-results" id="frNoResults" style="display:none">No entries match that search.</div>

      </div>

    </main>
  </div>
  <div id="footer-placeholder"></div>

  <script src="/operation/scripts/atlas.js"></script>
  <script src="/data/lexicon.js"></script>
  <script src="/data/french-register.js"></script>
  <script>
    loadSnippets('The Lexicon');

    const FEATURED_WORDS = ['ocean', 'fire', 'time', 'archive', 'silence'];

    function getDef(e) {
      if (e.definitions && e.definitions.length) return e.definitions[0];
      return e.definition || '';
    }

    const entries = window.lexiconData.entries;
    const sorted  = [...entries].sort((a, b) => a.word.localeCompare(b.word));

    // ── Featured grid ──────────────────────────────
    const fg = document.getElementById('featuredGrid');
    FEATURED_WORDS.forEach(w => {
      const e = entries.find(x => x.word === w);
      if (!e) return;
      const card = document.createElement('a');
      card.href = '/lexicon/record.html?word=' + encodeURIComponent(e.word);
      card.className = 'lex-feat-card';
      card.innerHTML = `
        <p class="lex-feat-word">${e.word}</p>
        <p class="lex-feat-pos">${e.pos}</p>
        <p class="lex-feat-snippet">${getDef(e)}</p>
      `;
      fg.appendChild(card);
    });

    // ── Alphabet bar ───────────────────────────────
    const letters = [...new Set(sorted.map(e => e.word[0].toUpperCase()))];
    const allLetters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const alphaBar = document.getElementById('alphaBar');

    allLetters.forEach(L => {
      const btn = document.createElement('button');
      btn.className = 'lex-alpha-btn';
      btn.textContent = L;
      if (!letters.includes(L)) {
        btn.disabled = true;
      } else {
        btn.addEventListener('click', () => {
          document.getElementById('lexSearch').value = '';
          renderList(sorted);
          document.querySelectorAll('.lex-alpha-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          requestAnimationFrame(() => {
            const section = document.getElementById('section-' + L);
            if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
        });
      }
      alphaBar.appendChild(btn);
    });

    // ── Word list ──────────────────────────────────
    const wordList = document.getElementById('wordList');
    const noResults = document.getElementById('noResults');

    function truncateDef(def, max = 90) {
      return def.length > max ? def.slice(0, max).trimEnd() + '…' : def;
    }

    function renderList(items) {
      wordList.innerHTML = '';
      noResults.style.display = 'none';

      if (items.length === 0) {
        wordList.style.display = 'none';
        noResults.style.display = 'block';
        return;
      }

      wordList.style.display = 'block';

      const groups = {};
      items.forEach(e => {
        const L = e.word[0].toUpperCase();
        if (!groups[L]) groups[L] = [];
        groups[L].push(e);
      });

      Object.keys(groups).sort().forEach(L => {
        const section = document.createElement('div');
        section.className = 'lex-letter-section';
        section.id = 'section-' + L;

        const header = document.createElement('div');
        header.className = 'lex-letter-header';
        header.textContent = L;
        section.appendChild(header);

        groups[L].forEach(e => {
          const row = document.createElement('a');
          row.href = '/lexicon/record.html?word=' + encodeURIComponent(e.word);
          row.className = 'lex-word-row';
          row.innerHTML = `
            <span class="lex-row-word">${e.word}</span>
            <span class="lex-row-pos">${e.pos}</span>
            <span class="lex-row-dot">·</span>
            <span class="lex-row-def">${truncateDef(getDef(e))}</span>
          `;
          section.appendChild(row);
        });

        wordList.appendChild(section);
      });
    }

    renderList(sorted);

    // ── Search ─────────────────────────────────────
    const searchInput = document.getElementById('lexSearch');

    function doSearch(q) {
      q = q.trim().toLowerCase();
      document.querySelectorAll('.lex-alpha-btn').forEach(b => b.classList.remove('active'));

      if (!q) {
        renderList(sorted);
        return;
      }

      const filtered = sorted.filter(e =>
        e.word.toLowerCase().includes(q) ||
        getDef(e).toLowerCase().includes(q)
      );
      renderList(filtered);
    }

    searchInput.addEventListener('input', () => doSearch(searchInput.value));

    searchInput.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const q = searchInput.value.trim().toLowerCase();
      if (!q) return;
      const exact = entries.find(x => x.word.toLowerCase() === q);
      if (exact) {
        window.location.href = '/lexicon/record.html?word=' + encodeURIComponent(exact.word);
      }
    });

    // ── Random entry ───────────────────────────────
    document.getElementById('randomEntryBtn').addEventListener('click', () => {
      const e = entries[Math.floor(Math.random() * entries.length)];
      window.location.href = '/lexicon/record.html?word=' + encodeURIComponent(e.word);
    });

    // ══════════════════════════════════════════════
    // TAB SWITCHING
    // ══════════════════════════════════════════════

    const tabLexEl  = document.getElementById('tab-lexicon');
    const tabRegEl  = document.getElementById('tab-register');
    const tabBtnLex = document.getElementById('tabBtnLexicon');
    const tabBtnReg = document.getElementById('tabBtnRegister');

    function switchTab(tab) {
      localStorage.setItem('lex_active_tab', tab);
      if (tab === 'register') {
        tabLexEl.style.display  = 'none';
        tabRegEl.style.display  = 'block';
        tabBtnLex.classList.remove('active');
        tabBtnReg.classList.add('active');
        frRender(frLoad());
      } else {
        tabLexEl.style.display  = 'block';
        tabRegEl.style.display  = 'none';
        tabBtnLex.classList.add('active');
        tabBtnReg.classList.remove('active');
      }
    }

    tabBtnLex.addEventListener('click', () => switchTab('lexicon'));
    tabBtnReg.addEventListener('click', () => switchTab('register'));

    if (localStorage.getItem('lex_active_tab') === 'register') switchTab('register');

    // ══════════════════════════════════════════════
    // FRENCH REGISTER
    // ══════════════════════════════════════════════

    const FR_KEY      = 'fr_register_v1';
    const FR_SEED_KEY = 'fr_seeded_count';

    function frLoad() {
      try { return JSON.parse(localStorage.getItem(FR_KEY) || '[]'); }
      catch(e) { return []; }
    }

    function frSave(arr) {
      localStorage.setItem(FR_KEY, JSON.stringify(arr));
    }

    function frSeedFromFile() {
      var fileEntries = (window.frenchRegisterData && window.frenchRegisterData.entries) || [];
      var lastCount   = parseInt(localStorage.getItem(FR_SEED_KEY) || '0', 10);
      if (fileEntries.length <= lastCount) return;
      var existing    = frLoad();
      var existingIds = new Set(existing.map(function(e) { return e.id; }));
      var toAdd       = fileEntries.filter(function(e) { return !existingIds.has(e.id); });
      if (toAdd.length > 0) frSave(toAdd.concat(existing));
      localStorage.setItem(FR_SEED_KEY, fileEntries.length.toString());
    }

    function frExport() {
      var all   = frLoad();
      var lines = all.map(function(e) {
        return '    { id: ' + JSON.stringify(e.id) +
               ', french: '  + JSON.stringify(e.french) +
               ', english: ' + JSON.stringify(e.english) +
               ', note: '    + JSON.stringify(e.note || '') +
               ', date: '    + JSON.stringify(e.date) + ' }';
      });
      var content = 'window.frenchRegisterData = {\n\n  entries: [\n\n' +
                    lines.join(',\n\n') +
                    '\n\n  ]\n\n};\n';
      var blob = new Blob([content], { type: 'text/javascript' });
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement('a');
      a.href     = url;
      a.download = 'french-register.js';
      a.click();
      URL.revokeObjectURL(url);
    }

    frSeedFromFile();

    function frEsc(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function frFmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso + 'T12:00:00');
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function frFilter(arr, q) {
      q = (q || '').trim().toLowerCase();
      if (!q) return arr;
      return arr.filter(function(e) {
        return e.french.toLowerCase().includes(q) ||
               e.english.toLowerCase().includes(q) ||
               (e.note && e.note.toLowerCase().includes(q));
      });
    }

    function frCurrentItems() {
      var q = (document.getElementById('frSearch') || {}).value || '';
      return frFilter(frLoad(), q);
    }

    function frRender(items) {
      var ledger  = document.getElementById('frLedger');
      var rowsEl  = document.getElementById('frRows');
      var emptyEl = document.getElementById('frEmpty');
      var noResEl = document.getElementById('frNoResults');
      var countEl = document.getElementById('frCount');
      var all     = frLoad();

      countEl.textContent = all.length + ' entr' + (all.length === 1 ? 'y' : 'ies') + ' on record';
      noResEl.style.display = 'none';

      if (all.length === 0) {
        ledger.style.display  = 'none';
        emptyEl.style.display = 'block';
        return;
      }
      emptyEl.style.display = 'none';

      if (items.length === 0) {
        ledger.style.display  = 'none';
        noResEl.style.display = 'block';
        return;
      }

      ledger.style.display = 'block';
      rowsEl.innerHTML = items.map(function(e) {
        return '<div class="fr-row" data-id="' + frEsc(e.id) + '">' +
          '<div class="fr-row-fr">' + frEsc(e.french) +
            (e.note ? '<div class="fr-row-note">' + frEsc(e.note) + '</div>' : '') +
          '</div>' +
          '<div class="fr-row-en">' + frEsc(e.english) + '</div>' +
          '<div class="fr-row-date">' + frEsc(frFmtDate(e.date)) + '</div>' +
          '<div class="fr-row-actions">' +
            '<button class="fr-btn-edit" title="Edit" onclick="frStartEdit(\'' + e.id + '\')">' +
              '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
            '</button>' +
            '<button class="fr-btn-del" title="Delete" onclick="frDelete(\'' + e.id + '\')">' +
              '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>' +
            '</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function frStartEdit(id) {
      var all = frLoad();
      var e = all.find(function(x) { return x.id === id; });
      if (!e) return;
      var row = document.querySelector('.fr-row[data-id="' + id + '"]');
      if (!row) return;
      row.outerHTML =
        '<div class="fr-edit-row" data-id="' + frEsc(e.id) + '">' +
          '<div class="fr-edit-grid">' +
            '<div class="fr-edit-group">' +
              '<label class="fr-form-label" style="color:#8a611c">French</label>' +
              '<input type="text" class="fr-edit-input" id="fedit-fr-' + e.id + '" value="' + frEsc(e.french) + '" autocomplete="off" spellcheck="false" lang="fr">' +
            '</div>' +
            '<div class="fr-edit-group">' +
              '<label class="fr-form-label" style="color:#8a611c">English</label>' +
              '<input type="text" class="fr-edit-input" id="fedit-en-' + e.id + '" value="' + frEsc(e.english) + '" autocomplete="off">' +
            '</div>' +
            '<div class="fr-edit-group" style="grid-column:1/-1">' +
              '<label class="fr-form-label" style="color:#8a611c">Note</label>' +
              '<input type="text" class="fr-edit-input" id="fedit-note-' + e.id + '" value="' + frEsc(e.note || '') + '" placeholder="optional..." autocomplete="off">' +
            '</div>' +
          '</div>' +
          '<div class="fr-edit-actions">' +
            '<button class="fr-edit-save" onclick="frSaveEdit(\'' + e.id + '\')">Save</button>' +
            '<button class="fr-edit-cancel" onclick="frRender(frCurrentItems())">Cancel</button>' +
          '</div>' +
        '</div>';
      var frInput = document.getElementById('fedit-fr-' + e.id);
      if (frInput) frInput.focus();
    }

    function frSaveEdit(id) {
      var frVal   = (document.getElementById('fedit-fr-'   + id) || {}).value || '';
      var enVal   = (document.getElementById('fedit-en-'   + id) || {}).value || '';
      var noteVal = (document.getElementById('fedit-note-' + id) || {}).value || '';
      if (!frVal.trim() || !enVal.trim()) return;
      var all = frLoad();
      var idx = all.findIndex(function(x) { return x.id === id; });
      if (idx < 0) return;
      all[idx].french  = frVal.trim();
      all[idx].english = enVal.trim();
      all[idx].note    = noteVal.trim();
      frSave(all);
      frRender(frCurrentItems());
    }

    function frDelete(id) {
      if (!confirm('Remove this entry from the register?')) return;
      frSave(frLoad().filter(function(x) { return x.id !== id; }));
      frRender(frCurrentItems());
    }

    document.getElementById('frSubmit').addEventListener('click', function() {
      var frVal   = document.getElementById('frFrench').value.trim();
      var enVal   = document.getElementById('frEnglish').value.trim();
      var noteVal = document.getElementById('frNote').value.trim();
      var errEl   = document.getElementById('frError');
      if (!frVal || !enVal) {
        errEl.textContent    = 'French and English fields are required.';
        errEl.style.display  = 'block';
        return;
      }
      errEl.style.display = 'none';
      var all = frLoad();
      all.unshift({
        id:      Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
        french:  frVal,
        english: enVal,
        note:    noteVal,
        date:    new Date().toISOString().slice(0, 10)
      });
      frSave(all);
      document.getElementById('frFrench').value  = '';
      document.getElementById('frEnglish').value = '';
      document.getElementById('frNote').value    = '';
      frRender(frFilter(all, document.getElementById('frSearch').value));
      document.getElementById('frFrench').focus();
    });

    ['frFrench', 'frEnglish', 'frNote'].forEach(function(id) {
      document.getElementById(id).addEventListener('keydown', function(ev) {
        if (ev.key === 'Enter') document.getElementById('frSubmit').click();
      });
    });

    document.getElementById('frSearch').addEventListener('input', function() {
      frRender(frFilter(frLoad(), this.value));
    });

    document.getElementById('frExportBtn').addEventListener('click', frExport);
  </script>
</body>
</html>
