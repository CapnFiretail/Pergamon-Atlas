<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612" crossorigin="anonymous"></script>
  <title>Pergamon Atlas | The French Lexicon</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/operation/styles/header.css">
  <link rel="stylesheet" href="/operation/styles/sidebar.css">
  <link rel="stylesheet" href="/operation/styles/main.css">
  <link rel="stylesheet" href="/operation/styles/footer.css">
  <link rel="stylesheet" href="/operation/styles/lexicon.css">
  <link rel="stylesheet" href="/operation/styles/french-lexicon.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content" id="mainContent"></main>
  </div>
  <div id="footer-placeholder"></div>

  <script src="/operation/scripts/atlas.js"></script>
  <script src="/data/french-lexicon.js"></script>
  <script>

    // ── Storage ──────────────────────────────────────
    const FL_KEY      = 'fl_entries_v1';
    const FL_SEED_KEY = 'fl_seeded_count';

    function flLoad() {
      try { return JSON.parse(localStorage.getItem(FL_KEY) || '[]'); }
      catch(e) { return []; }
    }

    function flSeedFromFile() {
      var fileEntries = (window.frenchLexiconData && window.frenchLexiconData.entries) || [];
      var lastCount   = parseInt(localStorage.getItem(FL_SEED_KEY) || '0', 10);
      if (fileEntries.length <= lastCount) return;
      var existing    = flLoad();
      var existingIds = new Set(existing.map(function(e) { return e.id; }));
      var toAdd       = fileEntries.filter(function(e) { return !existingIds.has(e.id); });
      if (toAdd.length > 0) {
        localStorage.setItem(FL_KEY, JSON.stringify(toAdd.concat(existing)));
      }
      localStorage.setItem(FL_SEED_KEY, fileEntries.length.toString());
    }

    flSeedFromFile();

    // ── Helpers ──────────────────────────────────────
    function h(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      var d = new Date(iso + 'T12:00:00');
      return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    // ── Find entry (by ?id= or ?word= fallback) ───────
    var params = new URLSearchParams(window.location.search);
    var entryId = (params.get('id') || '').trim();
    var slug    = (params.get('word') || '').toLowerCase().trim();
    var all     = flLoad();
    var entry   = entryId
      ? all.find(function(e) { return e.id === entryId; })
      : all.find(function(e) { return (e.slug && e.slug === slug) || e.word.toLowerCase() === slug; });

    var main = document.getElementById('mainContent');

    if (!entry) {
      document.title = 'Pergamon Atlas | Record Not Found';
      loadSnippets('The French Lexicon');
      main.innerHTML = '<div class="lex-not-found">' +
        '<h2>Record Not Found</h2>' +
        '<p>No indexed entry was located in the French Lexicon.</p>' +
        '<a class="lex-random-btn" href="/lexicon/" onclick="localStorage.setItem(\'lex_active_tab\',\'register\')">← French Lexicon</a>' +
        '</div>';
    } else {
      document.title = 'Pergamon Atlas | ' + entry.word + ' — The French Lexicon';
      loadSnippets(entry.word + ' — The French Lexicon');
      renderPage();
    }

    window.deleteEntry = function() {
      if (!confirm('Permanently remove "' + entry.word + '" from the French Lexicon?')) return;
      var updated = flLoad().filter(function(e) { return e.id !== entry.id; });
      localStorage.setItem(FL_KEY, JSON.stringify(updated));
      localStorage.setItem('lex_active_tab', 'register');
      window.location.href = '/lexicon/';
    };

    function renderPage() {
      var formality  = entry.formality || 'neutral';
      var related    = entry.related || [];

      // ── Formality badge ──────────────────────────
      var fLabel = { informal: 'Informal', neutral: 'Neutral', formal: 'Formal' };
      var formalityHTML = '<span class="fl-formality-badge ' + h(formality) + '">' +
        '<span class="fl-formality-dot"></span>' + h(fLabel[formality] || formality) + '</span>';

      // ── Grammar panel ────────────────────────────
      var grammarFields = [];
      grammarFields.push({ label: 'Word Type', value: entry.pos || '' });
      if (entry.gender)           grammarFields.push({ label: 'Gender', value: entry.gender });
      if (entry.plural)           grammarFields.push({ label: 'Plural Form', value: entry.plural });
      if (entry.conjugationGroup) grammarFields.push({ label: 'Conjugation', value: entry.conjugationGroup });
      if (entry.irregularForms)   grammarFields.push({ label: 'Irregular Forms', value: entry.irregularForms });

      var grammarHTML = '<div class="fl-grammar-grid">' +
        grammarFields.map(function(f) {
          return '<div class="fl-grammar-field">' +
            '<div class="fl-grammar-label">' + h(f.label) + '</div>' +
            '<div class="fl-grammar-value">' + h(f.value) + '</div>' +
          '</div>';
        }).join('') + '</div>';

      // ── Examples ─────────────────────────────────
      var examples = entry.examples || [];
      var examplesHTML = examples.length
        ? '<div class="fl-example-block">' +
          examples.map(function(ex) {
            return '<div class="fl-example-pair">' +
              (ex.french  ? '<div class="fl-example-lang">French</div><p class="fl-example-fr">' + h(ex.french) + '</p>' : '') +
              (ex.english ? '<div class="fl-example-lang" style="margin-top:8px">English</div><p class="fl-example-en">' + h(ex.english) + '</p>' : '') +
            '</div>';
          }).join('') + '</div>'
        : '<p style="font-family:Georgia,serif;font-size:14px;color:#bbb;font-style:italic;margin:0">No example recorded.</p>';

      // ── Related records ───────────────────────────
      var relatedHTML = '';
      if (related.length) {
        var cards = related.map(function(r) {
          var rel = all.find(function(e) { return (e.slug===r||e.word.toLowerCase()===r) && e.id !== entry.id; });
          if (rel) {
            return '<a class="lex-cluster-card" href="/french-lexicon/record.html?id=' + encodeURIComponent(rel.id) + '">' +
              '<span class="lex-cluster-card-word">' + h(rel.word) + '</span>' +
              '<span class="lex-cluster-card-pos">' + h(rel.pos||'') + '</span>' +
              '<span class="lex-cluster-card-addr">' + h(rel.atlas&&rel.atlas.address||'') + '</span>' +
            '</a>';
          } else {
            return '<div class="lex-cluster-card" style="opacity:0.5;cursor:default">' +
              '<span class="lex-cluster-card-word">' + h(r) + '</span>' +
              '<span class="lex-cluster-card-pos" style="color:#ccc;font-style:italic">not indexed</span>' +
            '</div>';
          }
        }).join('');
        relatedHTML = '<p class="section-label" style="margin-top:32px">Related Records</p>' +
          '<div class="lex-cluster-grid">' + cards + '</div>';
      }

      // ── Alternatives ──────────────────────────────
      var alts = entry.alternatives || [];
      var altsHTML = alts.length
        ? '<div class="fl-alt-label">Alternative Meanings</div>' +
          '<ul class="fl-alt-list">' +
          alts.map(function(a) { return '<li class="fl-alt-item">' + h(a) + '</li>'; }).join('') +
          '</ul>'
        : '';

      // ── Atlas address ─────────────────────────────
      var address = (entry.atlas && entry.atlas.address) || '';

      // ── Render ────────────────────────────────────
      main.innerHTML =

        // Hero
        '<div class="lex-word-hero">' +
          '<div class="lex-hero-wordblock">' +
            '<h1>' + h(entry.word) + '</h1>' +
            '<p class="lex-word-pronunciation">' +
              (entry.pronunciation ? h(entry.pronunciation) + '&ensp;·&ensp;' : '') +
              h(entry.pos) + '&ensp;·&ensp;French' +
            '</p>' +
            '<div class="fl-hero-meta">' +
              '<span class="fl-lang-badge">French</span>' +
              '<a href="/french-lexicon/?edit=' + h(entry.id) + '" class="fl-edit-entry-btn">' +
                '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
                'Edit Entry' +
              '</a>' +
            '</div>' +
          '</div>' +
          '<a href="/lexicon/" class="lex-hero-artifact" aria-label="French Lexicon index" onclick="localStorage.setItem(\'lex_active_tab\',\'register\')">' +
            '<span class="lex-hero-artifact-inner"></span>' +
            '<span style="font-size:28px;color:rgba(226,173,53,0.85);flex-shrink:0;line-height:1">⚜</span>' +
            '<span class="lex-hero-artifact-text">' +
              '<span class="lex-hero-artifact-label">Atlas Address</span>' +
              '<span class="lex-hero-artifact-code">' + h(address) + '</span>' +
            '</span>' +
          '</a>' +
        '</div>' +

        // Translation
        '<div class="lex-panel">' +
          '<p class="lex-panel-label">Translation</p>' +
          '<p class="fl-primary">' + h(entry.primary||'—') + '</p>' +
          altsHTML +
        '</div>' +

        // Example Usage
        '<div class="lex-panel">' +
          '<p class="lex-panel-label">Example Usage</p>' +
          examplesHTML +
        '</div>' +

        // Context
        '<div class="lex-panel">' +
          '<p class="lex-panel-label">Context</p>' +
          '<div class="fl-context-grid one">' +
            '<div class="fl-context-row-label">Formality</div>' +
            '<div>' + formalityHTML + '</div>' +
          '</div>' +
        '</div>' +

        // Grammar
        '<div class="lex-panel">' +
          '<p class="lex-panel-label">Grammar</p>' +
          grammarHTML +
        '</div>' +

        relatedHTML +

        // Date Added
        '<p class="section-label" style="margin-top:32px">Record Info</p>' +
        '<div class="lex-panel">' +
          '<div class="fl-notes-meta">' +
            '<div class="fl-notes-meta-field">' +
              '<div class="fl-notes-meta-label">Date Added</div>' +
              '<div class="fl-notes-meta-value' + (!entry.date ? ' muted' : '') + '">' +
                (entry.date ? fmtDate(entry.date) : 'Not recorded') +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="fl-notes-actions">' +
            '<button class="fl-btn-danger" onclick="deleteEntry()">Delete Record</button>' +
          '</div>' +
        '</div>' +

        // Back link
        '<div style="margin-top:24px;margin-bottom:8px">' +
          '<a href="/lexicon/" class="lex-random-btn" style="font-size:12px;padding:9px 16px" onclick="localStorage.setItem(\'lex_active_tab\',\'register\')">← French Lexicon</a>' +
        '</div>';
    }

  </script>
</body>
</html>
