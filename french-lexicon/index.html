<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612" crossorigin="anonymous"></script>
  <title>Pergamon Atlas | French Lexicon — New Entry</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Add new words to the French Lexicon within Pergamon Atlas.">
  <link rel="stylesheet" href="/operation/styles/header.css">
  <link rel="stylesheet" href="/operation/styles/sidebar.css">
  <link rel="stylesheet" href="/operation/styles/main.css">
  <link rel="stylesheet" href="/operation/styles/footer.css">
  <link rel="stylesheet" href="/operation/styles/lexicon.css">
  <link rel="stylesheet" href="/operation/styles/french-lexicon.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">

      <!-- Hero -->
      <section class="game-hero catalog-hero">
        <span class="game-hero-corner tl"></span>
        <span class="game-hero-corner tr"></span>
        <span class="game-hero-corner bl"></span>
        <span class="game-hero-corner br"></span>
        <div class="game-hero-emblem">
          <span style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:100px;line-height:1;color:#c28a2b;filter:drop-shadow(0 0 8px rgba(184,136,26,0.25))">⚜</span>
        </div>
        <div class="game-hero-sep">&#10022;</div>
        <div class="game-hero-title">
          <h2>The French Lexicon</h2>
          <div class="game-hero-sub">
            <span class="game-hero-sub-line"></span>
            <span>Pergamon Catalogs — Language Archive</span>
            <span class="game-hero-sub-line"></span>
          </div>
        </div>
      </section>

      <!-- Controls -->
      <div class="fl-control-row">
        <a href="/lexicon/" class="lex-random-btn" style="text-decoration:none;background:#fff;border-color:#ccc;color:#555" onclick="localStorage.setItem('lex_active_tab','register')">← French Lexicon</a>
        <button class="lex-random-btn" id="flExportBtn" type="button" style="background:#fff;border-color:#ccc;color:#555">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export
        </button>
      </div>

      <!-- Entry Form -->
      <div class="fl-form-wrap" id="flFormWrap">
        <div class="fl-form-card">
          <div class="fl-form-header" id="flFormHeader">New Record</div>
          <input type="hidden" id="flEditId">

          <div class="fl-form-section">
            <div class="fl-form-section-title">Identity</div>
            <div class="fl-form-grid three">
              <div class="fl-form-group">
                <label class="fl-form-label" for="flWord">French Word <span class="fl-form-req">*</span></label>
                <input type="text" class="fl-form-input" id="flWord" placeholder="e.g. bonjour" autocomplete="off" spellcheck="false" lang="fr">
              </div>
              <div class="fl-form-group">
                <label class="fl-form-label" for="flPron">Pronunciation <span class="fl-form-opt">(auto-filled)</span></label>
                <input type="text" class="fl-form-input" id="flPron" placeholder="e.g. /bɔ̃.ʒuʁ/" autocomplete="off">
              </div>
              <div class="fl-form-group">
                <label class="fl-form-label" for="flPos">Word Type <span class="fl-form-req">*</span></label>
                <select class="fl-form-select" id="flPos">
                  <option value="">— select —</option>
                  <option value="noun">Noun</option>
                  <option value="verb">Verb</option>
                  <option value="adjective">Adjective</option>
                  <option value="adverb">Adverb</option>
                  <option value="pronoun">Pronoun</option>
                  <option value="preposition">Preposition</option>
                  <option value="conjunction">Conjunction</option>
                  <option value="article">Article</option>
                  <option value="interjection">Interjection</option>
                  <option value="expression">Expression</option>
                </select>
              </div>
            </div>
          </div>

          <div class="fl-form-section">
            <div class="fl-form-section-title">Translation</div>
            <div class="fl-form-grid">
              <div class="fl-form-group">
                <label class="fl-form-label" for="flPrimary">Primary English Meaning <span class="fl-form-req">*</span></label>
                <input type="text" class="fl-form-input" id="flPrimary" placeholder="e.g. Hello" autocomplete="off">
              </div>
              <div class="fl-form-group">
                <label class="fl-form-label" for="flAlt">Alternative Meanings <span class="fl-form-opt">(comma-separated)</span></label>
                <input type="text" class="fl-form-input" id="flAlt" placeholder="e.g. Hi, Hey, Good day" autocomplete="off">
              </div>
            </div>
          </div>

          <div class="fl-form-section">
            <div class="fl-form-section-title">Example Usage <span class="fl-opt">(optional)</span></div>
            <div class="fl-form-grid">
              <div class="fl-form-group">
                <label class="fl-form-label" for="flExFr">French Sentence</label>
                <input type="text" class="fl-form-input" id="flExFr" placeholder="e.g. Bonjour, comment allez-vous ?" autocomplete="off" lang="fr">
              </div>
              <div class="fl-form-group">
                <label class="fl-form-label" for="flExEn">English Translation</label>
                <input type="text" class="fl-form-input" id="flExEn" placeholder="e.g. Hello, how are you?" autocomplete="off">
              </div>
            </div>
          </div>

          <div class="fl-form-section">
            <div class="fl-form-section-title">Context <span class="fl-opt">(optional)</span></div>
            <div class="fl-form-grid one">
              <div class="fl-form-group">
                <label class="fl-form-label">Formality</label>
                <div class="fl-radio-group">
                  <label class="fl-radio-label"><input type="radio" name="flFormality" value="informal"><span class="fl-radio-chip">Informal</span></label>
                  <label class="fl-radio-label"><input type="radio" name="flFormality" value="neutral" checked><span class="fl-radio-chip">Neutral</span></label>
                  <label class="fl-radio-label"><input type="radio" name="flFormality" value="formal"><span class="fl-radio-chip">Formal</span></label>
                </div>
              </div>
            </div>
          </div>

          <div class="fl-form-section">
            <div class="fl-form-section-title">Grammar <span class="fl-opt">(optional)</span></div>
            <div class="fl-form-grid">
              <div class="fl-form-group">
                <label class="fl-form-label" for="flGender">Gender</label>
                <select class="fl-form-select" id="flGender">
                  <option value="">—</option>
                  <option value="masculine">Masculine (le / un)</option>
                  <option value="feminine">Feminine (la / une)</option>
                  <option value="varies">Varies by meaning</option>
                </select>
              </div>
              <div class="fl-form-group">
                <label class="fl-form-label" for="flPlural">Plural Form</label>
                <input type="text" class="fl-form-input" id="flPlural" placeholder="e.g. les chats" autocomplete="off" lang="fr">
              </div>
              <div class="fl-form-group">
                <label class="fl-form-label" for="flConjGroup">Conjugation Group</label>
                <select class="fl-form-select" id="flConjGroup">
                  <option value="">—</option>
                  <option value="Group 1 (-er)">Group 1 — -er verbs</option>
                  <option value="Group 2 (-ir)">Group 2 — -ir verbs (regular)</option>
                  <option value="Group 3 (irregular)">Group 3 — irregular</option>
                </select>
              </div>
              <div class="fl-form-group">
                <label class="fl-form-label" for="flIrregular">Irregular Forms</label>
                <input type="text" class="fl-form-input" id="flIrregular" placeholder="e.g. je suis, tu es..." autocomplete="off" lang="fr">
              </div>
            </div>
          </div>

          <div class="fl-form-section" style="margin-bottom:8px">
            <div class="fl-form-section-title">Connections <span class="fl-opt">(optional)</span></div>
            <div class="fl-form-grid one">
              <div class="fl-form-group">
                <label class="fl-form-label" for="flRelated">Related Words <span class="fl-form-opt">(comma-separated French words)</span></label>
                <input type="text" class="fl-form-input" id="flRelated" placeholder="e.g. bonjour, coucou, bonsoir" autocomplete="off" lang="fr">
              </div>
            </div>
          </div>

          <div class="fl-form-error" id="flFormError" style="display:none"></div>

          <div class="fl-form-actions">
            <button class="fl-form-submit" id="flFormSubmit" type="button">Add to Lexicon</button>
            <a href="/lexicon/" class="fl-form-cancel" style="text-decoration:none" onclick="localStorage.setItem('lex_active_tab','register')">Cancel</a>
          </div>
        </div>
      </div>

    </main>
  </div>
  <div id="footer-placeholder"></div>

  <script src="/operation/scripts/atlas.js"></script>
  <script src="/data/french-lexicon.js"></script>
  <script>
    loadSnippets('The French Lexicon');

    // ── Storage ──────────────────────────────────────
    const FL_KEY      = 'fl_entries_v1';
    const FL_SEED_KEY = 'fl_seeded_count';

    function flLoad() {
      try { return JSON.parse(localStorage.getItem(FL_KEY) || '[]'); }
      catch(e) { return []; }
    }

    function flSave(arr) {
      localStorage.setItem(FL_KEY, JSON.stringify(arr));
    }

    function flSeedFromFile() {
      var fileEntries = (window.frenchLexiconData && window.frenchLexiconData.entries) || [];
      var lastCount   = parseInt(localStorage.getItem(FL_SEED_KEY) || '0', 10);
      if (fileEntries.length <= lastCount) return;
      var existing    = flLoad();
      var existingIds = new Set(existing.map(function(e) { return e.id; }));
      var toAdd       = fileEntries.filter(function(e) { return !existingIds.has(e.id); });
      if (toAdd.length > 0) flSave(toAdd.concat(existing));
      localStorage.setItem(FL_SEED_KEY, fileEntries.length.toString());
    }

    flSeedFromFile();

    // ── Auto-IPA ──────────────────────────────────────
    function autoIPA(word) {
      var s = word.toLowerCase();
      s = s.replace(/ou/g, '\x01');          // protect ou → /u/
      s = s.replace(/ll/g, '\x02');          // protect ll → /j/
      s = s.replace(/eau|au/g, 'o');
      s = s.replace(/ain|aim|ein/g, 'ɛ̃');
      s = s.replace(/ai|ei/g, 'ɛ');
      s = s.replace(/oi/g, 'wa');
      s = s.replace(/an|am|en|em/g, 'ɑ̃');
      s = s.replace(/in|im/g, 'ɛ̃');
      s = s.replace(/on|om/g, 'õ');
      s = s.replace(/un|um/g, 'œ̃');
      s = s.replace(/ch/g, 'ʃ');
      s = s.replace(/qu/g, 'k');
      s = s.replace(/ph/g, 'f');
      s = s.replace(/gn/g, 'ɲ');
      s = s.replace(/th/g, 't');
      s = s.replace(/c(?=[eiéèêyɛ])/g, 's');
      s = s.replace(/ç/g, 's');
      s = s.replace(/g(?=[eiéèêyɛ])/g, 'ʒ');
      s = s.replace(/j/g, 'ʒ');
      s = s.replace(/r/g, 'ʁ');
      s = s.replace(/h/g, '');
      s = s.replace(/[stdpgz]$/g, '');
      s = s.replace(/e$/g, '');             // silent trailing e (before eʁ→e)
      s = s.replace(/eʁ$/g, 'e');           // -er verb infinitives
      s = s.replace(/é/g, 'e');
      s = s.replace(/[èê]/g, 'ɛ');
      s = s.replace(/â/g, 'ɑ');
      s = s.replace(/ô/g, 'o');
      s = s.replace(/î/g, 'i');
      s = s.replace(/û/g, 'y');
      s = s.replace(/u/g, 'y');             // remaining u → /y/ (BEFORE restoring ou)
      s = s.replace(/\x01/g, 'u');          // restore ou → u
      s = s.replace(/\x02/g, 'j');          // restore ll → j
      return '/' + s + '/';
    }

    // ── Helpers ──────────────────────────────────────
    function flGenAddress() {
      var c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      var seg = function() {
        return Array.from({length:5}, function() { return c[Math.floor(Math.random() * c.length)]; }).join('');
      };
      return seg() + '-' + seg() + '-' + seg();
    }

    // ── Export ────────────────────────────────────────
    function flExport() {
      var all  = flLoad();
      var rows = all.map(function(e) { return '    ' + JSON.stringify(e); });
      var content = 'window.frenchLexiconData = {\n\n  entries: [\n\n' +
                    rows.join(',\n\n') + '\n\n  ]\n\n};\n';
      var blob = new Blob([content], { type: 'text/javascript' });
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement('a');
      a.href = url; a.download = 'french-lexicon.js'; a.click();
      URL.revokeObjectURL(url);
    }

    // ── Form ──────────────────────────────────────────
    function flOpenForm(entry) {
      document.getElementById('flEditId').value            = entry ? entry.id : '';
      document.getElementById('flFormHeader').textContent  = entry ? 'Edit Record' : 'New Record';
      document.getElementById('flFormSubmit').textContent  = entry ? 'Save Changes' : 'Add to Lexicon';

      document.getElementById('flWord').value      = entry ? entry.word : '';
      document.getElementById('flPron').value      = entry ? (entry.pronunciation || '') : '';
      document.getElementById('flPos').value       = entry ? (entry.pos || '') : '';
      document.getElementById('flPrimary').value   = entry ? (entry.primary || '') : '';
      document.getElementById('flAlt').value       = entry ? (entry.alternatives || []).join(', ') : '';
      document.getElementById('flExFr').value      = entry ? ((entry.examples && entry.examples[0] && entry.examples[0].french) || '') : '';
      document.getElementById('flExEn').value      = entry ? ((entry.examples && entry.examples[0] && entry.examples[0].english) || '') : '';
      document.getElementById('flGender').value    = entry ? (entry.gender || '') : '';
      document.getElementById('flPlural').value    = entry ? (entry.plural || '') : '';
      document.getElementById('flConjGroup').value = entry ? (entry.conjugationGroup || '') : '';
      document.getElementById('flIrregular').value = entry ? (entry.irregularForms || '') : '';
      document.getElementById('flRelated').value   = entry ? (entry.related || []).join(', ') : '';

      var formality = (entry && entry.formality) || 'neutral';
      document.querySelectorAll('input[name="flFormality"]').forEach(function(r) {
        r.checked = (r.value === formality);
      });

      document.getElementById('flFormError').style.display = 'none';
      document.getElementById('flWord').focus();
    }

    function flSubmitForm() {
      var word    = (document.getElementById('flWord').value || '').trim();
      var pos     = document.getElementById('flPos').value;
      var primary = (document.getElementById('flPrimary').value || '').trim();
      var errEl   = document.getElementById('flFormError');
      var editId  = document.getElementById('flEditId').value;

      if (!word || !pos || !primary) {
        errEl.textContent   = 'French word, word type, and primary translation are required.';
        errEl.style.display = 'block';
        return;
      }

      var slug = word.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9\-àâéèêëîïôùûüç]/g, '');
      var all  = flLoad();
      var duplicate = all.find(function(e) {
        return (e.slug === slug || e.word.toLowerCase() === word.toLowerCase()) && e.id !== editId;
      });
      if (duplicate) {
        errEl.textContent   = '"' + word + '" is already in the Lexicon.';
        errEl.style.display = 'block';
        return;
      }

      errEl.style.display = 'none';

      var formalityEl = document.querySelector('input[name="flFormality"]:checked');
      var altRaw  = (document.getElementById('flAlt').value || '').trim();
      var exFr    = (document.getElementById('flExFr').value || '').trim();
      var exEn    = (document.getElementById('flExEn').value || '').trim();
      var related = (document.getElementById('flRelated').value || '').split(',').map(function(s) {
        return s.trim().toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9\-àâéèêëîïôùûüç]/g, '');
      }).filter(Boolean);

      var existing = editId ? all.find(function(e) { return e.id === editId; }) : null;

      var entry = {
        id:               editId || (Date.now().toString(36) + Math.random().toString(36).slice(2, 5)),
        word:             word,
        slug:             slug,
        pronunciation:    (document.getElementById('flPron').value || '').trim(),
        pos:              pos,
        translation:      primary,
        primary:          primary,
        alternatives:     altRaw ? altRaw.split(',').map(function(s) { return s.trim(); }).filter(Boolean) : [],
        examples:         (exFr || exEn) ? [{ french: exFr, english: exEn }] : [],
        formality:        (formalityEl && formalityEl.value) || 'neutral',
        gender:           document.getElementById('flGender').value || '',
        plural:           (document.getElementById('flPlural').value || '').trim(),
        conjugationGroup: document.getElementById('flConjGroup').value || '',
        irregularForms:   (document.getElementById('flIrregular').value || '').trim(),
        related:          related,
        atlas:            existing ? existing.atlas : { address: flGenAddress() },
        date:             existing ? existing.date  : new Date().toISOString().slice(0, 10)
      };

      if (editId) {
        var idx = all.findIndex(function(e) { return e.id === editId; });
        if (idx >= 0) all[idx] = entry; else all.unshift(entry);
        flSave(all);
        window.location.href = '/french-lexicon/record.html?id=' + encodeURIComponent(entry.id);
      } else {
        all.unshift(entry);
        flSave(all);
        localStorage.setItem('lex_active_tab', 'register');
        window.location.href = '/lexicon/';
      }
    }

    // ── Auto-IPA on word blur ─────────────────────────
    document.getElementById('flWord').addEventListener('blur', function() {
      var pronEl = document.getElementById('flPron');
      if (this.value.trim() && !pronEl.value.trim()) {
        pronEl.value = autoIPA(this.value.trim());
      }
    });

    // ── Event listeners ───────────────────────────────
    document.getElementById('flFormSubmit').addEventListener('click', flSubmitForm);
    document.getElementById('flExportBtn').addEventListener('click', flExport);

    document.querySelectorAll('.fl-form-input, .fl-form-select').forEach(function(el) {
      el.addEventListener('keydown', function(ev) {
        if (ev.key === 'Enter') flSubmitForm();
      });
    });

    // ── Handle ?edit=ID ───────────────────────────────
    (function() {
      var params = new URLSearchParams(window.location.search);
      var editId = params.get('edit');
      if (!editId) return;
      var entry = flLoad().find(function(e) { return e.id === editId; });
      if (entry) flOpenForm(entry);
    })();
  </script>
</body>
</html>
