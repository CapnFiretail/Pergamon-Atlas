    /* === Homepage V3 — Admin View dark editorial hero + Featured Today ====
       First Pergamon Atlas page to use a dark visual language. Scoped
       exclusively to this page: body.pa-admin-dark is added by this page's
       own script (see the DOMContentLoaded handler near the bottom) only
       after PergamonVisibility resolves view === 'admin' — the selector
       below only ever matches when that class is present, so no shared
       stylesheet changes and no other Atlas page is affected. Default
       (class absent) keeps today's light .main-content, so guests/users
       and the moment before JS resolves both fail safely to light.
       Colors reuse the dark-mode tokens already established for the
       Tools/Games catalog cards' Admin Appearance (see
       #tc-list[data-theme="dark"] in tools/index.html) rather than a new
       palette: ivory #f5efe2, muted #a3a3a3, gold accent #e0b34a. This is
       a fixed design for the admin homepage, independent of that
       Light/Dark Appearance *preference* (Settings), which stays scoped
       to the catalog cards it already governs. ========================= */

    body.pa-admin-dark .main-content{
      background:#121110;
    }

    /* Shared framed-panel treatment — both the hero and the Featured
       Today card use this so the homepage reads as one designed
       composition rather than loose content on a dark field: a surface
       one step lighter than the page background, a thin gold-tinted
       border, and a restrained radius (no big rounded "SaaS card"). */
    .pa-panel{
      border:1px solid rgba(224,179,74,0.18);
      background:#161310;
      border-radius:10px;
    }

    .atlas-hero{
      display:flex;

    .atlas-hero-left{

    }

    .atlas-hero-eyebrow{

      letter-spacing:0.26em;
      text-transform:uppercase;
      color:#e0b34a;
    }

    .atlas-hero-title{

    .atlas-hero-subtitle{

    /* Chess Forge thumbnail. Same box as before, but now filled with the
       exact checkerboard component the Games catalog already uses to
       represent Chess Forge (see .cat-ch/.cat-ch-sq in games/index.html)

       rather than sourcing/generating one. Copied here (not shared via a
       stylesheet) since this codebase already scopes these small catalog
       components per-page, same as .section-label above. Oversized and
       centered/clipped to fill the box the way object-fit: cover would
       for a real image, so it still works at any breakpoint's thumbnail
       aspect ratio (see the ≤600px override below). */
    .featured-card-thumb{
      position:relative;
      overflow:hidden;
      flex:0 0 140px;

    @media (max-width:900px){

      .atlas-hero-left,

  <script>
    // Featured Today — V1 renders a single placeholder entry from a plain
    // object. Later this becomes a pick from real Atlas artifacts
    // (entries.js) and can rotate on a schedule without this render
    // function itself needing to change.
    // Builds the same 8x8 checkerboard markup the Games catalog already
    // uses to represent Chess Forge (see .cat-ch in games/index.html) —
    // reusing that existing component rather than sourcing/generating an
    // image. Swap this out (or make it artifact-driven) once a real
    // artifact thumbnail image exists.
    function chessboardSquares(){
      let html = '';
      for (let r = 0; r < 8; r++){
        for (let c = 0; c < 8; c++){
          html += `<div class="cat-ch-sq ${(r + c) % 2 === 0 ? 'dark' : 'light'}"></div>`;
        }
      }
      return html;
    }

    function renderFeaturedArtifact(artifact, containerId){
      const el = document.getElementById(containerId);
      if (!el || !artifact) return;

      el.innerHTML = `
        <a class="featured-card pa-panel" href="${artifact.path}">
          <div class="featured-card-thumb">
            <div class="cat-ch">${chessboardSquares()}</div>
          </div>
          <div class="featured-card-body">
            <span class="featured-card-eyebrow">Featured Artifact</span>
            <h3 class="featured-card-title">${artifact.title}</h3>
            <p class="featured-card-desc">${artifact.description}</p>
            <span class="featured-card-cta">Explore &#8594;</span>
          </div>
        </a>`;
    }

    const FEATURED_ARTIFACT = {
      title: 'Chess Forge',
      description: 'Play. Learn. Improve. A new way to experience chess on the Atlas.',
      path: '/chess-forge/'
    };

    renderFeaturedArtifact(FEATURED_ARTIFACT, 'featured-artifact-slot');

    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>

<script>
  // Switches between the minimal public homepage and the full
  // developmental homepage based on the resolved Public/Admin view. The
  // sidebar/header/footer placeholders already get this via atlas.js;
  // this page's own body content needs the same call since it isn't
  // inside one of those placeholders.
  //
  // applyNavVisibility() resolves to the current view ('admin'/'public');
  // toggling body.pa-admin-dark on it is what scopes this page's dark
  // homepage styling (see the "Homepage V2" block above) to an actual
  // resolved admin session in Admin View — never guests/users, and never
  // before this resolves, so it fails safely to today's light look.
  document.addEventListener('DOMContentLoaded', function () {
    waitForPergamonVisibility().then(function (pv) {
      if (!pv) return;
      pv.applyNavVisibility(document).then(function (view) {
        document.body.classList.toggle('pa-admin-dark', view === 'admin');
      });
    });
  });
</script>
