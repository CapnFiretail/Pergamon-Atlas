  <style>
    /* The bootstrap script toggles homepage blocks and the featured picker
       with el.hidden. Several of them carry a component `display` rule
       (.public-hero / .featured-picker are flex) that would otherwise beat
       the [hidden] UA style, so make [hidden] win outright — scoped to
       this page's own <style>, nothing else on the page uses the
       attribute. */
    [hidden]{ display:none !important; }

    .public-hero{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      min-height:50vh;
      padding:48px 24px;
    }

    .public-hero-name{
      margin:0 0 12px 0;
      font-size:clamp(34px,6vw,58px);
      color:#8a611c;
      letter-spacing:0.5px;
    }

    .public-hero-tagline{
      margin:0;
      font-size:clamp(16px,2.5vw,20px);
      color:#666;
    }

    /* === Homepage V8 — configurable dark homepage + publishing ============
       The dark hero (Quick Access + Featured Today) is the "configurable
       homepage". index.html ships it alongside the classic .public-hero;
       the bootstrap script near the bottom shows one or the other:
         - Admin View: always the configurable homepage (the editing
           surface).
         - Everyone else: the configurable homepage ONLY once
           homepage_settings.published is true (see homepage-config.js);
           otherwise the classic .public-hero.
       body.pa-admin-dark follows that same decision, so this is still the
       only page that is ever dark — for admins always, and for the public
       once published. Default HTML state (#configurable-homepage hidden,
       .public-hero shown) means any JS failure falls safely back to the
       classic light homepage.
       The hero image and the Featured Today card are data-driven from
       homepage_settings + entries.js; nothing about them is hardcoded
       here. Admin-only edit controls carry data-admin-control="view" (the
       same marker the footer publish panel uses).
       Colors reuse the dark-mode tokens already established for the
       Tools/Games catalog cards' Admin Appearance (see
       #tc-list[data-theme="dark"] in tools/index.html): ivory #f5efe2,
       muted #a3a3a3, gold accent #e0b34a. Independent of the Light/Dark
       Appearance *preference* (Settings), which stays scoped to the
       catalog cards it already governs. ================================= */

    body.pa-admin-dark .main-content{
      background:#121110;
    }

    /* Shared framed-panel treatment — both the hero and the Featured
       Today card use this so the homepage reads as one designed
       composition rather than loose content on a dark field: a surface
       one step lighter than the page background, a thin gold-tinted
       border, and a restrained radius (no big rounded "SaaS card"). */
    .pa-panel{
      border:1px solid rgba(224,179,74,0.18);
      background:#161310;
      border-radius:10px;
    }

    .atlas-hero{
      display:flex;
      flex-direction:column;
      gap:26px;
      padding:28px 40px;
      margin-bottom:28px;
    }

    /* Top band: identity text on the left, thin banner image on the right.
       Its height is driven by the text block — the image is capped and
       centered so it never forces the hero taller (see .atlas-hero-image). */
    .atlas-hero-top{
      display:flex;
      align-items:center;
      gap:48px;
    }

    .atlas-hero-left{
      flex:1.5 1 380px;
      min-width:0;
    }

    .atlas-hero-eyebrow{
      display:block;
      margin:0 0 10px;
      font-size:13px;
      font-weight:700;
      letter-spacing:0.26em;
      text-transform:uppercase;
      color:#e0b34a;
    }

    .atlas-hero-title{
      margin:0 0 8px 0;
      font-size:clamp(44px,5.2vw,64px);
      line-height:1.05;
      color:#f5efe2;
    }

    .atlas-hero-subtitle{
      margin:0;
      font-size:clamp(19px,1.8vw,22px);
      color:#a3a3a3;
    }

    /* Quick Access — a compact row of navigation cards that replaces the
       old homepage hero search field (search still lives in the global
       header). Sits inside the hero panel, below the identity band, so it
       reads as part of the hero composition rather than a separate
       section. Each card: gold sidebar-style icon · title + one-line
       description · a chevron that nudges right on hover. Reuses .pa-panel
       for the surface and the sidebar's existing inline SVG icons — no new
       icon library. */
    .quick-access{
      display:flex;
      gap:14px;
    }

    .qa-card{
      flex:1 1 0;
      min-width:0;
      display:flex;
      align-items:center;
      gap:14px;
      padding:15px 18px;
      text-decoration:none;
      transition:border-color 0.2s ease, background-color 0.2s ease;
    }

    /* Quick Access cards want more definition against the dark ground than
       the shared .pa-panel border gives (later rule, equal specificity, so
       this wins) — same gold accent, just thicker and less transparent.
       Nothing else about the card changes. */
    .qa-card{
      border:1.5px solid rgba(224,179,74,0.42);
    }

    .qa-card:hover{
      border-color:rgba(224,179,74,0.75);
      background:#1a1611;
    }

    .qa-card-icon{
      flex:0 0 auto;
      display:flex;
      color:#e0b34a;
    }

    .qa-card-body{
      flex:1;
      min-width:0;
    }

    .qa-card-title{
      display:block;
      font-size:15px;
      color:#f5efe2;
      margin-bottom:2px;
    }

    .qa-card-desc{
      display:block;
      font-size:12.5px;
      line-height:1.4;
      color:#a3a3a3;
    }

    .qa-card-chevron{
      flex:0 0 auto;
      display:flex;
      color:#8f877a;
      transition:color 0.2s ease, transform 0.2s ease;
    }

    .qa-card:hover .qa-card-chevron{
      color:#e0b34a;
      transform:translateX(2px);
    }

    .atlas-hero-right{
      flex:1 1 300px;
      min-width:0;
      display:flex;
    }

    /* Wide, thin editorial banner. Empty by default (the dark box is the
       placeholder); an <img class="atlas-hero-image-img"> is injected by
       the bootstrap script when homepage_settings.hero_image_path is set.
       A low aspect-ratio plus a max-height cap and align-self:center mean
       the image sizes from the column width but stops well short of the
       text height, so the hero stays a short horizontal band.
       The gold border belongs to the FRAME, so it stays put regardless of
       the image's crop/zoom/position. Same accent as the rest of the
       homepage (rgba(224,179,74,…) === #e0b34a), just more defined. */
    .atlas-hero-image{
      position:relative;
      overflow:hidden;
      flex:1;
      aspect-ratio:3.2 / 1;
      max-height:132px;
      align-self:center;
      background:#1c1c1a;
      border:2px solid rgba(224,179,74,0.55);
      border-radius:8px;
    }

    /* Crop/zoom is presentation-only — no cropped file is produced. The
       three custom properties come from homepage_settings
       (hero_image_x/_y/_zoom), set on #hero-image by the bootstrap script;
       defaults 50%/50%/1 = centred, no zoom. object-fit:cover is the
       zoom-1 baseline; object-position pans; scale() zooms toward the same
       point. The modal crop editor drives an identical .atlas-hero-image /
       .atlas-hero-image-img pair with the same properties, so its preview
       matches this frame exactly. */
    .atlas-hero-image-img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:var(--hero-x, 50%) var(--hero-y, 50%);
      transform:scale(var(--hero-zoom, 1));
      transform-origin:var(--hero-x, 50%) var(--hero-y, 50%);
      display:block;
    }

    /* Admin-only (data-admin-control="view"): a subtle pencil in the
       image corner. Muted until the hero is hovered / it's focused. */
    .hero-image-edit{
      position:absolute;
      right:8px;
      bottom:8px;
      z-index:2;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:30px;
      height:30px;
      border:1px solid rgba(224,179,74,0.5);
      border-radius:7px;
      background:rgba(18,17,16,0.78);
      color:#e0b34a;
      font-size:14px;
      line-height:1;
      cursor:pointer;
      opacity:0.55;
      transition:opacity 0.15s ease, background 0.15s ease;
    }

    .atlas-hero-right:hover .hero-image-edit,
    .hero-image-edit:focus-visible{
      opacity:1;
      background:rgba(18,17,16,0.92);
    }

    /* Section eyebrow + trailing rule. */
    .section-label{
      display:flex;
      align-items:center;
      gap:14px;
      font-size:12px;
      font-weight:700;
      letter-spacing:0.24em;
      text-transform:uppercase;
      color:#e0b34a;
      margin:0 0 16px;
    }

    .section-label::after{
      content:"";
      flex:1;
      height:1px;
      background:rgba(224,179,74,0.25);
    }

    /* Row that carries the section label (with its trailing rule) plus the
       admin-only "Change Featured" button at the far right — mock:
       FEATURED TODAY ───────────────  Change Featured */
    .featured-today-header{
      display:flex;
      align-items:center;
      gap:14px;
      margin:0 0 16px;
    }

    .featured-today-header .section-label{
      flex:1;
      margin:0;
    }

    .featured-change-btn{
      flex:0 0 auto;
      border:1px solid rgba(224,179,74,0.4);
      background:transparent;
      color:#e0b34a;
      border-radius:999px;
      padding:5px 13px;
      font-family:Georgia, serif;
      font-size:10.5px;
      letter-spacing:0.08em;
      text-transform:uppercase;
      white-space:nowrap;
      cursor:pointer;
      transition:background 0.15s ease, border-color 0.15s ease;
    }

    .featured-change-btn:hover{
      background:rgba(224,179,74,0.1);
      border-color:#e0b34a;
    }

    /* Admin-only inline picker, revealed by "Change Featured". A plain
       <select> of eligible Atlas artifacts — picking one writes
       homepage_settings.featured_path and the card re-resolves from
       canonical entry metadata. */
    .featured-picker{
      display:flex;
      align-items:center;
      gap:10px;
      margin:0 0 14px;
      padding:12px 14px;
      border:1px solid rgba(224,179,74,0.18);
      border-radius:8px;
      background:#161310;
    }

    .featured-picker select{
      flex:1;
      min-width:0;
      background:#100e0b;
      color:#f0ece2;
      border:1px solid rgba(224,179,74,0.22);
      border-radius:6px;
      padding:8px 10px;
      font-family:Georgia, serif;
      font-size:13px;
    }

    .featured-picker-status{
      flex:0 0 auto;
      font-size:11px;
      color:#a3a3a3;
      white-space:nowrap;
    }

    .featured-picker-status.is-error{ color:#f0a0a0; }
    .featured-picker-status.is-ok{ color:#9fd39f; }

    .featured-today-section{
      margin-bottom:24px;
    }

    .featured-card{
      display:flex;
      align-items:center;
      gap:24px;
      padding:24px 28px;
      text-decoration:none;
      color:inherit;
    }

    /* Featured Today thumbnail box. Filled by renderFeaturedArtifact():
       an <img> when the featured artifact has a card_image in its
       atlas-meta; otherwise a per-path fallback (the Games-catalog
       checkerboard for Chess Forge — see FEATURED_FALLBACK_THUMBS); or,
       failing both, the empty dark box. Oversized/clipped children fill
       the box the way object-fit: cover would, so any breakpoint's
       thumbnail aspect ratio works (see the ≤600px override below). */
    .featured-card-thumb{
      position:relative;
      overflow:hidden;
      flex:0 0 140px;
      aspect-ratio:4 / 3;
      background:#1c1c1a;
      border-radius:6px;
    }

    .featured-card-thumb .featured-card-thumb-img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .featured-card-thumb .cat-ch{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      width:200%;
      height:200%;
      display:grid;
      grid-template-columns:repeat(8, 1fr);
      grid-template-rows:repeat(8, 1fr);
    }

    .featured-card-thumb .cat-ch-sq.light{ background:#f0d9b5; }
    .featured-card-thumb .cat-ch-sq.dark{ background:#b58863; }

    .featured-card-body{
      flex:1;
      min-width:0;
    }

    .featured-card-eyebrow{
      display:block;
      font-size:11px;
      font-weight:700;
      letter-spacing:0.18em;
      text-transform:uppercase;
      color:#e0b34a;
      margin-bottom:6px;
    }

    .featured-card-title{
      margin:0 0 6px 0;
      font-size:clamp(19px,2vw,23px);
      color:#f5efe2;
    }

    .featured-card-desc{
      margin:0 0 14px 0;
      font-size:14px;
      line-height:1.55;
      color:#a3a3a3;
      max-width:520px;
    }

    .featured-card-cta{
      display:inline-flex;
      align-items:center;
      gap:7px;
      border:1px solid rgba(224,179,74,0.5);
      background:transparent;
      color:#e0b34a;
      border-radius:999px;
      padding:7px 15px;
      font-family:Georgia, serif;
      font-size:11px;
      letter-spacing:0.06em;
      text-transform:uppercase;
      white-space:nowrap;
      transition:background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .featured-card:hover .featured-card-cta{
      background:rgba(224,179,74,0.1);
      border-color:#e0b34a;
      color:#f0c161;
    }

    /* The featured card is a <div> with a stretched link on the title, so
       the whole card still navigates while the admin description editor
       (button + textarea) can sit above it and take its own clicks. */
    .featured-card{ position:relative; }

    .featured-card-title a.featured-card-link{
      color:inherit;
      text-decoration:none;
    }

    .featured-card-link::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:1;
    }

    /* Description row + its admin-only edit pencil. Raised above the
       stretched link so the pencil is clickable. */
    .featured-desc-row{
      position:relative;
      z-index:2;
      display:flex;
      align-items:flex-start;
      gap:8px;
      margin:0 0 14px 0;
    }

    .featured-desc-row .featured-card-desc{
      margin:0;
    }

    .featured-desc-edit{
      flex:0 0 auto;
      margin-top:1px;
      background:none;
      border:0;
      color:#8f877a;
      font-size:13px;
      line-height:1;
      cursor:pointer;
      opacity:0.6;
      transition:opacity 0.15s ease, color 0.15s ease;
    }

    .featured-card:hover .featured-desc-edit,
    .featured-desc-edit:focus-visible{
      opacity:1;
      color:#e0b34a;
    }

    .featured-desc-editor{
      position:relative;
      z-index:2;
      margin:0 0 14px 0;
    }

    .featured-desc-input{
      width:100%;
      box-sizing:border-box;
      background:#100e0b;
      color:#f0ece2;
      border:1px solid rgba(224,179,74,0.22);
      border-radius:6px;
      padding:8px 10px;
      font-family:Georgia, serif;
      font-size:13px;
      line-height:1.5;
      resize:vertical;
    }

    .featured-desc-editor-row{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:8px;
    }

    .featured-desc-btn{
      border:1px solid rgba(224,179,74,0.4);
      background:transparent;
      color:#e0b34a;
      border-radius:6px;
      padding:5px 12px;
      font-family:Georgia, serif;
      font-size:11px;
      cursor:pointer;
      transition:background 0.15s ease, border-color 0.15s ease;
    }

    .featured-desc-btn.ghost{ border-color:rgba(255,255,255,0.14); color:#a3a3a3; }
    .featured-desc-btn:hover{ background:rgba(224,179,74,0.1); border-color:#e0b34a; }
    .featured-desc-btn.ghost:hover{ background:rgba(255,255,255,0.05); border-color:rgba(255,255,255,0.25); }

    .featured-desc-status{ font-size:11px; color:#a3a3a3; white-space:nowrap; }
    .featured-desc-status.is-error{ color:#f0a0a0; }
    .featured-desc-status.is-ok{ color:#9fd39f; }

    /* ── Hero image crop editor modal ──────────────────────────────────── */
    .hero-crop-modal{
      position:fixed;
      inset:0;
      z-index:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .hero-crop-backdrop{
      position:absolute;
      inset:0;
      background:rgba(8,7,6,0.72);
    }

    .hero-crop-dialog{
      position:relative;
      width:100%;
      max-width:440px;
      padding:18px;
      background:#161310;
    }

    .hero-crop-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-size:12px;
      font-weight:700;
      letter-spacing:0.18em;
      text-transform:uppercase;
      color:#e0b34a;
      margin-bottom:14px;
    }

    .hero-crop-x{
      background:none;
      border:0;
      color:#8f877a;
      font-size:20px;
      line-height:1;
      cursor:pointer;
      padding:0 4px;
    }

    .hero-crop-x:hover{ color:#f5efe2; }

    /* Same class as the real hero frame → identical rendering. Only the
       layout props inherited from the hero's flex parent are neutralised. */
    .hero-crop-preview{
      flex:none;
      align-self:auto;
      width:100%;
      max-height:none;
      margin-bottom:14px;
    }

    .hero-crop-empty{
      margin:0 0 14px;
      font-size:12px;
      line-height:1.5;
      color:#a3a3a3;
    }

    .hero-crop-controls{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-bottom:14px;
    }

    .hero-crop-controls label{
      display:grid;
      grid-template-columns:78px 1fr;
      align-items:center;
      gap:12px;
      font-size:12px;
      color:#a3a3a3;
    }

    .hero-crop-controls input[type="range"]{
      width:100%;
      accent-color:#e0b34a;
    }

    .hero-crop-actions{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .hero-crop-spacer{ flex:1; }

    .hero-crop-btn{
      border:1px solid rgba(224,179,74,0.4);
      background:transparent;
      color:#e0b34a;
      border-radius:7px;
      padding:6px 12px;
      font-family:Georgia, serif;
      font-size:12px;
      cursor:pointer;
      transition:background 0.15s ease, border-color 0.15s ease;
    }

    .hero-crop-btn:hover{ background:rgba(224,179,74,0.1); border-color:#e0b34a; }
    .hero-crop-btn.ghost{ border-color:rgba(255,255,255,0.14); color:#a3a3a3; }
    .hero-crop-btn.ghost:hover{ background:rgba(255,255,255,0.05); border-color:rgba(255,255,255,0.25); }
    .hero-crop-btn.primary{ background:rgba(224,179,74,0.16); border-color:#e0b34a; color:#f0c161; }
    .hero-crop-btn.primary:hover{ background:rgba(224,179,74,0.26); }
    .hero-crop-btn[disabled]{ opacity:0.5; cursor:default; }

    .hero-crop-status{ font-size:11px; color:#a3a3a3; white-space:nowrap; }
    .hero-crop-status.is-error{ color:#f0a0a0; }
    .hero-crop-status.is-ok{ color:#9fd39f; }

    .atlas-hero-image.is-admin{ cursor:pointer; }

    @media (max-width:900px){
      .atlas-hero{
        gap:24px;
        padding:24px 20px;
      }

      /* Collapse the identity band to a single column. .atlas-hero-left/
         -right's flex-basis values mean WIDTH in the desktop row above —
         stacked, those same values would be read as a HEIGHT (column
         mode's main axis): the text block stretches past its content (a
         dead gap before the image) and the image fights its aspect-ratio.
         Reset both to size from actual content instead. */
      .atlas-hero-top{
        flex-direction:column;
        align-items:stretch;
        gap:22px;
      }

      .atlas-hero-left,
      .atlas-hero-right{
        flex:none;
      }

      .atlas-hero-image{
        width:100%;
        max-height:180px;
      }

      /* Cards wrap to a 2-up grid, then a single column on narrow phones. */
      .quick-access{
        flex-wrap:wrap;
      }

      .qa-card{
        flex:1 1 calc(50% - 7px);
      }
    }

    @media (max-width:560px){
      .qa-card{
        flex-basis:100%;
      }
    }

    @media (max-width:600px){
      .featured-card{
        flex-direction:column;
        align-items:stretch;
        padding:20px;
      }

      .featured-card-thumb{
        flex:none;
        width:100%;
        aspect-ratio:16 / 9;
      }
    }

    /* ====================================================================
       TEST — Featured Card art at Games-catalog size
       --------------------------------------------------------------------
       Reversible experiment (see USE_CATALOG_ART in the render script).
       When on, the Featured Card's image slot shows the SAME CSS
       mini-graphic the Games catalog card uses for that game, at the SAME
       intrinsic pixel size, centred in a larger dark area — instead of the
       old .featured-card-thumb (which is kept intact as the fallback).

       The Games catalog has NO image files: each card renders a fixed-size
       CSS/HTML mini-graphic inside a 230x230 .feat-preview-frame on a #111
       square (.feat-graphic). The rules below are COPIED VERBATIM from
       games/index.html (the values, not eyeballed) and namespaced under
       .featured-catalog-art so nothing here can affect the catalog or the
       old .featured-card-thumb path. Delete this whole block + the
       USE_CATALOG_ART branch to revert. games/index.html is untouched.
       ==================================================================== */
    .featured-catalog-art{
      flex:0 0 240px;
      max-width:240px;

  <script>
    // Featured Today renderer. The artifact object is resolved from
    // homepage_settings.featured_path against canonical entry metadata
    // (see homepage-config.js) — this function only draws it.
    //
    // Thumbnail: artifact.cardImage (the entry's card_image from
    // atlas-meta) → <img>; else a per-path fallback in
    // FEATURED_FALLBACK_THUMBS; else the empty dark box.

    // 8x8 checkerboard, the same component the Games catalog uses for
    // Chess Forge (see .cat-ch in games/index.html). A stopgap until Chess
    // Forge has a real card_image — not a general fallback.
    function chessboardSquares(){
      let html = '';
      for (let r = 0; r < 8; r++){
        for (let c = 0; c < 8; c++){
          html += `<div class="cat-ch-sq ${(r + c) % 2 === 0 ? 'dark' : 'light'}"></div>`;
        }
      }
      return html;
    }

    const FEATURED_FALLBACK_THUMBS = {
      '/games/chess-forge': () => `<div class="cat-ch">${chessboardSquares()}</div>`
    };

    /* ── TEST: reuse Games-catalog art at catalog size ──────────────────
       Flip to false to fully restore the previous .featured-card-thumb
       behaviour (which is left intact below as the fallback). See the
       matching CSS "TEST" block above.

       There are no image files in the Games catalog — each card renders a
       fixed-size CSS mini-graphic inside a .feat-preview-frame. Rather
       than copy that markup here (a second source), we read it live from
       /games/index.html once and cache path → .feat-preview-frame HTML.
       On any fetch/parse failure CATALOG_ART stays {} and the old thumb
       path is used. games/index.html is only read, never modified. */
    const USE_CATALOG_ART = true;
    let CATALOG_ART = {};
    let catalogArtPromise = null;
    function loadCatalogArt(){
      if (catalogArtPromise) return catalogArtPromise;
      catalogArtPromise = fetch('/games/index.html')
        .then(r => r.ok ? r.text() : Promise.reject(r.status))
        .then(html => {
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const map = {};
          doc.querySelectorAll('.featured-grid .feat-card').forEach(card => {
            const href = (card.getAttribute('href') || '').replace(/\/+$/, '');
            const frame = card.querySelector('.feat-preview-frame');
            if (href && frame) map[href] = frame.innerHTML;
          });
          return map;
        })
        .catch(e => { console.warn('Featured art: catalog fetch failed, using fallback thumb', e); return {}; });
      return catalogArtPromise;
    }

    // Used only if homepage_settings has no featured_path yet, or it
    // doesn't resolve to a known entry.
    const FEATURED_DEFAULT = {
      path: '/games/chess-forge',
      title: 'Chess Forge',
      description: 'Play. Learn. Improve. A new way to experience chess on the Atlas.',
      canonicalDescription: 'Play. Learn. Improve. A new way to experience chess on the Atlas.',
      descriptionIsOverride: false,
      cardImage: null
    };

    /* ── TEST: Featured Today trio (2 Tools + 1 Game in one enclosure) ───
       Flip to false to fully restore the single Featured card above (which
       is left entirely intact). See the matching CSS "TEST — Featured
       Today trio" block. Nothing below runs when this is false. */
    const FEATURED_TRIO = true;

    // Tools have no image files and no description in entries.js — their
    // icon (an emoji) and canonical description live in the CATALOG array
    // inside /tools/index.html. Read it live once, same idea as
    // loadCatalogArt(). On any failure this resolves {} and the tool
    // cards fall back to name-only. tools/index.html is only read.
    let TOOL_CATALOG = {};
    let toolCatalogPromise = null;
    function loadToolCatalog(){
      if (toolCatalogPromise) return toolCatalogPromise;
      toolCatalogPromise = fetch('/tools/index.html')
        .then(r => r.ok ? r.text() : Promise.reject(r.status))
        .then(html => {
          const map = {};
          // rows: ['/tools/slug', 'emoji', 'description'],
          const re = /\[\s*'(\/tools\/[a-z0-9-]+)'\s*,\s*'([^']*)'\s*,\s*'((?:[^'\\]|\\')*)'\s*\]/g;
          let m;
          while ((m = re.exec(html))) {
            map[m[1]] = { icon: m[2], desc: m[3].replace(/\\'/g, "'") };
          }
          return map;
        })
        .catch(e => { console.warn('Featured trio: tool catalog fetch failed', e); return {}; });
      return toolCatalogPromise;
    }

    function ftNorm(p){ return String(p == null ? '' : p).replace(/\/+$/, ''); }
    function ftPretty(p){
      const s = ftNorm(p).split('/').filter(Boolean).pop() || '';
      return s.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    function esc(s){
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // The card is a <div> with a stretched link on the title so the whole
    // card still navigates, while the admin description editor can live
    // inside it. Admin markup (pencil + editor) is only emitted when
    // adminView is true — no data-admin-control needed since it's absent
    // for everyone else and re-emitted on every re-render.
    function renderFeaturedArtifact(artifact, containerId, adminView){
      const el = document.getElementById(containerId);
      if (!el || !artifact || !artifact.path) return;

      // TEST path: Games-catalog art at catalog size (see USE_CATALOG_ART).
      // Falls through to the original .featured-card-thumb below when the
      // flag is off or no catalog art exists for this path.
      let artHtml;
      if (USE_CATALOG_ART && CATALOG_ART[artifact.path]) {
        artHtml = `<div class="featured-catalog-art"><div class="feat-preview-frame">${CATALOG_ART[artifact.path]}</div></div>`;
      } else {
        let thumb;
        if (artifact.cardImage) {
          thumb = `<img class="featured-card-thumb-img" src="${esc(artifact.cardImage)}" alt="">`;
        } else if (FEATURED_FALLBACK_THUMBS[artifact.path]) {
          thumb = FEATURED_FALLBACK_THUMBS[artifact.path]();
        } else {
          thumb = '';
        }
        artHtml = `<div class="featured-card-thumb">${thumb}</div>`;
      }

      const desc = artifact.description || '';
      const editPencil = adminView
        ? `<button type="button" class="featured-desc-edit" aria-label="Edit homepage description" title="Edit homepage description">&#9998;</button>`
        : '';
      const editor = adminView
        ? `<div class="featured-desc-editor" hidden>
            <textarea class="featured-desc-input" rows="3" maxlength="600"></textarea>
            <div class="featured-desc-editor-row">
              <button type="button" class="featured-desc-btn primary" data-act="save">Save</button>
              <button type="button" class="featured-desc-btn ghost" data-act="cancel">Cancel</button>
              <span class="featured-desc-status" hidden></span>
            </div>
          </div>`
        : '';

      el.innerHTML = `
        <div class="featured-card pa-panel">
          ${artHtml}
          <div class="featured-card-body">
            <span class="featured-card-eyebrow">Featured Artifact</span>
            <h3 class="featured-card-title"><a class="featured-card-link" href="${esc(artifact.path)}">${esc(artifact.title)}</a></h3>
            <div class="featured-desc-row">
              <p class="featured-card-desc">${esc(desc)}</p>
              ${editPencil}
            </div>
            ${editor}
            <span class="featured-card-cta" aria-hidden="true">Explore &#8594;</span>
          </div>
        </div>`;
    }

    try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
  </script>
<script>loadSnippets('');</script>

<!-- Homepage-only. Deliberately NOT in the indexer's ATLAS_SCRIPTS block —
     no other Atlas page loads homepage customization code. Defensive about
     load order (polls for its deps), so its position relative to the block
     above does not matter. -->
<script src="/operation/scripts/auth/homepage-config.js"></script>
<script>
  // Homepage bootstrap. Decides which homepage renders and wires the
  // Admin View editing controls.
  //
  //   showConfigurable = (view === 'admin') || homepage_settings.published
  //
  // Admins always see (and edit) the configurable homepage. Everyone else
  // sees it only once it's published; otherwise the classic .public-hero.
  // body.pa-admin-dark follows showConfigurable, so '/' is the only page
  // that ever goes dark. Any failure below leaves the fail-safe default
  // (classic shown, configurable hidden) in place.
  document.addEventListener('DOMContentLoaded', function () {
    var classicEl = document.getElementById('classic-homepage');
    var configurableEl = document.getElementById('configurable-homepage');

    Promise.all([waitForPergamonVisibility(), waitForPergamonHomepage()])
      .then(async function (deps) {
        var pv = deps[0], ph = deps[1];
        if (!pv) return;

        // Reveal/hide role+view-gated shell controls (the pencil, the
        // "Change Featured" button) — same marker the footer publish
        // panel uses.
        await pv.applyNavVisibility(document);

        var view = await pv.currentAtlasView();
        var resolved = ph
          ? await ph.getResolved()
          : { published: false, heroImageUrl: null, heroZoom: 1, heroX: 50, heroY: 50, featured: null };
        var showConfigurable = (view === 'admin') || resolved.published;

        if (classicEl) classicEl.hidden = showConfigurable;
        if (configurableEl) configurableEl.hidden = !showConfigurable;
        document.body.classList.toggle('pa-admin-dark', showConfigurable);

        if (!showConfigurable) return;

        var adminView = view === 'admin';
        applyHeroImage(resolved.heroImageUrl, {
          zoom: resolved.heroZoom, x: resolved.heroX, y: resolved.heroY
        });

        if (FEATURED_TRIO) {
          var sec = document.getElementById('featured-today-section');
          if (sec) sec.classList.add('ft-enclosed');
          await renderFeaturedTrio(resolved, adminView, ph);
        } else {
          await renderFeatured(resolved.featured || FEATURED_DEFAULT, adminView, ph);
        }

        // Editing is only reachable for an admin in Admin View
        // (applyNavVisibility hid the controls otherwise); every write is
        // still RLS-gated server-side regardless.
        if (adminView && ph) wireHomepageAdmin(ph);
      });
  });

  function applyCropVars(box, crop) {
    if (!box) return;
    var c = crop || {};
    var z = (typeof c.zoom === 'number' && isFinite(c.zoom)) ? c.zoom : 1;
    var x = (typeof c.x === 'number' && isFinite(c.x)) ? c.x : 50;
    var y = (typeof c.y === 'number' && isFinite(c.y)) ? c.y : 50;
    box.style.setProperty('--hero-zoom', String(z));
    box.style.setProperty('--hero-x', x + '%');
    box.style.setProperty('--hero-y', y + '%');
  }

  function applyHeroImage(url, crop) {
    var box = document.getElementById('hero-image');
    if (!box) return;
    var img = document.getElementById('hero-image-img');
    if (url) {
      if (!img) {
        img = document.createElement('img');
        img.id = 'hero-image-img';
        img.className = 'atlas-hero-image-img';
        img.alt = '';
        box.insertBefore(img, box.firstChild);
      }
      img.src = url;
    } else if (img) {
      img.remove();
    }
    applyCropVars(box, crop);
  }

  async function renderFeatured(artifact, adminView, ph) {
    // TEST: pull catalog art once (cached). No-op / {} when USE_CATALOG_ART
    // is off or the fetch fails — renderFeaturedArtifact then uses the
    // original thumb path.
    if (USE_CATALOG_ART && !Object.keys(CATALOG_ART).length) {
      try { CATALOG_ART = await loadCatalogArt(); } catch (e) { CATALOG_ART = {}; }
    }
    renderFeaturedArtifact(artifact || FEATURED_DEFAULT, 'featured-artifact-slot', adminView);
    if (adminView && ph) wireFeaturedDescEditor(ph);
  }

  /* ── TEST: Featured Today trio render ─────────────────────────────────
     Resolves the three homepage_settings selections (paths + description
     overrides) against the Tools/Games catalogs + entries.js + effective
     visibility, then draws one enclosure. Effective visibility is what
     decides whether a card renders for the public — an artifact that is
     not effectively public is simply omitted in Public / Public Preview
     (in Admin View it's shown with an "admin-only" note). */
  async function ftResolveTool(sel, toolCat) {
    var path = ftNorm(sel.path);
    var entry = (window.PergamonHomepage && PergamonHomepage.lookupEntry) ? PergamonHomepage.lookupEntry(path) : null;
    var pv = window.PergamonVisibility;
    var visible = pv ? await pv.isVisibleInCurrentView(entry)
                     : !!(entry && !entry.archived && entry.visibility === 'public');
    var eff = (pv && entry) ? await pv.getEffectiveVisibility(path, entry.visibility)
                            : (entry ? entry.visibility : 'public');
    var meta = toolCat[path] || null;
    var override = (typeof sel.descriptionOverride === 'string') ? sel.descriptionOverride.trim() : '';
    return {
      slot: sel.slot,
      path: path,
      name: (entry && entry.name) || ftPretty(path),
      icon: meta ? meta.icon : '',
      description: override || (meta ? meta.desc : '') || '',
      visible: visible,
      adminOnly: eff !== 'public'
    };
  }

  async function ftResolveGame(sel, gameArt) {
    var path = ftNorm(sel.path);
    var entry = (window.PergamonHomepage && PergamonHomepage.lookupEntry) ? PergamonHomepage.lookupEntry(path) : null;
    var pv = window.PergamonVisibility;
    var visible = pv ? await pv.isVisibleInCurrentView(entry)
                     : !!(entry && !entry.archived && entry.visibility === 'public');
    var eff = (pv && entry) ? await pv.getEffectiveVisibility(path, entry.visibility)
                            : (entry ? entry.visibility : 'public');
    var override = (typeof sel.descriptionOverride === 'string') ? sel.descriptionOverride.trim() : '';
    var canonical = (entry && entry.description) || '';
    if (!canonical && path === FEATURED_DEFAULT.path) canonical = FEATURED_DEFAULT.description;
    return {
      path: path,
      name: (entry && entry.name) || ftPretty(path),
      artHtml: gameArt[path] || null,
      description: override || canonical || '',
      visible: visible,
      adminOnly: eff !== 'public'
    };
  }

  function ftEyebrow(text, adminOnly, adminView) {
    var hint = (adminView && adminOnly) ? ' <span class="ft-adminonly">· admin-only</span>' : '';
    return '<span class="ft-eyebrow">' + text + hint + '</span>';
  }

  function ftDescBlock(slotKey, text, adminView, pClass) {
    var empty = !text;
    // Public view + no editorial copy → render nothing (no lonely gap).
    if (empty && !adminView) return '';
    var cls = (pClass || 'ft-desc') + (empty ? ' ft-desc-empty' : '');
    var body = empty ? 'Add a homepage description' : esc(text);
    var pencil = adminView
      ? '<button type="button" class="ft-desc-edit" data-slot="' + slotKey + '" aria-label="Edit homepage description" title="Edit homepage description">&#9998;</button>'
      : '';
    var editor = adminView
      ? '<div class="ft-desc-editor" data-slot="' + slotKey + '" hidden>'
        + '<textarea class="ft-desc-input" rows="3" maxlength="600"></textarea>'
        + '<div class="ft-desc-editor-row">'
        +   '<button type="button" class="featured-desc-btn primary" data-act="save">Save</button>'
        +   '<button type="button" class="featured-desc-btn ghost" data-act="cancel">Cancel</button>'
        +   '<span class="featured-desc-status" hidden></span>'
        + '</div></div>'
      : '';
    return '<div class="ft-desc-row"><p class="' + cls + '" data-slot="' + slotKey + '">' + body + '</p>' + pencil + '</div>' + editor;
  }

  function ftToolCard(c, adminView) {
    var slotKey = 'tool' + c.slot;
    return '<div class="ft-tool">'
      + '<div class="ft-tool-icon">' + esc(c.icon || '🔧') + '</div>'
      + '<div class="ft-tool-body">'
      +   ftEyebrow('Featured Tool', c.adminOnly, adminView)
      +   '<h3 class="ft-tool-name"><a class="ft-card-link" href="' + esc(c.path) + '/">' + esc(c.name) + '</a></h3>'
      +   ftDescBlock(slotKey, c.description, adminView, 'ft-desc')
      +   '<span class="ft-action" aria-hidden="true">Explore &#8594;</span>'
      + '</div></div>';
  }

  function ftGameCard(c, adminView) {
    var art;
    if (c.artHtml) {
      art = '<div class="featured-catalog-art"><div class="feat-preview-frame">' + c.artHtml + '</div></div>';
    } else if (FEATURED_FALLBACK_THUMBS[c.path]) {
      art = '<div class="featured-card-thumb">' + FEATURED_FALLBACK_THUMBS[c.path]() + '</div>';
    } else {
      art = '<div class="featured-card-thumb"></div>';
    }
    return '<div class="ft-game pa-panel">'
      + '<div class="ft-game-art">' + art + '</div>'
      + '<div class="ft-game-body">'
      +   ftEyebrow('Featured Game', c.adminOnly, adminView)
      +   '<h3 class="featured-card-title"><a class="ft-card-link" href="' + esc(c.path) + '/">' + esc(c.name) + '</a></h3>'
      +   ftDescBlock('game', c.description, adminView, 'featured-card-desc ft-desc')
      +   '<span class="featured-card-cta" aria-hidden="true">Explore &#8594;</span>'
      + '</div></div>';
  }

  async function renderFeaturedTrio(resolved, adminView, ph) {
    var slotEl = document.getElementById('featured-artifact-slot');
    if (!slotEl) return;

    var toolCat = await loadToolCatalog();
    var gameArt = USE_CATALOG_ART ? await loadCatalogArt().catch(function () { return {}; }) : {};

    var t1 = await ftResolveTool(resolved.featuredTools[0], toolCat);
    var t2 = await ftResolveTool(resolved.featuredTools[1], toolCat);
    var g  = await ftResolveGame(resolved.featuredGame, gameArt);

    function keep(c) { return adminView || c.visible; }
    var tools = [t1, t2].filter(keep);
    var showGame = keep(g);

    var html = '<div class="ft-trio">'
      + '<div class="ft-trio-tools">' + tools.map(function (c) { return ftToolCard(c, adminView); }).join('') + '</div>'
      + (showGame ? ftGameCard(g, adminView) : '')
      + '</div>';
    slotEl.innerHTML = (tools.length || showGame) ? html : '';

    if (adminView && ph) ftWireDescEditors(ph);
  }

  function ftWireDescEditors(ph) {
    var slotEl = document.getElementById('featured-artifact-slot');
    if (!slotEl) return;
    [].forEach.call(slotEl.querySelectorAll('.ft-desc-edit'), function (pencil) {
      if (pencil.dataset.wired) return;
      pencil.dataset.wired = '1';
      var slotKey = pencil.dataset.slot;
      var row = pencil.closest('.ft-desc-row');
      var descP = row && row.querySelector('p[data-slot="' + slotKey + '"]');
      var editor = slotEl.querySelector('.ft-desc-editor[data-slot="' + slotKey + '"]');
      if (!descP || !editor) return;
      var input = editor.querySelector('.ft-desc-input');
      var status = editor.querySelector('.featured-desc-status');
      var saveBtn = editor.querySelector('[data-act="save"]');
      var cancelBtn = editor.querySelector('[data-act="cancel"]');

      function open() {
        input.value = descP.classList.contains('ft-desc-empty') ? '' : (descP.textContent || '');
        descP.hidden = true; pencil.hidden = true; editor.hidden = false;
        setStatus(status, ''); input.focus();
      }
      function close() { editor.hidden = true; descP.hidden = false; pencil.hidden = false; }

      pencil.addEventListener('click', open);
      cancelBtn.addEventListener('click', close);
      saveBtn.addEventListener('click', async function () {
        saveBtn.disabled = true;
        setStatus(status, 'Saving…');
        var res = await ph.setFeaturedSlotDescription(slotKey, input.value);
        saveBtn.disabled = false;
        if (res && res.error) {
          setStatus(status, (res.error && res.error.message) || 'Save failed', 'error');
          return;
        }
        setStatus(status, 'Saved', 'ok');
        var r = await ph.getResolved();
        setTimeout(function () { renderFeaturedTrio(r, true, ph); }, 650);
      });
    });
  }

  function ftWireTrioPicker(ph) {
    var changeBtn = document.getElementById('featured-change-btn');
    var picker = document.getElementById('featured-trio-picker');
    var t1 = document.getElementById('ftp-tool1');
    var t2 = document.getElementById('ftp-tool2');
    var gm = document.getElementById('ftp-game');
    var status = document.getElementById('ftp-status');
    if (!changeBtn || !picker || !t1 || !t2 || !gm || changeBtn.dataset.wiredTrio) return;
    changeBtn.dataset.wiredTrio = '1';

    var E = window.atlasEntries || {};
    function opts(list) {
      return (list || []).slice()
        .sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); })
        .map(function (e) { return '<option value="' + esc(e.path) + '">' + esc(e.name) + '</option>'; })
        .join('');
    }
    var toolOpts = opts(E.tools);
    t1.innerHTML = toolOpts;
    t2.innerHTML = toolOpts;
    gm.innerHTML = opts(E.games);

    function setSel(el, val) {
      if ([].some.call(el.options, function (o) { return o.value === val; })) el.value = val;
    }
    ph.getResolved().then(function (r) {
      setSel(t1, ftNorm(r.featuredTools[0].path));
      setSel(t2, ftNorm(r.featuredTools[1].path));
      setSel(gm, ftNorm(r.featuredGame.path));
    });

    changeBtn.addEventListener('click', function () { picker.hidden = !picker.hidden; });

    async function pick(el, fn) {
      el.disabled = true;
      setStatus(status, 'Saving…');
      var res = await fn(el.value);
      el.disabled = false;
      if (res && res.error) {
        setStatus(status, (res.error && res.error.message) || 'Save failed', 'error');
        return;
      }
      var r = await ph.getResolved();
      await renderFeaturedTrio(r, true, ph);
      setStatus(status, 'Saved', 'ok');
    }
    t1.addEventListener('change', function () { pick(t1, function (v) { return ph.setFeaturedTool(1, v); }); });
    t2.addEventListener('change', function () { pick(t2, function (v) { return ph.setFeaturedTool(2, v); }); });
    gm.addEventListener('change', function () { pick(gm, function (v) { return ph.setFeaturedGame(v); }); });
  }

  function setStatus(el, msg, kind) {
    if (!el) return;
    el.textContent = msg || '';
    el.classList.toggle('is-error', kind === 'error');
    el.classList.toggle('is-ok', kind === 'ok');
    el.hidden = !msg;
    if (msg && kind === 'ok') {
      setTimeout(function () { if (el.textContent === msg) el.hidden = true; }, 2500);
    }
  }

  function wireHomepageAdmin(ph) {
    wireCropModal(ph);

    if (FEATURED_TRIO) { ftWireTrioPicker(ph); return; }

    // ── Featured artifact picker (pre-trio) ──
    var changeBtn = document.getElementById('featured-change-btn');
    var picker = document.getElementById('featured-picker');
    var select = document.getElementById('featured-select');
    var pickStatus = document.getElementById('featured-picker-status');
    if (changeBtn && picker && select && !changeBtn.dataset.wired) {
      changeBtn.dataset.wired = '1';

      // Every current Game and Tool, straight from the indexer's output
      // (window.atlasEntries). No names hardcoded — a game added to the
      // catalog and re-indexed shows up here automatically. featured_path
      // resolution isn't limited to these two groups.
      var E = window.atlasEntries || {};
      function optionsHtml(list) {
        return (list || []).slice()
          .sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); })
          .map(function (e) { return '<option value="' + esc(e.path) + '">' + esc(e.name) + '</option>'; })
          .join('');
      }
      var gamesHtml = optionsHtml(E.games);
      var toolsHtml = optionsHtml(E.tools);
      select.innerHTML =
        (gamesHtml ? '<optgroup label="Games">' + gamesHtml + '</optgroup>' : '') +
        (toolsHtml ? '<optgroup label="Tools">' + toolsHtml + '</optgroup>' : '');

      ph.getResolved().then(function (r) {
        var current = (r && r.featuredPath) || FEATURED_DEFAULT.path;
        if ([].some.call(select.options, function (o) { return o.value === current; })) {
          select.value = current;
        }
      });

      changeBtn.addEventListener('click', function () { picker.hidden = !picker.hidden; });

      select.addEventListener('change', async function () {
        select.disabled = true;
        setStatus(pickStatus, 'Saving…');
        var res = await ph.setFeaturedArtifact(select.value); // also clears featured_description
        select.disabled = false;
        if (res && res.error) {
          setStatus(pickStatus, (res.error && res.error.message) || 'Save failed', 'error');
          return;
        }
        var r = await ph.getResolved();
        await renderFeatured(r.featured || FEATURED_DEFAULT, true, ph);
        setStatus(pickStatus, 'Saved', 'ok');
      });
    }
  }

  // ── Featured Today description — homepage-only editorial copy ──
  // Re-runs after every renderFeaturedArtifact() (the markup is rebuilt).
  function wireFeaturedDescEditor(ph) {
    var slot = document.getElementById('featured-artifact-slot');
    if (!slot) return;
    var pencil = slot.querySelector('.featured-desc-edit');
    var editor = slot.querySelector('.featured-desc-editor');
    var descP = slot.querySelector('.featured-card-desc');
    if (!pencil || !editor || !descP || pencil.dataset.wired) return;
    pencil.dataset.wired = '1';

    var input = editor.querySelector('.featured-desc-input');
    var status = editor.querySelector('.featured-desc-status');
    var saveBtn = editor.querySelector('[data-act="save"]');
    var cancelBtn = editor.querySelector('[data-act="cancel"]');

    function open() {
      input.value = descP.textContent || '';
      descP.hidden = true;
      pencil.hidden = true;
      editor.hidden = false;
      setStatus(status, '');
      input.focus();
    }
    function close() {
      editor.hidden = true;
      descP.hidden = false;
      pencil.hidden = false;
    }

    pencil.addEventListener('click', open);
    cancelBtn.addEventListener('click', close);
    saveBtn.addEventListener('click', async function () {
      saveBtn.disabled = true;
      setStatus(status, 'Saving…');
      var res = await ph.setFeaturedDescription(input.value); // blank ⇒ NULL ⇒ canonical
      saveBtn.disabled = false;
      if (res && res.error) {
        setStatus(status, (res.error && res.error.message) || 'Save failed', 'error');
        return;
      }
      var r = await ph.getResolved();
      descP.textContent = (r.featured && r.featured.description) || '';
      setStatus(status, 'Saved', 'ok');
      setTimeout(close, 800);
    });
  }

  // ── Hero image crop editor modal ──
  function wireCropModal(ph) {
    var modal = document.getElementById('hero-crop-modal');
    if (!modal || modal.dataset.wired) return;
    modal.dataset.wired = '1';

    var preview = document.getElementById('hero-crop-preview');
    var emptyMsg = document.getElementById('hero-crop-empty');
    var controls = document.getElementById('hero-crop-controls');
    var zoomEl = document.getElementById('hero-crop-zoom');
    var xEl = document.getElementById('hero-crop-x');
    var yEl = document.getElementById('hero-crop-y');
    var replaceBtn = document.getElementById('hero-crop-replace');
    var resetBtn = document.getElementById('hero-crop-reset');
    var saveBtn = document.getElementById('hero-crop-save');
    var statusEl = document.getElementById('hero-crop-status');
    var fileInput = document.getElementById('hero-image-input');
    var heroBox = document.getElementById('hero-image');
    var openPencil = document.getElementById('hero-image-edit');

    var defaults = ph.cropDefaults ? ph.cropDefaults() : { zoom: 1, x: 50, y: 50 };
    var current = { url: null, zoom: 1, x: 50, y: 50 }; // last-saved

    function syncPreview() {
      applyCropVars(preview, {
        zoom: parseFloat(zoomEl.value),
        x: parseFloat(xEl.value),
        y: parseFloat(yEl.value)
      });
    }
    function setSliders(c) {
      zoomEl.value = c.zoom; xEl.value = c.x; yEl.value = c.y;
      syncPreview();
    }
    function renderPreviewImg(url) {
      var old = preview.querySelector('img');
      if (old) old.remove();
      var has = !!url;
      if (has) {
        var img = document.createElement('img');
        img.className = 'atlas-hero-image-img';
        img.alt = '';
        img.src = url;
        preview.insertBefore(img, preview.firstChild);
      }
      preview.hidden = !has;
      emptyMsg.hidden = has;
      controls.hidden = !has;
      saveBtn.disabled = !has;
      resetBtn.disabled = !has;
    }
    async function openModal() {
      var r = await ph.getResolved();
      current = { url: r.heroImageUrl || null, zoom: r.heroZoom, x: r.heroX, y: r.heroY };
      renderPreviewImg(current.url);
      setSliders(current);
      setStatus(statusEl, '');
      modal.hidden = false;
    }
    function closeModal() { modal.hidden = true; }

    [zoomEl, xEl, yEl].forEach(function (el) { el.addEventListener('input', syncPreview); });
    resetBtn.addEventListener('click', function () { setSliders(defaults); });
    modal.querySelectorAll('[data-close]').forEach(function (el) {
      el.addEventListener('click', closeModal);
    });

    replaceBtn.addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', async function () {
      var file = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if (!file) return;
      replaceBtn.disabled = true;
      setStatus(statusEl, 'Uploading…');
      var res = await ph.setHeroImage(file); // resets crop server-side
      replaceBtn.disabled = false;
      if (res && res.error) {
        setStatus(statusEl, (res.error && res.error.message) || 'Upload failed', 'error');
        return;
      }
      var r = await ph.getResolved();
      current = { url: r.heroImageUrl || null, zoom: r.heroZoom, x: r.heroX, y: r.heroY };
      renderPreviewImg(current.url);
      setSliders(current);
      applyHeroImage(current.url, current); // reflect on the live hero now
      setStatus(statusEl, 'Image replaced — position it, then Save', 'ok');
    });

    saveBtn.addEventListener('click', async function () {
      var crop = {
        zoom: parseFloat(zoomEl.value),
        x: parseFloat(xEl.value),
        y: parseFloat(yEl.value)
      };
      saveBtn.disabled = true;
      setStatus(statusEl, 'Saving…');
      var res = await ph.setHeroCrop(crop);
      saveBtn.disabled = false;
      if (res && res.error) {
        setStatus(statusEl, (res.error && res.error.message) || 'Save failed', 'error');
        return;
      }
      applyHeroImage(current.url, crop);
      setStatus(statusEl, 'Saved', 'ok');
      setTimeout(closeModal, 700);
    });

    // Open triggers: the pencil, or clicking the image itself.
    if (openPencil && !openPencil.dataset.wired) {
      openPencil.dataset.wired = '1';
      openPencil.addEventListener('click', function (e) { e.stopPropagation(); openModal(); });
    }
    if (heroBox) {
      heroBox.classList.add('is-admin');
      heroBox.addEventListener('click', function (e) {
        if (e.target.closest('.hero-image-edit')) return;
        openModal();
      });
    }
  }
</script>
