  <script>
    loadSnippets('Settings');

    // Deferred to DOMContentLoaded: the indexer clusters PergamonVisibility
    // in the late script block, after this tag.
    document.addEventListener('DOMContentLoaded', function () {
      waitForPergamonVisibility().then(function (pv) {
        if (!pv) return;
        var buttons = document.querySelectorAll('.appearance-btn');

        function paint(value) {
          buttons.forEach(function (b) {
            b.classList.toggle('active', b.dataset.value === value);
          });
        }

        paint(pv.getStoredAppearance());

        buttons.forEach(function (b) {
          b.addEventListener('click', function () {
            pv.setStoredAppearance(b.dataset.value);
            paint(b.dataset.value);
          });
        });
      });
    });
  </script>
