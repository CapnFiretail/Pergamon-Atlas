<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pergamon Atlas — Labyrinth Prototype</title>
  <style>
    /* ============================================================
       ATLAS EXPLORER — Prototype UI
       Architecture: two-panel layout, SVG map, epoch shifting
       Aesthetic: dark terminal / living archive
    ============================================================ */

    :root {
      --bg:           #080810;
      --surface:      #0d0d1a;
      --surface2:     #111124;
      --border:       #2a2a3e;
      --text:         #c8c8d8;
      --text-dim:     #4a4a6a;
      --text-faint:   #2a2a4a;
      --gold:         #c28a2b;
      --gold-dim:     #7a5518;
      --blue:         #4a9eff;
      --teal:         #2bc2b0;
      --red:          #ff5555;
      --purple:       #9a4aff;
      --green:        #4aff9a;

      --node-origin:  #ffffff;
      --node-system:  #c28a2b;
      --node-content: #2bc2b0;
      --node-hidden:  #ff5555;
      --node-archive: #9a4aff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      display: grid;
      grid-template-rows: 44px 1fr;
      grid-template-columns: 300px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ---- Header ---- */
    header {
      grid-column: 1 / -1;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 14px;
    }
    .hdr-title {
      color: var(--gold);
      font-size: 13px;
      letter-spacing: 3px;
      font-weight: bold;
    }
    .hdr-sep { color: var(--text-faint); }
    .hdr-epoch { color: var(--blue); font-size: 11px; letter-spacing: 1px; }
    .hdr-status { color: var(--text-dim); font-size: 10px; }
    .hdr-controls { margin-left: auto; display: flex; gap: 6px; }

    button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 10px;
      padding: 4px 10px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: border-color 0.15s, color 0.15s;
    }
    button:hover { border-color: var(--gold); color: var(--gold); }
    button.toggled { border-color: var(--blue); color: var(--blue); }

    /* ---- Left Panel ---- */
    #panel {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .p-section {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .p-label {
      color: var(--text-faint);
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    #sel-name    { color: #fff; font-size: 15px; line-height: 1.2; min-height: 19px; }
    #sel-id      { color: var(--gold); font-size: 9px; letter-spacing: 1px; margin-top: 3px; }
    #sel-meta    { color: var(--text-dim); font-size: 10px; margin-top: 4px; }
    #sel-status  { font-size: 10px; margin-top: 3px; }
    #sel-url     { font-size: 10px; margin-top: 6px; word-break: break-all; }
    #sel-url a   { color: var(--blue); text-decoration: none; }
    #sel-url a:hover { text-decoration: underline; }
    #sel-desc    { font-size: 10px; color: var(--text-dim); margin-top: 6px; font-style: italic; line-height: 1.5; }

    /* Connections list */
    #conn-list { list-style: none; }
    #conn-list li {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 0;
      font-size: 10px;
      border-bottom: 1px solid var(--text-faint);
    }
    #conn-list li:last-child { border-bottom: none; }
    .c-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .c-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .c-type { color: var(--text-faint); font-size: 9px; letter-spacing: 1px; }
    .c-active  { color: var(--teal); }
    .c-dormant { color: var(--text-faint); text-decoration: line-through; }
    .c-special { color: var(--red); }
    .c-archive { color: var(--purple); }

    /* Atlas log */
    #log-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
    }
    .log-entry {
      font-size: 9px;
      padding: 2px 0;
      border-bottom: 1px solid var(--text-faint);
      line-height: 1.5;
      color: var(--text-dim);
    }
    .log-entry:last-child { border-bottom: none; }
    .log-ts { color: var(--text-faint); margin-right: 4px; }
    .log-hi  { color: var(--gold); }
    .log-err { color: var(--red); }
    .log-ok  { color: var(--teal); }

    /* ---- Map Panel ---- */
    #map-wrap {
      position: relative;
      background: var(--bg);
      overflow: hidden;
    }
    #atlas-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Legend */
    #legend {
      position: absolute;
      bottom: 14px;
      right: 14px;
      background: rgba(13,13,26,0.92);
      border: 1px solid var(--border);
      padding: 10px 14px;
    }
    .leg-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 10px; }
    .leg-row:last-child { margin-bottom: 0; }
    .leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .leg-line { width: 18px; height: 2px; flex-shrink: 0; }

    /* Epoch indicator bottom-left */
    #epoch-ring {
      position: absolute;
      bottom: 14px;
      left: 14px;
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .epoch-pip {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-faint);
      transition: background 0.3s;
    }
    .epoch-pip.current { background: var(--gold); }
    .epoch-pip.past    { background: var(--gold-dim); }

    /* Tooltip */
    #tip {
      position: absolute;
      display: none;
      background: rgba(10,10,20,0.96);
      border: 1px solid var(--border);
      padding: 8px 12px;
      font-size: 10px;
      pointer-events: none;
      z-index: 50;
      max-width: 180px;
      line-height: 1.5;
    }
    #tip strong { color: #fff; display: block; margin-bottom: 2px; }

    /* Shift animation flash */
    @keyframes mapFlash {
      0%   { opacity: 0.3; }
      100% { opacity: 1; }
    }
    .shifting { animation: mapFlash 0.4s ease-out; }
  </style>
</head>
<body>

<!-- ============================================================
     HEADER
============================================================ -->
<header>
  <span class="hdr-title">PERGAMON ATLAS</span>
  <span class="hdr-sep">/</span>
  <span class="hdr-epoch" id="hdr-epoch">EPOCH-0000</span>
  <span class="hdr-sep">/</span>
  <span class="hdr-status" id="hdr-status">initializing…</span>
  <div class="hdr-controls">
    <button onclick="shiftEpoch()"        title="Advance epoch — maze reconfigures">[ SHIFT MAZE ]</button>
    <button onclick="resetEpoch()"        title="Return to epoch 0">[ RESET ]</button>
    <button id="btn-dormant" class="" onclick="toggleDormant()" title="Show dormant (inactive) edges">[ ALL EDGES ]</button>
    <button id="btn-archive" class="" onclick="toggleArchive()" title="Reveal archive layer">[ ARCHIVE ]</button>
  </div>
</header>

<!-- ============================================================
     LEFT PANEL
============================================================ -->
<div id="panel">
  <div class="p-section">
    <div class="p-label">Selected Node</div>
    <div id="sel-name">—</div>
    <div id="sel-id"></div>
    <div id="sel-meta"></div>
    <div id="sel-status"></div>
    <div id="sel-url"></div>
    <div id="sel-desc"></div>
  </div>

  <div class="p-section" style="flex-shrink:0">
    <div class="p-label">Connections</div>
    <ul id="conn-list"><li style="color:var(--text-faint)">click a node</li></ul>
  </div>

  <div class="p-section" style="flex-shrink:0;border-bottom:none">
    <div class="p-label">Atlas Log</div>
  </div>
  <div id="log-wrap"></div>
</div>

<!-- ============================================================
     MAP
============================================================ -->
<div id="map-wrap">
  <svg id="atlas-svg" viewBox="-450 -430 900 870">
    <g id="g-rings"></g>
    <g id="g-edges"></g>
    <g id="g-nodes"></g>
  </svg>

  <!-- Epoch ring indicator -->
  <div id="epoch-ring"></div>

  <!-- Legend -->
  <div id="legend">
    <div style="color:var(--text-faint);font-size:9px;letter-spacing:2px;margin-bottom:6px">LEGEND</div>
    <div class="leg-row"><div class="leg-dot" style="background:#fff"></div> Origin</div>
    <div class="leg-row"><div class="leg-dot" style="background:var(--node-system)"></div> System</div>
    <div class="leg-row"><div class="leg-dot" style="background:var(--node-content)"></div> Content</div>
    <div class="leg-row"><div class="leg-dot" style="background:var(--node-hidden)"></div> Hidden</div>
    <div class="leg-row"><div class="leg-dot" style="background:var(--node-archive)"></div> Archive</div>
    <div style="margin-top:6px;border-top:1px solid var(--border);padding-top:6px">
    <div class="leg-row"><div class="leg-line" style="background:var(--node-system)"></div> Spanning (stable)</div>
    <div class="leg-row"><div class="leg-line" style="background:var(--blue);opacity:0.7"></div> Optional (shifts)</div>
    <div class="leg-row"><div class="leg-line" style="background:var(--red);opacity:0.6"></div> Special (rare)</div>
    <div class="leg-row"><div class="leg-line" style="background:var(--purple);opacity:0.5"></div> Archive link</div>
    </div>
  </div>

  <!-- Tooltip -->
  <div id="tip"></div>
</div>

<script>
/* ============================================================
   PERGAMON ATLAS — Labyrinth Engine Prototype v0.1

   Architecture overview:
     DATA LAYER  — nodes and edges are permanent, stable
     NAV LAYER   — which edges are active shifts per epoch
     RENDER LAYER— SVG polar map, panel, log

   Key invariants:
     1. Spanning edges are always active (graph stays connected)
     2. All behavior is deterministic from masterSeed + epoch
     3. Hidden nodes are invisible/unreachable unless a special
        edge activates — they cannot be "found" by guessing
     4. Direct URL access always works regardless of epoch state
============================================================ */

// ===========================================================
// SECTION 1 — RNG
// Same mulberry32 used across the codebase.
// Seeded RNG: same seed → same sequence, always.
// ===========================================================

function mulberry32(seed) {
  seed = seed >>> 0;
  return function() {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ===========================================================
// SECTION 2 — STATIC DATA: NODES
//
// Every node has a permanent id. Nodes never move, never change.
// ring:  0=origin, 1=inner/system, 2=content, 3=outer/volatile
// angle: polar position on the map (degrees)
// type:  origin | system | content | hidden | archive
// state: active | archived | locked
//
// In production, nodes.js merges with entries.js so that
// path/seed/coords come from entries.js and ring/angle/desc
// come from nodes.js. Here they're combined for the prototype.
// ===========================================================

const NODES = [

  // ── Ring 0: Origin ──────────────────────────────────────
  {
    id: 'PA-R0-ORIGIN',
    name: 'Origin',
    ring: 0, angle: 0,
    type: 'origin', state: 'active',
    chamber: null,
    url: '/',
    desc: 'The center of the Atlas. All paths begin here. The first record.'
  },

  // ── Ring 1: System Nodes (always reachable) ─────────────
  {
    id: 'PA-R1-SYS-TL',
    name: 'Tools Chamber',
    ring: 1, angle: 300,
    type: 'system', state: 'active',
    chamber: 'TL',
    url: '/sectors/systems/tools',
    desc: 'Catalogued instruments of computation. 53 active entries.'
  },
  {
    id: 'PA-R1-SYS-GM',
    name: 'Games Chamber',
    ring: 1, angle: 60,
    type: 'system', state: 'active',
    chamber: 'GM',
    url: '/sectors/systems/games',
    desc: 'Hall of interactive constructs. 32 active entries.'
  },
  {
    id: 'PA-R1-SYS-AR',
    name: 'Archive Portal',
    ring: 1, angle: 180,
    type: 'system', state: 'active',
    chamber: 'AR',
    url: '/sectors/systems/other/archives',
    desc: 'Gateway to deprecated and dormant records. Handle with care.'
  },

  // ── Ring 2: Content Nodes (tools) ───────────────────────
  {
    id: 'PA-R2-TL-001',
    name: 'Password Generator',
    ring: 2, angle: 270,
    type: 'content', state: 'active',
    chamber: 'TL',
    url: '/sectors/atlas/tools/password-generator',
    desc: 'Generates cryptographically informed passwords of variable length.'
  },
  {
    id: 'PA-R2-TL-002',
    name: 'JSON Formatter',
    ring: 2, angle: 305,
    type: 'content', state: 'active',
    chamber: 'TL',
    url: '/sectors/atlas/tools/json-formatter',
    desc: 'Parses, validates, and formats raw JSON structures.'
  },
  {
    id: 'PA-R2-TL-003',
    name: 'Unit Converter',
    ring: 2, angle: 335,
    type: 'content', state: 'active',
    chamber: 'TL',
    url: '/sectors/atlas/tools/unit-converter',
    desc: 'Translates values between measurement systems.'
  },
  {
    id: 'PA-R2-TL-004',
    name: 'Caesar Cipher',
    ring: 2, angle: 355,
    type: 'content', state: 'active',
    chamber: 'TL',
    url: '/sectors/atlas/tools/caesar-cipher',
    desc: 'Classical rotational substitution cipher.'
  },

  // ── Ring 2: Content Nodes (games) ───────────────────────
  {
    id: 'PA-R2-GM-001',
    name: 'Chess Forge',
    ring: 2, angle: 40,
    type: 'content', state: 'active',
    chamber: 'GM',
    url: '/sectors/atlas/games/chess-forge',
    desc: 'Strategic board construct. Pieces carry memory of past positions.'
  },
  {
    id: 'PA-R2-GM-002',

  },
  {
    id: 'PA-R2-GM-003',

    chamber: 'GM',
    url: '/sectors/atlas/games/wordle',
    desc: 'Lexical deduction in six attempts. Language as maze.'
  },

  // ── Ring 3: Outer / Volatile ─────────────────────────────
  {
    id: 'PA-R3-TL-001',
    name: 'Binary Translator',
    ring: 3, angle: 320,
    type: 'content', state: 'active',
    chamber: 'TL',
    url: '/sectors/atlas/tools/binary-translator',
    desc: 'Renders text as binary notation and reverses the process.'
  },
  {
    id: 'PA-R3-GM-001',
    name: 'Minesweeper',
    ring: 3, angle: 55,
    type: 'content', state: 'active',
    chamber: 'GM',
    url: '/sectors/atlas/games/minesweeper',
    desc: 'Probabilistic deduction under incomplete information.'
  },
  {
    id: 'PA-R3-GM-002',
    name: 'Maze',
    ring: 3, angle: 80,
    type: 'content', state: 'active',
    chamber: 'GM',
    url: '/sectors/atlas/games/maze',
    desc: 'A labyrinth within the labyrinth. Recursive.'
  },

  // ── Ring 3: HIDDEN NODE ───────────────────────────────────
  // This node is invisible and unreachable unless a special edge
  // activates. Its name and URL are intentionally null here.
  // When first reached, the system logs an anomaly event.
  {
    id: 'PA-R3-HIDDEN-01',
    name: null,            // revealed only when reachable
    ring: 3, angle: 200,
    type: 'hidden', state: 'locked',
    chamber: null,
    url: null,             // no destination yet — future content
    desc: null
  },

  // ── Ring 3: Archive Nodes ─────────────────────────────────
  {
    id: 'PA-R3-ARC-01',
    name: 'Atlas Runner v1',
    ring: 3, angle: 155,
    type: 'archive', state: 'archived',
    chamber: 'AR',
    url: '/sectors/archives/atlas-runner-v1',
    desc: 'An earlier iteration of the runner construct. Preserved, deprecated.'
  },
  {
    id: 'PA-R3-ARC-02',
    name: 'Chess Forge v1',
    ring: 3, angle: 172,
    type: 'archive', state: 'archived',
    chamber: 'AR',
    url: '/sectors/archives/chess-forge-v1',
    desc: 'Original chess construct. Obsolete strategies, intact execution.'
  },
];

// ===========================================================
// SECTION 3 — STATIC DATA: EDGES
//
// ALL possible connections in the Atlas.
// This list is permanent — it never changes.
// What changes per epoch is whether each edge is *active*.
//
// Types:
//   spanning     → always active (minimum spanning tree)
//   optional     → active ~60% of epochs (threshold 0.40)
//   special      → active ~15% of epochs (threshold 0.85)
//   archive-link → active ~25% of epochs (threshold 0.75)
//
// Design rule: every non-hidden node must have at least
// one SPANNING edge guaranteeing it stays reachable.
// ===========================================================

const ALL_EDGES = [

  // ── Spanning tree (guaranteed always-active) ─────────────
  // These form the backbone. Even if all optional edges die,
  // you can still reach every active node.
  { id:'E-001', from:'PA-R0-ORIGIN',    to:'PA-R1-SYS-TL',    type:'spanning'  },
  { id:'E-002', from:'PA-R0-ORIGIN',    to:'PA-R1-SYS-GM',    type:'spanning'  },
  { id:'E-003', from:'PA-R0-ORIGIN',    to:'PA-R1-SYS-AR',    type:'spanning'  },
  { id:'E-004', from:'PA-R1-SYS-TL',   to:'PA-R2-TL-001',    type:'spanning'  },
  { id:'E-005', from:'PA-R1-SYS-GM',   to:'PA-R2-GM-001',    type:'spanning'  },
  { id:'E-006', from:'PA-R2-TL-001',   to:'PA-R3-TL-001',    type:'spanning'  },
  { id:'E-007', from:'PA-R2-GM-001',   to:'PA-R3-GM-001',    type:'spanning'  },
  { id:'E-008', from:'PA-R2-TL-002',   to:'PA-R2-TL-003',    type:'spanning'  },
  { id:'E-009', from:'PA-R2-GM-002',   to:'PA-R3-GM-002',    type:'spanning'  },

  // ── Optional edges (shift per epoch) ─────────────────────
  // These are the "shifting corridors." When one closes, you
  // may need to find a longer route through the maze.
  { id:'E-010', from:'PA-R1-SYS-TL',   to:'PA-R2-TL-002',    type:'optional'  },
  { id:'E-011', from:'PA-R1-SYS-TL',   to:'PA-R2-TL-003',    type:'optional'  },
  { id:'E-012', from:'PA-R1-SYS-TL',   to:'PA-R2-TL-004',    type:'optional'  },
  { id:'E-013', from:'PA-R1-SYS-GM',   to:'PA-R2-GM-002',    type:'optional'  },
  { id:'E-014', from:'PA-R1-SYS-GM',   to:'PA-R2-GM-003',    type:'optional'  },
  { id:'E-015', from:'PA-R2-TL-001',   to:'PA-R2-TL-002',    type:'optional'  }, // lateral
  { id:'E-016', from:'PA-R2-TL-003',   to:'PA-R2-TL-004',    type:'optional'  }, // lateral
  { id:'E-017', from:'PA-R2-GM-001',   to:'PA-R2-GM-002',    type:'optional'  }, // lateral
  { id:'E-018', from:'PA-R2-GM-002',   to:'PA-R2-GM-003',    type:'optional'  }, // lateral
  { id:'E-019', from:'PA-R2-TL-002',   to:'PA-R3-TL-001',    type:'optional'  },
  { id:'E-020', from:'PA-R2-TL-004',   to:'PA-R3-TL-001',    type:'optional'  },
  { id:'E-021', from:'PA-R2-GM-002',   to:'PA-R3-GM-002',    type:'optional'  },
  { id:'E-022', from:'PA-R3-TL-001',   to:'PA-R3-GM-001',    type:'optional'  }, // cross-chamber ring 3

  // ── Special edges (rare — unlock hidden node) ─────────────
  // These corridors only open rarely. They are the only way
  // to discover PA-R3-HIDDEN-01. Both must be inactive for the
  // node to stay hidden.
  { id:'E-100', from:'PA-R2-TL-004',   to:'PA-R3-HIDDEN-01', type:'special'   },
  { id:'E-101', from:'PA-R3-TL-001',   to:'PA-R3-HIDDEN-01', type:'special'   },

  // ── Archive links (occasional access to archive nodes) ────
  { id:'E-200', from:'PA-R1-SYS-AR',   to:'PA-R3-ARC-01',    type:'archive-link' },
  { id:'E-201', from:'PA-R1-SYS-AR',   to:'PA-R3-ARC-02',    type:'archive-link' },
  { id:'E-202', from:'PA-R2-GM-001',   to:'PA-R3-ARC-02',    type:'archive-link' }, // thematic link
];

// ===========================================================
// SECTION 4 — ATLAS ENGINE
//
// Deterministic edge activation from epoch + master seed.
// Rule: same epoch always produces the same active edge set.
// ===========================================================

const MASTER_SEED  = 0x5EED4A75;  // fixed "Pergamon" seed — never changes
const EPOCH_COUNT  = 8;           // maze cycles through 8 configurations

// Activation threshold per type.
// Edge is ACTIVE when rng() > threshold.
const THRESHOLDS = {
  spanning:      0,     // always active (threshold 0 = never deactivated)
  optional:      0.40,  // ~60% active per epoch
  special:       0.85,  // ~15% active per epoch
  'archive-link': 0.75, // ~25% active per epoch
};

// Returns the full edge list with an `active` property added.
// This is the core function. Changing masterSeed or epoch
// produces a completely different maze configuration.
function computeActiveEdges(epoch) {
  return ALL_EDGES.map((edge, idx) => {
    const threshold = THRESHOLDS[edge.type];
    if (threshold === 0) return { ...edge, active: true };

    // Each edge has its own independent RNG stream.
    // The seed is derived from three sources:
    //   masterSeed — the Atlas identity (never changes)
    //   idx * prime — edge identity (each edge has unique behavior)
    //   epoch * prime2 — time dimension (epoch changes the map)
    //
    // XOR combines them without correlation between dimensions.
    const edgeSeed = (MASTER_SEED ^ (idx * 0x00013337) ^ (epoch * 0x0000BEEF)) >>> 0;
    const rng = mulberry32(edgeSeed);
    return { ...edge, active: rng() > threshold };
  });
}

// BFS from Origin — returns Set of all reachable node IDs.
// Used to: (a) highlight reachable nodes, (b) detect hidden node discoveries.
function computeReachability(activeEdges) {
  // Build adjacency list from active edges only
  const adj = {};
  for (const e of activeEdges) {
    if (!e.active) continue;
    (adj[e.from] = adj[e.from] || []).push(e.to);
    (adj[e.to]   = adj[e.to]   || []).push(e.from);
  }

  const reachable = new Set();
  const queue = ['PA-R0-ORIGIN'];
  while (queue.length) {
    const node = queue.shift();
    if (reachable.has(node)) continue;
    reachable.add(node);
    for (const neighbor of (adj[node] || [])) {
      if (!reachable.has(neighbor)) queue.push(neighbor);
    }
  }
  return reachable;
}

// ===========================================================
// SECTION 5 — COORDINATE SYSTEM
//
// Visual polar layout: ring → radius, angle → SVG coordinates.
// This is purely for rendering — not the same as the z/y/x
// coordinate system in entries.js (which is lore/ATLAS codes).
// ===========================================================

const RING_RADII = [0, 115, 225, 335]; // pixels per ring
const NODE_MAP   = Object.fromEntries(NODES.map(n => [n.id, n]));

const NODE_VISUAL = {
  origin:  { color: '#ffffff', r: 18 },
  system:  { color: '#c28a2b', r: 13 },
  content: { color: '#2bc2b0', r: 9  },
  hidden:  { color: '#ff5555', r: 7  },
  archive: { color: '#9a4aff', r: 7  },
};

function nodeXY(node) {
  const radius = RING_RADII[node.ring] || 0;
  const rad    = ((node.angle - 90) * Math.PI) / 180; // -90 so 0° is at top
  return { x: Math.cos(rad) * radius, y: Math.sin(rad) * radius };
}

// ===========================================================
// SECTION 6 — APPLICATION STATE
// ===========================================================

let epoch         = 0;
let selectedId    = 'PA-R0-ORIGIN';
let showDormant   = false;
let showArchive   = false;
let activeEdges   = [];
let reachable     = new Set();

// ===========================================================
// SECTION 7 — RENDERER
// ===========================================================

const SVG_NS = 'http://www.w3.org/2000/svg';

function el(tag, attrs = {}) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

function renderRings() {
  const g = document.getElementById('g-rings');
  g.innerHTML = '';

  for (let i = 1; i <= 3; i++) {
    const r = RING_RADII[i];
    g.appendChild(el('circle', { cx:0, cy:0, r,
      fill:'none', stroke:'#1a1a2a', 'stroke-width':'1', 'stroke-dasharray':'3 8' }));
    const lbl = el('text', { x:-r+4, y:-4,
      fill:'#1a1a30', 'font-family':'Courier New', 'font-size':'8', 'letter-spacing':'2' });
    lbl.textContent = `RING-${i}`;
    g.appendChild(lbl);
  }

  // Origin pulse ring
  g.appendChild(el('circle', { cx:0, cy:0, r:26,
    fill:'none', stroke:'rgba(255,255,255,0.05)', 'stroke-width':'1' }));
}

function renderEdges() {
  const g = document.getElementById('g-edges');
  g.innerHTML = '';

  for (const edge of activeEdges) {
    // Visibility rules
    if (!edge.active && !showDormant) continue;
    if (edge.type === 'archive-link' && !showArchive) continue;

    const fromNode = NODE_MAP[edge.from];
    const toNode   = NODE_MAP[edge.to];
    if (!fromNode || !toNode) continue;

    // Hide special edge if hidden node isn't even in dormant mode
    if (toNode.type === 'hidden' && !showDormant && !edge.active) continue;

    const p1 = nodeXY(fromNode);
    const p2 = nodeXY(toNode);

    let stroke, width, dash, opacity;

    if (!edge.active) {
      // Dormant — shown only in all-edges mode
      stroke = '#1a1a30'; width = '1'; dash = '4 6'; opacity = '0.5';
    } else if (edge.type === 'spanning') {
      stroke = '#7a5518'; width = '2'; dash = 'none'; opacity = '1';
    } else if (edge.type === 'optional') {
      stroke = '#2a5a7a'; width = '1.5'; dash = 'none'; opacity = '0.8';
    } else if (edge.type === 'special') {
      stroke = '#7a2222'; width = '1.5'; dash = '3 4'; opacity = '0.7';
    } else if (edge.type === 'archive-link') {
      stroke = '#5a2a7a'; width = '1'; dash = '6 4'; opacity = '0.6';
    }

    const line = el('line', {
      x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
      stroke, 'stroke-width': width,
      'stroke-dasharray': dash !== 'none' ? dash : null,
      opacity
    });
    if (dash === 'none') line.removeAttribute('stroke-dasharray');
    g.appendChild(line);
  }
}

function renderNodes() {
  const g = document.getElementById('g-nodes');
  g.innerHTML = '';

  for (const node of NODES) {
    const isReachable  = reachable.has(node.id);
    const isSelected   = node.id === selectedId;
    const isHidden     = node.type === 'hidden';
    const isArchive    = node.type === 'archive';

    // Visibility rules
    if (isHidden  && !isReachable && !showDormant)  continue;
    if (isArchive && !isReachable && !showArchive)  continue;

    const vis   = NODE_VISUAL[node.type];
    const pos   = nodeXY(node);
    const color = vis.color;
    const r     = vis.r;

    // Outer glow (reachable nodes only)
    if (isReachable) {
      g.appendChild(el('circle', {
        cx: pos.x, cy: pos.y, r: r + 6,
        fill: 'none', stroke: color, 'stroke-width': '0.5', opacity: '0.15'
      }));
    }

    // Selection ring
    if (isSelected) {
      g.appendChild(el('circle', {
        cx: pos.x, cy: pos.y, r: r + 4,
        fill: 'none', stroke: color, 'stroke-width': '2', opacity: '0.6'
      }));
    }

    // Main node circle
    const circle = el('circle', {
      cx: pos.x, cy: pos.y, r,
      fill:          isReachable ? color : '#0d0d1a',
      stroke:        color,
      'stroke-width': isSelected ? '2.5' : '1.5',
      opacity:        isReachable ? '1' : '0.25',
      cursor:         'pointer'
    });
    circle.addEventListener('click', () => selectNode(node.id));
    circle.addEventListener('mouseenter', e => showTip(e, node, isReachable));
    circle.addEventListener('mouseleave', hideTip);
    g.appendChild(circle);

    // Node label
    const nameText = isHidden && !isReachable ? '???' : (node.name || node.id);
    const lbl = el('text', {
      x: pos.x, y: pos.y + r + 12,
      'text-anchor': 'middle', fill: isReachable ? color : '#2a2a4a',
      'font-family': 'Courier New', 'font-size': node.type === 'origin' ? '10' : '9',
      opacity: isReachable ? '1' : '0.3', 'pointer-events': 'none'
    });
    lbl.textContent = nameText;
    g.appendChild(lbl);

    // Node ID (tiny, below name)
    if (node.type !== 'origin') {
      const idLbl = el('text', {
        x: pos.x, y: pos.y + r + 22,
        'text-anchor': 'middle', fill: '#2a2a42',
        'font-family': 'Courier New', 'font-size': '7', 'pointer-events': 'none'
      });
      idLbl.textContent = node.id;
      g.appendChild(idLbl);
    }
  }
}

// ===========================================================
// SECTION 8 — PANEL UPDATE
// ===========================================================

function updatePanel(nodeId) {
  const node = NODE_MAP[nodeId];
  if (!node) return;

  const isReachable = reachable.has(node.id);
  const isHidden    = node.type === 'hidden' && !isReachable;

  document.getElementById('sel-name').textContent =
    isHidden ? '[ UNCHARTED NODE ]' : (node.name || '—');

  document.getElementById('sel-id').textContent = node.id;

  document.getElementById('sel-meta').textContent =
    `Ring ${node.ring}  ·  ${node.chamber || 'NO CHAMBER'}  ·  ${node.type.toUpperCase()}`;

  const statusEl = document.getElementById('sel-status');
  if (isReachable) {
    statusEl.innerHTML = `<span style="color:var(--teal)">● REACHABLE</span> this epoch`;
  } else {
    statusEl.innerHTML = `<span style="color:var(--text-dim)">○ UNREACHABLE</span> — direct URL still works`;
  }

  const urlEl = document.getElementById('sel-url');
  if (node.url) {
    if (isReachable) {
      urlEl.innerHTML = `<a href="${node.url}">${node.url}</a>`;
    } else {
      urlEl.innerHTML = `<span style="color:var(--text-faint)">${node.url}</span>`;
    }
  } else if (isHidden) {
    urlEl.innerHTML = `<span style="color:var(--text-faint)">[path undiscovered]</span>`;
  } else {
    urlEl.textContent = '';
  }

  document.getElementById('sel-desc').textContent =
    isHidden ? 'This node has not yet been mapped. Its designation is unknown.' : (node.desc || '');

  // Build connections list
  const list = document.getElementById('conn-list');
  list.innerHTML = '';

  const myEdges = activeEdges.filter(e => e.from === nodeId || e.to === nodeId);

  if (!myEdges.length) {
    list.innerHTML = '<li style="color:var(--text-faint);font-size:10px">No mapped connections</li>';
    return;
  }

  for (const edge of myEdges) {
    if (edge.type === 'archive-link' && !showArchive) continue;

    const otherId   = edge.from === nodeId ? edge.to : edge.from;
    const other     = NODE_MAP[otherId];
    if (!other) continue;

    const isOtherHidden   = other.type === 'hidden' && !reachable.has(otherId);
    const isOtherArchive  = other.type === 'archive';
    if (isOtherArchive && !showArchive && !edge.active) continue;

    const displayName = isOtherHidden ? '[ UNKNOWN ]' : (other.name || otherId);

    let dotColor, nameClass;
    if (!edge.active) {
      dotColor = 'var(--text-faint)'; nameClass = 'c-dormant';
    } else if (edge.type === 'archive-link') {
      dotColor = 'var(--node-archive)'; nameClass = 'c-archive';
    } else if (edge.type === 'special') {
      dotColor = 'var(--node-hidden)'; nameClass = 'c-special';
    } else {
      dotColor = 'var(--node-content)'; nameClass = 'c-active';
    }

    const li = document.createElement('li');
    li.innerHTML = `
      <span class="c-dot" style="background:${dotColor}"></span>
      <span class="c-name ${nameClass}">${displayName}</span>
      <span class="c-type">${edge.type}</span>
    `;
    li.style.cursor = 'pointer';
    li.addEventListener('click', () => {
      selectNode(otherId);
      // If node is visible in map, make it selected
    });
    list.appendChild(li);
  }
}

// ===========================================================
// SECTION 9 — CONTROLS
// ===========================================================

function render() {
  activeEdges = computeActiveEdges(epoch);
  reachable   = computeReachability(activeEdges);

  renderRings();
  renderEdges();
  renderNodes();
  updatePanel(selectedId);
  updateEpochIndicator();
  updateHeader();
}

function selectNode(id) {
  selectedId = id;
  render(); // re-render so selection highlight updates

  const node = NODE_MAP[id];
  if (node) {
    log(
      `Inspected <span class="log-hi">${reachable.has(id) ? (node.name || id) : '???'}</span> [${id}]`
    );
  }
}

function shiftEpoch() {
  const prevReach = new Set(reachable); // snapshot before shift
  epoch = (epoch + 1) % EPOCH_COUNT;
  render();

  // Detect new discoveries
  const gained = [...reachable].filter(id => !prevReach.has(id));
  const lost   = [...prevReach].filter(id => !reachable.has(id));

  log(`<span class="log-hi">MAZE SHIFTED</span> → Epoch ${epoch}`);

  if (gained.length) {
    for (const id of gained) {
      const n = NODE_MAP[id];
      if (n?.type === 'hidden') {
        log(`<span class="log-err">⚠ ANOMALY</span> — Unknown node briefly accessible [${id}]`);
      } else {
        log(`<span class="log-ok">+ UNLOCKED</span> — ${n?.name || id} is now reachable`);
      }
    }
  }
  if (lost.length) {
    for (const id of lost) {
      const n = NODE_MAP[id];
      log(`<span style="color:var(--text-dim)">− SEALED</span> — ${n?.name || id} corridor closed`);
    }
  }

  // Animate the SVG
  document.getElementById('atlas-svg').classList.add('shifting');
  setTimeout(() => document.getElementById('atlas-svg').classList.remove('shifting'), 400);
}

function resetEpoch() {
  epoch = 0;
  render();
  log(`Atlas reset to <span class="log-hi">Epoch 0</span>`);
}

function toggleDormant() {
  showDormant = !showDormant;
  document.getElementById('btn-dormant').classList.toggle('toggled', showDormant);
  render();
  log(showDormant ? 'Showing dormant edges' : 'Hiding dormant edges');
}

function toggleArchive() {
  showArchive = !showArchive;
  document.getElementById('btn-archive').classList.toggle('toggled', showArchive);
  render();
  log(showArchive
    ? '<span class="log-hi">Archive layer revealed</span>'
    : 'Archive layer hidden'
  );
}

function updateEpochIndicator() {
  const wrap = document.getElementById('epoch-ring');
  wrap.innerHTML = '';
  for (let i = 0; i < EPOCH_COUNT; i++) {
    const pip = document.createElement('div');
    pip.className = 'epoch-pip' +
      (i === epoch ? ' current' : (i < epoch ? ' past' : ''));
    wrap.appendChild(pip);
  }
}

function updateHeader() {
  document.getElementById('hdr-epoch').textContent =
    `EPOCH-${String(epoch).padStart(4,'0')} / ${EPOCH_COUNT - 1}`;

  const activeCount = activeEdges.filter(e => e.active).length;
  document.getElementById('hdr-status').textContent =
    `${reachable.size} nodes reachable  ·  ${activeCount}/${ALL_EDGES.length} edges active`;
}

// ===========================================================
// SECTION 10 — TOOLTIP
// ===========================================================

function showTip(event, node, isReachable) {
  const tip = document.getElementById('tip');
  const name = (node.type === 'hidden' && !isReachable) ? '[ UNKNOWN ]' : (node.name || node.id);
  const desc = (node.type === 'hidden' && !isReachable) ? 'This node has not yet been charted.' : (node.desc || '');
  tip.innerHTML = `<strong>${name}</strong><span style="color:var(--text-faint)">${node.id}</span><br>${desc}`;
  tip.style.display = 'block';

  const rect = document.getElementById('map-wrap').getBoundingClientRect();
  let tx = event.clientX - rect.left + 14;
  let ty = event.clientY - rect.top  + 14;
  if (tx + 190 > rect.width)  tx = event.clientX - rect.left - 196;
  if (ty + 90  > rect.height) ty = event.clientY - rect.top  - 96;
  tip.style.left = tx + 'px';
  tip.style.top  = ty + 'px';
}

function hideTip() {
  document.getElementById('tip').style.display = 'none';
}

// ===========================================================
// SECTION 11 — LOG
// ===========================================================

function log(html) {
  const wrap = document.getElementById('log-wrap');
  const d    = document.createElement('div');
  d.className = 'log-entry';
  const t = new Date().toTimeString().slice(0, 8);
  d.innerHTML = `<span class="log-ts">${t}</span>${html}`;
  wrap.prepend(d);
  while (wrap.children.length > 25) wrap.removeChild(wrap.lastChild);
}

// ===========================================================
// INIT
// ===========================================================

render();
selectNode('PA-R0-ORIGIN');

log(`Atlas engine initialized`);
log(`<span class="log-hi">${NODES.length}</span> nodes registered`);
log(`<span class="log-hi">${ALL_EDGES.length}</span> edges in permanent map`);
log(`Master seed: <span class="log-hi">0x${MASTER_SEED.toString(16).toUpperCase()}</span>`);
log(`Epoch period: <span class="log-hi">${EPOCH_COUNT}</span> configurations`);
log(`Shift the maze to discover hidden paths`);

/* ===========================================================
   HOW TO ADD A NEW NODE (production workflow):

   1. Add the content page to sectors/atlas/tools/ or games/
   2. Run `node pergamon-data/indexing/indexer.js` to inject
      atlas-meta and regenerate entries.js
   3. Add a node entry to pergamon-data/atlas/nodes.js
      with the correct ring, angle, and type
   4. Add a spanning edge from its nearest parent node in edges.js
   5. Optionally add optional/lateral edges for extra paths
   6. That's it — the node is in the Atlas immediately

   HOW TO ARCHIVE A NODE:

   1. Change its state to 'archived' in nodes.js
   2. Remove its spanning edge, add an archive-link edge
      from PA-R1-SYS-AR instead
   3. Move the physical page to sectors/archives/
   4. The node stays in the graph but becomes intermittently
      accessible (only when archive-link edges are active)

   HOW TO RECONSTRUCT ANY PAST STATE:

   getStateAtEpoch(3) gives you the exact edge set and
   reachability for epoch 3, deterministically, forever.
   =========================================================== */

</script>
