<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas Navigator — Pergamon Atlas</title>
<style>
  :root {
    --gold:    #c9a84c;
    --dim:     #7a6530;
    --bg:      #09080a;
    --panel:   #100e12;
    --inset:   #0d0b0f;
    --border:  #201c26;
    --text:    #d6c89a;
    --muted:   #5a5040;
    --warp:    #6b3a5a;
    --warp-fg: #c97ab0;
    --here:    #2a4a3a;
    --here-fg: #6bc49a;
    --red:     #7a3a3a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 13px;
    overflow: hidden;
  }

  /* ── Layout ─────────────────────────────────────────── */

  #shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  #topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    gap: 16px;
  }

  #main {
    flex: 1 1 0;
    display: flex;
    overflow: hidden;
  }

  #left-panel {
    flex: 1 1 0;
    overflow-y: auto;
    padding: 28px 28px 40px;
    border-right: 1px solid var(--border);
  }

  #right-panel {
    flex: 0 0 280px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Top bar ─────────────────────────────────────────── */

  .tb-brand {
    font-size: 9px;
    letter-spacing: 0.35em;
    color: var(--muted);
    text-transform: uppercase;
    white-space: nowrap;
  }

  .tb-address {
    font-size: 15px;
    color: var(--gold);
    letter-spacing: 0.1em;
    flex: 1;
    text-align: center;
  }

  .tb-coords {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  /* ── Room panel ──────────────────────────────────────── */

  #room-name {
    font-size: 20px;
    color: var(--gold);
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }

  #room-atmosphere {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
    margin-bottom: 28px;
    font-style: italic;
    max-width: 480px;
  }

  .section-rule {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  .section-rule::after {
    content: '';
    flex: 1;
    border-top: 1px solid var(--border);
  }

  /* Artifact list */

  #artifact-list {
    margin-bottom: 32px;
  }

  .artifact-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 1px solid transparent;
    margin-bottom: 4px;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }

  .artifact-row:hover {
    border-color: var(--border);
    background: var(--inset);
  }

  .artifact-row.here {
    border-color: var(--here);
    background: rgba(107, 196, 154, 0.05);
  }

  .art-badge {
    font-size: 8px;
    letter-spacing: 0.2em;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 2px 5px;
    white-space: nowrap;
  }

  .artifact-row.here .art-badge {
    color: var(--here-fg);
    border-color: var(--here);
  }

  .art-name {
    flex: 1;
    color: var(--text);
    transition: color 0.1s;
  }

  .artifact-row:hover .art-name { color: var(--gold); }
  .artifact-row.here .art-name  { color: var(--here-fg); }

  .art-prox {
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
  }

  .artifact-row.here .art-prox {
    color: var(--here-fg);
    font-size: 9px;
    letter-spacing: 0.15em;
  }

  .art-link {
    font-size: 10px;
    color: var(--dim);
    text-decoration: none;
    padding: 2px 4px;
    transition: color 0.1s;
  }

  .art-link:hover { color: var(--gold); }

  /* Exit grid */

  #exit-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    max-width: 560px;
  }

  .exit-btn {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    background: var(--inset);
    cursor: pointer;
    text-align: left;
    transition: border-color 0.12s, background 0.12s;
    position: relative;
  }

  .exit-btn:hover {
    border-color: var(--dim);
    background: #140f18;
  }

  .exit-btn.warp {
    border-color: var(--warp);
    background: rgba(107, 58, 90, 0.08);
  }

  .exit-btn.warp:hover {
    border-color: var(--warp-fg);
    background: rgba(107, 58, 90, 0.15);
  }

  .exit-dir {
    font-size: 8px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .exit-btn.warp .exit-dir { color: var(--warp-fg); opacity: 0.7; }

  .exit-name {
    font-size: 12px;
    color: var(--text);
  }

  .exit-btn.warp .exit-name { color: var(--warp-fg); }

  .exit-addr {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.07em;
  }

  .exit-btn.warp .exit-addr {
    color: var(--warp);
    font-style: italic;
  }

  /* ── Right panel ─────────────────────────────────────── */

  #trail-section {
    flex: 1 1 0;
    overflow-y: auto;
    padding: 20px 16px;
    border-bottom: 1px solid var(--border);
  }

  #jump-section {
    flex: 0 0 auto;
    padding: 16px;
  }

  .rp-label {
    font-size: 9px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  #trail-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .trail-entry {
    padding: 6px 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: border-color 0.1s, background 0.1s;
  }

  .trail-entry:hover {
    border-color: var(--border);
    background: var(--inset);
  }

  .trail-entry.current {
    border-color: var(--border);
    background: var(--inset);
  }

  .te-name {
    font-size: 11px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .trail-entry.current .te-name { color: var(--gold); }

  .te-addr {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  /* Jump */

  .jump-input-row {
    display: flex;
    gap: 6px;
  }

  #jump-input {
    flex: 1;
    background: var(--inset);
    border: 1px solid var(--border);
    color: var(--gold);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    padding: 8px 10px;
    outline: none;
    letter-spacing: 0.05em;
    transition: border-color 0.12s;
  }

  #jump-input::placeholder { color: var(--muted); letter-spacing: 0; }
  #jump-input:focus { border-color: var(--dim); }

  #jump-btn {
    background: transparent;
    border: 1px solid var(--dim);
    color: var(--gold);
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    padding: 0 12px;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
    text-transform: uppercase;
  }

  #jump-btn:hover {
    border-color: var(--gold);
    background: rgba(201,168,76,0.06);
  }

  #jump-error {
    font-size: 10px;
    color: var(--red);
    margin-top: 6px;
    min-height: 14px;
  }

  /* ── Scrollbar ───────────────────────────────────────── */

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); }

  /* ── Transitions ─────────────────────────────────────── */

  #room-name, #room-atmosphere, #artifact-list, #exit-grid {
    transition: opacity 0.15s;
  }

  .fade-out { opacity: 0 !important; }
</style>
</head>
<body>

<div id="shell">

  <!-- Top bar -->
  <div id="topbar">
    <div class="tb-brand">Pergamon Atlas</div>
    <div class="tb-address" id="tb-address">—</div>
    <div class="tb-coords"  id="tb-coords">—</div>
  </div>

  <div id="main">

    <!-- Left: room -->
    <div id="left-panel">
      <div id="room-name">—</div>
      <div id="room-atmosphere"></div>

      <div class="section-rule">Artifacts</div>
      <div id="artifact-list"></div>

      <div class="section-rule">Exits</div>
      <div id="exit-grid"></div>
    </div>

    <!-- Right: trail + jump -->
    <div id="right-panel">

      <div id="trail-section">
        <div class="rp-label">Trail</div>
        <div id="trail-list"></div>
      </div>

      <div id="jump-section">
        <div class="rp-label">Jump to Address</div>
        <div class="jump-input-row">
          <input id="jump-input" type="text" placeholder="XXXXX-YYYYY-ZZZZZ" maxlength="17"
            oninput="this.value = this.value.toUpperCase().replace(/[^A-Z2-9\-]/g,'')">
          <button id="jump-btn" onclick="doJump()">Go</button>
        </div>
        <div id="jump-error"></div>
      </div>

    </div>
  </div>
</div>

<script src="../pergamon-data/pergamon-address.js"></script>
<script src="../pergamon-data/indexing/entries.js"></script>
<script>
'use strict';

const PA   = window.PergamonAddress;
const CMAX = PA.COORD_MAX; // 16,777,215

// ── Constants ──────────────────────────────────────────────────────────────

const STEP        = 500_000;  // units per directional move
const MAX_TRAIL   = 20;
const NEARBY_SHOW = 6;
const WARP_CHANCE = 0.14;

// ── State ──────────────────────────────────────────────────────────────────

const state = {
  x: 0, y: 0, z: 0,
  trail: []  // [{ name, address, x, y, z }]
};

// ── RNG / hashing ─────────────────────────────────────────────────────────

function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashCoords(x, y, z) {
  let h = 0x50455247; // Pergamon Constant high word as init
  for (const v of [x, y, z]) {
    h = Math.imul(h ^ (v >>> 0), 0x9e3779b9);
    h ^= h >>> 16;
    h = Math.imul(h, 0x85ebca6b);
    h ^= h >>> 13;
  }
  return h >>> 0;
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ── Room generation ────────────────────────────────────────────────────────

const ADJECTIVES = [
  'Obsidian', 'Brass', 'Ivory', 'Iron', 'Marble', 'Copper', 'Amber',
  'Crystal', 'Stone', 'Pale', 'Dim', 'Silent', 'Ancient', 'Worn',
  'Narrow', 'Vaulted', 'Hollow', 'Gilded', 'Ashen', 'Sunken'
];

const NOUNS = [
  'Study', 'Chamber', 'Gallery', 'Corridor', 'Vault', 'Hall',
  'Archive', 'Passage', 'Reading Room', 'Anteroom', 'Stacks',
  'Index Room', 'Alcove', 'Folio Room', 'Shelf Hall', 'Atrium'
];

const EXIT_NAMES = {
  north: ['North Corridor',   'North Gallery',  'North Shelfway',  'Northern Passage'],
  south: ['South Corridor',   'South Gallery',  'South Passage',   'Southern Hall'   ],
  east:  ['East Gallery',     'East Wing',      'East Shelfway',   'Eastern Corridor'],
  west:  ['West Gallery',     'West Passage',   'West Wing',       'Western Hall'    ],
  up:    ['Upper Stair',      'The Rise',       'Upper Level',     'Ascending Hall'  ],
  down:  ['Lower Stair',      'The Descent',    'Lower Level',     'Descending Stair'],
};

const ATMOSPHERES = {
  dense: [
    'A grand chamber crowded with relics. Pedestals hold artifacts in every corner.',
    'A wide hall where many things are indexed. The air is thick with old paper.',
    'An intersection of corridors. Something rests on nearly every surface.',
    'A vaulted reading room with shelves floor to ceiling, most of them filled.',
  ],
  sparse: [
    'A quiet study with sparse furnishings. A few artifacts rest on nearby shelves.',
    'A modest room with one or two relics visible along the far wall.',
    'A small chamber. Something glints faintly in the dim light nearby.',
    'A narrow passage with a single reading stand beside an unlit sconce.',
  ],
  empty: [
    'A long corridor. The shelves are bare. Nothing is visible from here.',
    'An empty anteroom. Dust gathers on bare pedestals.',
    'A dim passage with barren shelves in every direction.',
    'A void-adjacent hall. The silence here is absolute.',
    'An unmarked room. The shelves were cleared long ago.',
  ],
};

const DIRS = {
  north: { label: 'North', dx:  0, dy:  1, dz:  0 },
  south: { label: 'South', dx:  0, dy: -1, dz:  0 },
  east:  { label: 'East',  dx:  1, dy:  0, dz:  0 },
  west:  { label: 'West',  dx: -1, dy:  0, dz:  0 },
  up:    { label: 'Up',    dx:  0, dy:  0, dz:  1 },
  down:  { label: 'Down',  dx:  0, dy:  0, dz: -1 },
};

function generateRoom(x, y, z) {
  const seed = hashCoords(x, y, z);
  const rng  = mulberry32(seed);

  const adj  = ADJECTIVES[Math.floor(rng() * ADJECTIVES.length)];
  const noun = NOUNS     [Math.floor(rng() * NOUNS.length)];
  const name = `The ${adj} ${noun}`;

  // Nearby artifacts — drives atmosphere
  const nearby  = findNearest(x, y, z, NEARBY_SHOW);
  const density = nearby.filter(e => e.dist < 2_000_000).length;

  const pool = density >= 3 ? ATMOSPHERES.dense
             : density >= 1 ? ATMOSPHERES.sparse
             :                ATMOSPHERES.empty;
  const atmosphere = pool[Math.floor(rng() * pool.length)];

  // Exits
  const exits = {};
  for (const [dir, info] of Object.entries(DIRS)) {
    const warp = rng() < WARP_CHANCE;
    const exitName = EXIT_NAMES[dir][Math.floor(rng() * EXIT_NAMES[dir].length)];

    let nx, ny, nz;
    if (warp) {
      // Deterministic warp: hash current pos mixed with direction char
      const ws  = hashCoords(x ^ (dir.charCodeAt(0) * 0x1000), y, z);
      const wr  = mulberry32(ws);
      nx = Math.floor(wr() * 2 * CMAX) - CMAX;
      ny = Math.floor(wr() * 2 * CMAX) - CMAX;
      nz = Math.floor(wr() * 2 * CMAX) - CMAX;
    } else {
      nx = clamp(x + info.dx * STEP, -CMAX, CMAX);
      ny = clamp(y + info.dy * STEP, -CMAX, CMAX);
      nz = clamp(z + info.dz * STEP, -CMAX, CMAX);
    }

    exits[dir] = {
      dir,
      label:   info.label,
      name:    exitName,
      warp,
      dest:    { x: nx, y: ny, z: nz },
      address: PA.coordsToAddress(nx, ny, nz)
    };
  }

  return { name, atmosphere, nearby, exits };
}

// ── Artifact helpers ───────────────────────────────────────────────────────

function allArtifacts() {
  if (typeof window.atlasEntries === 'undefined') return [];
  return [...window.atlasEntries.tools, ...window.atlasEntries.games];
}

function findNearest(x, y, z, limit) {
  return allArtifacts()
    .map(e => ({
      ...e,
      dist: Math.hypot(e.coords.x - x, e.coords.y - y, e.coords.z - z)
    }))
    .sort((a, b) => a.dist - b.dist)
    .slice(0, limit);
}

function proximityLabel(dist) {
  if (dist === 0)          return 'this chamber';
  if (dist < 50_000)       return 'immediate vicinity';
  if (dist < 500_000)      return 'very close';
  if (dist < 2_000_000)    return 'nearby';
  if (dist < 5_000_000)    return 'close';
  if (dist < 10_000_000)   return 'distant';
  return 'remote';
}

// ── Navigation ─────────────────────────────────────────────────────────────

function navigateTo(x, y, z, via) {
  const room    = generateRoom(x, y, z);
  const address = PA.coordsToAddress(x, y, z);

  // Push trail
  const entry = { name: room.name, address, x, y, z, via };
  state.trail = [entry, ...state.trail.slice(0, MAX_TRAIL - 1)];
  state.x = x; state.y = y; state.z = z;

  render(room, address);
}

function takeExit(dir) {
  const room = generateRoom(state.x, state.y, state.z);
  const exit = room.exits[dir];
  fadeAndNavigate(exit.dest.x, exit.dest.y, exit.dest.z,
    exit.warp ? `${exit.name} [warp]` : exit.name);
}

function goToArtifact(e) {
  fadeAndNavigate(e.coords.x, e.coords.y, e.coords.z, e.name);
}

function doJump() {
  const raw = document.getElementById('jump-input').value.trim();
  const err = document.getElementById('jump-error');
  err.textContent = '';
  try {
    const { x, y, z } = PA.addressToCoords(raw);
    document.getElementById('jump-input').value = '';
    fadeAndNavigate(x, y, z, `Jump → ${raw}`);
  } catch (e) {
    err.textContent = 'Invalid address format.';
  }
}

function fadeAndNavigate(x, y, z, via) {
  const targets = ['#room-name','#room-atmosphere','#artifact-list','#exit-grid'];
  targets.forEach(s => document.querySelector(s).classList.add('fade-out'));
  setTimeout(() => {
    targets.forEach(s => document.querySelector(s).classList.remove('fade-out'));
    navigateTo(x, y, z, via);
  }, 130);
}

// ── Rendering ──────────────────────────────────────────────────────────────

function render(room, address) {
  // Top bar
  document.getElementById('tb-address').textContent = address;
  document.getElementById('tb-coords').textContent  =
    `${state.x}, ${state.y}, ${state.z}`;

  // Room
  document.getElementById('room-name').textContent      = room.name;
  document.getElementById('room-atmosphere').textContent = room.atmosphere;

  // Artifacts
  const artList = document.getElementById('artifact-list');
  artList.innerHTML = '';
  for (const e of room.nearby) {
    const atHere = e.dist === 0;
    const row    = document.createElement('div');
    row.className = 'artifact-row' + (atHere ? ' here' : '');
    row.onclick   = () => goToArtifact(e);

    const badge = document.createElement('span');
    badge.className   = 'art-badge';
    badge.textContent = e.chamber;

    const name = document.createElement('span');
    name.className   = 'art-name';
    name.textContent = e.name;

    const prox = document.createElement('span');
    prox.className   = 'art-prox';
    prox.textContent = atHere ? '◆ HERE' : proximityLabel(e.dist);

    const link = document.createElement('a');
    link.className   = 'art-link';
    link.textContent = '→';
    link.href        = e.path;
    link.target      = '_blank';
    link.title       = 'Open artifact';
    link.onclick     = ev => ev.stopPropagation();

    row.appendChild(badge);
    row.appendChild(name);
    row.appendChild(prox);
    row.appendChild(link);
    artList.appendChild(row);
  }

  // Exits
  const grid = document.getElementById('exit-grid');
  grid.innerHTML = '';
  for (const exit of Object.values(room.exits)) {
    const btn = document.createElement('button');
    btn.className = 'exit-btn' + (exit.warp ? ' warp' : '');
    btn.onclick   = () => takeExit(exit.dir);

    const dirSpan  = document.createElement('span');
    dirSpan.className   = 'exit-dir';
    dirSpan.textContent = exit.warp ? `${exit.label} — distorted` : exit.label;

    const nameSpan  = document.createElement('span');
    nameSpan.className   = 'exit-name';
    nameSpan.textContent = exit.name;

    const addrSpan  = document.createElement('span');
    addrSpan.className   = 'exit-addr';
    addrSpan.textContent = exit.warp ? 'destination unstable' : exit.address;

    btn.appendChild(dirSpan);
    btn.appendChild(nameSpan);
    btn.appendChild(addrSpan);
    grid.appendChild(btn);
  }

  // Trail
  const trailEl = document.getElementById('trail-list');
  trailEl.innerHTML = '';
  for (let i = 0; i < state.trail.length; i++) {
    const t   = state.trail[i];
    const row = document.createElement('div');
    row.className = 'trail-entry' + (i === 0 ? ' current' : '');
    row.onclick   = () => fadeAndNavigate(t.x, t.y, t.z, 'Trail');

    const tName = document.createElement('div');
    tName.className   = 'te-name';
    tName.textContent = t.name;

    const tAddr = document.createElement('div');
    tAddr.className   = 'te-addr';
    tAddr.textContent = t.address;

    row.appendChild(tName);
    row.appendChild(tAddr);
    trailEl.appendChild(row);
  }
}

// ── Keyboard ───────────────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (document.activeElement === document.getElementById('jump-input')) return;
  const map = { ArrowUp: 'north', ArrowDown: 'south', ArrowRight: 'east',
                ArrowLeft: 'west', PageUp: 'up', PageDown: 'down' };
  if (map[e.key]) { e.preventDefault(); takeExit(map[e.key]); }
  if (e.key === 'Enter') document.getElementById('jump-input').focus();
});

document.getElementById('jump-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doJump();
  if (e.key === 'Escape') e.target.blur();
});

// ── Boot ───────────────────────────────────────────────────────────────────

(function boot() {
  // Check URL param: ?at=XXXXX-YYYYY-ZZZZZ
  const params = new URLSearchParams(window.location.search);
  const atParam = params.get('at');

  if (atParam) {
    try {
      const { x, y, z } = PA.addressToCoords(atParam);
      navigateTo(x, y, z, 'Linked address');
      return;
    } catch (_) { /* fall through */ }
  }

  // Default: navigate to the artifact nearest to (0,0,0)
  const nearest = findNearest(0, 0, 0, 1)[0];
  if (nearest) {
    navigateTo(nearest.coords.x, nearest.coords.y, nearest.coords.z, 'Entry reference');
  } else {
    navigateTo(0, 0, 0, 'Origin');
  }
})();
