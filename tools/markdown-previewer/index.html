      <div class="tool-hero">
        <h2>Markdown Previewer</h2>
        <p>Write Markdown on the left, see the rendered preview on the right in real time.</p>
      </div>
      <div class="toolbar">
        <button class="tool-btn" onclick="insert('**','**')"><strong>Bold</strong></button>
        <button class="tool-btn" onclick="insert('*','*')"><em>Italic</em></button>
        <button class="tool-btn" onclick="insert('`','`')">Code</button>
        <button class="tool-btn" onclick="insertLine('## ')">H2</button>
        <button class="tool-btn" onclick="insertLine('### ')">H3</button>
        <button class="tool-btn" onclick="insertLine('- ')">List</button>
        <button class="tool-btn" onclick="insertLine('> ')">Quote</button>
        <button class="tool-btn" onclick="insertLine('---')">HR</button>
        <button class="tool-btn" onclick="insertLink()">Link</button>
        <button class="tool-btn" onclick="loadSample()">Sample</button>
        <button class="tool-btn" onclick="clearAll()">Clear</button>
        <button class="tool-btn" onclick="copyHTML()">Copy HTML</button>
      </div>
      <div class="editor-layout">
        <div class="editor-pane">
          <div class="pane-header">Markdown <button class="pane-btn" onclick="copyMarkdown()">Copy</button></div>
          <textarea class="code" id="editor" placeholder="# Hello World&#10;&#10;Type your **Markdown** here..." oninput="render()"></textarea>
        </div>
        <div class="editor-pane">
          <div class="pane-header">Preview <span id="wordCountLabel" style="color:#888;font-size:12px;font-weight:400"></span></div>
          <div class="preview-area" id="preview"></div>
        </div>

    </main>

  <script src="/operation/scripts/atlas.js"></script>
  <script>
    loadSnippets('Tools');

    function render() {
      const md = document.getElementById('editor').value;
      document.getElementById('preview').innerHTML = marked.parse(md);
      const words = md.trim() ? md.trim().split(/\s+/).length : 0;
      document.getElementById('wordCountLabel').textContent = words + ' words';
    }

    function insert(before, after) {
      const ta = document.getElementById('editor');
      const start = ta.selectionStart, end = ta.selectionEnd;
      const sel = ta.value.slice(start, end);
      ta.value = ta.value.slice(0,start) + before + sel + after + ta.value.slice(end);
      ta.selectionStart = start + before.length;
      ta.selectionEnd = end + before.length;
      ta.focus(); render();
    }

    function insertLine(prefix) {
      const ta = document.getElementById('editor');
      const start = ta.selectionStart;
      const lineStart = ta.value.lastIndexOf('\n', start-1)+1;
      ta.value = ta.value.slice(0,lineStart) + prefix + ta.value.slice(lineStart);
      ta.selectionStart = ta.selectionEnd = lineStart + prefix.length;
      ta.focus(); render();
    }

    function insertLink() {
      const ta = document.getElementById('editor');
      const start = ta.selectionStart;
      const sel = ta.value.slice(start, ta.selectionEnd) || 'link text';
      const insertion = `[${sel}](url)`;
      ta.value = ta.value.slice(0,start) + insertion + ta.value.slice(ta.selectionEnd);
      ta.focus(); render();
    }

    function clearAll() { document.getElementById('editor').value=''; render(); }
    function copyMarkdown() { navigator.clipboard.writeText(document.getElementById('editor').value); }
    function copyHTML() { navigator.clipboard.writeText(document.getElementById('preview').innerHTML); }

    function loadSample() {
      document.getElementById('editor').value = `# Welcome to the Markdown Previewer

| JSON Formatter | Utility | Live |
| Markdown Previewer | Utility | Live |

---

Made with ❤ at Pergamon Atlas`;
      render();
    }

    render();
  </script>
