<body>

  <script>
    loadSnippets('Color Picker');

    let history = [];

    function hexToRgb(hex) {
      const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
      return [r,g,b];
    }

    function rgbToHsl(r,g,b) {
      r/=255; g/=255; b/=255;
      const max=Math.max(r,g,b), min=Math.min(r,g,b);
      let h,s,l=(max+min)/2;
      if(max===min){h=s=0;}else{
        const d=max-min; s=l>.5?d/(2-max-min):d/(max+min);
        switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4;}
        h/=6;
      }
      return [Math.round(h*360),Math.round(s*100),Math.round(l*100)];
    }

    function hslToHex(h,s,l) {
      s/=100; l/=100;
      const a=s*Math.min(l,1-l);
      const f=n=>{const k=(n+h/30)%12; return Math.round(255*(l-a*Math.max(Math.min(k-3,9-k,1),-1))).toString(16).padStart(2,'0');};
      return '#'+f(0)+f(8)+f(4);
    }

    function luminance(r,g,b) {
      const s=[r,g,b].map(v=>{v/=255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});
      return .2126*s[0]+.7152*s[1]+.0722*s[2];
    }

    function contrastRatio(l1,l2) { return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05); }

    function update() {
      const hex = document.getElementById('picker').value;
      document.getElementById('preview').style.background = hex;
      const [r,g,b] = hexToRgb(hex);
      const [h,s,l] = rgbToHsl(r,g,b);
      const cmyk = rgbToCmyk(r,g,b);

      const vals = [
        {label:'HEX', val:hex.toUpperCase()},
        {label:'RGB', val:`rgb(${r}, ${g}, ${b})`},
        {label:'HSL', val:`hsl(${h}, ${s}%, ${l}%)`},
        {label:'CMYK', val:`cmyk(${cmyk[0]}%, ${cmyk[1]}%, ${cmyk[2]}%, ${cmyk[3]}%)`},
        {label:'CSS', val:`color: ${hex};`},
      ];

      document.getElementById('valGrid').innerHTML = vals.map(v=>`
        <div class="val-row">
          <span class="val-label">${v.label}</span>
          <span class="val-text">${v.val}</span>
          <button class="copy-small" onclick="navigator.clipboard.writeText('${v.val.replace(/'/g,"\\'")}');this.textContent='✓';setTimeout(()=>this.textContent='Copy',1200)">Copy</button>
        </div>
      `).join('');

      // contrast
      const lum = luminance(r,g,b);
      const wContrast = contrastRatio(1, lum);
      const bContrast = contrastRatio(0, lum);
      document.getElementById('contrastWhite').style.background = hex;
      document.getElementById('contrastWhite').style.color = 'white';
      document.getElementById('contrastWhite').textContent = 'White: ' + wContrast.toFixed(2) + ':1 ' + (wContrast>=4.5?'✓ AA':'✗');
      document.getElementById('contrastBlack').style.background = hex;
      document.getElementById('contrastBlack').style.color = 'black';
      document.getElementById('contrastBlack').textContent = 'Black: ' + bContrast.toFixed(2) + ':1 ' + (bContrast>=4.5?'✓ AA':'✗');
      document.getElementById('contrastScore').textContent = `Best for accessibility: ${bContrast > wContrast ? 'Black' : 'White'} text`;

      // tints/shades
      const steps = [90,70,50,30,10];
      document.getElementById('tintsShades').innerHTML = steps.map(lv=>{
        const c = hslToHex(h,s,lv);
        return `<div style="height:60px;background:${c};cursor:pointer;display:flex;align-items:center;justify-content:center" title="${c}" onclick="document.getElementById('picker').value='${c}';update()"><span style="font-size:11px;font-family:monospace;background:rgba(255,255,255,.7);padding:2px 4px;border-radius:3px;color:#111">${lv}%</span></div>`;
      }).join('');

      // history
      if (!history.includes(hex)) {
        history.unshift(hex);
        if (history.length > 16) history.pop();
        renderHistory();
      }

      // named approx
      document.getElementById('namedColor').textContent = closestNamed(r,g,b);
    }

    function rgbToCmyk(r,g,b) {
      if(r===0&&g===0&&b===0) return [0,0,0,100];
      r/=255; g/=255; b/=255;
      const k=1-Math.max(r,g,b);
      return [Math.round((1-r-k)/(1-k)*100),Math.round((1-g-k)/(1-k)*100),Math.round((1-b-k)/(1-k)*100),Math.round(k*100)];
    }

    function renderHistory() {
      document.getElementById('histSwatches').innerHTML = history.map(c=>
        `<div class="hist-swatch" style="background:${c}" title="${c}" onclick="document.getElementById('picker').value='${c}';update()"></div>`
      ).join('');
    }

    const namedColors = {red:[255,0,0],green:[0,128,0],blue:[0,0,255],white:[255,255,255],black:[0,0,0],yellow:[255,255,0],cyan:[0,255,255],magenta:[255,0,255],orange:[255,165,0],purple:[128,0,128],pink:[255,192,203],brown:[165,42,42],gray:[128,128,128],lime:[0,255,0],navy:[0,0,128],teal:[0,128,128],gold:[255,215,0],silver:[192,192,192],maroon:[128,0,0],olive:[128,128,0]};
    function closestNamed(r,g,b) {
      let best='', bestD=Infinity;
      Object.entries(namedColors).forEach(([name,[nr,ng,nb]])=>{
        const d=(r-nr)**2+(g-ng)**2+(b-nb)**2;
        if(d<bestD){bestD=d;best=name;}
      });
      return 'Closest named color: ' + best;
    }

    update();
  </script>
