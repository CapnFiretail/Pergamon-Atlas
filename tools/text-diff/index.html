<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Text Diff</h2>
        <p>Paste two versions of text to see exactly what changed — added, removed, and unchanged lines.</p>
      </div>
      <div class="panel">
        <div class="two-col">
          <div>
            <h3>Original</h3>
            <textarea id="textA" placeholder="Paste original text here..."></textarea>
          </div>
          <div>
            <h3>Modified</h3>
            <textarea id="textB" placeholder="Paste modified text here..."></textarea>
          </div>
        </div>
        <button class="atlas-btn" onclick="runDiff()">Compare</button>
        <button class="atlas-btn" style="background:#555" onclick="loadSample()">Load Sample</button>
      </div>
      <div class="panel" id="resultPanel" style="display:none">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <h3 style="margin:0">Diff Result</h3>
          <div class="mode-tabs">
            <button class="mode-tab active" id="tabUnified" onclick="setView('unified')">Unified</button>
            <button class="mode-tab" id="tabSplit" onclick="setView('split')">Split</button>
          </div>
        </div>
        <div class="stats-row" id="statsRow"></div>
        <div id="diffOutput"></div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/operation/scripts/atlas.js"></script>
  <script>
    loadSnippets('Tools');

    let currentDiff = [];
    let viewMode = 'unified';

    function lcs(a, b) {
      const m = a.length, n = b.length;
      const dp = Array.from({length:m+1}, ()=>new Array(n+1).fill(0));
      for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) {
        if(a[i-1]===b[j-1]) dp[i][j]=dp[i-1][j-1]+1;
        else dp[i][j]=Math.max(dp[i-1][j],dp[i][j-1]);
      }
      const result=[];
      let i=m,j=n;
      while(i>0||j>0){
        if(i>0&&j>0&&a[i-1]===b[j-1]){result.unshift({type:'same',val:a[i-1]});i--;j--;}
        else if(j>0&&(i===0||dp[i][j-1]>=dp[i-1][j])){result.unshift({type:'add',val:b[j-1]});j--;}
        else{result.unshift({type:'del',val:a[i-1]});i--;}
      }
      return result;
    }

    function runDiff() {
      const a = document.getElementById('textA').value.split('\n');
      const b = document.getElementById('textB').value.split('\n');
      currentDiff = lcs(a, b);
      renderDiff();
      document.getElementById('resultPanel').style.display = 'block';
    }

    function setView(v) {
      viewMode = v;
      document.getElementById('tabUnified').classList.toggle('active', v==='unified');
      document.getElementById('tabSplit').classList.toggle('active', v==='split');
      renderDiff();
    }

    function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function renderDiff() {
      const added = currentDiff.filter(d=>d.type==='add').length;
      const removed = currentDiff.filter(d=>d.type==='del').length;
      const same = currentDiff.filter(d=>d.type==='same').length;
      document.getElementById('statsRow').innerHTML = `
        <div class="stat-chip"><strong style="color:#22863a">+${added}</strong> added</div>
        <div class="stat-chip"><strong style="color:#cb2431">-${removed}</strong> removed</div>
        <div class="stat-chip"><strong>${same}</strong> unchanged</div>
      `;

      const out = document.getElementById('diffOutput');
      if(viewMode === 'unified') {
        let ln1=0, ln2=0;
        out.innerHTML = '<div class="diff-output">' + currentDiff.map(d => {
          if(d.type==='same'){ln1++;ln2++;return `<div class="diff-line unchanged"><span class="ln">${ln1}</span><span class="ln">${ln2}</span><span class="mark"> </span><span class="text">${esc(d.val)}</span></div>`;}
          if(d.type==='del'){ln1++;return `<div class="diff-line removed"><span class="ln">${ln1}</span><span class="ln"> </span><span class="mark">-</span><span class="text">${esc(d.val)}</span></div>`;}
          ln2++;return `<div class="diff-line added"><span class="ln"> </span><span class="ln">${ln2}</span><span class="mark">+</span><span class="text">${esc(d.val)}</span></div>`;
        }).join('') + '</div>';
      } else {
        const dels = currentDiff.filter(d=>d.type!=='add');
        const adds = currentDiff.filter(d=>d.type!=='del');
        const rows = Math.max(dels.length, adds.length);
        let html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">';
        html += '<div class="diff-output">';
        dels.forEach((d,i)=>{
          const cls = d.type==='del'?'removed':'unchanged';
          const mark = d.type==='del'?'-':' ';
          html += `<div class="diff-line ${cls}"><span class="mark">${mark}</span><span class="text">${esc(d.val)}</span></div>`;
        });
        html += '</div><div class="diff-output">';
        adds.forEach((d,i)=>{
          const cls = d.type==='add'?'added':'unchanged';
          const mark = d.type==='add'?'+':' ';
          html += `<div class="diff-line ${cls}"><span class="mark">${mark}</span><span class="text">${esc(d.val)}</span></div>`;
        });
        html += '</div></div>';
        out.innerHTML = html;
      }
    }

    function loadSample() {
      document.getElementById('textA').value = `function greet(name) {
  console.log("Hello, " + name);
  return name;
}

const user = "Alice";
greet(user);`;
      document.getElementById('textB').value = `function greet(name, greeting = "Hello") {
  console.log(greeting + ", " + name + "!");
  return name.toUpperCase();
}

const user = "Bob";
greet(user, "Hi");
console.log("Done");`;
      runDiff();
    }
  </script>
