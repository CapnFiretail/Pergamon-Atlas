  <div id="header-placeholder"></div>
  <div class="layout">

    <main class="main-content">
      <div class="tool-hero">
        <h2>Shuffle List</h2>
        <p>Randomize a list, pick random items, or sort alphabetically.</p>
      </div>
      <div class="card">
        <h3>Input List</h3>
        <div class="sep-row">
          <span>Separator:</span>
          <select id="sepSel" onchange="updateSepInput()">
            <option value="newline">New line</option>
            <option value="comma">Comma</option>
            <option value="semicolon">Semicolon</option>
            <option value="custom">Custom</option>
          </select>
          <input type="text" id="customSep" style="width:60px;display:none" placeholder="sep">
        </div>
        <label>Items (one per line by default)</label>
        <textarea id="inputList" placeholder="Alice&#10;Bob&#10;Charlie&#10;Diana&#10;Eve"></textarea>
        <div class="item-count" id="itemCount">0 items</div>
        <div class="btn-row">
          <button class="action-btn gold" onclick="shuffle()">Shuffle</button>
          <button class="action-btn outline" onclick="sortAZ()">Sort A→Z</button>
          <button class="action-btn outline" onclick="sortZA()">Sort Z→A</button>
          <button class="action-btn outline" onclick="removeDupes()">Remove Dupes</button>
          <button class="action-btn outline" onclick="reverseList()">Reverse</button>
          <button class="action-btn outline" onclick="copyOutput()">Copy Output</button>
        </div>
        <div id="outputArea" style="display:none">
          <label>Result</label>
          <div class="output-list" id="outputList"></div>
        </div>
      </div>
      <div class="card">
        <h3>Pick Random Item(s)</h3>
        <div class="pick-row">
          <span>Pick</span>
          <input type="number" id="pickCount" value="1" min="1">
          <span>item(s) at random</span>
          <button class="action-btn gold" onclick="pickRandom()">Pick</button>
        </div>
        <div class="pick-result" id="pickResult" style="display:none"></div>
      </div>
    </main>
  </div>

  <script>loadSnippets('Shuffle List');</script>
  <script>
  let lastResult=[];

  document.getElementById('inputList').addEventListener('input',updateCount);

  function updateCount(){
    const items=getItems();
    document.getElementById('itemCount').textContent=items.length+' item'+(items.length===1?'':'s');
  }

  function getSep(){
    const sel=document.getElementById('sepSel').value;
    if(sel==='newline')return '\n';
    if(sel==='comma')return ',';
    if(sel==='semicolon')return ';';
    return document.getElementById('customSep').value||'\n';
  }

  function updateSepInput(){
    document.getElementById('customSep').style.display=document.getElementById('sepSel').value==='custom'?'inline':'none';
    updateCount();
  }

  function getItems(){
    const sep=getSep();
    return document.getElementById('inputList').value.split(sep).map(s=>s.trim()).filter(s=>s!=='');
  }

  function fisherYates(arr){
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    return a;
  }

  function showResult(items){
    lastResult=items;
    const area=document.getElementById('outputArea');
    area.style.display='block';
    document.getElementById('outputList').innerHTML=items.map(item=>`<div class="output-item">${item}</div>`).join('');
  }

  function shuffle(){showResult(fisherYates(getItems()));}
  function sortAZ(){showResult([...getItems()].sort((a,b)=>a.localeCompare(b)));}
  function sortZA(){showResult([...getItems()].sort((a,b)=>b.localeCompare(a)));}
  function removeDupes(){const seen=new Set();showResult(getItems().filter(i=>{if(seen.has(i.toLowerCase()))return false;seen.add(i.toLowerCase());return true;}));}
  function reverseList(){showResult([...getItems()].reverse());}

  function copyOutput(){
    const sep=getSep();
    navigator.clipboard.writeText(lastResult.join(sep)).catch(()=>{});
  }

  function pickRandom(){
    const items=getItems();
    if(!items.length){document.getElementById('pickResult').style.display='none';return;}
    const n=Math.min(parseInt(document.getElementById('pickCount').value)||1,items.length);
    const picked=fisherYates(items).slice(0,n);
    const el=document.getElementById('pickResult');
    el.style.display='block';
    el.innerHTML=picked.map(p=>`<strong>${p}</strong>`).join('<br>');
  }

  updateCount();
  </script>
