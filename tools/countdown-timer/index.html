<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612" crossorigin="anonymous"></script>
  <title>Pergamon Atlas | Countdown Timer</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/styles/header.css">
  <link rel="stylesheet" href="/styles/sidebar.css">
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/footer.css">
  <style>
    .tool-hero{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);color:white;border:2px solid #8a611c;border-radius:16px;padding:28px;margin-bottom:24px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
    .tool-hero h2{margin:0 0 10px;font-size:clamp(28px,4vw,42px);color:#f0d39b}
    .tool-hero p{margin:0;font-size:17px;line-height:1.7;color:#f3f3f3}
    .panel{background:white;border:2px solid #000;border-radius:16px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:20px}
    .panel h3{margin:0 0 18px;font-size:22px}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
    .field label{font-size:14px;font-weight:700;color:#333}
    .field input{padding:12px;border:1.5px solid #ccc;border-radius:10px;font-size:16px;font-family:Georgia,serif;width:100%;box-sizing:border-box}
    .field input:focus{outline:none;border-color:#8a611c}
    .atlas-btn{border:none;border-radius:10px;padding:12px 26px;font-size:15px;font-family:Georgia,serif;cursor:pointer;background:#000;color:white;transition:.15s;margin-right:8px}
    .atlas-btn:hover{background:#222}
    .countdown-display{background:#111;color:#f0d39b;border-radius:16px;padding:36px 24px;text-align:center;margin-bottom:20px}
    .cd-title{font-size:18px;color:#aaa;margin-bottom:16px;font-family:Georgia,serif}
    .cd-units{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
    .cd-unit{text-align:center}
    .cd-num{font-size:clamp(40px,8vw,72px);font-weight:800;font-family:monospace;line-height:1;min-width:2ch;display:inline-block}
    .cd-label{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
    .cd-sep{font-size:clamp(32px,6vw,56px);font-weight:300;color:#555;align-self:flex-start;padding-top:4px}
    .cd-done{font-size:36px;font-weight:800;color:#f0d39b;padding:20px 0}
    .progress-bar{height:8px;background:#333;border-radius:999px;overflow:hidden;margin-top:20px}
    .progress-fill{height:100%;background:linear-gradient(90deg,#8a611c,#f0d39b);border-radius:999px;transition:.9s linear}
    .presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    .preset-btn{background:#f7f7f7;border:1.5px solid #ddd;border-radius:8px;padding:8px 14px;font-size:13px;font-family:Georgia,serif;cursor:pointer;transition:.15s}
    .preset-btn:hover{border-color:#8a611c;background:#fdf6e9}
    @media(max-width:600px){.cd-sep{display:none}}
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Countdown Timer</h2>
        <p>Count down to any date and time — birthdays, deadlines, events, launches.</p>
      </div>

      <div class="countdown-display">
        <div class="cd-title" id="cdTitle">Set an event below</div>
        <div class="cd-units" id="cdUnits">
          <div class="cd-unit"><div class="cd-num" id="cdDays">--</div><div class="cd-label">Days</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-num" id="cdHours">--</div><div class="cd-label">Hours</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-num" id="cdMins">--</div><div class="cd-label">Minutes</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-num" id="cdSecs">--</div><div class="cd-label">Seconds</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>

      <div class="panel">
        <h3>Set Countdown</h3>
        <div class="field">
          <label>Event Name</label>
          <input type="text" id="eventName" placeholder="e.g. New Year's Day, Birthday, Project Deadline" value="New Year's Day">
        </div>
        <div class="field">
          <label>Target Date &amp; Time</label>
          <input type="datetime-local" id="targetDate">
        </div>
        <button class="atlas-btn" onclick="startCountdown()">Start Countdown</button>
        <div style="margin-top:16px">
          <div style="font-size:13px;color:#888;margin-bottom:8px;font-weight:700">Quick Events:</div>
          <div class="presets" id="presets"></div>
        </div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/scripts/atlas.js"></script>
  <script>
    loadSnippets('Countdown Timer');

    let targetTime = null;
    let originTime = null;
    let ticker = null;
    let eventLabel = '';

    function buildPresets() {
      const now = new Date();
      const year = now.getFullYear();
      const presets = [
        {name:"New Year's", date: new Date(year+1,0,1)},
        {name:"Christmas", date: new Date(year,11,25)},
        {name:"Valentine's", date: new Date(year+(now.getMonth()>=1&&now.getDate()>14?1:0),1,14)},
        {name:"Halloween", date: new Date(year+(now.getMonth()>=9&&now.getDate()>31?1:0),9,31)},
        {name:"New Year's Eve", date: new Date(year,11,31)},
      ];
      document.getElementById('presets').innerHTML = presets.map(p =>
        `<button class="preset-btn" onclick="setPreset('${p.name}','${p.date.toISOString().slice(0,16)}')">${p.name}</button>`
      ).join('');
    }

    function setPreset(name, dateStr) {
      document.getElementById('eventName').value = name;
      document.getElementById('targetDate').value = dateStr;
      startCountdown();
    }

    function startCountdown() {
      const val = document.getElementById('targetDate').value;
      if (!val) { alert('Please select a target date.'); return; }
      targetTime = new Date(val).getTime();
      originTime = Date.now();
      eventLabel = document.getElementById('eventName').value || 'Event';
      if (ticker) clearInterval(ticker);
      tick();
      ticker = setInterval(tick, 1000);
    }

    function pad(n) { return String(Math.max(0,n)).padStart(2,'0'); }

    function tick() {
      const now = Date.now();
      const diff = targetTime - now;
      document.getElementById('cdTitle').textContent = eventLabel;

      if (diff <= 0) {
        clearInterval(ticker);
        document.getElementById('cdDays').textContent = '00';
        document.getElementById('cdHours').textContent = '00';
        document.getElementById('cdMins').textContent = '00';
        document.getElementById('cdSecs').textContent = '00';
        document.getElementById('progressFill').style.width = '100%';
        document.getElementById('cdTitle').textContent = eventLabel + ' — It\'s here!';
        return;
      }

      const totalSec = Math.floor(diff / 1000);
      const days = Math.floor(totalSec / 86400);
      const hours = Math.floor((totalSec % 86400) / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;

      document.getElementById('cdDays').textContent = days;
      document.getElementById('cdHours').textContent = pad(hours);
      document.getElementById('cdMins').textContent = pad(mins);
      document.getElementById('cdSecs').textContent = pad(secs);

      const totalDuration = targetTime - originTime;
      const elapsed = now - originTime;
      const pct = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));
      document.getElementById('progressFill').style.width = pct + '%';
    }

    // Set default to next New Year
    const now = new Date();
    const nextNY = new Date(now.getFullYear()+1, 0, 1);
    document.getElementById('targetDate').value = nextNY.toISOString().slice(0,16);
    buildPresets();
    startCountdown();
  </script>
</body>
</html>
