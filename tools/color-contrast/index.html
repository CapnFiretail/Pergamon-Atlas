  <div id="header-placeholder"></div>

      <div class="tool-hero">

      <div class="card">
        <h3>Pick Colors</h3>
        <div class="cc-row">
          <div class="cc-field">

              <input type="color" id="fgPicker" value="#111111" oninput="syncHex('fg',this.value)">
              <input type="text" id="fgHex" value="#111111" oninput="syncPicker('fg',this.value)" maxlength="7">
            </div>
          </div>
          <div class="cc-field">
            <label>Background</label>
            <div class="cc-color-pick">
              <input type="color" id="bgPicker" value="#ffffff" oninput="syncHex('bg',this.value)">
              <input type="text" id="bgHex" value="#ffffff" oninput="syncPicker('bg',this.value)" maxlength="7">
            </div>
          </div>
          <button class="calc-btn" onclick="check()">Check</button>
        </div>
      </div>
      <div class="card" id="results">

        <p style="color:#aaa;font-size:14px">Select colors above and click Check.</p>

  <script>loadSnippets('Tools');</script>
  <script>
  function syncHex(side,val){document.getElementById(side+'Hex').value=val;check();}
  function syncPicker(side,val){if(/^#[0-9a-fA-F]{6}$/.test(val)){document.getElementById(side+'Picker').value=val;check();}}

  function hexToRgb(hex){
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return[r,g,b];
  }

  function luminance([r,g,b]){
    const c=[r,g,b].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});
    return.2126*c[0]+.7152*c[1]+.0722*c[2];
  }

  function contrast(hex1,hex2){
    const l1=luminance(hexToRgb(hex1)),l2=luminance(hexToRgb(hex2));
    const hi=Math.max(l1,l2),lo=Math.min(l1,l2);
    return(hi+.05)/(lo+.05);
  }

  function badge(label,pass){return`<div class="badge ${pass?'pass':'fail'}">${pass?'Pass':'Fail'} · ${label}</div>`;}

  function check(){
    const fg=document.getElementById('fgHex').value;
    const bg=document.getElementById('bgHex').value;
    if(!/^#[0-9a-fA-F]{6}$/.test(fg)||!/^#[0-9a-fA-F]{6}$/.test(bg))return;
    const ratio=contrast(fg,bg);
    const r=ratio.toFixed(2);
    const aa_normal=ratio>=4.5,aa_large=ratio>=3,aaa_normal=ratio>=7,aaa_large=ratio>=4.5;
    document.getElementById('results').innerHTML=`
      <h3>Results</h3>
      <div class="preview-box" style="background:${bg};border-color:${bg==='#ffffff'?'#eee':bg}">
        <div class="preview-text" style="color:${fg}">Sample Text — The quick brown fox</div>
        <div class="preview-small" style="color:${fg}">Small text — body copy at 14px looks like this.</div>
      </div>
      <div class="ratio-display">${r}:1</div>
      <div class="badges">
        ${badge('AA Normal Text',aa_normal)}
        ${badge('AA Large Text',aa_large)}
        ${badge('AAA Normal Text',aaa_normal)}
        ${badge('AAA Large Text',aaa_large)}
      </div>
      <table class="cc-table">
        <tr><th>Level</th><th>Requirement</th><th>Result</th></tr>
        <tr><td>WCAG AA</td><td>4.5:1 normal, 3:1 large/bold</td><td>${aa_normal?'<span style="color:green">Pass</span>':'<span style="color:red">Fail</span>'}</td></tr>
        <tr><td>WCAG AAA</td><td>7:1 normal, 4.5:1 large/bold</td><td>${aaa_normal?'<span style="color:green">Pass</span>':'<span style="color:red">Fail</span>'}</td></tr>
      </table>`;
  }

  check();
  </script>
