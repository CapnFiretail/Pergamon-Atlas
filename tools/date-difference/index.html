  <script>
    loadSnippets('Date Difference');
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('endDate').value = today;

    function calculate() {
      const s = new Date(document.getElementById('startDate').value);
      const e = new Date(document.getElementById('endDate').value);
      if (isNaN(s)||isNaN(e)) return;
      const [start,end] = s<=e ? [s,e] : [e,s];
      const totalMs = end - start;
      const totalDays = Math.floor(totalMs / 86400000);
      const totalWeeks = Math.floor(totalDays / 7);
      const totalHours = totalDays * 24;
      const totalMins = totalHours * 60;
      const totalMonths = (end.getFullYear()-start.getFullYear())*12+(end.getMonth()-start.getMonth());
      const totalYears = Math.floor(totalMonths/12);

      let years = end.getFullYear()-start.getFullYear();
      let months = end.getMonth()-start.getMonth();
      let days = end.getDate()-start.getDate();
      if (days < 0){months--;const prev=new Date(end.getFullYear(),end.getMonth(),0);days+=prev.getDate();}
      if (months < 0){years--;months+=12;}

      document.getElementById('rYears').textContent = totalYears.toLocaleString();
      document.getElementById('rMonths').textContent = totalMonths.toLocaleString();
      document.getElementById('rWeeks').textContent = totalWeeks.toLocaleString();
      document.getElementById('rDays').textContent = totalDays.toLocaleString();
      document.getElementById('rHours').textContent = totalHours.toLocaleString();
      document.getElementById('rMins').textContent = totalMins.toLocaleString();
      document.getElementById('bdY').textContent = years + ' year' + (years!==1?'s':'');
      document.getElementById('bdM').textContent = months + ' month' + (months!==1?'s':'');
      document.getElementById('bdD').textContent = days + ' day' + (days!==1?'s':'');
      document.getElementById('resultsSection').style.display = 'block';
    }
  </script>
