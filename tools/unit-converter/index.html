    .tool-hero{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);color:white;border:2px solid #8a611c;border-radius:16px;padding:28px;margin-bottom:24px;box-shadow:0 6px 18px rgba(0,0,0,.18)}

<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Unit Converter</h2>
        <p>Convert between units of length, weight, temperature, volume, speed, and more.</p>
      </div>
      <div class="panel">
        <div class="cat-tabs" id="catTabs"></div>
        <div class="converter-row">
          <div class="field">
            <label>From</label>
            <input type="number" id="fromVal" placeholder="Enter value" oninput="convert('from')">
            <select id="fromUnit" onchange="convert('from')"></select>
          </div>
          <button class="swap-btn" onclick="swap()">⇄</button>
          <div class="field">
            <label>To</label>
            <input type="number" id="toVal" placeholder="Result" oninput="convert('to')">
            <select id="toUnit" onchange="convert('from')"></select>
          </div>
        </div>
        <div class="result-display" id="resultDisplay">
          <div class="big" id="resultBig">—</div>
          <div class="label" id="resultLabel">Enter a value above</div>
        </div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/operation/scripts/atlas.js"></script>
  <script>
    loadSnippets('Tools');

    const categories = {
      Length: {
        units: ['Meters','Kilometers','Centimeters','Millimeters','Inches','Feet','Yards','Miles','Nautical Miles'],
        base: 'Meters',
        toBase: {Meters:1,Kilometers:1000,Centimeters:.01,Millimeters:.001,Inches:.0254,Feet:.3048,Yards:.9144,Miles:1609.344,'Nautical Miles':1852}
      },
      Weight: {
        units: ['Kilograms','Grams','Milligrams','Pounds','Ounces','Tons','Stone'],
        base: 'Kilograms',
        toBase: {Kilograms:1,Grams:.001,Milligrams:.000001,Pounds:.453592,Ounces:.0283495,Tons:1000,Stone:6.35029}
      },
      Temperature: {
        units: ['Celsius','Fahrenheit','Kelvin'],
        base: 'Celsius',
        toBase: null // handled specially
      },
      Volume: {
        units: ['Liters','Milliliters','Gallons (US)','Quarts','Pints','Cups','Fluid Ounces','Cubic Meters'],
        base: 'Liters',
        toBase: {Liters:1,Milliliters:.001,'Gallons (US)':3.78541,Quarts:.946353,Pints:.473176,Cups:.236588,'Fluid Ounces':.0295735,'Cubic Meters':1000}
      },
      Speed: {
        units: ['m/s','km/h','mph','Knots','ft/s'],
        base: 'm/s',
        toBase: {'m/s':1,'km/h':0.27778,'mph':0.44704,'Knots':0.514444,'ft/s':0.3048}
      },
      Area: {
        units: ['Square Meters','Square Kilometers','Square Miles','Square Feet','Square Inches','Acres','Hectares'],
        base: 'Square Meters',
        toBase: {'Square Meters':1,'Square Kilometers':1e6,'Square Miles':2589988,'Square Feet':0.092903,'Square Inches':0.00064516,'Acres':4046.86,'Hectares':10000}
      },
      Time: {
        units: ['Seconds','Minutes','Hours','Days','Weeks','Months','Years'],
        base: 'Seconds',
        toBase: {Seconds:1,Minutes:60,Hours:3600,Days:86400,Weeks:604800,Months:2629800,Years:31557600}
      },
      Data: {
        units: ['Bytes','Kilobytes','Megabytes','Gigabytes','Terabytes','Bits','Kilobits','Megabits'],
        base: 'Bytes',
        toBase: {Bytes:1,Kilobytes:1024,Megabytes:1048576,Gigabytes:1073741824,Terabytes:1099511627776,Bits:.125,Kilobits:128,Megabits:131072}
      }
    };

    let currentCat = 'Length';

    function buildTabs() {
      const tabs = document.getElementById('catTabs');
      Object.keys(categories).forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-tab' + (cat === currentCat ? ' active' : '');
        btn.textContent = cat;
        btn.onclick = () => selectCat(cat);
        tabs.appendChild(btn);
      });
    }

    function selectCat(cat) {
      currentCat = cat;
      document.querySelectorAll('.cat-tab').forEach((b,i) => {
        b.classList.toggle('active', Object.keys(categories)[i] === cat);
      });
      buildUnitSelects();
      convert('from');
    }

    function buildUnitSelects() {
      const cat = categories[currentCat];
      ['fromUnit','toUnit'].forEach((id, i) => {
        const sel = document.getElementById(id);
        sel.innerHTML = '';
        cat.units.forEach((u, idx) => {
          const opt = document.createElement('option');
          opt.value = u; opt.textContent = u;
          if (id === 'toUnit' && idx === 1) opt.selected = true;
          sel.appendChild(opt);
        });
      });
    }

    function toC(val, unit) {
      if (unit === 'Celsius') return val;
      if (unit === 'Fahrenheit') return (val - 32) * 5/9;
      return val - 273.15;
    }
    function fromC(val, unit) {
      if (unit === 'Celsius') return val;
      if (unit === 'Fahrenheit') return val * 9/5 + 32;
      return val + 273.15;
    }

    function convert(dir) {
      const cat = categories[currentCat];
      if (dir === 'from') {
        const val = parseFloat(document.getElementById('fromVal').value);
        const from = document.getElementById('fromUnit').value;
        const to = document.getElementById('toUnit').value;
        if (isNaN(val)) { document.getElementById('toVal').value = ''; setResult('—','Enter a value'); return; }
        let result;
        if (currentCat === 'Temperature') {
          result = fromC(toC(val, from), to);
        } else {
          result = (val * cat.toBase[from]) / cat.toBase[to];
        }
        const pretty = parseFloat(result.toPrecision(8));
        document.getElementById('toVal').value = pretty;
        setResult(pretty + ' ' + to, val + ' ' + from + ' = ' + pretty + ' ' + to);
      } else {
        const val = parseFloat(document.getElementById('toVal').value);
        const from = document.getElementById('fromUnit').value;
        const to = document.getElementById('toUnit').value;
        if (isNaN(val)) return;
        let result;
        if (currentCat === 'Temperature') {
          result = fromC(toC(val, to), from);
        } else {
          result = (val * cat.toBase[to]) / cat.toBase[from];
        }
        document.getElementById('fromVal').value = parseFloat(result.toPrecision(8));
        setResult(val + ' ' + to, val + ' ' + to + ' = ' + parseFloat(result.toPrecision(8)) + ' ' + from);
      }
    }

    function setResult(big, label) {
      document.getElementById('resultBig').textContent = big;
      document.getElementById('resultLabel').textContent = label;
    }

    function swap() {
      const fv = document.getElementById('fromVal').value;
      const tv = document.getElementById('toVal').value;
      const fu = document.getElementById('fromUnit').value;
      const tu = document.getElementById('toUnit').value;
      document.getElementById('fromUnit').value = tu;
      document.getElementById('toUnit').value = fu;
      document.getElementById('fromVal').value = tv;
      document.getElementById('toVal').value = fv;
      convert('from');
    }

    buildTabs();
    buildUnitSelects();
  </script>

<script src="/data/pergamon-address.js"></script>

</body>
