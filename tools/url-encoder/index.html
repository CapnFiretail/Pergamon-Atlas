<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612" crossorigin="anonymous"></script>
  <title>Pergamon Atlas | URL Encoder / Decoder</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/styles/header.css">
  <link rel="stylesheet" href="/styles/sidebar.css">
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/footer.css">
  <style>
    .tool-hero{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);color:white;border:2px solid #8a611c;border-radius:16px;padding:28px;margin-bottom:24px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
    .tool-hero h2{margin:0 0 10px;font-size:clamp(28px,4vw,42px);color:#f0d39b}
    .tool-hero p{margin:0;font-size:17px;line-height:1.7;color:#f3f3f3}
    .panel{background:white;border:2px solid #000;border-radius:16px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:20px}
    .panel h3{margin:0 0 14px;font-size:22px}
    .ta-wrap{position:relative;margin-bottom:12px}
    textarea{width:100%;height:120px;padding:14px;border:1.5px solid #ccc;border-radius:10px;font-size:15px;font-family:monospace;resize:vertical;box-sizing:border-box;line-height:1.5}
    textarea:focus{outline:none;border-color:#8a611c}
    .copy-btn{position:absolute;top:10px;right:10px;background:#111;color:white;border:none;border-radius:7px;padding:6px 12px;font-size:13px;font-family:Georgia,serif;cursor:pointer}
    .copy-btn:hover{background:#333}
    .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    .atlas-btn{border:none;border-radius:10px;padding:11px 20px;font-size:15px;font-family:Georgia,serif;cursor:pointer;transition:.15s}
    .atlas-btn.primary{background:#000;color:white}
    .atlas-btn.primary:hover{background:#222}
    .atlas-btn.secondary{background:white;color:#111;border:1.5px solid #ccc}
    .atlas-btn.secondary:hover{background:#f5f5f5}
    .mode-tabs{display:flex;gap:0;border:2px solid #000;border-radius:12px;overflow:hidden;margin-bottom:18px;width:fit-content}
    .mode-tab{padding:10px 20px;font-size:15px;font-family:Georgia,serif;cursor:pointer;background:white;border:none;transition:.15s;font-weight:700}
    .mode-tab.active{background:#111;color:white}
    .parse-table{width:100%;border-collapse:collapse;font-size:14px}
    .parse-table th{background:#111;color:#f0d39b;padding:9px 12px;text-align:left;font-size:13px}
    .parse-table td{padding:8px 12px;border-bottom:1px solid #eee;font-family:monospace;word-break:break-all}
    .parse-table tr:last-child td{border-bottom:none}
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>URL Encoder / Decoder</h2>
        <p>Encode or decode URLs and query strings. Also parses query parameters.</p>
      </div>
      <div class="panel">
        <div class="mode-tabs">
          <button class="mode-tab active" id="tabEncode" onclick="setMode('encode')">Encode</button>
          <button class="mode-tab" id="tabDecode" onclick="setMode('decode')">Decode</button>
          <button class="mode-tab" id="tabParse" onclick="setMode('parse')">Parse URL</button>
        </div>

        <div id="sectionEncode">
          <h3>Encode URL</h3>
          <div class="ta-wrap">
            <textarea id="encodeInput" placeholder="https://example.com/path?name=hello world&type=some/thing" oninput="encode()"></textarea>
          </div>
          <div class="btn-row">
            <button class="atlas-btn secondary" onclick="document.getElementById('encodeInput').value='';encode()">Clear</button>
          </div>
          <h3>Result</h3>
          <div class="ta-wrap">
            <textarea id="encodeOutput" readonly></textarea>
            <button class="copy-btn" onclick="copyEl('encodeOutput')">Copy</button>
          </div>
        </div>

        <div id="sectionDecode" style="display:none">
          <h3>Decode URL</h3>
          <div class="ta-wrap">
            <textarea id="decodeInput" placeholder="https%3A%2F%2Fexample.com%2Fpath%3Fname%3Dhello%20world" oninput="decode()"></textarea>
          </div>
          <div class="btn-row">
            <button class="atlas-btn secondary" onclick="document.getElementById('decodeInput').value='';decode()">Clear</button>
          </div>
          <h3>Result</h3>
          <div class="ta-wrap">
            <textarea id="decodeOutput" readonly></textarea>
            <button class="copy-btn" onclick="copyEl('decodeOutput')">Copy</button>
          </div>
        </div>

        <div id="sectionParse" style="display:none">
          <h3>Parse URL</h3>
          <div class="ta-wrap">
            <textarea id="parseInput" placeholder="https://example.com/path/to/page?name=atlas&type=tool&active=true#section1" style="height:80px" oninput="parseURL()"></textarea>
          </div>
          <div id="parseResult" style="margin-top:14px"></div>
        </div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/scripts/atlas.js"></script>
  <script>
    loadSnippets('URL Encoder');

    let mode = 'encode';
    function setMode(m) {
      mode = m;
      ['encode','decode','parse'].forEach(s=>{
        document.getElementById('section'+s[0].toUpperCase()+s.slice(1)).style.display = s===m?'block':'none';
        document.getElementById('tab'+s[0].toUpperCase()+s.slice(1)).classList.toggle('active', s===m);
      });
    }

    function encode() {
      try {
        const inp = document.getElementById('encodeInput').value;
        document.getElementById('encodeOutput').value = encodeURIComponent(inp);
      } catch(e) { document.getElementById('encodeOutput').value = 'Error'; }
    }

    function decode() {
      try {
        const inp = document.getElementById('decodeInput').value;
        document.getElementById('decodeOutput').value = decodeURIComponent(inp.replace(/\+/g,' '));
      } catch(e) { document.getElementById('decodeOutput').value = 'Invalid URL encoding'; }
    }

    function parseURL() {
      const inp = document.getElementById('parseInput').value.trim();
      if (!inp) { document.getElementById('parseResult').innerHTML=''; return; }
      try {
        const url = new URL(inp);
        const params = [...url.searchParams.entries()];
        let html = `<table class="parse-table"><thead><tr><th>Part</th><th>Value</th></tr></thead><tbody>
          <tr><td>Protocol</td><td>${url.protocol}</td></tr>
          <tr><td>Host</td><td>${url.host}</td></tr>
          <tr><td>Pathname</td><td>${url.pathname}</td></tr>
          <tr><td>Hash</td><td>${url.hash||'—'}</td></tr>
        </tbody></table>`;
        if (params.length) {
          html += `<h4 style="margin:14px 0 8px;font-size:16px">Query Parameters</h4>
          <table class="parse-table"><thead><tr><th>Key</th><th>Value</th></tr></thead><tbody>
          ${params.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}
          </tbody></table>`;
        }
        document.getElementById('parseResult').innerHTML = html;
      } catch(e) { document.getElementById('parseResult').innerHTML = '<span style="color:#c00">Invalid URL</span>'; }
    }

    function copyEl(id) {
      navigator.clipboard.writeText(document.getElementById(id).value);
    }
  </script>
</body>
</html>
