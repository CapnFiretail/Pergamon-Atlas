<!DOCTYPE html>
<html lang="en">
<head>
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612"
    crossorigin="anonymous"></script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pergamon Atlas | Tools</title>

  <style>
    /* =========================
       GLOBAL PAGE STYLES
    ========================= */
    body {
      margin: 0;
      font-family: Georgia, serif;
      background-color: #e9e9e9;
    }

    /* =========================
       TOP HEADER / TOPBAR
    ========================= */
    .topbar {
      background-color: #000;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo-box {
      width: 128px;
      height: 100px;
      background-color: #222;
      border: 2px solid black;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand h1 {
      margin: 0;
      font-size: 48px;
      font-weight: bold;
    }

    .suggest-btn {
      background-color: white;
      color: black;
      border: none;
      padding: 12px 20px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
    }

    .suggest-btn:hover {
      background-color: #ddd;
    }

    /* =========================
       MAIN PAGE LAYOUT
    ========================= */
    .layout {
      display: flex;
      min-height: calc(100vh - 140px);
    }

    /* =========================
       SIDEBAR
    ========================= */
    .sidebar {
      width: 220px;
      background-color: #111;
      padding-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .sidebar a {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 16px 24px;
      color: white;
      text-decoration: none;
      font-size: 24px;
    }

    .sidebar a:hover {
      background-color: #222;
    }

    /* =========================
       SIDEBAR AD BOX
    ========================= */
    .ad-box {
      width: 90%;
      margin: 25px auto;
      padding: 20px;
      background: #ffffff;
      border-radius: 10px;
      border: 2px dashed #999;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 120px;
      box-sizing: border-box;
    }

    .ad-box ins {
      display: block;
      width: 100%;
      max-width: 100%;
      background-color: #ffffff;
    }

    /* =========================
       MAIN CONTENT AREA
    ========================= */
    .main-content {
      flex: 1;
      padding: 30px;
      background-color: #e9e9e9;
    }

    .section-box {
      background-color: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      margin-bottom: 25px;
    }

    .section-box h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 30px;
    }

    /* =========================
       TOOL GRID
    ========================= */
    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .tool-card {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100px;
      background-color: white;
      color: black;
      text-decoration: none;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      padding: 15px;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .tool-card:hover {
      background-color: #f5f5f5;
      transform: translateY(-2px);
    }

    /* =========================
       IN-CONTENT AD AREA
    ========================= */
    .content-ad-box {
      background: #ffffff;
      border: 2px dashed #999;
      border-radius: 12px;
      padding: 20px;
      min-height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 25px 0;
      box-sizing: border-box;
    }

    .content-ad-box ins {
      display: block;
      width: 100%;
    }

    /* =========================
       MOBILE
    ========================= */
    @media (max-width: 900px) {
      .layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        padding-top: 0;
      }

      .sidebar a {
        text-align: center;
      }

      .brand h1 {
        font-size: 34px;
      }
    }
  </style>
</head>
<body>

  <!-- =========================
       TOP HEADER
  ========================== -->
  <div class="topbar">
    <div class="brand">
      <div class="logo-box">
        <img src="/images/logo.png" alt="Pergamon Atlas Logo">
      </div>
      <h1>Pergamon Atlas | Tools</h1>
    </div>

    <button class="suggest-btn">Suggest a Tool</button>
  </div>

  <!-- =========================
       PAGE LAYOUT
  ========================== -->
  <div class="layout">

    <!-- Sidebar -->
    <div class="sidebar">
      <a href="/">Home</a>
      <a href="/tools">Tools</a>
      <a href="/games">Games</a>
      <a href="/help">Help</a>

      <div class="ad-box">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-4717716734064612"
             data-ad-slot="8448245585"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">

      <div class="section-box">
        <h2>Calculators</h2>
        <div class="tool-grid">
          <a href="/tools/gpa-calculator" class="tool-card">GPA Calculator</a>
          <a href="/tools/bmi-calculator" class="tool-card">BMI Calculator</a>
          <a href="/tools/tip-calculator" class="tool-card">Tip Calculator</a>
          <a href="/tools/compound-interest-calculator" class="tool-card">Compound Interest Calculator</a>
          <a href="/tools/percentage-calculator" class="tool-card">Percentage Calculator</a>
        </div>
      </div>

      <div class="content-ad-box">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-4717716734064612"
             data-ad-slot="8448245585"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
      </div>

      <div class="section-box">
        <h2>Generators</h2>
        <div class="tool-grid">
          <a href="/tools/password-generator" class="tool-card">Password Generator</a>
          <a href="/tools/random-number-generator" class="tool-card">Random Number Generator</a>
          <a href="/tools/name-generator" class="tool-card">Name Generator</a>
        </div>
      </div>

      <div class="section-box">
        <h2>Other Tools</h2>
        <div class="tool-grid">
          <a href="/tools/unit-converter" class="tool-card">Unit Converter</a>
          <a href="/tools/coin-flip" class="tool-card">Coin Flip</a>
          <a href="/tools/dice-roller" class="tool-card">Dice Roller</a>
          <a href="/tools/gear-ratio-calculator" class="tool-card">Gear Ratios</a>
        </div>
      </div>

    </div>
  </div>

  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});
    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>

</body>
</html>
