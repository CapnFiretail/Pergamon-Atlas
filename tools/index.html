<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612" crossorigin="anonymous"></script>
  <title>Pergamon Atlas | Tools</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/operation/styles/header.css">
  <link rel="stylesheet" href="/operation/styles/sidebar.css">
  <link rel="stylesheet" href="/operation/styles/main.css">
  <link rel="stylesheet" href="/operation/styles/footer.css">
  <style>

    .main-content { background-color: #e8e2d5; }

    /* ── Chapter breaks ──────────────────────────────────────── */

    .tc-chapter {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 38px 0 11px;
    }
    .tc-chapter:first-child { margin-top: 0; }
    .tc-chapter::before,
    .tc-chapter::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(120,80,10,0.2);
    }
    .tc-chapter-label {
      font-family: Georgia, serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(120,80,10,0.55);
      white-space: nowrap;
    }

    /* ── List container ──────────────────────────────────────── */

    #tc-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
      margin-bottom: 60px;
    }
    .tc-chapter { grid-column: 1 / -1; }

    /* ── Card ────────────────────────────────────────────────── */

    .tc-card {
      display: block;
      background: #131008;
      border: 1px solid rgba(184,136,26,0.55);
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 14px rgba(0,0,0,0.28);
      transition: border-color 0.18s, background 0.18s, box-shadow 0.18s;
    }

    /* Left gold accent bar — always visible */
    .tc-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: rgba(184,136,26,0.48);
      border-radius: 10px 0 0 10px;
      z-index: 1;
    }

    .tc-card:hover {
      border-color: rgba(184,136,26,0.82);
      background: #191410;
      box-shadow: 0 4px 22px rgba(0,0,0,0.36);
    }
    .tc-card:hover::before { background: rgba(184,136,26,0.72); }

    /* ── Head ────────────────────────────────────────────────── */

    .tc-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 18px 12px 20px;
      position: relative;
      z-index: 2;
    }

    .tc-icon-wrap {
      width: 42px;
      height: 42px;
      background: #070504;
      border: 1px solid rgba(184,136,26,0.13);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      line-height: 1;
      flex-shrink: 0;
    }

    .tc-title { flex: 1; min-width: 0; }

    .tc-name {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tc-code {
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      color: #e2ad35;
      letter-spacing: 0.07em;
      margin-top: 3px;
      white-space: nowrap;
    }

    /* ── Seal group (address + button) ──────────────────────── */

    .tc-seal-group {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
    }

    .tc-seal-addr {
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      color: #e2ad35;
      letter-spacing: 0.07em;
      white-space: nowrap;
    }

    /* ── Seal button ─────────────────────────────────────────── */

    .tc-seal {
      width: 32px;
      height: 32px;
      background: rgba(184,136,26,0.07);
      border: 1px solid rgba(184,136,26,0.28);
      border-radius: 6px;
      color: #e2ad35;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      z-index: 3;
    }
    .tc-seal svg { pointer-events: none; }
    .tc-seal:hover {
      background: rgba(184,136,26,0.16);
      border-color: rgba(184,136,26,0.55);
      color: #e2ad35;
    }

    /* ── Divider ─────────────────────────────────────────────── */

    .tc-rule {
      height: 1px;
      background: rgba(184,136,26,0.09);
      margin: 0 20px;
      position: relative;
      z-index: 2;
    }

    /* ── Foot ────────────────────────────────────────────────── */

    .tc-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 11px 18px 14px 20px;
      position: relative;
      z-index: 2;
    }

    .tc-left { flex: 1; min-width: 0; }

    .tc-desc {
      font-size: 13px;
      color: rgba(237,233,224,0.75);
      line-height: 1.58;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .tc-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 6px;
      font-size: 10.5px;
      color: #e2ad35;
      letter-spacing: 0.04em;
    }

    /* ── Open Artifact button ────────────────────────────────── */

    .tc-action {
      font-family: Georgia, serif;
      font-size: 11.5px;
      color: #e2ad35;
      border: 1px solid rgba(184,136,26,0.5);
      border-radius: 5px;
      padding: 6px 14px;
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: 0.06em;
      background: rgba(184,136,26,0.07);
      transition: border-color 0.18s, background 0.18s, box-shadow 0.18s;
    }
    .tc-card:hover .tc-action {
      border-color: rgba(184,136,26,0.78);
      background: rgba(184,136,26,0.12);
      box-shadow: 0 0 18px rgba(184,136,26,0.14);
    }

    /* ── Mobile ──────────────────────────────────────────────── */

    @media (max-width: 900px) {
      #tc-list { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .tc-head { padding: 12px 14px 10px 14px; gap: 10px; }
      .tc-foot { padding: 9px 14px 12px 14px; flex-wrap: wrap; gap: 10px; }
      .tc-rule { margin: 0 14px; }
      .tc-icon-wrap { width: 36px; height: 36px; font-size: 16px; }
      .tc-name { font-size: 15px; }
      .tc-action { font-size: 11px; padding: 5px 11px; }
      .tc-seal-tip { display: none; }
      .tc-chapter { margin: 28px 0 8px; }
      .tc-chapter-label { font-size: 10px; }
    }

  </style>
</head>
<body>

<div id="header-placeholder"></div>
<div class="layout">
<div id="sidebar-placeholder"></div>

<main class="main-content">

  <section class="game-hero catalog-hero">
    <span class="game-hero-corner tl"></span>
    <span class="game-hero-corner tr"></span>
    <span class="game-hero-corner bl"></span>
    <span class="game-hero-corner br"></span>
    <div class="game-hero-emblem">
      <img src="/operation/images/tool-icon.png" alt="">
    </div>
    <div class="game-hero-sep">&#10022;</div>
    <div class="game-hero-title">
      <h2>Tools</h2>
      <div class="game-hero-sub">
        <span class="game-hero-sub-line"></span>
        <span>Pergamon Catalogs</span>
        <span class="game-hero-sub-line"></span>
      </div>
    </div>
    <div class="catalog-count">
      <span class="catalog-count-inner"></span>
      <span class="catalog-count-num">56</span>
      <span class="catalog-count-label">Tools</span>
    </div>
  </section>

  <div id="tc-list"></div>

</main>
</div>

<div id="footer-placeholder"></div>

<script src="/data/pergamon-address.js"></script>
<script src="/data/entries.js"></script>
<script src="/data/atlas-reference.js"></script>
<script src="/operation/scripts/atlas.js"></script>
<script>
  loadSnippets('Tools');

  (function () {

    /* ── Archive seal SVG ──────────────────────────────────── */
    var SEAL = '<svg width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg"><polygon points="6.5,0.5 12.5,3.7 12.5,9.3 6.5,12.5 0.5,9.3 0.5,3.7" stroke="currentColor" stroke-width="1.1" fill="none"/><circle cx="6.5" cy="6.5" r="1.8" fill="currentColor"/></svg>';

    /* ── Chamber labels ────────────────────────────────────── */
    var CHAMBERS = { TL: 'Tools Wing', GM: 'Games Wing', PG: 'Archive' };

    /* ── Date formatter ────────────────────────────────────── */
    var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function fmtDate(d) {
      if (!d) return '';
      var parts = d.split('-');
      return MONTHS[parseInt(parts[1], 10) - 1] + ' ' + parseInt(parts[2], 10) + ', ' + parts[0];
    }

    /* ── Catalog definition ────────────────────────────────── */
    var CATALOG = [
      { ch: 'Calculators', items: [
        ['/tools/gpa-calculator',               '📘', 'Calculate grade point average across courses and credit hours.'],
        ['/tools/grade-calculator',             '📊', 'Convert percentage scores to letter grades and GPA point values.'],
        ['/tools/bmi-calculator',               '📏', 'Compute body mass index from height and weight in any unit system.'],
        ['/tools/calorie-calculator',           '🔥', 'Estimate daily caloric needs by age, weight, height, and activity level.'],
        ['/tools/compound-interest-calculator', '📈', 'Project investment growth with compounding returns over any time horizon.'],
        ['/tools/loan-calculator',              '🏦', 'Calculate monthly payments, total interest, and loan amortization.'],
        ['/tools/mortgage-calculator',          '🏠', 'Estimate monthly mortgage payments and total home loan cost over term.'],
        ['/tools/percentage-calculator',        '🔢', 'Solve percentage increases, decreases, and proportional ratios.'],
        ['/tools/tip-calculator',               '💵', 'Calculate gratuity and split restaurant bills by party size.'],
        ['/tools/speed-calculator',             '🚀', 'Compute speed, distance, or elapsed time given any two known values.'],
        ['/tools/scientific-calculator',        '🔬', 'Perform advanced mathematical operations and trigonometric functions.'],
        ['/tools/age-calculator',               '🎂', 'Calculate exact age and elapsed time between any two dates.'],
        ['/tools/aspect-ratio',                 '📐', 'Compute and convert image aspect ratios and pixel dimensions.'],
      ]},
      { ch: 'Finance', items: [
        ['/tools/bill-splitter',                '🧾', 'Divide shared expenses evenly among any number of contributors.'],
        ['/tools/budget-planner',               '💼', 'Plan monthly budgets and map income against projected expenses.'],
        ['/tools/salary-converter',             '💰', 'Convert salary between hourly, weekly, monthly, and annual rates.'],
        ['/tools/savings-goal',                 '🏆', 'Calculate how long to reach a savings target at a given deposit rate.'],
      ]},
      { ch: 'Cipher & Script', items: [
        ['/tools/base64',                       '🔐', 'Encode and decode text to Base64 format for safe data transmission.'],
        ['/tools/json-formatter',               '🗂️', 'Prettify, validate, and minify JSON data structures.'],
        ['/tools/regex-tester',                 '🔍', 'Test regular expressions against sample input text in real time.'],
        ['/tools/text-diff',                    '⚖️', 'Compare two text blocks and highlight their differences line by line.'],
        ['/tools/url-encoder',                  '🌐', 'Encode and decode URL components for safe web transmission.'],
        ['/tools/caesar-cipher',                '🔒', 'Encrypt and decrypt messages using the classical Caesar shift cipher.'],
        ['/tools/character-counter',            '📝', 'Count characters, words, sentences, and estimated reading time.'],
        ['/tools/password-strength',            '🛡️', 'Analyze password security and estimate resistance to brute-force attack.'],
        ['/tools/epoch-converter',              '🕰️', 'Convert Unix timestamps to human-readable dates and back.'],
        ['/tools/binary-translator',            '💻', 'Translate text to binary notation and decode binary back to text.'],
        ['/tools/number-base-converter',        '#️⃣', 'Convert numbers between binary, octal, decimal, and hexadecimal bases.'],
        ['/tools/markdown-previewer',           '📄', 'Render Markdown syntax to formatted HTML with a live preview pane.'],
        ['/tools/case-converter',               '🔡', 'Convert text between camelCase, snake_case, UPPER, Title Case, and more.'],
        ['/tools/word-counter',                 '📖', 'Count words, characters, and sentences across any block of text.'],
      ]},
      { ch: 'Color Studio', items: [
        ['/tools/color-contrast',               '🎨', 'Check foreground and background color accessibility ratios against WCAG.'],
        ['/tools/color-palette',                '🖌️', 'Generate harmonious color palettes from any seed color.'],
        ['/tools/color-picker',                 '💠', 'Pick, convert, and copy colors across hex, RGB, and HSL formats.'],
        ['/tools/gradient-generator',           '🌈', 'Build and preview CSS gradient strings with full color control.'],
      ]},
      { ch: 'Synthesis', items: [
        ['/tools/password-generator',           '🔑', 'Generate cryptographically strong passwords with custom length and rules.'],
        ['/tools/qr-code-generator',            '📷', 'Create QR codes from any URL, text, or arbitrary data string.'],
        ['/tools/lorem-ipsum',                  '📜', 'Generate placeholder text in various lengths and paragraph formats.'],
        ['/tools/name-generator',               '🎭', 'Generate random names by nationality, historical era, or archetype.'],
        ['/tools/quote-generator',              '💬', 'Surface curated quotations from philosophers, writers, and thinkers.'],
      ]},
      { ch: 'Operations', items: [
        ['/tools/pomodoro-timer',               '🍅', 'Run structured 25-minute focus intervals using the Pomodoro technique.'],
        ['/tools/countdown-timer',              '⏳', 'Set precise countdowns for deadlines, events, and timed sessions.'],
        ['/tools/stopwatch',                    '⌚', 'Track elapsed time with millisecond precision and lap recording.'],
        ['/tools/flashcards',                   '📚', 'Create and study custom flashcard decks with active recall practice.'],
        ['/tools/timezone-converter',           '🌍', 'Compare current times across multiple world time zones simultaneously.'],
        ['/tools/metronome',                    '🎵', 'Maintain steady tempo with an adjustable beats-per-minute metronome.'],
        ['/tools/date-difference',              '📅', 'Calculate exact days, months, and years between any two dates.'],
        ['/tools/reading-time',                 '⏱️', 'Estimate reading duration for any block of text at a given pace.'],
        ['/tools/unit-converter',               '⚖️', 'Convert measurements across length, mass, volume, temperature, and more.'],
        ['/tools/times-tables',                 '✖️', 'Practice and visualize multiplication tables with an interactive grid.'],
        ['/tools/roman-numerals',               'Ⅻ', 'Convert between Arabic and Roman numeral notation in both directions.'],
      ]},
      { ch: 'Curiosities', items: [
        ['/tools/random-number',                '🎲', 'Generate random integers or decimals within any specified range.'],
        ['/tools/dice-roller',                  '🎯', 'Roll any combination of standard polyhedral dice for tabletop games.'],
        ['/tools/decision-spinner',             '🎡', 'Spin a probability wheel to resolve decisions and dilemmas by chance.'],
        ['/tools/shuffle-list',                 '🔀', 'Randomize the order of any list of items, names, or entries.'],
      ]},
      { ch: 'Atlas Navigation', items: [
        ['/tools/atlas-decoder',                '🗺️', 'Decode Atlas addresses to locate and identify artifacts in coordinate space.'],
      ]},
    ];

    /* ── Build atlas address lookup ────────────────────────── */
    var atlasTools = (window.atlasEntries && window.atlasEntries.tools) || [];
    var byPath = {};
    atlasTools.forEach(function(t) { byPath[t.path] = t; });

    function esc(s) {
      return String(s)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }

    /* ── Render ────────────────────────────────────────────── */
    var html = '';

    CATALOG.forEach(function(section) {
      html += '<div class="tc-chapter"><span class="tc-chapter-label">' + esc(section.ch) + '</span></div>';

      section.items.forEach(function(item) {
        var path  = item[0];
        var icon  = item[1];
        var desc  = item[2];
        var entry = byPath[path] || {};

        var fullAddr = entry.address ? 'ATLAS-' + entry.address : '';
        var artCode  = (entry.code_seed && entry.seed)
          ? (((entry.code_seed ^ entry.seed) >>> 0).toString(16).toUpperCase().padStart(8,'0') + '-' + (entry.address || '').split('-')[0])
          : '';
        var dated    = fmtDate(entry.date);
        var name     = entry.name || path.split('/').pop().replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});

        html +=
          '<a href="' + path + '/" class="tc-card">' +
            '<div class="tc-head">' +
              '<div class="tc-icon-wrap">' + icon + '</div>' +
              '<div class="tc-title">' +
                '<div class="tc-name">' + esc(name) + '</div>' +
                '<div class="tc-code">' + esc(artCode) + '</div>' +
              '</div>' +
              '<div class="tc-seal-group">' +
                '<span class="tc-seal-addr">' + esc(fullAddr) + '</span>' +
                '<button class="tc-seal" title="Open in Atlas Decoder"' +
                  ' onclick="event.preventDefault();event.stopPropagation();window.location.href=\'/tools/atlas-decoder/\'">' +
                  SEAL +
                '</button>' +
              '</div>' +
            '</div>' +
            '<div class="tc-rule"></div>' +
            '<div class="tc-foot">' +
              '<div class="tc-left">' +
                '<div class="tc-desc">' + esc(desc) + '</div>' +
                '<div class="tc-meta">Indexed ' + esc(dated) + '</div>' +
              '</div>' +
              '<span class="tc-action">Open Artifact &#8594;</span>' +
            '</div>' +
          '</a>';
      });
    });

    document.getElementById('tc-list').innerHTML = html;

  })();
</script>

</body>
</html>
