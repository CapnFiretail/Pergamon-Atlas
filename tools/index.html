<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page setup -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pergamon Atlas | Tools</title>

  <style>
    /* =========================
       GLOBAL PAGE STYLES
    ========================= */
    body {
      margin: 0;
      font-family: Georgia, serif;
      background-color: #e9e9e9;
    }

    /* =========================
       TOP HEADER / TOPBAR
    ========================= */
    .topbar {
      background-color: #000;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
    }

    /* Left side of topbar: logo + title */
    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo-box{
      width:128px;
      height:100px;
      background-color:#222;
      border:2px solid black;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      color:white;
      overflow:hidden;
    }  

    .logo-box img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .brand h1 {
      margin: 0;
      font-size: 64px;
      font-weight: bold;
    }

    /* Suggest button in topbar */
    .suggest-btn {
      background-color: white;
      color: black;
      border: none;
      padding: 12px 20px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
    }

    .suggest-btn:hover {
      background-color: #ddd;
    }

    /* =========================
       MAIN PAGE LAYOUT
       Sidebar + Main Content
    ========================= */
    .layout {
      display: flex;
      min-height: calc(100vh - 110px);
    }

    /* =========================
       SIDEBAR
    ========================= */
    .sidebar {
      width: 220px;
      background-color: #111;
      padding-top: 20px;
      display: flex;
      flex-direction: column;
    }

    .sidebar a {
      display: block;
      padding: 16px 24px;
      color: white;
      text-decoration: none;
      font-size: 24px;
    }

    .sidebar a:hover {
      background-color: #222;
    }

    /* Sidebar ad space */
    .ad-box{
      width:90%;
      height:200px;
      margin-top:20px;
      background-color:#333;
      color:white;
      padding:20px 1px;
      border-radius:8px;
      text-align:center;
      font-size:18px;
      border:2px solid white;
      margin-left:auto;
      margin-right:auto;
    }
    /* =========================
       MAIN CONTENT AREA
    ========================= */
    .main-content{
      flex:1;
      padding:30px;
      background-color:#e9e9e9;
    }

    /* Calculator grid */
    .tool-grid{
      display:grid;
      grid-template-columns:repeat(5, 2fr);
      gap:20px;
      margin-top:20px;
    }
    
    /* Individual tool cards */
    .tool-card{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100px;
      background-color:white;
      color:black;
      text-decoration:none;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.12);
      font-size:20px;
      font-weight:bold;
      text-align:center;
      padding:15px;
    }

    .tool-card:hover{
      background-color:#f5f5f5;
      transform:translateY(-2px);
    }

  </style>
</head>
<body>

  <!-- =========================
       TOP HEADER
  ========================== -->
  <div class="topbar">
    
    <div class="brand">
      <div class="logo-box">
        <img src="/images/logo.png" alt="Pergamon Atlas Logo">
      </div>
      <h1>Pergamon Atlas | Tools</h1>
    </div>
    
    <button class="suggest-btn">Suggest a Tool</button>
  </div>

  <!-- =========================
       PAGE LAYOUT
       Sidebar + Main Content
  ========================== -->
  <div class="layout">

    <!-- Sidebar navigation -->
    <div class="sidebar">
      <a href="/">Home</a>
      <a href="tools">Tools</a>
      <a href="games">Games</a>
      <a href="help">Help</a>

      <div class="ad-box">Ad Space</div>
    </div>

    <!-- Main content area -->
    <div class="main-content">
  <h2>Calculators</h2>

  <div class="tool-grid">
    <a href="/tools/gpa-calculator" class="tool-card">GPA Calculator</a>
    <a href="/tools/bmi-calculator" class="tool-card">BMI Calculator</a>
    <a href="/tools/password-generator" class="tool-card">Tip Calculator</a>
    <a href="/tools/bmi-calculator" class="tool-card">Compound Interest Calculator</a>
    <a href="/tools/gpa-calculator" class="tool-card">Percentage Calculator</a>
  </div>
      
  <h2>Generators</h2>
      
  <div class="tool-grid">  
    <a href="/tools/dice-roller" class="tool-card">Password Generator</a>
    <a href="/tools/unit-converter" class="tool-card">Random Number Generator</a>
    <a href="/tools/percentage-calculator" class="tool-card">Name Generator</a>
  </div>

<h2>Other Tools</h2>
      
  <div class="tool-grid">  
    <a href="/tools/dice-roller" class="tool-card">Unit Converter</a>
    <a href="/tools/unit-converter" class="tool-card">Coin Flip</a>
    <a href="/tools/percentage-calculator" class="tool-card">Dice Roller</a>
    <a href="/tools/gear-ratio-calculator" class="tool-card">Gear Ratios</a>
  </div>
</div>

</body>
</html>
