  <style>

    .main-content { background-color: #e8e2d5; }

    /* ── Chapter breaks ──────────────────────────────────────── */

    .tc-chapter {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 38px 0 11px;
    }
    .tc-chapter:first-child { margin-top: 0; }
    .tc-chapter::before,
    .tc-chapter::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(120,80,10,0.2);
    }
    .tc-chapter-label {
      font-family: Georgia, serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(120,80,10,0.55);
      white-space: nowrap;
    }

    /* ── List container ──────────────────────────────────────── */

    #tc-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
      margin-bottom: 60px;
    }
    .tc-chapter { grid-column: 1 / -1; }

    /* ── Card ────────────────────────────────────────────────── */
    /* Same Pergamon house-card family as Games (.feat-card / .content-card):
       white shell, 2px black border, matching radius/shadow scale, and the
       same lift+shadow+gold hover language — kept rectangular rather than
       square, with a wide hero band instead of a square preview panel. */

    .tc-card {
      display: flex;
      flex-direction: column;
      background: white;
      border: 2px solid #000;
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
    }

    .tc-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.14);
      border-color: #8a611c;
    }

    /* ── Hero band ───────────────────────────────────────────── */

    .tc-hero {
      height: 72px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 30% 50%, rgba(184,136,26,0.22), transparent 65%),
        #111;
      border-bottom: 2px solid #000;
      transition: background 0.18s;
    }

    .tc-card:hover .tc-hero {
      background:
        radial-gradient(circle at 30% 50%, rgba(184,136,26,0.34), transparent 65%),
        #111;
    }

    .tc-hero-icon {
      font-size: 32px;
      line-height: 1;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
    }

    /* ── Body ────────────────────────────────────────────────── */

    .tc-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px 18px 16px;
      flex: 1;
    }

    .tc-body-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .tc-name {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 18px;
      font-weight: 700;
      color: #111;
      line-height: 1.25;
    }

    .tc-desc {
      font-size: 13.5px;
      color: #444;
      line-height: 1.55;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* ── Artifact Code / Atlas Address row ──────────────────── */

    .tc-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 10px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 10.5px;
      letter-spacing: 0.05em;
    }

    .tc-code { color: #8a611c; font-weight: 700; }
    .tc-addr { color: #999; }

    /* ── Seal button ─────────────────────────────────────────── */

    .tc-seal {
      width: 30px;
      height: 30px;
      background: rgba(138,97,28,0.06);
      border: 1px solid rgba(138,97,28,0.4);
      border-radius: 6px;
      color: #8a611c;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
    }
    .tc-seal svg { pointer-events: none; }
    .tc-seal:hover {
      background: rgba(138,97,28,0.14);
      border-color: #8a611c;
    }

    /* ── Foot ────────────────────────────────────────────────── */

    .tc-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }

    .tc-indexed {
      font-size: 11px;
      color: #999;
    }

    .tc-action {
      font-family: Georgia, serif;
      font-size: 12px;
      font-weight: 700;
      color: #8a611c;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    /* ── Mobile ──────────────────────────────────────────────── */

    @media (max-width: 900px) {
      #tc-list { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .tc-hero { height: 60px; }
      .tc-hero-icon { font-size: 26px; }
      .tc-body { padding: 12px 14px 14px; }
      .tc-name { font-size: 16px; }
      .tc-action { font-size: 11px; }
      .tc-chapter { margin: 28px 0 8px; }
      .tc-chapter-label { font-size: 10px; }
    }

  </style>

<script>
  loadSnippets('Tools');

  // Deferred to DOMContentLoaded: the indexer clusters PergamonVisibility
  // and entries.js in the late script block, after this tag, so this must
  // not assume they're defined yet at the time this script tag runs.
  document.addEventListener('DOMContentLoaded', async function () {

    /* ── Archive seal SVG ──────────────────────────────────── */
    var SEAL = '<svg width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg"><polygon points="6.5,0.5 12.5,3.7 12.5,9.3 6.5,12.5 0.5,9.3 0.5,3.7" stroke="currentColor" stroke-width="1.1" fill="none"/><circle cx="6.5" cy="6.5" r="1.8" fill="currentColor"/></svg>';

    /* ── Chamber labels ────────────────────────────────────── */
    var CHAMBERS = { TL: 'Tools Wing', GM: 'Games Wing', PG: 'Archive' };

    /* ── Date formatter ────────────────────────────────────── */
    var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function fmtDate(d) {
      if (!d) return '';
      var parts = d.split('-');
      return MONTHS[parseInt(parts[1], 10) - 1] + ' ' + parseInt(parts[2], 10) + ', ' + parts[0];
    }

    /* ── Catalog definition ────────────────────────────────── */
    var CATALOG = [
      ['/tools/gpa-calculator',    '📘', 'Calculate grade point average across courses and credit hours.'],
      ['/tools/scientific-calculator', '🔬', 'Perform advanced mathematical operations and trigonometric functions.'],
      ['/tools/password-generator','🔑', 'Generate cryptographically strong passwords with custom length and rules.'],
      ['/tools/color-picker',      '💠', 'Pick, convert, and copy colors across hex, RGB, and HSL formats.'],
      ['/tools/random-number',     '🎲', 'Generate random integers or decimals within any specified range.'],
      ['/tools/decision-spinner',  '🎡', 'Spin a probability wheel to resolve decisions and dilemmas by chance.'],
    ];

    /* ── Build atlas address lookup ────────────────────────── */
    var atlasTools = (window.atlasEntries && window.atlasEntries.tools) || [];
    var byPath = {};
    atlasTools.forEach(function(t) { byPath[t.path] = t; });

    function esc(s) {
      return String(s)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }

    /* ── Visibility: the matching Atlas entry (entries.js) is the sole  ──
       source of truth for whether a catalog item is publicly visible —
       this CATALOG array intentionally carries no visibility of its own. */
    var visibleCatalog = CATALOG;
    if (window.PergamonVisibility) {
      var checks = await Promise.all(CATALOG.map(function (item) {
        return window.PergamonVisibility.isVisibleInCurrentView(byPath[item[0]]);
      }));
      visibleCatalog = CATALOG.filter(function (_, i) { return checks[i]; });
    }
    var countEl = document.querySelector('.catalog-count-num');
    if (countEl) countEl.textContent = String(visibleCatalog.length);

    /* ── Render ────────────────────────────────────────────── */
    var html = '';

    visibleCatalog.forEach(function(item) {
      var path  = item[0];
      var icon  = item[1];
      var desc  = item[2];
      var entry = byPath[path] || {};

      var fullAddr = entry.address ? 'ATLAS-' + entry.address : '';
      var artCode  = (entry.code_seed && entry.seed)
        ? (((entry.code_seed ^ entry.seed) >>> 0).toString(16).toUpperCase().padStart(8,'0') + '-' + (entry.address || '').split('-')[0])
        : '';
      var dated    = fmtDate(entry.date);
      var name     = entry.name || path.split('/').pop().replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});

      html +=
        '<a href="' + path + '/" class="tc-card">' +
          '<div class="tc-hero"><span class="tc-hero-icon">' + icon + '</span></div>' +
          '<div class="tc-body">' +
            '<div class="tc-body-top">' +
              '<h3 class="tc-name">' + esc(name) + '</h3>' +
              '<button class="tc-seal" title="Open in Atlas Decoder"' +
                ' onclick="event.preventDefault();event.stopPropagation();window.location.href=\'/archives/atlas-decoder-archive-i/\'">' +
                SEAL +
              '</button>' +
            '</div>' +
            '<div class="tc-desc">' + esc(desc) + '</div>' +
            '<div class="tc-meta-row">' +
              '<span class="tc-code">' + esc(artCode) + '</span>' +
              '<span class="tc-addr">' + esc(fullAddr) + '</span>' +
            '</div>' +
            '<div class="tc-foot">' +
              '<span class="tc-indexed">Indexed ' + esc(dated) + '</span>' +
              '<span class="tc-action">Open Artifact &#8594;</span>' +
            '</div>' +
          '</div>' +
        '</a>';
    });

    document.getElementById('tc-list').innerHTML = html;

  });
</script>
