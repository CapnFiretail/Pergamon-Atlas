    @keyframes swingRight{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}

    .pendulum-line.swing-r{animation:swingRight var(--beat-dur) ease-in-out forwards}

    .bpm-btn{width:36px;height:36px;border:1.5px solid #ccc;border-radius:7px;background:white;font-size:18px;cursor:pointer;font-family:Georgia,serif;transition:.15s;display:flex;align-items:center;justify-content:center}
    .bpm-btn:hover{border-color:#8a611c;color:#8a611c}
    .start-btn{padding:12px 36px;background:#111;color:white;border:none;border-radius:10px;font-size:17px;font-family:Georgia,serif;cursor:pointer;transition:.15s;letter-spacing:.04em}
    .start-btn:hover{background:#333}
    .start-btn.running{background:#8a611c}
    .tap-btn{padding:11px 28px;border:2px solid #8a611c;background:white;color:#8a611c;border-radius:10px;font-size:15px;font-family:Georgia,serif;cursor:pointer;transition:.15s}
    .tap-btn:hover,.tap-btn:active{background:#8a611c;color:white}

      <div class="card">
        <h3>Tempo</h3>
        <div class="metro-center">
          <div class="pendulum-box">
            <div class="pendulum-line" id="pendulum"><div class="pendulum-bob"></div></div>
          </div>
          <div class="bpm-display" id="bpmDisplay">120</div>
          <div class="bpm-label">BPM</div>
          <div class="tempo-name" id="tempoName">Allegretto</div>
          <div class="bpm-controls">
            <button class="bpm-btn" onclick="addBpm(-10)">−10</button>
            <button class="bpm-btn" onclick="addBpm(-1)">−</button>
            <input type="range" class="bpm-slider" id="bpmSlider" min="20" max="240" value="120" oninput="setBpm(this.value)">
            <button class="bpm-btn" onclick="addBpm(1)">+</button>
            <button class="bpm-btn" onclick="addBpm(10)">+10</button>
          </div>
          <div class="beat-row">
            <span class="beat-lbl">Beat:</span>
            <select class="beat-sel" id="beatSel" onchange="setBeatCount(this.value)">
              <option value="2">2/4</option>
              <option value="3">3/4</option>
              <option value="4" selected>4/4</option>
              <option value="6">6/8</option>
            </select>
            <div class="beat-dots" id="beatDots"></div>
          </div>
          <div style="display:flex;gap:12px">
            <button class="start-btn" id="startBtn" onclick="toggleMetronome()">Start</button>
            <button class="tap-btn" onclick="tapTempo()">Tap</button>
          </div>
        </div>

      </div>
    </main>

  <script>
  let bpm=120, beatCount=4, currentBeat=0, running=false;
  let schedulerTimer=null, audioCtx=null;
  let nextNoteTime=0, beatPhase=0;
  let tapTimes=[];

  const TEMPOS=[
    {name:'Grave',max:39},{name:'Largo',max:59},{name:'Larghetto',max:65},
    {name:'Adagio',max:75},{name:'Andante',max:107},{name:'Moderato',max:119},
    {name:'Allegretto',max:155},{name:'Allegro',max:167},{name:'Vivace',max:199},
    {name:'Presto',max:219},{name:'Prestissimo',max:999}
  ];
  const PRESETS=[
    {name:'Slow (60)',bpm:60},{name:'Waltz (96)',bpm:96},{name:'Allegro (120)',bpm:120},
    {name:'Fast (140)',bpm:140},{name:'Molto (168)',bpm:168},{name:'Presto (192)',bpm:192}
  ];

  function getTempoName(b){return TEMPOS.find(t=>b<=t.max)?.name||'Prestissimo';}

  function setBpm(val){
    bpm=Math.min(240,Math.max(20,parseInt(val)));
    document.getElementById('bpmDisplay').textContent=bpm;
    document.getElementById('bpmSlider').value=bpm;
    document.getElementById('tempoName').textContent=getTempoName(bpm);
    if(running)restart();
  }
  function addBpm(d){setBpm(bpm+d);}
  function setBeatCount(v){beatCount=parseInt(v);buildDots();}

  function buildDots(){
    const el=document.getElementById('beatDots');
    el.innerHTML='';
    for(let i=0;i<beatCount;i++){
      const d=document.createElement('div');
      d.className='beat-dot'+(i===0?' accent':'');
      d.id='dot'+i;
      el.appendChild(d);
    }
  }

  function buildPresets(){
    const el=document.getElementById('presets');
    PRESETS.forEach(p=>{
      const b=document.createElement('button');
      b.className='preset-btn';b.textContent=p.name;
      b.onclick=()=>setBpm(p.bpm);
      el.appendChild(b);
    });
  }

  function getAudioCtx(){
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    return audioCtx;
  }

  function scheduleBeep(time,isAccent){
    const ctx=getAudioCtx();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.frequency.value=isAccent?1100:880;
    gain.gain.setValueAtTime(isAccent?0.35:0.2,time);
    gain.gain.exponentialRampToValueAtTime(0.001,time+0.08);
    osc.start(time);osc.stop(time+0.1);
  }

  function swingPendulum(phase){
    const p=document.getElementById('pendulum');
    p.classList.remove('swing-l','swing-r');
    void p.offsetWidth;
    const dur=(60/bpm)+'s';
    p.style.setProperty('--beat-dur',dur);
    p.classList.add(phase%2===0?'swing-l':'swing-r');
  }

  function scheduler(){
    const ctx=getAudioCtx();
    while(nextNoteTime<ctx.currentTime+0.1){
      const isAccent=beatPhase%beatCount===0;
      scheduleBeep(nextNoteTime,isAccent);
      // Update UI on next frame
      const b=beatPhase%beatCount;
      const delay=(nextNoteTime-ctx.currentTime)*1000;
      setTimeout(()=>{
        document.querySelectorAll('.beat-dot').forEach((d,i)=>{
          d.classList.toggle('active',i===b);
        });
        swingPendulum(beatPhase);
      },Math.max(0,delay));
      nextNoteTime+=60/bpm;
      beatPhase++;
    }
    schedulerTimer=setTimeout(scheduler,25);
  }

  function toggleMetronome(){
    running=!running;
    const btn=document.getElementById('startBtn');
    if(running){
      btn.textContent='Stop';btn.classList.add('running');
      beatPhase=0;
      const ctx=getAudioCtx();
      nextNoteTime=ctx.currentTime+0.05;
      scheduler();
    }else{
      btn.textContent='Start';btn.classList.remove('running');
      clearTimeout(schedulerTimer);
      document.querySelectorAll('.beat-dot').forEach(d=>d.classList.remove('active'));
      const p=document.getElementById('pendulum');
      p.classList.remove('swing-l','swing-r');
    }
  }

  function restart(){
    if(!running)return;
    clearTimeout(schedulerTimer);
    const ctx=getAudioCtx();
    nextNoteTime=ctx.currentTime+0.05;
    scheduler();
  }

  function tapTempo(){
    const now=performance.now();
    tapTimes.push(now);
    if(tapTimes.length>8)tapTimes.shift();
    if(tapTimes.length>=2){
      const gaps=[];
      for(let i=1;i<tapTimes.length;i++)gaps.push(tapTimes[i]-tapTimes[i-1]);
      const avg=gaps.reduce((a,b)=>a+b,0)/gaps.length;
      setBpm(Math.round(60000/avg));
    }
    // Reset tap if gap > 3s
    setTimeout(()=>{if(tapTimes.length&&performance.now()-tapTimes[tapTimes.length-1]>2500)tapTimes=[];},2600);
  }

  buildDots();buildPresets();
  document.getElementById('tempoName').textContent=getTempoName(bpm);
  </script>
