<!DOCTYPE html>
<html lang="en">
<head>

  <title>Tip Calculator</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      font-family: Georgia, serif;
      background-color:#e9e9e9;
    }

    /* HEADER */
    .topbar{
      background-color:#000;
      color:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 30px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:18px;
    }

    .logo-box{
      width:80px;
      height:60px;
      background-color:#222;
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
    }

    /* LAYOUT */
    .container{
      display:flex;
    }

    .sidebar{
      width:220px;
      background:#111;
      color:white;
      padding:20px;
      min-height:100vh;
    }

    .sidebar a{
      display:block;
      color:white;
      text-decoration:none;
      margin-bottom:15px;
    }

    .main{
      flex:1;
      padding:40px;
    }

    .card{
      background:white;
      padding:30px;
      border-radius:10px;
      max-width:500px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    input, select{
      width:100%;
      padding:10px;
      margin:10px 0;
      font-size:16px;
    }

    button{
      width:100%;
      padding:12px;
      background:black;
      color:white;
      border:none;
      cursor:pointer;
      margin-top:10px;
    }

    .result{
      margin-top:20px;
      font-size:18px;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="topbar">
    <div class="brand">
      <div class="logo-box">LOGO</div>
      <h2>Tip Calculator</h2>
    </div>
  </div>

  <!-- PAGE -->
  <div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <h3>Tools</h3>
      <a href="#">GPA Calculator</a>
      <a href="#">BMI Calculator</a>
      <a href="#">Tip Calculator</a>
    </div>

    <!-- MAIN -->
    <div class="main">
      <div class="card">

        <h2>Calculate Your Tip</h2>

        <label>Bill Amount ($)</label>
        <input type="number" id="bill" placeholder="Enter bill amount">

        <label>Tip Percentage</label>
        <select id="tip">
          <option value="0.15">15%</option>
          <option value="0.18">18%</option>
          <option value="0.20">20%</option>
          <option value="0.25">25%</option>
        </select>

        <label>Number of People</label>
        <input type="number" id="people" value="1" min="1">

        <button onclick="calculateTip()">Calculate</button>

        <div class="result" id="output"></div>

      </div>
    </div>

  </div>

  <script>
    function calculateTip(){
      let bill = parseFloat(document.getElementById("bill").value);
      let tipPercent = parseFloat(document.getElementById("tip").value);
      let people = parseInt(document.getElementById("people").value);

      if(!bill || bill <= 0){
        document.getElementById("output").innerHTML = "Enter a valid bill amount.";
        return;
      }

      let tipAmount = bill * tipPercent;
      let total = bill + tipAmount;
      let perPerson = total / people;

      document.getElementById("output").innerHTML = `
        Tip: $${tipAmount.toFixed(2)} <br>
        Total: $${total.toFixed(2)} <br>
        Per Person: $${perPerson.toFixed(2)}
      `;
    }
  </script>

</body>
</html>
