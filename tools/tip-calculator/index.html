<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612"
     crossorigin="anonymous"></script>

  <title>Pergamon Atlas | Tip Calculator</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    /* =========================
       GLOBAL PAGE STYLES
    ========================== */
    body{
      margin:0;
      font-family:Georgia, serif;
      background-color:#e9e9e9;
    }

    /* =========================
       TOP HEADER / NAV BAR
    ========================== */
    .topbar{
      background-color:#000;
      color:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 30px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:18px;
    }

    .logo-box{
      width:128px;
      height:100px;
      background-color:#222;
      border:2px solid black;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .logo-box img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .brand h1{
      margin:0;
      font-size:64px;
      font-weight:bold;
    }

    .suggest-btn{
      background-color:white;
      color:black;
      border:none;
      padding:12px 20px;
      font-size:18px;
      cursor:pointer;
      border-radius:8px;
    }

    .suggest-btn:hover{
      background-color:#ddd;
    }

    /* =========================
       PAGE LAYOUT
    ========================== */
    .layout{
      display:flex;
      min-height:calc(100vh - 140px);
    }

    /* =========================
       SIDEBAR
    ========================== */
    .sidebar{
      width:220px;
      background-color:#111;
      padding-top:20px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .sidebar a{
      color:white;
      text-decoration:none;
      padding:16px 24px;
      font-size:24px;
      display:block;
      width:100%;
      box-sizing:border-box;
    }

    .sidebar a:hover{
      background-color:#222;
    }

    /* =========================
       SIDEBAR AD SPACE
    ========================== */
    .ad-box{
      width:90%;
      margin:25px auto;
      padding:20px;
      background:#ffffff;
      border-radius:10px;
      border:2px dashed #999;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:120px;
      box-sizing:border-box;
    }

    .ad-box ins{
      display:block;
      width:100%;
      max-width:100%;
      background-color:#ffffff;
    }

    /* =========================
       MAIN CONTENT AREA
    ========================== */
    .main-content{
      flex:1;
      padding:30px;
      background-color:#e9e9e9;
    }

    .welcome-box{
      background-color:white;
      padding:30px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.12);
      max-width:700px;
    }

    .calculator-form{
      margin-top:20px;
    }

    .calculator-form label{
      display:block;
      font-size:22px;
      margin-bottom:8px;
      margin-top:18px;
    }

    .calculator-form input,
    .calculator-form select{
      width:100%;
      padding:14px;
      font-size:20px;
      font-family:Georgia, serif;
      border:1px solid #bbb;
      border-radius:8px;
      box-sizing:border-box;
    }

    .calc-btn,
    .reset-btn{
      margin-top:22px;
      padding:14px 22px;
      font-size:20px;
      font-family:Georgia, serif;
      border:none;
      border-radius:8px;
      cursor:pointer;
      margin-right:12px;
    }

    .calc-btn{
      background-color:#000;
      color:white;
    }

    .calc-btn:hover{
      background-color:#222;
    }

    .reset-btn{
      background-color:#d9d9d9;
      color:black;
    }

    .reset-btn:hover{
      background-color:#c5c5c5;
    }

    .results-box{
      margin-top:30px;
      padding:22px;
      background-color:#f7f7f7;
      border-radius:10px;
      border:1px solid #ccc;
    }

    .results-box p{
      font-size:24px;
      margin:12px 0;
    }

    .error-message{
      color:#b00020;
      font-size:20px;
      margin-top:18px;
      font-weight:bold;
    }
  </style>
</head>

<body>

  <!-- =========================
       TOP HEADER
  ========================== -->
  <div class="topbar">
    <div class="brand">
      <div class="logo-box">
        <img src="/images/logo.png" alt="Pergamon Atlas Logo">
      </div>
      <h1>Pergamon Atlas</h1>
    </div>

    <button class="suggest-btn">Website Suggestions</button>
  </div>

  <!-- =========================
       PAGE LAYOUT
  ========================== -->
  <div class="layout">

    <!-- Sidebar Navigation -->
    <div class="sidebar">
      <a href="/">Home</a>
      <a href="/tools">Tools</a>
      <a href="/games">Games</a>
      <a href="/help">Help</a>

      <div class="ad-box">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-4717716734064612"
             data-ad-slot="8448245585"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="welcome-box">
        <h2>Tip Calculator</h2>
        <p>Quickly calculate tip, total bill, and cost per person.</p>

        <div class="calculator-form">
          <label for="billAmount">Bill Amount ($)</label>
          <input type="number" id="billAmount" placeholder="Enter bill amount" step="0.01" min="0">

          <label for="tipPercent">Tip Percentage</label>
          <select id="tipPercent">
            <option value="15">15%</option>
            <option value="18">18%</option>
            <option value="20" selected>20%</option>
            <option value="25">25%</option>
          </select>

          <label for="peopleCount">Number of People</label>
          <input type="number" id="peopleCount" placeholder="Enter number of people" min="1" value="1">

          <button class="calc-btn" onclick="calculateTip()">Calculate Tip</button>
          <button class="reset-btn" onclick="resetCalculator()">Reset</button>

          <div id="errorBox" class="error-message"></div>

          <div class="results-box" id="resultsBox">
            <p><strong>Tip Amount:</strong> $0.00</p>
            <p><strong>Total Bill:</strong> $0.00</p>
            <p><strong>Per Person:</strong> $0.00</p>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});

    function calculateTip(){
      let billAmount = parseFloat(document.getElementById("billAmount").value);
      let tipPercent = parseFloat(document.getElementById("tipPercent").value);
      let peopleCount = parseInt(document.getElementById("peopleCount").value);

      let errorBox = document.getElementById("errorBox");
      let resultsBox = document.getElementById("resultsBox");

      errorBox.textContent = "";

      if (isNaN(billAmount) || billAmount <= 0){
        errorBox.textContent = "Please enter a valid bill amount.";
        return;
      }

      if (isNaN(peopleCount) || peopleCount < 1){
        errorBox.textContent = "Please enter a valid number of people.";
        return;
      }

      let tipAmount = billAmount * (tipPercent / 100);
      let totalBill = billAmount + tipAmount;
      let perPerson = totalBill / peopleCount;

      resultsBox.innerHTML = `
        <p><strong>Tip Amount:</strong> $${tipAmount.toFixed(2)}</p>
        <p><strong>Total Bill:</strong> $${totalBill.toFixed(2)}</p>
        <p><strong>Per Person:</strong> $${perPerson.toFixed(2)}</p>
      `;
    }

    function resetCalculator(){
      document.getElementById("billAmount").value = "";
      document.getElementById("tipPercent").value = "20";
      document.getElementById("peopleCount").value = "1";
      document.getElementById("errorBox").textContent = "";
      document.getElementById("resultsBox").innerHTML = `
        <p><strong>Tip Amount:</strong> $0.00</p>
        <p><strong>Total Bill:</strong> $0.00</p>
        <p><strong>Per Person:</strong> $0.00</p>
      `;
    }
  </script>

</body>
</html>
