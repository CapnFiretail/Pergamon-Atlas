  <script>
    loadSnippets('Quote Generator');

    const quotes = {
      Philosophy: [
        {text:"The unexamined life is not worth living.",author:"Socrates"},
        {text:"We suffer more in imagination than in reality.",author:"Seneca"},
        {text:"He who has a why to live can bear almost any how.",author:"Friedrich Nietzsche"},
        {text:"The only true wisdom is in knowing you know nothing.",author:"Socrates"},
        {text:"Man is condemned to be free.",author:"Jean-Paul Sartre"},
        {text:"To be is to do.",author:"Immanuel Kant"},
        {text:"The life of man is of no greater importance to the universe than that of an oyster.",author:"David Hume"},
        {text:"Happiness is not something ready-made. It comes from your own actions.",author:"Dalai Lama"},
        {text:"In the middle of difficulty lies opportunity.",author:"Albert Einstein"},
      ],
      Stoicism: [
        {text:"You have power over your mind, not outside events. Realize this and you will find strength.",author:"Marcus Aurelius"},
        {text:"Waste no more time arguing about what a good man should be. Be one.",author:"Marcus Aurelius"},
        {text:"The impediment to action advances action. What stands in the way becomes the way.",author:"Marcus Aurelius"},
        {text:"Luck is what happens when preparation meets opportunity.",author:"Seneca"},
        {text:"No man is free who is not master of himself.",author:"Epictetus"},
        {text:"Make the best use of what is in your power, and take the rest as it happens.",author:"Epictetus"},
        {text:"It is not the man who has too little but the man who craves more, that is poor.",author:"Seneca"},
        {text:"Difficulties strengthen the mind, as labor does the body.",author:"Seneca"},
      ],
      Science: [
        {text:"The important thing is not to stop questioning. Curiosity has its own reason for existing.",author:"Albert Einstein"},
        {text:"Science is not only a disciple of reason but also one of romance and passion.",author:"Stephen Hawking"},
        {text:"The saddest aspect of life right now is that science gathers knowledge faster than society gathers wisdom.",author:"Isaac Asimov"},
        {text:"In science it often happens that scientists say 'You know that's a really good argument; my position is mistaken.'",author:"Carl Sagan"},
        {text:"The cosmos is within us. We are made of star-stuff.",author:"Carl Sagan"},
        {text:"Research is what I'm doing when I don't know what I'm doing.",author:"Wernher von Braun"},
        {text:"Science is a way of thinking much more than it is a body of knowledge.",author:"Carl Sagan"},
      ],
      Motivation: [
        {text:"It does not matter how slowly you go as long as you do not stop.",author:"Confucius"},
        {text:"The secret of getting ahead is getting started.",author:"Mark Twain"},
        {text:"Success is not final; failure is not fatal: it is the courage to continue that counts.",author:"Winston Churchill"},
        {text:"Whether you think you can, or you think you can't — you're right.",author:"Henry Ford"},
        {text:"The harder I work, the luckier I get.",author:"Samuel Goldwyn"},
        {text:"Don't watch the clock; do what it does. Keep going.",author:"Sam Levenson"},
        {text:"Fall seven times, stand up eight.",author:"Japanese Proverb"},
        {text:"Start where you are. Use what you have. Do what you can.",author:"Arthur Ashe"},
      ],
      Wit: [
        {text:"I have not failed. I've just found 10,000 ways that won't work.",author:"Thomas Edison"},
        {text:"I am so clever that sometimes I don't understand a single word of what I am saying.",author:"Oscar Wilde"},
        {text:"Two things are infinite: the universe and human stupidity; and I'm not sure about the universe.",author:"Albert Einstein"},
        {text:"The trouble with having an open mind, of course, is that people will insist on coming along and trying to put things in it.",author:"Terry Pratchett"},
        {text:"I always wanted to be somebody, but now I realize I should have been more specific.",author:"Lily Tomlin"},
        {text:"Before you judge a man, walk a mile in his shoes. After that, who cares? He's a mile away and you've got his shoes.",author:"Billy Connolly"},
        {text:"If at first you don't succeed, try, try again. Then quit. There's no point in being a damn fool about it.",author:"W.C. Fields"},
      ],
      Literature: [
        {text:"Not all those who wander are lost.",author:"J.R.R. Tolkien"},
        {text:"It is our choices, Harry, that show what we truly are, far more than our abilities.",author:"J.K. Rowling"},
        {text:"There is no greater agony than bearing an untold story inside you.",author:"Maya Angelou"},
        {text:"One must always be careful of books, and what is inside them, for words have the power to change us.",author:"Cassandra Clare"},
        {text:"A reader lives a thousand lives before he dies. The man who never reads lives only one.",author:"George R.R. Martin"},
        {text:"It was the best of times, it was the worst of times.",author:"Charles Dickens"},
        {text:"So we beat on, boats against the current, borne back ceaselessly into the past.",author:"F. Scott Fitzgerald"},
      ]
    };

    let currentCategory = 'Philosophy';
    let currentQuote = null;
    let favorites = JSON.parse(localStorage.getItem('atlas_fav_quotes') || '[]');

    function buildTabs() {
      const tabs = document.getElementById('catTabs');
      Object.keys(quotes).forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-tab' + (cat===currentCategory?' active':'');
        btn.textContent = cat;
        btn.onclick = () => { currentCategory=cat; document.querySelectorAll('.cat-tab').forEach((b,i)=>b.classList.toggle('active',Object.keys(quotes)[i]===cat)); newQuote(); };
        tabs.appendChild(btn);
      });
    }

    function newQuote() {
      const pool = quotes[currentCategory];
      const q = pool[Math.floor(Math.random()*pool.length)];
      currentQuote = {...q, category: currentCategory};
      document.getElementById('quoteText').textContent = q.text;
      document.getElementById('quoteAuthor').textContent = '— ' + q.author;
      document.getElementById('quoteCat').textContent = currentCategory;
    }

    function saveFavorite() {
      if (!currentQuote) return;
      const exists = favorites.some(f=>f.text===currentQuote.text);
      if (!exists) {
        favorites.unshift(currentQuote);
        localStorage.setItem('atlas_fav_quotes', JSON.stringify(favorites));
        renderFavorites();
      }
    }

    function removeFavorite(i) {
      favorites.splice(i,1);
      localStorage.setItem('atlas_fav_quotes', JSON.stringify(favorites));
      renderFavorites();
    }

    function renderFavorites() {
      const list = document.getElementById('favList');
      if (!favorites.length) { list.innerHTML='<div class="empty-favs">No favorites saved yet.</div>'; return; }
      list.innerHTML = favorites.map((f,i) => `
        <div class="fav-item">
          <button class="fav-del" onclick="removeFavorite(${i})">×</button>
          "${f.text}"
          <div class="fav-author">— ${f.author} · ${f.category}</div>
        </div>
      `).join('');
    }

    function copyQuote() {
      if (!currentQuote) return;
      navigator.clipboard.writeText(`"${currentQuote.text}" — ${currentQuote.author}`);
    }

    buildTabs();
    newQuote();
    renderFavorites();
  </script>
