<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612"
    crossorigin="anonymous"></script>

  <title>Pergamon Atlas | GPA Calculator</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/styles/header.css">
  <link rel="stylesheet" href="/styles/sidebar.css">
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/footer.css">

  <style>
    .gpa-hero{
      background: linear-gradient(135deg, #111 0%, #1a1a1a 100%);
      color: white;
      border: 2px solid #000;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    }

    .gpa-hero h2{
      margin: 0 0 10px 0;
      font-size: clamp(30px, 4vw, 42px);
      color: #f0d39b;
    }

    .gpa-grid{
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 22px;
    }

    .gpa-panel{
      background: white;
      border: 2px solid #000;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .panel-subtext{
      margin-bottom: 16px;
      color: #333;
    }

    .mode-toggle{
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .mode-pill{
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #f7f7f7;
      border: 1px solid #ccc;
      cursor: pointer;
    }

    .class-list{
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 20px;
    }

    .class-row{
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 18px;
      background: #fafafa;
    }

    .class-row-top{
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .row-grid{
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 14px;
    }

    .field{
      display: flex;
      flex-direction: column;
    }

    .field input,
    .field select{
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #bbb;
    }

    .button-row{
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .atlas-btn{
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .primary{
      background: black;
      color: white;
    }

    .secondary{
      background: white;
      border: 1px solid #999;
    }

    .remove{
      background: #222;
      color: white;
    }

    .results-grid{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 18px;
    }

    .result-card{
      background: #f7f7f7;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
    }

    .result-number{
      font-size: 28px;
      font-weight: bold;
    }

    .formula-box{
      background: #111;
      color: white;
      padding: 20px;
      border-radius: 14px;
    }

    @media (max-width: 900px){
      .gpa-grid{
        grid-template-columns: 1fr;
      }

      .row-grid{
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>
  <div id="header-placeholder"></div>

  <div class="layout">
    <div id="sidebar-placeholder"></div>

    <main class="main-content">
      <section class="gpa-hero">
        <h2>GPA Calculator</h2>
      </section>

      <section class="gpa-grid">
        <div class="gpa-panel">
          <h3>Add Your Classes</h3>
          <p class="panel-subtext">
            Toggle between high school and college mode.
          </p>

          <div class="mode-toggle">
            <label class="mode-pill">
              <input type="radio" name="studentType" value="highschool" checked>
              High School
            </label>

            <label class="mode-pill">
              <input type="radio" name="studentType" value="college">
              College
            </label>
          </div>

          <div id="classList" class="class-list"></div>

          <div class="button-row">
            <button class="atlas-btn secondary" onclick="addClassRow()">+ Add</button>
            <button class="atlas-btn primary" onclick="calculateGPA()">Calculate</button>
            <button class="atlas-btn secondary" onclick="resetClasses()">Reset</button>
          </div>

          <p id="tipsText">
            Weighted classes can boost GPA in high school mode.
          </p>
        </div>

        <div>
          <div class="gpa-panel">
            <h3>Results</h3>

            <div class="results-grid">
              <div class="result-card">
                <h4>Total</h4>
                <div class="result-number" id="totalClasses">0</div>
              </div>

              <div class="result-card">
                <h4 id="creditsLabel">Classes</h4>
                <div class="result-number" id="totalCredits">0</div>
              </div>

              <div class="result-card">
                <h4>Unweighted</h4>
                <div class="result-number" id="unweightedGPA">0.00</div>
              </div>

              <div class="result-card">
                <h4 id="weightedLabel">Weighted</h4>
                <div class="result-number" id="weightedGPA">0.00</div>
              </div>
            </div>
          </div>

          <div class="formula-box">
            <h4>Other Educational Tools</h4>
            <p>Coming Soon.</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="footer-placeholder"></div>

  <script>
    const pageHeaderSuffix = "";

    fetch('/snippets/header.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;
        const pageTitleText = document.querySelector('.page-title-text');
        if (pageTitleText) pageTitleText.textContent = "";
      });

    fetch('/snippets/sidebar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('sidebar-placeholder').innerHTML = data;
      });

    fetch('/snippets/footer.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('footer-placeholder').innerHTML = data;
      });

    let classCount = 0;

    function addClassRow(){
      classCount++;

      const row = document.createElement("div");
      row.className = "class-row";

      row.innerHTML = `
        <div class="class-row-top">
          <strong>Class ${classCount}</strong>
          <button class="atlas-btn remove">Remove</button>
        </div>

        <div class="row-grid">
          <input placeholder="Class Name">
          <input type="number" class="grade" placeholder="Grade">
          <input type="number" class="credits" value="3">
          <select class="level">
            <option value="0">Regular</option>
            <option value="0.5">Honors</option>
            <option value="1">AP</option>
          </select>
        </div>
      `;

      row.querySelector(".remove").onclick = () => {
        row.remove();
        calculateGPA();
      };

      document.getElementById("classList").appendChild(row);
    }

    function resetClasses(){
      document.getElementById("classList").innerHTML = "";
      classCount = 0;
      for(let i=0;i<4;i++) addClassRow();
    }

    function convertGrade(g){
      if(g>=90) return 4;
      if(g>=80) return 3;
      if(g>=70) return 2;
      if(g>=60) return 1;
      return 0;
    }

    function calculateGPA(){
      const rows = document.querySelectorAll(".class-row");
      let total=0, credits=0, u=0, w=0;
      const type = document.querySelector('input[name="studentType"]:checked').value;

      rows.forEach(r=>{
        const g = parseFloat(r.querySelector(".grade").value);
        if(isNaN(g)) return;

        const gp = convertGrade(g);
        total++;

        if(type==="college"){
          const c = parseFloat(r.querySelector(".credits").value);
          credits += c;
          u += gp*c;
          w += gp*c;
        } else {
          const bonus = parseFloat(r.querySelector(".level").value);
          u += gp;
          w += gp+bonus;
        }
      });

      if(type==="college"){
        document.getElementById("totalCredits").textContent = credits;
        document.getElementById("unweightedGPA").textContent = (u/credits||0).toFixed(2);
        document.getElementById("weightedGPA").textContent = (w/credits||0).toFixed(2);
      } else {
        document.getElementById("totalCredits").textContent = total;
        document.getElementById("unweightedGPA").textContent = (u/total||0).toFixed(2);
        document.getElementById("weightedGPA").textContent = (w/total||0).toFixed(2);
      }

      document.getElementById("totalClasses").textContent = total;
    }

    resetClasses();
  </script>
</body>
</html>
