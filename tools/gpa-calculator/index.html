<!DOCTYPE>
<html lang="en">
  <head>
    
    <title>GPA Calculator</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <style>

      /* =========================
       GLOBAL PAGE STYLES
      ========================== */
      body{
        margin:0;
        font-family: Georgia, serif;
        background-color:#e9e9e9;
      }

      /* =========================
         TOP HEADER / NAV BAR
      ========================== */
      .topbar{
        background-color:#000;
        color:white;
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:20px 30px;
      }

      /* Brand container (logo + title) */
      .brand{
        display:flex;
        align-items:center;
        gap:18px;
      }

      /* Logo placeholder box */
      .logo-box{
        width:70px;
        height:70px;
        background-color:#222;
        border:2px solid white;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:14px;
        color:white;
      }

      /* Site title */
      .brand h1{
        margin:0;
        font-size:64px;
        font-weight:bold;
      }

      /* Suggestion button */
      .suggest-btn{
        background-color:white;
        color:black;
        border:none;
        padding:12px 20px;
        font-size:18px;
        cursor:pointer;
        border-radius:8px;
      }

      .suggest-btn:hover{
        background-color:#ddd;
      }
    </style>
    
  </head>
  
  <body>
    <!-- =========================
           TOP HEADER
      ========================== -->
      <div class="topbar">

        <div class="brand">
          <div class="logo-box">LOGO</div>
          <h1>GPA Calculator</h1>
        </div>

        <button class="suggest-btn">Website Suggestions</button>

      </div>
  </body>
</html>
