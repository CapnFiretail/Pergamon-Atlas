<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612"
    crossorigin="anonymous"></script>

  <title>Pergamon Atlas | Accounts</title> 

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/function/styles/header.css">
  <link rel="stylesheet" href="/function/styles/sidebar.css">
</head>

<body>

  <div id="header-placeholder"></div>

  <div class="layout">
    <div id="sidebar-placeholder"></div>

    <main class="main-content">
    </main>
  </div>

  <script>
    const pageName = "Accounts";
    const pageHeaderSuffix = pageName ? " | " + pageName : "";

    fetch('/function/snippets/header.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;

        const pageTitleText = document.querySelector('.page-title-text');
        if (pageTitleText) {
          pageTitleText.textContent = pageHeaderSuffix;
        }
      });

    fetch('/function/snippets/sidebar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('sidebar-placeholder').innerHTML = data;

        const path = window.location.pathname;

        document.querySelectorAll('.sidebar a').forEach(link => {
          link.classList.remove('active');

          if (path === "/" && link.getAttribute("href") === "/") {
            link.classList.add('active');
          }
          else if (path.startsWith("/tools") && link.getAttribute("href") === "/tools") {
            link.classList.add('active');
          }
          else if (path.startsWith("/games") && link.getAttribute("href") === "/games") {
            link.classList.add('active');
          }
          else if (path.startsWith("/help") && link.getAttribute("href") === "/help") {
            link.classList.add('active');
          }
        });
      });

    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>

</body>
</html>
