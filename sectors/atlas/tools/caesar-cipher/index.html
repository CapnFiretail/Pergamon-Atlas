<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612" crossorigin="anonymous"></script>
  <title>Pergamon Atlas | Caesar Cipher</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/function/styles/header.css">
  <link rel="stylesheet" href="/function/styles/sidebar.css">
  <link rel="stylesheet" href="/function/styles/main.css">
  <link rel="stylesheet" href="/function/styles/footer.css">
  <style>
    .tool-hero{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);color:white;border:2px solid #8a611c;border-radius:16px;padding:28px;margin-bottom:24px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
    .tool-hero h2{margin:0 0 10px;font-size:clamp(28px,4vw,42px);color:#f0d39b}
    .tool-hero p{margin:0;font-size:17px;color:#f3f3f3}
    .card{background:white;border:2px solid #000;border-radius:16px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:20px}
    .card h3{margin:0 0 14px;font-size:20px}
    label{display:block;font-size:13px;font-weight:700;color:#555;margin-bottom:4px}
    textarea{width:100%;padding:12px;border:1.5px solid #ccc;border-radius:8px;font-size:15px;font-family:Georgia,serif;box-sizing:border-box;resize:vertical;min-height:100px}
    textarea:focus{outline:none;border-color:#8a611c}
    .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}
    .shift-wrap{display:flex;align-items:center;gap:8px}
    .shift-wrap input[type=range]{width:160px}
    .shift-val{font-size:18px;font-weight:800;color:#8a611c;min-width:28px;text-align:center;font-family:monospace}
    .mode-btns{display:flex;gap:6px}
    .mode-btn{padding:8px 16px;border:1.5px solid #ccc;border-radius:7px;background:white;font-family:Georgia,serif;font-size:14px;cursor:pointer;transition:.15s}
    .mode-btn.active{background:#111;border-color:#111;color:white;font-weight:700}
    .quick-btns{display:flex;gap:6px;flex-wrap:wrap}
    .q-btn{padding:6px 12px;border:1.5px solid #ddd;border-radius:6px;background:#f5f5f5;font-size:13px;cursor:pointer;font-family:Georgia,serif;transition:.15s}
    .q-btn:hover{border-color:#8a611c;color:#8a611c}
    .output-area{position:relative}
    .copy-btn{position:absolute;top:8px;right:8px;padding:5px 12px;border:1.5px solid #ccc;border-radius:6px;background:white;font-size:12px;cursor:pointer;font-family:Georgia,serif;transition:.15s}
    .copy-btn:hover{border-color:#8a611c;color:#8a611c}
    .ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px;font-family:monospace;font-size:12px}
    .ref-cell{background:#f5f5f5;border-radius:4px;padding:4px 2px;text-align:center}
    .ref-cell .orig{color:#888}
    .ref-cell .enc{color:#8a611c;font-weight:700}
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Caesar Cipher</h2>
        <p>Encode or decode text using a letter-shift cipher. ROT13 shifts by 13.</p>
      </div>
      <div class="card">
        <h3>Cipher Tool</h3>
        <label>Input Text</label>
        <textarea id="inputText" oninput="process()" placeholder="Type or paste text here...">Hello, World!</textarea>
        <div class="controls">
          <div class="shift-wrap">
            <label style="margin:0">Shift:</label>
            <input type="range" id="shift" min="1" max="25" value="3" oninput="updateShift()">
            <span class="shift-val" id="shiftVal">3</span>
          </div>
          <div class="mode-btns">
            <button class="mode-btn active" id="mEncode" onclick="setMode('encode')">Encode</button>
            <button class="mode-btn"        id="mDecode" onclick="setMode('decode')">Decode</button>
          </div>
        </div>
        <div class="quick-btns">
          <span style="font-size:13px;color:#888;align-self:center">Quick:</span>
          <button class="q-btn" onclick="setShift(3)">Caesar (3)</button>
          <button class="q-btn" onclick="setShift(13)">ROT13</button>
          <button class="q-btn" onclick="setShift(1)">Shift 1</button>
          <button class="q-btn" onclick="copyOutput()">Copy Output</button>
        </div>
        <br>
        <label>Output</label>
        <div class="output-area">
          <textarea id="outputText" readonly style="background:#fafafa"></textarea>
        </div>
      </div>
      <div class="card">
        <h3>Shift Reference</h3>
        <div class="ref-grid" id="refGrid"></div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/function/scripts/atlas.js"></script>
  <script>loadSnippets('Caesar Cipher');</script>
  <script>
  let cipherMode='encode';

  function setMode(m){
    cipherMode=m;
    document.getElementById('mEncode').classList.toggle('active',m==='encode');
    document.getElementById('mDecode').classList.toggle('active',m==='decode');
    process();
  }

  function setShift(n){document.getElementById('shift').value=n;updateShift();}

  function updateShift(){
    document.getElementById('shiftVal').textContent=document.getElementById('shift').value;
    process(); buildRef();
  }

  function cipher(text,shift,encode){
    return text.split('').map(ch=>{
      const code=ch.charCodeAt(0);
      if(code>=65&&code<=90){
        const s=encode?shift:(26-shift);
        return String.fromCharCode(((code-65+s)%26)+65);
      }
      if(code>=97&&code<=122){
        const s=encode?shift:(26-shift);
        return String.fromCharCode(((code-97+s)%26)+97);
      }
      return ch;
    }).join('');
  }

  function process(){
    const input=document.getElementById('inputText').value;
    const shift=parseInt(document.getElementById('shift').value);
    const encode=cipherMode==='encode';
    document.getElementById('outputText').value=cipher(input,shift,encode);
  }

  function buildRef(){
    const shift=parseInt(document.getElementById('shift').value);
    const grid=document.getElementById('refGrid');
    grid.innerHTML='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(ch=>{
      const enc=cipher(ch,shift,true);
      return`<div class="ref-cell"><div class="orig">${ch}</div><div class="enc">${enc}</div></div>`;
    }).join('');
  }

  function copyOutput(){
    const out=document.getElementById('outputText').value;
    navigator.clipboard.writeText(out).catch(()=>{});
  }

  buildRef(); process();
  </script>
</body>
</html>
