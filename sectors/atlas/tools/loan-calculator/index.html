  <style>
    .tool-hero{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);color:white;border:2px solid #8a611c;border-radius:16px;padding:28px;margin-bottom:24px;box-shadow:0 6px 18px rgba(0,0,0,.18)}

    .tool-hero p{margin:0;font-size:17px;line-height:1.7;color:#f3f3f3}
    .layout2{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
    .panel{background:white;border:2px solid #000;border-radius:16px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:20px}
    .panel h3{margin:0 0 18px;font-size:22px}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
    .field label{font-size:14px;font-weight:700;color:#333}
    .field input,.field select{padding:12px;border:1.5px solid #ccc;border-radius:10px;font-size:16px;font-family:Georgia,serif}
    .field input:focus,.field select:focus{outline:none;border-color:#8a611c}
    .input-prefix{position:relative}
    .input-prefix::before{content:'$';position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;color:#888;pointer-events:none}
    .input-prefix input{padding-left:28px}
    .input-suffix{position:relative}
    .input-suffix::after{content:'%';position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:16px;color:#888;pointer-events:none}
    .input-suffix input{padding-right:32px}
    .atlas-btn{width:100%;border:none;border-radius:10px;padding:13px;font-size:16px;font-family:Georgia,serif;cursor:pointer;background:#000;color:white;transition:.15s;margin-top:4px}
    .atlas-btn:hover{background:#222}
    .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}

    .res-num{font-size:24px;font-weight:800;color:#111}
    .res-label{font-size:13px;color:#555;margin-top:4px}
    .breakdown-bar{height:22px;border-radius:999px;background:#eee;overflow:hidden;margin-bottom:8px;display:flex}
    .bar-principal{background:#c28a2b;height:100%}
    .bar-interest{background:#444;height:100%}
    .bar-legend{display:flex;gap:18px;font-size:13px;margin-bottom:16px}
    .legend-dot{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:5px}
    .amort-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
    .amort-table th{background:#111;color:#f0d39b;padding:10px 8px;text-align:right;font-size:13px}
    .amort-table th:first-child{text-align:left}

<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Loan Calculator</h2>
        <p>Calculate monthly payments, total interest, and view a full amortization schedule.</p>
      </div>
      <div class="layout2">
        <div class="panel">
          <h3>Loan Details</h3>
          <div class="field"><label>Loan Amount</label><div class="input-prefix"><input type="number" id="principal" value="20000" min="0"></div></div>
          <div class="field"><label>Annual Interest Rate</label><div class="input-suffix"><input type="number" id="rate" value="6.5" step="0.1" min="0"></div></div>
          <div class="field"><label>Loan Term</label>
            <div style="display:flex;gap:8px">
              <input type="number" id="term" value="5" min="1" style="flex:1">
              <select id="termUnit" style="width:110px">
                <option value="years">Years</option>
                <option value="months">Months</option>
              </select>
            </div>
          </div>
          <button class="atlas-btn" onclick="calculate()">Calculate</button>
        </div>
        <div>
          <div class="panel" id="resultPanel" style="display:none">
            <h3>Results</h3>
            <div class="result-grid">
              <div class="res-box"><div class="res-num" id="rMonthly">—</div><div class="res-label">Monthly Payment</div></div>
              <div class="res-box"><div class="res-num" id="rTotal">—</div><div class="res-label">Total Paid</div></div>
              <div class="res-box"><div class="res-num" id="rInterest">—</div><div class="res-label">Total Interest</div></div>
              <div class="res-box"><div class="res-num" id="rPrincipal">—</div><div class="res-label">Principal</div></div>
            </div>
            <div class="breakdown-bar"><div class="bar-principal" id="barP"></div><div class="bar-interest" id="barI"></div></div>
            <div class="bar-legend">
              <span><span class="legend-dot" style="background:#c28a2b"></span>Principal</span>
              <span><span class="legend-dot" style="background:#444"></span>Interest</span>
            </div>
          </div>
        </div>
      </div>
      <div class="panel" id="amortPanel" style="display:none">
        <h3>Amortization Schedule</h3>
        <div class="amort-scroll">
          <table class="amort-table">
            <thead><tr><th>Month</th><th>Payment</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead>
            <tbody id="amortBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/function/scripts/atlas.js"></script>
  <script>
    loadSnippets('Loan Calculator');

    function fmt(n){ return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

    function calculate() {
      const P = parseFloat(document.getElementById('principal').value);
      const annualRate = parseFloat(document.getElementById('rate').value)/100;
      let months = parseInt(document.getElementById('term').value);
      if (document.getElementById('termUnit').value === 'years') months *= 12;
      if (isNaN(P)||isNaN(annualRate)||isNaN(months)||months<1) return;

      const r = annualRate/12;
      let monthly;
      if (r === 0) { monthly = P/months; }
      else { monthly = P * (r*Math.pow(1+r,months)) / (Math.pow(1+r,months)-1); }

      const totalPaid = monthly * months;
      const totalInterest = totalPaid - P;

      document.getElementById('rMonthly').textContent = fmt(monthly);
      document.getElementById('rTotal').textContent = fmt(totalPaid);
      document.getElementById('rInterest').textContent = fmt(totalInterest);
      document.getElementById('rPrincipal').textContent = fmt(P);

      const pPct = (P/totalPaid)*100;
      document.getElementById('barP').style.width = pPct+'%';
      document.getElementById('barI').style.width = (100-pPct)+'%';

      // Amortization
      let balance = P;
      const rows = [];
      for (let i = 1; i <= months; i++) {
        const intPay = balance * r;
        const princPay = monthly - intPay;
        balance -= princPay;
        rows.push({m:i, pay:monthly, princ:princPay, int:intPay, bal:Math.max(0,balance)});
      }
      document.getElementById('amortBody').innerHTML = rows.map(row=>
        `<tr><td>${row.m}</td><td>${fmt(row.pay)}</td><td>${fmt(row.princ)}</td><td>${fmt(row.int)}</td><td>${fmt(row.bal)}</td></tr>`
      ).join('');

      document.getElementById('resultPanel').style.display = 'block';
      document.getElementById('amortPanel').style.display = 'block';
    }

    calculate();
  </script>
