    .tool-hero{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);color:white;border:2px solid #8a611c;border-radius:16px;padding:28px;margin-bottom:24px;box-shadow:0 6px 18px rgba(0,0,0,.18)}

    .output{width:100%;min-height:300px;padding:16px;border:1.5px solid #ccc;border-radius:10px;font-size:16px;font-family:Georgia,serif;line-height:1.8;resize:vertical;box-sizing:border-box;background:#fafafa}

<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Lorem Ipsum Generator</h2>
        <p>Generate placeholder text in words, sentences, or paragraphs.</p>
      </div>
      <div class="panel">
        <h3>Options</h3>
        <div class="controls">
          <div class="field">
            <label>Amount</label>
            <input type="number" id="amount" value="3" min="1" max="100">
          </div>
          <div class="field">
            <label>Type</label>
            <select id="genType">
              <option value="paragraphs">Paragraphs</option>
              <option value="sentences">Sentences</option>
              <option value="words">Words</option>
            </select>
          </div>
          <div class="field">
            <label>Start with "Lorem ipsum"</label>
            <select id="startLorem">
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </div>
          <button class="atlas-btn" onclick="generate()">Generate</button>
          <button class="copy-btn" onclick="copyOutput()">Copy</button>
        </div>
        <textarea class="output" id="output" readonly></textarea>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/function/scripts/atlas.js"></script>
  <script>
    loadSnippets('Lorem Ipsum Generator');

    const LOREM = 'lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua ut enim ad minim veniam quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt in culpa qui officia deserunt mollit anim id est laborum curabitur pretium tincidunt lacus nulla gravida orci a odio nullam varius turpis pellentesque dignissim ligula nunc eleifend massa fringilla metus blandit nibh vulputate proin aliquam integer vitae libero ac feugiat semper lectus aenean quam in scelerisque sem nibh id diam nisl dapibus ac facilisis in nunc fringilla lobortis feugiat vivamus at augue eget arcu dictum varius duis at consectetur lorem donec massa sapien faucibus et molestie ac feugiat sed lectus vestibulum mattis ullamcorper velit sed ullamcorper morbi tincidunt ornare massa eget egestas purus viverra accumsan in nisl nisi scelerisct nisl'.split(' ');

    function randWord() { return LOREM[Math.floor(Math.random()*LOREM.length)]; }

    function makeSentence() {
      const len = 8 + Math.floor(Math.random()*10);
      const words = Array.from({length:len}, randWord);
      words[0] = words[0][0].toUpperCase() + words[0].slice(1);
      return words.join(' ') + '.';
    }

    function makeParagraph() {
      const count = 4 + Math.floor(Math.random()*4);
      return Array.from({length:count}, makeSentence).join(' ');
    }

    function generate() {
      const amount = Math.max(1, Math.min(100, parseInt(document.getElementById('amount').value)||3));
      const type = document.getElementById('genType').value;
      const startLorem = document.getElementById('startLorem').value === 'yes';
      let result = '';

      if (type === 'words') {
        const words = Array.from({length:amount}, randWord);
        if (startLorem) { words[0]='Lorem'; if(amount>1) words[1]='ipsum'; }
        result = words.join(' ') + '.';
      } else if (type === 'sentences') {
        const sentences = Array.from({length:amount}, makeSentence);
        if (startLorem) sentences[0] = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit.';
        result = sentences.join(' ');
      } else {
        const paras = Array.from({length:amount}, makeParagraph);
        if (startLorem) paras[0] = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. ' + paras[0];
        result = paras.join('\n\n');
      }
      document.getElementById('output').value = result;
    }

    function copyOutput() {
      navigator.clipboard.writeText(document.getElementById('output').value);
      const btn = document.querySelector('.copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 1500);
    }

    generate();
  </script>
