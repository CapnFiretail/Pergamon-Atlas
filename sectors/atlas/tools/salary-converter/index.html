<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612" crossorigin="anonymous"></script>
  <title>Pergamon Atlas | Salary Converter</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/function/styles/header.css">
  <link rel="stylesheet" href="/function/styles/sidebar.css">
  <link rel="stylesheet" href="/function/styles/main.css">
  <link rel="stylesheet" href="/function/styles/footer.css">
  <style>
    .tool-hero{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);color:white;border:2px solid #8a611c;border-radius:16px;padding:28px;margin-bottom:24px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
    .tool-hero h2{margin:0 0 10px;font-size:clamp(28px,4vw,42px);color:#f0d39b}
    .tool-hero p{margin:0;font-size:17px;line-height:1.7;color:#f3f3f3}
    .panel{background:white;border:2px solid #000;border-radius:16px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:20px}
    .panel h3{margin:0 0 18px;font-size:22px}
    .input-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end;margin-bottom:20px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field label{font-size:14px;font-weight:700;color:#333}
    .field select,.field input{padding:12px;border:1.5px solid #ccc;border-radius:10px;font-size:16px;font-family:Georgia,serif;width:100%;box-sizing:border-box}
    .field select:focus,.field input:focus{outline:none;border-color:#8a611c}
    .input-prefix{position:relative}
    .input-prefix::before{content:'$';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#888;pointer-events:none}
    .input-prefix input{padding-left:28px}
    .eq-sign{font-size:28px;color:#888;text-align:center;padding-bottom:12px}
    .atlas-btn{width:100%;border:none;border-radius:10px;padding:13px;font-size:16px;font-family:Georgia,serif;cursor:pointer;background:#000;color:white;transition:.15s;margin-top:4px}
    .atlas-btn:hover{background:#222}
    .result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
    .res-box{background:#111;color:white;border-radius:12px;padding:18px}
    .res-box .amount{font-size:28px;font-weight:800;color:#f0d39b}
    .res-box .period{font-size:14px;color:#aaa;margin-top:4px}
    .hours-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
    .hours-row .field{flex:1}
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Salary Converter</h2>
        <p>Convert between hourly, daily, weekly, monthly, and annual pay rates instantly.</p>
      </div>
      <div class="panel">
        <h3>Enter Pay</h3>
        <div class="hours-row">
          <div class="field"><label>Hours per Week</label><input type="number" id="hpw" value="40" min="1" max="168" oninput="calculate()"></div>
          <div class="field"><label>Weeks per Year</label><input type="number" id="wpy" value="52" min="1" max="52" oninput="calculate()"></div>
          <div class="field"><label>Days per Week</label><input type="number" id="dpw" value="5" min="1" max="7" oninput="calculate()"></div>
        </div>
        <div class="input-grid">
          <div class="field"><label>Amount</label><div class="input-prefix"><input type="number" id="amount" value="25" min="0" step="0.01" oninput="calculate()"></div></div>
          <div class="eq-sign">=</div>
          <div class="field"><label>Per</label>
            <select id="period" onchange="calculate()">
              <option value="hourly">Per Hour</option>
              <option value="daily">Per Day</option>
              <option value="weekly">Per Week</option>
              <option value="biweekly">Bi-Weekly</option>
              <option value="monthly">Per Month</option>
              <option value="annual">Per Year</option>
            </select>
          </div>
        </div>
      </div>
      <div class="panel">
        <h3>All Rates</h3>
        <div class="result-grid" id="resultGrid"></div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/function/scripts/atlas.js"></script>
  <script>
    loadSnippets('Salary Converter');

    function calculate() {
      const amount=parseFloat(document.getElementById('amount').value)||0;
      const period=document.getElementById('period').value;
      const hpw=parseFloat(document.getElementById('hpw').value)||40;
      const wpy=parseFloat(document.getElementById('wpy').value)||52;
      const dpw=parseFloat(document.getElementById('dpw').value)||5;

      const hpd=hpw/dpw;
      const hpy=hpw*wpy;
      const dpy=dpw*wpy;

      let hourly;
      switch(period){
        case 'hourly': hourly=amount; break;
        case 'daily': hourly=amount/hpd; break;
        case 'weekly': hourly=amount/hpw; break;
        case 'biweekly': hourly=amount/(hpw*2); break;
        case 'monthly': hourly=amount*12/hpy; break;
        case 'annual': hourly=amount/hpy; break;
      }

      const annual=hourly*hpy;
      const results=[
        {label:'Per Hour',val:hourly},
        {label:'Per Day ('+dpw+' days/wk)',val:hourly*hpd},
        {label:'Per Week',val:hourly*hpw},
        {label:'Bi-Weekly',val:hourly*hpw*2},
        {label:'Per Month (÷12)',val:annual/12},
        {label:'Per Year',val:annual},
      ];
      const fmt=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
      document.getElementById('resultGrid').innerHTML=results.map(r=>`
        <div class="res-box">
          <div class="amount">${fmt(r.val)}</div>
          <div class="period">${r.label}</div>
        </div>`).join('');
    }
    calculate();
  </script>
<script src="/pergamon-data/indexing/generator.js"></script><script src="/pergamon-data/indexing/auto-atlas.js"></script>
</body>
</html>
