<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612" crossorigin="anonymous"></script>
  <title>Pergamon Atlas | Mortgage Calculator</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/function/styles/header.css">
  <link rel="stylesheet" href="/function/styles/sidebar.css">
  <link rel="stylesheet" href="/function/styles/main.css">
  <link rel="stylesheet" href="/function/styles/footer.css">
  <style>
    .tool-hero{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);color:white;border:2px solid #8a611c;border-radius:16px;padding:28px;margin-bottom:24px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
    .tool-hero h2{margin:0 0 10px;font-size:clamp(28px,4vw,42px);color:#f0d39b}
    .tool-hero p{margin:0;font-size:17px;line-height:1.7;color:#f3f3f3}
    .cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
    .card{background:white;border:2px solid #000;border-radius:16px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
    .card h3{margin:0 0 16px;font-size:20px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:13px;font-weight:700;color:#555;margin-bottom:4px}
    .field input{width:100%;padding:10px;border:1.5px solid #ccc;border-radius:8px;font-size:16px;font-family:Georgia,serif;box-sizing:border-box}
    .field input:focus{outline:none;border-color:#8a611c}
    .calc-btn{background:#111;color:white;border:none;border-radius:8px;padding:11px 20px;font-size:15px;font-family:Georgia,serif;cursor:pointer;width:100%}
    .calc-btn:hover{background:#333}
    .result-box{background:#f7f7f7;border:1px solid #ddd;border-radius:10px;padding:14px;margin-bottom:10px}
    .result-box .r-label{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
    .result-box .r-val{font-size:26px;font-weight:800;color:#111}
    .result-box .r-sub{font-size:13px;color:#555;margin-top:2px}
    .breakdown{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .bd-item{background:#f7f7f7;border:1px solid #eee;border-radius:8px;padding:12px;text-align:center}
    .bd-item .bd-lbl{font-size:11px;color:#888;text-transform:uppercase}
    .bd-item .bd-val{font-size:18px;font-weight:800;color:#8a611c}
    @media(max-width:700px){.cards-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Mortgage Calculator</h2>
        <p>Calculate your monthly payment, total cost, and interest for any home loan.</p>
      </div>
      <div class="cards-grid">
        <div class="card">
          <h3>Loan Details</h3>
          <div class="field"><label>Home Price ($)</label><input type="number" id="price" value="400000"></div>
          <div class="field"><label>Down Payment ($)</label><input type="number" id="down" value="80000"></div>
          <div class="field"><label>Annual Interest Rate (%)</label><input type="number" id="rate" value="6.5" step="0.1"></div>
          <div class="field"><label>Loan Term (years)</label><input type="number" id="term" value="30"></div>
          <div class="field"><label>Annual Property Tax ($) <span style="font-weight:400;color:#aaa">optional</span></label><input type="number" id="tax" value="4800"></div>
          <div class="field"><label>Annual Insurance ($) <span style="font-weight:400;color:#aaa">optional</span></label><input type="number" id="ins" value="1200"></div>
          <button class="calc-btn" onclick="calculate()">Calculate</button>
        </div>
        <div class="card" id="results">
          <h3>Results</h3>
          <p style="color:#aaa;font-size:14px">Fill in the details and click Calculate.</p>
        </div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/function/scripts/atlas.js"></script>
  <script>loadSnippets('Mortgage Calculator');</script>
  <script>
  function fmt(n){return'$'+Math.round(n).toLocaleString();}
  function calculate(){
    const price=parseFloat(document.getElementById('price').value)||0;
    const down=parseFloat(document.getElementById('down').value)||0;
    const annualRate=parseFloat(document.getElementById('rate').value)||0;
    const years=parseFloat(document.getElementById('term').value)||30;
    const tax=parseFloat(document.getElementById('tax').value)||0;
    const ins=parseFloat(document.getElementById('ins').value)||0;
    const principal=price-down;
    const r=annualRate/100/12;
    const n=years*12;
    let monthly;
    if(r===0){monthly=principal/n;}
    else{monthly=principal*(r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1);}
    const totalPaid=monthly*n;
    const totalInterest=totalPaid-principal;
    const monthlyTax=tax/12;
    const monthlyIns=ins/12;
    const totalMonthly=monthly+monthlyTax+monthlyIns;
    const ltv=(principal/price*100).toFixed(1);

    document.getElementById('results').innerHTML=`
      <h3>Results</h3>
      <div class="result-box">
        <div class="r-label">Monthly Principal & Interest</div>
        <div class="r-val">${fmt(monthly)}</div>
        <div class="r-sub">+ ${fmt(monthlyTax)}/mo tax + ${fmt(monthlyIns)}/mo insurance = <strong>${fmt(totalMonthly)}/mo total</strong></div>
      </div>
      <div class="breakdown">
        <div class="bd-item"><div class="bd-lbl">Loan Amount</div><div class="bd-val">${fmt(principal)}</div></div>
        <div class="bd-item"><div class="bd-lbl">Down Payment</div><div class="bd-val">${fmt(down)}</div></div>
        <div class="bd-item"><div class="bd-lbl">Total Interest</div><div class="bd-val">${fmt(totalInterest)}</div></div>
        <div class="bd-item"><div class="bd-lbl">Total Cost</div><div class="bd-val">${fmt(totalPaid+down)}</div></div>
        <div class="bd-item"><div class="bd-lbl">LTV Ratio</div><div class="bd-val">${ltv}%</div></div>
        <div class="bd-item"><div class="bd-lbl">Payoff Year</div><div class="bd-val">${new Date().getFullYear()+years}</div></div>
      </div>`;
  }
  calculate();
  </script>
</body>
</html>
