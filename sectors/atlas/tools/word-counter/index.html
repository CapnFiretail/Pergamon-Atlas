  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>

        <h2>Word Counter</h2>
        <p>Count words, characters, sentences, and estimate reading time instantly.</p>
      </div>
      <div class="wc-layout">
        <div class="panel">
          <h3>Your Text</h3>
          <textarea id="textInput" placeholder="Paste or type your text here..."></textarea>
          <div class="btn-row">
            <button class="atlas-btn secondary" onclick="document.getElementById('textInput').value='';update()">Clear</button>
            <button class="atlas-btn secondary" onclick="copyText()">Copy</button>
          </div>
        </div>
        <div>
          <div class="panel">
            <h3>Statistics</h3>
            <div class="stat-grid">
              <div class="stat-box"><div class="stat-num" id="wordCount">0</div><div class="stat-label">Words</div></div>

              <div class="stat-box"><div class="stat-num" id="charNoSpace">0</div><div class="stat-label">No Spaces</div></div>
              <div class="stat-box"><div class="stat-num" id="sentenceCount">0</div><div class="stat-label">Sentences</div></div>
              <div class="stat-box"><div class="stat-num" id="paraCount">0</div><div class="stat-label">Paragraphs</div></div>
              <div class="stat-box"><div class="stat-num" id="lineCount">0</div><div class="stat-label">Lines</div></div>
            </div>
            <div class="reading-box">
              <h4>Reading Time</h4>
              <div class="reading-row"><span>Slow (150 wpm)</span><span id="slow">0s</span></div>
              <div class="reading-row"><span>Average (238 wpm)</span><span id="avg">0s</span></div>
              <div class="reading-row"><span>Fast (400 wpm)</span><span id="fast">0s</span></div>

          </div>
        </div>
      </div>
    </main>

  <script src="/function/scripts/atlas.js"></script>
  <script>
    loadSnippets('Word Counter');

    function fmtTime(words, wpm) {
      const secs = Math.round((words / wpm) * 60);
      if (secs < 60) return secs + 's';
      const m = Math.floor(secs / 60), s = secs % 60;
      return m + 'm ' + (s > 0 ? s + 's' : '');
    }

    function update() {
      const txt = document.getElementById('textInput').value;
      const words = txt.trim() === '' ? 0 : txt.trim().split(/\s+/).length;
      const chars = txt.length;
      const charsNoSpace = txt.replace(/\s/g, '').length;
      const sentences = txt.trim() === '' ? 0 : (txt.match(/[.!?]+/g) || []).length;
      const paras = txt.trim() === '' ? 0 : txt.split(/\n\s*\n/).filter(p => p.trim()).length;
      const lines = txt.trim() === '' ? 0 : txt.split('\n').length;

      document.getElementById('wordCount').textContent = words.toLocaleString();
      document.getElementById('charCount').textContent = chars.toLocaleString();
      document.getElementById('charNoSpace').textContent = charsNoSpace.toLocaleString();
      document.getElementById('sentenceCount').textContent = sentences.toLocaleString();
      document.getElementById('paraCount').textContent = paras.toLocaleString();
      document.getElementById('lineCount').textContent = lines.toLocaleString();
      document.getElementById('slow').textContent = fmtTime(words, 150);
      document.getElementById('avg').textContent = fmtTime(words, 238);
      document.getElementById('fast').textContent = fmtTime(words, 400);
    }

    function copyText() {
      const txt = document.getElementById('textInput').value;
      navigator.clipboard.writeText(txt).catch(() => {});
    }

    document.getElementById('textInput').addEventListener('input', update);
  </script>
