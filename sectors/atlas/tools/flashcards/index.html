  <style>
    .tool-hero{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);color:white;border:2px solid #8a611c;border-radius:16px;padding:28px;margin-bottom:24px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
    .tool-hero h2{margin:0 0 10px;font-size:clamp(28px,4vw,42px);color:#f0d39b}
    .tool-hero p{margin:0;font-size:17px;line-height:1.7;color:#f3f3f3}
    .mode-tabs{display:flex;gap:0;border:2px solid #000;border-radius:12px;overflow:hidden;margin-bottom:20px;width:fit-content}
    .mode-tab{padding:11px 24px;font-size:15px;font-family:Georgia,serif;cursor:pointer;background:white;border:none;font-weight:700;transition:.15s}
    .mode-tab.active{background:#111;color:white}
    .panel{background:white;border:2px solid #000;border-radius:16px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:20px}
    .panel h3{margin:0 0 14px;font-size:22px}
    /* Edit mode */
    .deck-name{width:100%;padding:12px;border:1.5px solid #ccc;border-radius:10px;font-size:18px;font-family:Georgia,serif;font-weight:700;box-sizing:border-box;margin-bottom:16px}
    .deck-name:focus{outline:none;border-color:#8a611c}
    .card-editor{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
    .card-row{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:start}
    .card-row textarea{padding:10px;border:1.5px solid #ccc;border-radius:9px;font-size:14px;font-family:Georgia,serif;resize:vertical;min-height:60px}
    .card-row textarea:focus{outline:none;border-color:#8a611c}
    .card-sep{font-size:18px;color:#ccc;align-self:center;padding-top:8px}
    .card-row button{background:none;border:1.5px solid #ccc;border-radius:8px;padding:8px;font-size:16px;cursor:pointer;color:#aaa;align-self:flex-start;margin-top:2px}
    .card-row button:hover{border-color:#c00;color:#c00}
    .add-btn{border:1.5px dashed #ccc;border-radius:9px;padding:9px;width:100%;font-size:14px;font-family:Georgia,serif;background:none;cursor:pointer;transition:.15s;margin-bottom:12px}
    .add-btn:hover{border-color:#8a611c;color:#8a611c}
    .atlas-btn{border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-family:Georgia,serif;cursor:pointer;transition:.15s}
    .atlas-btn.primary{background:#000;color:white}
    .atlas-btn.primary:hover{background:#222}
    .atlas-btn.secondary{background:white;color:#111;border:1.5px solid #ccc}
    .atlas-btn.secondary:hover{background:#f5f5f5}
    /* Study mode */
    .study-progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:15px;color:#555}
    .progress-bar{height:8px;background:#eee;border-radius:999px;overflow:hidden;margin-bottom:20px}
    .progress-fill{height:100%;background:#c28a2b;border-radius:999px;transition:.3s}
    .flashcard{perspective:1000px;height:260px;cursor:pointer;margin-bottom:20px}
    .card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s}
    .card-inner.flipped{transform:rotateY(180deg)}
    .card-face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid #000;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;font-size:22px;text-align:center;line-height:1.5}
    .card-face.front{background:#111;color:#f0d39b}
    .card-face.back{background:white;color:#111;transform:rotateY(180deg)}
    .card-hint{font-size:13px;margin-top:16px;opacity:.6}
    .study-btns{display:flex;gap:12px;justify-content:center;margin-bottom:14px}
    .grade-btn{border:none;border-radius:12px;padding:12px 22px;font-size:16px;font-weight:700;font-family:Georgia,serif;cursor:pointer;transition:.15s}
    .grade-btn:hover{transform:translateY(-2px)}
    .grade-btn.wrong{background:#fff5f5;color:#c00;border:2px solid #faa}
    .grade-btn.hard{background:#fff8e1;color:#f57f17;border:2px solid #ffcc80}
    .grade-btn.good{background:#e8f5e9;color:#2e7d32;border:2px solid #a5d6a7}
    .grade-btn.easy{background:#e3f2fd;color:#1565c0;border:2px solid #90caf9}
    .stats-row{display:flex;gap:12px;text-align:center;flex-wrap:wrap;margin-top:8px}
    .stat-chip{flex:1;background:#f7f7f7;border:1px solid #ddd;border-radius:10px;padding:10px;min-width:70px}
    .stat-chip .n{font-size:22px;font-weight:800}
    .stat-chip .l{font-size:12px;color:#666;margin-top:2px}
  </style>

<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Flashcard Maker</h2>
        <p>Create custom flashcard decks and study them with flip-and-grade review sessions.</p>
      </div>
      <div class="mode-tabs">
        <button class="mode-tab active" id="tabEdit" onclick="setMode('edit')">Edit Deck</button>
        <button class="mode-tab" id="tabStudy" onclick="startStudy()">Study</button>
      </div>

      <div id="editSection">
        <div class="panel">
          <input class="deck-name" id="deckName" placeholder="Deck name..." value="My Flashcard Deck">
          <div class="card-editor" id="cardEditor"></div>
          <button class="add-btn" onclick="addCard()">+ Add Card</button>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="atlas-btn primary" onclick="startStudy()">Study this Deck →</button>
            <button class="atlas-btn secondary" onclick="clearDeck()">Clear All</button>
          </div>
        </div>
      </div>

      <div id="studySection" style="display:none">
        <div class="panel">
          <div class="study-progress">
            <span id="studyCount">Card 1 of 1</span>
            <button class="atlas-btn secondary" onclick="setMode('edit')" style="padding:7px 14px;font-size:13px">← Back to Edit</button>
          </div>
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <div class="flashcard" id="flashcard" onclick="flipCard()">
            <div class="card-inner" id="cardInner">
              <div class="card-face front"><div id="cardFront"></div><div class="card-hint">Click to flip</div></div>
              <div class="card-face back"><div id="cardBack"></div><div class="card-hint">How did you do?</div></div>
            </div>
          </div>
          <div class="study-btns" id="gradeBtns" style="display:none">
            <button class="grade-btn wrong" onclick="grade(0)">✗ Wrong</button>
            <button class="grade-btn hard" onclick="grade(1)">Hard</button>
            <button class="grade-btn good" onclick="grade(2)">Good</button>
            <button class="grade-btn easy" onclick="grade(3)">Easy ✓</button>
          </div>
          <div class="stats-row">
            <div class="stat-chip"><div class="n" id="sWrong">0</div><div class="l">Wrong</div></div>
            <div class="stat-chip"><div class="n" id="sHard">0</div><div class="l">Hard</div></div>
            <div class="stat-chip"><div class="n" id="sGood">0</div><div class="l">Good</div></div>
            <div class="stat-chip"><div class="n" id="sEasy">0</div><div class="l">Easy</div></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/function/scripts/atlas.js"></script>
  <script>
    loadSnippets('Flashcard Maker');

    let cards = [
      {front:'What is the capital of France?',back:'Paris'},
      {front:'What is 7 × 8?',back:'56'},
      {front:'What does HTML stand for?',back:'HyperText Markup Language'},
      {front:'What year did World War II end?',back:'1945'}
    ];

    let studyDeck = [];
    let studyIdx = 0;
    let scores = {0:0,1:0,2:0,3:0};
    let flipped = false;

    function renderEditor() {
      const editor = document.getElementById('cardEditor');
      editor.innerHTML = '';
      cards.forEach((c,i) => {
        const row = document.createElement('div');
        row.className = 'card-row';
        row.innerHTML = `
          <textarea placeholder="Front (question)" oninput="cards[${i}].front=this.value">${c.front}</textarea>
          <span class="card-sep">→</span>
          <textarea placeholder="Back (answer)" oninput="cards[${i}].back=this.value">${c.back}</textarea>
          <button onclick="removeCard(${i})">×</button>
        `;
        editor.appendChild(row);
      });
    }

    function addCard() { cards.push({front:'',back:''}); renderEditor(); }
    function removeCard(i) { cards.splice(i,1); renderEditor(); }
    function clearDeck() { if(confirm('Clear all cards?')){ cards=[]; renderEditor(); } }

    function setMode(m) {
      document.getElementById('editSection').style.display = m==='edit'?'block':'none';
      document.getElementById('studySection').style.display = m==='study'?'block':'none';
      document.getElementById('tabEdit').classList.toggle('active',m==='edit');
      document.getElementById('tabStudy').classList.toggle('active',m==='study');
    }

    function startStudy() {
      const validCards = cards.filter(c=>c.front&&c.back);
      if (validCards.length === 0) { alert('Add at least one card first.'); return; }
      studyDeck = [...validCards].sort(()=>Math.random()-.5);
      studyIdx = 0;
      scores = {0:0,1:0,2:0,3:0};
      flipped = false;
      setMode('study');
      showCard();
    }

    function showCard() {
      if (studyIdx >= studyDeck.length) { finishStudy(); return; }
      const card = studyDeck[studyIdx];
      document.getElementById('cardFront').textContent = card.front;
      document.getElementById('cardBack').textContent = card.back;
      document.getElementById('cardInner').classList.remove('flipped');
      document.getElementById('gradeBtns').style.display = 'none';
      flipped = false;
      document.getElementById('studyCount').textContent = 'Card '+(studyIdx+1)+' of '+studyDeck.length;
      const pct = studyIdx/studyDeck.length*100;
      document.getElementById('progressFill').style.width = pct+'%';
    }

    function flipCard() {
      document.getElementById('cardInner').classList.toggle('flipped');
      flipped = !flipped;
      if (flipped) document.getElementById('gradeBtns').style.display = 'flex';
    }

    function grade(score) {
      scores[score]++;
      document.getElementById('sWrong').textContent=scores[0];
      document.getElementById('sHard').textContent=scores[1];
      document.getElementById('sGood').textContent=scores[2];
      document.getElementById('sEasy').textContent=scores[3];
      studyIdx++;
      showCard();
    }

    function finishStudy() {
      const total = studyDeck.length;
      const correct = scores[2]+scores[3];
      document.getElementById('studySection').querySelector('.panel').innerHTML = `
        <h3>Session Complete!</h3>
        <div style="background:#111;color:#f0d39b;border-radius:14px;padding:28px;text-align:center;margin-bottom:20px">
          <div style="font-size:56px;font-weight:800">${Math.round(correct/total*100)}%</div>
          <div style="color:#aaa;margin-top:6px">${correct} of ${total} correct</div>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <button class="atlas-btn primary" onclick="startStudy()">Study Again</button>
          <button class="atlas-btn secondary" onclick="setMode('edit')">Edit Deck</button>
        </div>
      `;
    }

    renderEditor();
  </script>

<script src="/pergamon-data/pergamon-address.js"></script>

<script src="/pergamon-data/atlas-reference.js"></script>
</body>
