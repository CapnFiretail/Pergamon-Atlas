    .add-stop-btn:hover{border-color:#8a611c;color:#8a611c}
    .atlas-btn{width:100%;border:none;border-radius:10px;padding:12px;font-size:15px;font-family:Georgia,serif;cursor:pointer;background:#000;color:white;transition:.15s;margin-top:4px}

<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Gradient Generator</h2>
        <p>Build CSS gradients visually. Add color stops, pick direction, copy the code.</p>
      </div>
      <div class="layout2">
        <div class="panel">
          <h3>Settings</h3>
          <div class="field">
            <label>Type</label>
            <select id="gradType" onchange="update()">
              <option value="linear">Linear</option>
              <option value="radial">Radial</option>
              <option value="conic">Conic</option>
            </select>
          </div>
          <div class="field" id="angleField">
            <label>Angle: <span id="angleVal">135</span>°</label>
            <input type="range" id="angle" min="0" max="360" value="135" oninput="document.getElementById('angleVal').textContent=this.value;update()">
          </div>
          <div id="colorStops"></div>
          <button class="add-stop-btn" onclick="addStop()">+ Add Color Stop</button>
          <button class="atlas-btn" onclick="randomGradient()">Random Gradient</button>
        </div>
        <div>
          <div class="preview-box" id="previewBox"></div>
          <div class="css-output" id="cssOutput">
            <button class="copy-css" onclick="copyCss()">Copy CSS</button>
            <div id="cssText"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/function/scripts/atlas.js"></script>
  <script>
    loadSnippets('Gradient Generator');

    let stops = [{color:'#c28a2b',pos:0},{color:'#111111',pos:100}];

    function renderStops() {
      const container = document.getElementById('colorStops');
      container.innerHTML = '';
      stops.forEach((stop, i) => {
        const row = document.createElement('div');
        row.className = 'color-stop-row';
        row.innerHTML = `
          <input type="color" value="${stop.color}" oninput="stops[${i}].color=this.value;update()">
          <input type="range" min="0" max="100" value="${stop.pos}" oninput="stops[${i}].pos=parseInt(this.value);document.getElementById('pct${i}').textContent=this.value+'%';update()">
          <span class="pct" id="pct${i}">${stop.pos}%</span>
          ${stops.length>2?`<button onclick="removeStop(${i})">×</button>`:''}
        `;
        container.appendChild(row);
      });
    }

    function addStop() {
      const mid = Math.round((stops[0].pos + stops[stops.length-1].pos)/2);
      stops.push({color:'#888888',pos:mid});
      stops.sort((a,b)=>a.pos-b.pos);
      renderStops(); update();
    }

    function removeStop(i) { stops.splice(i,1); renderStops(); update(); }

    function buildGradient() {
      const type = document.getElementById('gradType').value;
      const sorted = [...stops].sort((a,b)=>a.pos-b.pos);
      const colorStr = sorted.map(s=>`${s.color} ${s.pos}%`).join(', ');
      if (type==='linear') return `linear-gradient(${document.getElementById('angle').value}deg, ${colorStr})`;
      if (type==='radial') return `radial-gradient(circle, ${colorStr})`;
      return `conic-gradient(from ${document.getElementById('angle').value}deg, ${colorStr})`;
    }

    function update() {
      const grad = buildGradient();
      document.getElementById('previewBox').style.background = grad;
      document.getElementById('cssText').textContent = `background: ${grad};`;
      const isLinearOrConic = document.getElementById('gradType').value !== 'radial';
      document.getElementById('angleField').style.display = isLinearOrConic ? '' : 'none';
    }

    function copyCss() {
      navigator.clipboard.writeText(`background: ${buildGradient()};`);
      const btn = document.querySelector('.copy-css');
      btn.textContent = 'Copied!';
      setTimeout(()=>btn.textContent='Copy CSS',1500);
    }

    function randomGradient() {
      const randHex = () => '#' + Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0');
      const count = 2 + Math.floor(Math.random()*3);
      stops = Array.from({length:count},(_,i)=>({color:randHex(),pos:Math.round(i/(count-1)*100)}));
      document.getElementById('angle').value = Math.floor(Math.random()*360);
      document.getElementById('angleVal').textContent = document.getElementById('angle').value;
      renderStops(); update();
    }

    renderStops(); update();
  </script>
