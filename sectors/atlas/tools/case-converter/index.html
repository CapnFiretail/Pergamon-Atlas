        <h2>Case Converter</h2>
        <p>Transform text into uppercase, lowercase, title case, camelCase, snake_case, and more.</p>
      </div>
      <div class="panel">
        <h3>Input Text</h3>
        <textarea id="inputText" placeholder="Type or paste your text here..."></textarea>
        <div class="btn-grid">
          <button class="case-btn" onclick="convert('upper')"><strong>UPPER CASE</strong><span>HELLO WORLD</span></button>
          <button class="case-btn" onclick="convert('lower')"><strong>lower case</strong><span>hello world</span></button>
          <button class="case-btn" onclick="convert('title')"><strong>Title Case</strong><span>Hello World</span></button>
          <button class="case-btn" onclick="convert('sentence')"><strong>Sentence case</strong><span>Hello world</span></button>
          <button class="case-btn" onclick="convert('camel')"><strong>camelCase</strong><span>helloWorld</span></button>
          <button class="case-btn" onclick="convert('pascal')"><strong>PascalCase</strong><span>HelloWorld</span></button>
          <button class="case-btn" onclick="convert('snake')"><strong>snake_case</strong><span>hello_world</span></button>
          <button class="case-btn" onclick="convert('kebab')"><strong>kebab-case</strong><span>hello-world</span></button>
          <button class="case-btn" onclick="convert('constant')"><strong>CONSTANT_CASE</strong><span>HELLO_WORLD</span></button>
          <button class="case-btn" onclick="convert('alternate')"><strong>aLtErNaTe</strong><span>hElLo WoRlD</span></button>
          <button class="case-btn" onclick="convert('reverse')"><strong>esreveR</strong><span>dlroW olleH</span></button>
          <button class="case-btn" onclick="convert('trim')"><strong>Trim Whitespace</strong><span>removes extra spaces</span></button>
        </div>
      </div>
      <div class="panel result-area">
        <h3>Result</h3>
        <button class="copy-badge" onclick="copyResult()">Copy</button>
        <textarea id="outputText" placeholder="Result will appear here..." readonly></textarea>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/function/scripts/atlas.js"></script>
  <script>
    loadSnippets('Case Converter');

    function words(str) { return str.trim().replace(/[\s_-]+/g,' ').split(' ').filter(Boolean); }

    const converters = {
      upper: s => s.toUpperCase(),
      lower: s => s.toLowerCase(),
      title: s => words(s).map(w => w[0].toUpperCase()+w.slice(1).toLowerCase()).join(' '),
      sentence: s => s.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase()),
      camel: s => words(s).map((w,i) => i===0 ? w.toLowerCase() : w[0].toUpperCase()+w.slice(1).toLowerCase()).join(''),
      pascal: s => words(s).map(w => w[0].toUpperCase()+w.slice(1).toLowerCase()).join(''),
      snake: s => words(s).map(w => w.toLowerCase()).join('_'),
      kebab: s => words(s).map(w => w.toLowerCase()).join('-'),
      constant: s => words(s).map(w => w.toUpperCase()).join('_'),
      alternate: s => s.split('').map((c,i) => i%2===0?c.toLowerCase():c.toUpperCase()).join(''),
      reverse: s => s.split('').reverse().join(''),
      trim: s => s.replace(/\s+/g,' ').trim()
    };

    function convert(type) {
      const input = document.getElementById('inputText').value;
      document.getElementById('outputText').value = converters[type](input);
    }

    function copyResult() {
      const val = document.getElementById('outputText').value;
      navigator.clipboard.writeText(val).then(() => {
        const btn = document.querySelector('.copy-badge');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 1500);
      });
    }
  </script>
