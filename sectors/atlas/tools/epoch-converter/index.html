<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Epoch Converter</h2>
        <p>Convert Unix timestamps to human-readable dates and back.</p>
      </div>

      <div class="card">
        <h3>Current Time</h3>
        <div class="now-banner">
          <div>
            <div class="now-lbl">Unix Timestamp</div>
            <span id="nowEpoch">—</span>
          </div>
          <div>
            <div class="now-lbl">UTC</div>
            <span id="nowUTC">—</span>
          </div>
          <div>
            <div class="now-lbl">Local</div>
            <span id="nowLocal">—</span>
          </div>
          <button class="use-btn" onclick="useNow()">Use Now</button>
        </div>
      </div>

      <div class="card">
        <h3>Timestamp → Date</h3>
        <label>Unix Timestamp (seconds or milliseconds)</label>
        <input type="number" id="tsInput" placeholder="e.g. 1700000000" oninput="tsToDate()">
        <div class="result-grid" id="tsResults" style="display:none"></div>
      </div>

      <div class="divider">or</div>

      <div class="card">
        <h3>Date → Timestamp</h3>
        <label>Date & Time (local)</label>
        <input type="datetime-local" id="dtInput" oninput="dateToTs()">
        <div class="result-grid" id="dtResults" style="display:none"></div>
      </div>

      <div class="card">
        <h3>Relative Time</h3>
        <label>Timestamp or Date</label>
        <input type="text" id="relInput" placeholder="Timestamp or YYYY-MM-DD HH:MM:SS" oninput="calcRelative()">
        <div id="relResult" style="margin-top:12px;font-size:15px;color:#555"></div>
      </div>
    </main>
  </div>

  <script>loadSnippets('Epoch Converter');</script>
  <script>
  function pad(n,len=2){return String(n).padStart(len,'0');}

  function fmtUTC(d){
    return`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())} UTC`;
  }
  function fmtLocal(d){
    return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} (local)`;
  }
  function fmtISO(d){return d.toISOString();}
  function fmtRFC(d){return d.toUTCString();}

  function updateNow(){
    const d=new Date();
    document.getElementById('nowEpoch').textContent=Math.floor(d.getTime()/1000);
    document.getElementById('nowUTC').textContent=fmtUTC(d);
    document.getElementById('nowLocal').textContent=fmtLocal(d);
  }

  function useNow(){
    const ts=Math.floor(Date.now()/1000);
    document.getElementById('tsInput').value=ts;
    tsToDate();
  }

  function tsToDate(){
    const raw=document.getElementById('tsInput').value.trim();
    if(!raw){document.getElementById('tsResults').style.display='none';return;}
    let ms=parseInt(raw);
    if(isNaN(ms)){document.getElementById('tsResults').style.display='none';return;}
    // Auto-detect ms vs seconds
    if(ms>1e12){}else{ms*=1000;}
    const d=new Date(ms);
    if(isNaN(d.getTime())){document.getElementById('tsResults').style.display='none';return;}
    const items=[
      ['UTC',fmtUTC(d)],['Local',fmtLocal(d)],
      ['ISO 8601',fmtISO(d)],['RFC 2822',fmtRFC(d)],
      ['Day of Week',d.toLocaleDateString('en-US',{weekday:'long'})],
      ['Unix (ms)',d.getTime()],
    ];
    document.getElementById('tsResults').style.display='grid';
    document.getElementById('tsResults').innerHTML=items.map(([l,v])=>`<div class="res-box"><div class="r-lbl">${l}</div><div class="r-val">${v}</div></div>`).join('');
  }

  function dateToTs(){
    const val=document.getElementById('dtInput').value;
    if(!val){document.getElementById('dtResults').style.display='none';return;}
    const d=new Date(val);
    if(isNaN(d.getTime())){document.getElementById('dtResults').style.display='none';return;}
    const items=[
      ['Unix (seconds)',Math.floor(d.getTime()/1000)],
      ['Unix (ms)',d.getTime()],
      ['UTC',fmtUTC(d)],
      ['ISO 8601',fmtISO(d)],
    ];
    document.getElementById('dtResults').style.display='grid';
    document.getElementById('dtResults').innerHTML=items.map(([l,v])=>`<div class="res-box"><div class="r-lbl">${l}</div><div class="r-val">${v}</div></div>`).join('');
  }

  function calcRelative(){
    const val=document.getElementById('relInput').value.trim();
    const el=document.getElementById('relResult');
    if(!val){el.textContent='';return;}
    let d;
    const asNum=Number(val);
    if(!isNaN(asNum)&&val!==''){
      d=new Date(asNum>1e12?asNum:asNum*1000);
    }else{
      d=new Date(val);
    }
    if(isNaN(d.getTime())){el.textContent='Could not parse that date/timestamp.';el.style.color='#c0392b';return;}
    el.style.color='#555';
    const diff=(d-Date.now())/1000;
    const abs=Math.abs(diff);
    let rel;
    if(abs<60)rel=Math.round(abs)+' seconds';
    else if(abs<3600)rel=Math.round(abs/60)+' minutes';
    else if(abs<86400)rel=Math.round(abs/3600)+' hours';
    else if(abs<86400*30)rel=Math.round(abs/86400)+' days';
    else if(abs<86400*365)rel=Math.round(abs/86400/30)+' months';
    else rel=(abs/86400/365).toFixed(1)+' years';
    el.textContent=diff<0?rel+' ago':'in '+rel;
  }

  // Set datetime-local default to now
  const now=new Date();
  const pad2=n=>String(n).padStart(2,'0');
  document.getElementById('dtInput').value=`${now.getFullYear()}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())}T${pad2(now.getHours())}:${pad2(now.getMinutes())}`;

  updateNow();
  setInterval(updateNow,1000);
  </script>
