      <div class="calc-wrap">

          <div class="display">
            <div class="expr" id="expr"></div>
            <div class="value" id="value">0</div>
          </div>
          <div class="btn-grid">
            <!-- Row 1: mode + clear -->
            <button class="btn fn" onclick="toggleDeg()"><span id="degLabel">DEG</span></button>
            <button class="btn fn" onclick="appendFn('Math.PI')">π</button>
            <button class="btn fn" onclick="appendFn('Math.E')">e</button>
            <button class="btn clear" onclick="backspace()">⌫</button>
            <button class="btn clear" onclick="clearAll()">AC</button>
            <!-- Row 2: trig -->
            <button class="btn fn" onclick="appendFn('sin(')">sin</button>
            <button class="btn fn" onclick="appendFn('cos(')">cos</button>
            <button class="btn fn" onclick="appendFn('tan(')">tan</button>
            <button class="btn fn" onclick="appendFn('asin(')">sin⁻¹</button>
            <button class="btn fn" onclick="appendFn('acos(')">cos⁻¹</button>
            <!-- Row 3: log/power -->
            <button class="btn fn" onclick="appendFn('log(')">log</button>
            <button class="btn fn" onclick="appendFn('ln(')">ln</button>
            <button class="btn fn" onclick="appendFn('sqrt(')">√</button>
            <button class="btn fn" onclick="appendFn('pow(')">xʸ</button>
            <button class="btn fn" onclick="appendFn('atan(')">tan⁻¹</button>
            <!-- Row 4: numbers -->
            <button class="btn num" onclick="append('7')">7</button>
            <button class="btn num" onclick="append('8')">8</button>
            <button class="btn num" onclick="append('9')">9</button>
            <button class="btn op" onclick="append('/')">÷</button>
            <button class="btn fn" onclick="appendFn('abs(')">|x|</button>
            <!-- Row 5 -->
            <button class="btn num" onclick="append('4')">4</button>
            <button class="btn num" onclick="append('5')">5</button>
            <button class="btn num" onclick="append('6')">6</button>
            <button class="btn op" onclick="append('*')">×</button>
            <button class="btn fn" onclick="appendFn('fact(')">n!</button>
            <!-- Row 6 -->
            <button class="btn num" onclick="append('1')">1</button>
            <button class="btn num" onclick="append('2')">2</button>
            <button class="btn num" onclick="append('3')">3</button>
            <button class="btn op" onclick="append('-')">−</button>
            <button class="btn op" onclick="append('%')">%</button>
            <!-- Row 7 -->
            <button class="btn num wide2" onclick="append('0')">0</button>
            <button class="btn num" onclick="append('.')">.</button>
            <button class="btn op" onclick="append('+')">+</button>
            <button class="btn equals" onclick="calculate()">=</button>
            <!-- Row 8: parens -->
            <button class="btn fn wide2" onclick="append('(')">( )</button>
            <button class="btn fn wide2" onclick="append(')')"> ) </button>
            <button class="btn fn" onclick="toggleSign()">+/−</button>

  </div>

  <script src="/function/scripts/atlas.js"></script>
  <script>
    loadSnippets('Scientific Calculator');

    let expr = '';
    let useDeg = true;
    let history = [];

    function toRad(x) { return useDeg ? x * Math.PI/180 : x; }
    function toDeg(x) { return useDeg ? x * 180/Math.PI : x; }

    function sin(x){ return Math.sin(toRad(x)); }
    function cos(x){ return Math.cos(toRad(x)); }
    function tan(x){ return Math.tan(toRad(x)); }
    function asin(x){ return toDeg(Math.asin(x)); }
    function acos(x){ return toDeg(Math.acos(x)); }
    function atan(x){ return toDeg(Math.atan(x)); }
    function log(x){ return Math.log10(x); }
    function ln(x){ return Math.log(x); }
    function sqrt(x){ return Math.sqrt(x); }
    function abs(x){ return Math.abs(x); }
    function pow(x,y){ return Math.pow(x,y); }
    function fact(n){ if(n<0||!Number.isInteger(n))return NaN; let r=1; for(let i=2;i<=n;i++)r*=i; return r; }

    function append(v) { expr += v; render(); }
    function appendFn(fn) { expr += fn; render(); }
    function clearAll() { expr = ''; render(true); }
    function backspace() { expr = expr.slice(0,-1); render(); }
    function toggleDeg() { useDeg = !useDeg; document.getElementById('degLabel').textContent = useDeg?'DEG':'RAD'; }
    function toggleSign() { try { const v = eval(sanitize(expr||'0')); expr = String(-v); render(); } catch(e){} }

    function sanitize(s) {
      return s.replace(/Math\.PI/g, String(Math.PI))
              .replace(/Math\.E/g, String(Math.E))
              .replace(/(\d+)%/g, '($1/100)')
              .replace(/×/g,'*').replace(/÷/g,'/');
    }

    function render(reset) {
      document.getElementById('expr').textContent = expr;
      if (reset) { document.getElementById('value').textContent = '0'; return; }
      if (!expr) { document.getElementById('value').textContent = '0'; return; }
      try {
        const result = eval(sanitize(expr));
        if (typeof result === 'number' && !isNaN(result) && isFinite(result)) {
          document.getElementById('value').textContent = parseFloat(result.toPrecision(12)).toString();
        }
      } catch(e) {}
    }

    function calculate() {
      if (!expr) return;
      try {
        const result = eval(sanitize(expr));
        const formatted = parseFloat(result.toPrecision(12)).toString();
        history.unshift({expr, result: formatted});
        renderHistory();
        document.getElementById('expr').textContent = expr + ' =';
        document.getElementById('value').textContent = formatted;
        expr = formatted;
      } catch(e) {
        document.getElementById('value').textContent = 'Error';
        expr = '';
      }
    }

    function renderHistory() {
      const list = document.getElementById('histList');
      if (!history.length) return;
      list.innerHTML = history.slice(0,20).map(h=>`
        <div class="hist-item" onclick="loadFromHistory('${h.result}')">
          <div class="hist-expr">${h.expr} =</div>
          <div class="hist-val">${h.result}</div>
        </div>
      `).join('');
    }

    function loadFromHistory(val) { expr = val; render(); }

    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9') append(e.key);
      else if ('+-*/.()'.includes(e.key)) append(e.key);
      else if (e.key === 'Enter') calculate();
      else if (e.key === 'Backspace') backspace();
      else if (e.key === 'Escape') clearAll();
    });
  </script>
