<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612" crossorigin="anonymous"></script>
  <title>Pergamon Atlas | Timezone Converter</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/function/styles/header.css">
  <link rel="stylesheet" href="/function/styles/sidebar.css">
  <link rel="stylesheet" href="/function/styles/main.css">
  <link rel="stylesheet" href="/function/styles/footer.css">
  <style>
    .tool-hero{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);color:white;border:2px solid #8a611c;border-radius:16px;padding:28px;margin-bottom:24px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
    .tool-hero h2{margin:0 0 10px;font-size:clamp(28px,4vw,42px);color:#f0d39b}
    .tool-hero p{margin:0;font-size:17px;line-height:1.7;color:#f3f3f3}
    .card{background:white;border:2px solid #000;border-radius:16px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:20px}
    .card h3{margin:0 0 16px;font-size:20px}
    label{display:block;font-size:13px;font-weight:700;color:#555;margin-bottom:4px}
    select,input[type=datetime-local],input[type=time]{width:100%;padding:10px;border:1.5px solid #ccc;border-radius:8px;font-size:15px;font-family:Georgia,serif;box-sizing:border-box}
    select:focus,input:focus{outline:none;border-color:#8a611c}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
    .calc-btn{background:#111;color:white;border:none;border-radius:8px;padding:11px 20px;font-size:15px;font-family:Georgia,serif;cursor:pointer;margin-top:6px}
    .calc-btn:hover{background:#333}
    .result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:16px}
    .tz-result{background:#f7f7f7;border:1.5px solid #eee;border-radius:10px;padding:14px}
    .tz-result .tz-name{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
    .tz-result .tz-time{font-size:22px;font-weight:800;color:#111;font-family:monospace}
    .tz-result .tz-date{font-size:13px;color:#666}
    .now-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
    .now-box{background:#f7f7f7;border:1.5px solid #eee;border-radius:8px;padding:12px}
    .now-box .n-city{font-size:12px;color:#888;text-transform:uppercase;font-weight:700}
    .now-box .n-time{font-size:20px;font-weight:800;color:#8a611c;font-family:monospace}
    .now-box .n-date{font-size:12px;color:#999}
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Timezone Converter</h2>
        <p>Convert a time from one timezone to others instantly.</p>
      </div>

      <div class="card">
        <h3>Current World Time</h3>
        <div class="now-grid" id="nowGrid"></div>
      </div>

      <div class="card">
        <h3>Convert a Time</h3>
        <div class="form-row">
          <div>
            <label>Date & Time</label>
            <input type="datetime-local" id="inputTime">
          </div>
          <div>
            <label>From Timezone</label>
            <select id="fromTZ"></select>
          </div>
        </div>
        <button class="calc-btn" onclick="convert()">Convert</button>
        <div class="result-grid" id="resultGrid"></div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/function/scripts/atlas.js"></script>
  <script>loadSnippets('Timezone Converter');</script>
  <script>
  const ZONES=[
    {id:'America/New_York',label:'New York (ET)'},
    {id:'America/Chicago',label:'Chicago (CT)'},
    {id:'America/Denver',label:'Denver (MT)'},
    {id:'America/Los_Angeles',label:'Los Angeles (PT)'},
    {id:'America/Anchorage',label:'Anchorage (AKT)'},
    {id:'Pacific/Honolulu',label:'Honolulu (HT)'},
    {id:'Europe/London',label:'London (GMT/BST)'},
    {id:'Europe/Paris',label:'Paris (CET)'},
    {id:'Europe/Moscow',label:'Moscow (MSK)'},
    {id:'Asia/Dubai',label:'Dubai (GST)'},
    {id:'Asia/Kolkata',label:'Mumbai/Delhi (IST)'},
    {id:'Asia/Bangkok',label:'Bangkok (ICT)'},
    {id:'Asia/Shanghai',label:'Shanghai (CST)'},
    {id:'Asia/Tokyo',label:'Tokyo (JST)'},
    {id:'Australia/Sydney',label:'Sydney (AEST)'},
    {id:'Pacific/Auckland',label:'Auckland (NZST)'},
    {id:'UTC',label:'UTC'},
  ];

  const NOW_ZONES=['America/New_York','America/Los_Angeles','Europe/London','Europe/Paris','Asia/Kolkata','Asia/Tokyo','Australia/Sydney','UTC'];

  function populateSelect(){
    const sel=document.getElementById('fromTZ');
    ZONES.forEach(z=>{const o=document.createElement('option');o.value=z.id;o.textContent=z.label;sel.appendChild(o);});
    // Default to local tz
    try{const local=Intl.DateTimeFormat().resolvedOptions().timeZone;const opt=[...sel.options].find(o=>o.value===local);if(opt)sel.value=local;}catch(e){}
  }

  function setDefaultTime(){
    const now=new Date();
    const pad=n=>String(n).padStart(2,'0');
    document.getElementById('inputTime').value=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  }

  function convert(){
    const dt=document.getElementById('inputTime').value;
    const from=document.getElementById('fromTZ').value;
    if(!dt)return;
    // Parse as local date in 'from' timezone by using Intl
    const [datePart,timePart]=dt.split('T');
    const [y,mo,d]=datePart.split('-').map(Number);
    const [h,min]=timePart.split(':').map(Number);
    // Create a Date that represents this wall-clock time in the 'from' tz
    // Use a trick: format a UTC date and find the offset
    const approxUTC=new Date(Date.UTC(y,mo-1,d,h,min));
    const offsetMs=getOffsetMs(approxUTC,from);
    const utcMs=approxUTC.getTime()-offsetMs;
    const utcDate=new Date(utcMs);

    const grid=document.getElementById('resultGrid');
    grid.innerHTML='';
    ZONES.forEach(z=>{
      const fmt=new Intl.DateTimeFormat('en-US',{timeZone:z.id,hour:'2-digit',minute:'2-digit',hour12:true});
      const dateFmt=new Intl.DateTimeFormat('en-US',{timeZone:z.id,weekday:'short',month:'short',day:'numeric'});
      const div=document.createElement('div');
      div.className='tz-result';
      div.innerHTML=`<div class="tz-name">${z.label}</div><div class="tz-time">${fmt.format(utcDate)}</div><div class="tz-date">${dateFmt.format(utcDate)}</div>`;
      grid.appendChild(div);
    });
  }

  function getOffsetMs(date,tz){
    const utcStr=date.toLocaleString('en-US',{timeZone:'UTC',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const tzStr=date.toLocaleString('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    return new Date(tzStr)-new Date(utcStr);
  }

  function updateNow(){
    const grid=document.getElementById('nowGrid');
    const now=new Date();
    grid.innerHTML=NOW_ZONES.map(tz=>{
      const z=ZONES.find(z=>z.id===tz)||{label:tz};
      const timeFmt=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
      const dateFmt=new Intl.DateTimeFormat('en-US',{timeZone:tz,month:'short',day:'numeric'});
      return`<div class="now-box"><div class="n-city">${z.label}</div><div class="n-time">${timeFmt.format(now)}</div><div class="n-date">${dateFmt.format(now)}</div></div>`;
    }).join('');
  }

  populateSelect(); setDefaultTime(); updateNow();
  setInterval(updateNow,1000);
  </script>
</body>
</html>
