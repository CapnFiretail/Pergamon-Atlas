<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Aspect Ratio Calculator</h2>
        <p>Calculate dimensions, find ratios, and visualize aspect ratios for any size.</p>
      </div>
      <div class="panel">
        <h3>Calculate</h3>
        <div class="calc-grid">
          <div class="calc-card">
            <h4>Find the Ratio</h4>
            <div class="inline-fields">
              <input type="number" id="rw" placeholder="W">
              <span>×</span>
              <input type="number" id="rh" placeholder="H">
            </div>
            <button class="calc-btn" onclick="findRatio()">Calculate Ratio</button>
            <div class="result" id="ratioResult">—</div>
          </div>
          <div class="calc-card">
            <h4>Scale by Width</h4>
            <div class="inline-fields">
              Ratio:
              <input type="number" id="sw_rw" placeholder="W" style="width:70px">
              <span>:</span>
              <input type="number" id="sw_rh" placeholder="H" style="width:70px">
            </div>
            <div class="inline-fields">
              New Width:
              <input type="number" id="sw_neww" placeholder="px">
            </div>
            <button class="calc-btn" onclick="scaleByW()">Calculate Height</button>
            <div class="result" id="scaleWResult">—</div>
          </div>
          <div class="calc-card">
            <h4>Scale by Height</h4>
            <div class="inline-fields">
              Ratio:
              <input type="number" id="sh_rw" placeholder="W" style="width:70px">
              <span>:</span>
              <input type="number" id="sh_rh" placeholder="H" style="width:70px">
            </div>
            <div class="inline-fields">
              New Height:
              <input type="number" id="sh_newh" placeholder="px">
            </div>
            <button class="calc-btn" onclick="scaleByH()">Calculate Width</button>
            <div class="result" id="scaleHResult">—</div>
          </div>
        </div>
      </div>
      <div class="panel">
        <h3>Common Ratios</h3>
        <div class="common-grid" id="commonGrid"></div>
        <div class="preview-box" id="previewBox" style="height:20px;margin-top:14px"></div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/function/scripts/atlas.js"></script>
  <script>
    loadSnippets('Aspect Ratio Calculator');

    function gcd(a,b){ return b===0?a:gcd(b,a%b); }

    function findRatio() {
      const w=parseInt(document.getElementById('rw').value), h=parseInt(document.getElementById('rh').value);
      if(isNaN(w)||isNaN(h)||w<=0||h<=0) return;
      const d=gcd(w,h);
      const rw=w/d, rh=h/d;
      document.getElementById('ratioResult').textContent = rw+':'+rh + ' (' + (w/h).toFixed(4) + ')';
      updatePreview(rw,rh);
    }

    function scaleByW() {
      const rw=parseInt(document.getElementById('sw_rw').value), rh=parseInt(document.getElementById('sw_rh').value);
      const nw=parseInt(document.getElementById('sw_neww').value);
      if(isNaN(rw)||isNaN(rh)||isNaN(nw)) return;
      const nh=Math.round(nw*rh/rw);
      document.getElementById('scaleWResult').textContent = nw+'×'+nh+'px';
    }

    function scaleByH() {
      const rw=parseInt(document.getElementById('sh_rw').value), rh=parseInt(document.getElementById('sh_rh').value);
      const nh=parseInt(document.getElementById('sh_newh').value);
      if(isNaN(rw)||isNaN(rh)||isNaN(nh)) return;
      const nw=Math.round(nh*rw/rh);
      document.getElementById('scaleHResult').textContent = nw+'×'+nh+'px';
    }

    function updatePreview(rw,rh) {
      const maxW = document.getElementById('previewBox').offsetWidth;
      const maxH = 200;
      let pw=maxW, ph=Math.round(maxW*rh/rw);
      if(ph>maxH){ph=maxH; pw=Math.round(maxH*rw/rh);}
      document.getElementById('previewBox').style.height = ph+'px';
      document.getElementById('previewBox').style.width = pw+'px';
      document.getElementById('previewBox').style.margin = '14px auto 0';
      document.getElementById('previewBox').textContent = rw+':'+rh;
    }

    const commonRatios = [
      {ratio:'1:1',name:'Square',w:1,h:1},{ratio:'4:3',name:'Standard',w:4,h:3},{ratio:'16:9',name:'Widescreen',w:16,h:9},
      {ratio:'16:10',name:'Monitor',w:16,h:10},{ratio:'21:9',name:'Ultrawide',w:21,h:9},{ratio:'3:2',name:'Photo / APS-C',w:3,h:2},
      {ratio:'2:3',name:'Portrait',w:2,h:3},{ratio:'4:5',name:'Instagram',w:4,h:5},{ratio:'9:16',name:'Stories / TikTok',w:9,h:16},
      {ratio:'5:4',name:'Large Format',w:5,h:4},{ratio:'1.85:1',name:'Cinema',w:1.85,h:1},{ratio:'2.39:1',name:'CinemaScope',w:2.39,h:1}
    ];

    function buildCommonGrid() {
      const grid = document.getElementById('commonGrid');
      commonRatios.forEach(r=>{
        const card = document.createElement('div');
        card.className = 'common-card';
        card.innerHTML = `<div class="ratio">${r.ratio}</div><div class="name">${r.name}</div>`;
        card.onclick = () => updatePreview(r.w, r.h);
        grid.appendChild(card);
      });
    }

    buildCommonGrid();
    updatePreview(16,9);
  </script>
