    .person-row button{background:none;border:1.5px solid #ccc;border-radius:8px;padding:9px 11px;font-size:15px;cursor:pointer;color:#888}

<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Bill Splitter</h2>
        <p>Split any bill between any number of people, with tip and custom shares.</p>
      </div>
      <div class="layout2">
        <div class="panel">
          <h3>Bill Details</h3>
          <div class="field"><label>Total Bill</label><div class="input-prefix"><input type="number" id="billTotal" value="80" min="0" step="0.01" oninput="calculate()"></div></div>
          <div class="field">
            <label>Tip %</label>
            <input type="number" id="tipPct" value="18" min="0" max="100" step="1" oninput="calculate()">
            <div class="tip-quick">
              <button class="tip-btn" onclick="setTip(0)">0%</button>
              <button class="tip-btn" onclick="setTip(10)">10%</button>
              <button class="tip-btn" onclick="setTip(15)">15%</button>
              <button class="tip-btn active" onclick="setTip(18)">18%</button>
              <button class="tip-btn" onclick="setTip(20)">20%</button>
              <button class="tip-btn" onclick="setTip(25)">25%</button>
            </div>
          </div>
          <div class="field"><label>Tax %</label><input type="number" id="taxPct" value="0" min="0" max="30" step="0.1" oninput="calculate()"></div>
          <div class="field"><label>Split Mode</label>
            <select id="splitMode" onchange="calculate()">
              <option value="equal">Split Equally</option>
              <option value="custom">Custom Amounts</option>
            </select>
          </div>
          <h3 style="margin-top:8px">People</h3>
          <div class="person-list" id="personList"></div>
          <button class="add-btn" onclick="addPerson()">+ Add Person</button>
          <button class="atlas-btn" onclick="calculate()">Calculate Split</button>
        </div>
        <div>
          <div class="panel">
            <h3>Summary</h3>
            <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">$0.00</span></div>
            <div class="summary-row"><span>Tax</span><span id="sumTax">$0.00</span></div>
            <div class="summary-row"><span>Tip</span><span id="sumTip">$0.00</span></div>
            <div class="summary-row"><span>Total</span><span id="sumTotal">$0.00</span></div>
          </div>
          <div class="result-card" id="resultCard">
            <h4>Each Person Pays</h4>
            <div id="personResults"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/function/scripts/atlas.js"></script>
  <script>
    loadSnippets('Bill Splitter');

    let people = ['Alex','Sam','Jordan','Casey'];

    function renderPeople() {
      const list = document.getElementById('personList');
      const isCustom = document.getElementById('splitMode').value === 'custom';
      list.innerHTML = '';
      people.forEach((p,i) => {
        const row = document.createElement('div');
        row.className = 'person-row';
        row.innerHTML = `
          <input type="text" value="${p}" placeholder="Name" oninput="people[${i}]=this.value;calculate()">
          ${isCustom?`<div style="position:relative;flex-shrink:0"><span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#888;font-size:14px;pointer-events:none">$</span><input type="number" id="custom_${i}" value="0" min="0" step="0.01" style="width:90px;padding:10px 10px 10px 24px" oninput="calculate()"></div>`:''}
          <button onclick="removePerson(${i})">×</button>
        `;
        list.appendChild(row);
      });
    }

    function addPerson() { people.push('Person '+(people.length+1)); renderPeople(); calculate(); }
    function removePerson(i) { if(people.length>1){people.splice(i,1); renderPeople(); calculate();} }
    function setTip(v) {
      document.getElementById('tipPct').value=v;
      document.querySelectorAll('.tip-btn').forEach(b=>b.classList.toggle('active',b.textContent===v+'%'));
      calculate();
    }

    function calculate() {
      renderPeople();
      const subtotal = parseFloat(document.getElementById('billTotal').value)||0;
      const tipPct = parseFloat(document.getElementById('tipPct').value)||0;
      const taxPct = parseFloat(document.getElementById('taxPct').value)||0;
      const tax = subtotal*(taxPct/100);
      const tip = subtotal*(tipPct/100);
      const total = subtotal+tax+tip;
      const fmt = n=>'$'+n.toFixed(2);

      document.getElementById('sumSubtotal').textContent=fmt(subtotal);
      document.getElementById('sumTax').textContent=fmt(tax);
      document.getElementById('sumTip').textContent=fmt(tip);
      document.getElementById('sumTotal').textContent=fmt(total);

      const mode = document.getElementById('splitMode').value;
      let perPerson;
      if (mode==='equal') {
        const share = total/people.length;
        perPerson = people.map(p=>({name:p,amount:share}));
      } else {
        const customAmts = people.map((_,i)=>parseFloat(document.getElementById('custom_'+i)?.value)||0);
        const customTotal = customAmts.reduce((s,a)=>s+a,0);
        const scale = customTotal>0 ? total/customTotal : 0;
        perPerson = people.map((p,i)=>({name:p,amount:customAmts[i]*scale}));
      }

      document.getElementById('personResults').innerHTML = perPerson.map(p=>`
        <div class="person-result">
          <span>${p.name||'Person'}</span>
          <span class="amount">${fmt(p.amount)}</span>
        </div>`).join('');
    }

    renderPeople(); calculate();
  </script>
<script src="/pergamon-data/indexing/generator.js"></script><script src="/pergamon-data/indexing/auto-atlas.js"></script>
</body>
