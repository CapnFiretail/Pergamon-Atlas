  <script>
    loadSnippets('Age Calculator');

    // default calcDate to today
    const today = new Date();
    document.getElementById('calcDate').value = today.toISOString().split('T')[0];

    function calculate() {
      const dob = new Date(document.getElementById('dob').value);
      const calc = new Date(document.getElementById('calcDate').value);
      if (isNaN(dob)||isNaN(calc)) return;
      if (dob > calc) { alert('Date of birth cannot be after the calculation date.'); return; }

      let years = calc.getFullYear() - dob.getFullYear();
      let months = calc.getMonth() - dob.getMonth();
      let days = calc.getDate() - dob.getDate();
      if (days < 0) { months--; const prev = new Date(calc.getFullYear(), calc.getMonth(), 0); days += prev.getDate(); }
      if (months < 0) { years--; months += 12; }

      const totalDays = Math.floor((calc - dob) / 86400000);
      const totalWeeks = Math.floor(totalDays / 7);
      const totalHours = totalDays * 24;
      const totalMinutes = totalHours * 60;
      const totalMonths = years * 12 + months;

      document.getElementById('ageYears').textContent = years;
      document.getElementById('resYears').textContent = years;
      document.getElementById('resMonths').textContent = totalMonths.toLocaleString();
      document.getElementById('resDays').textContent = totalDays.toLocaleString();
      document.getElementById('resWeeks').textContent = totalWeeks.toLocaleString();
      document.getElementById('resHours').textContent = totalHours.toLocaleString();
      document.getElementById('resMinutes').textContent = totalMinutes.toLocaleString();

      // next birthday
      let nextBday = new Date(calc.getFullYear(), dob.getMonth(), dob.getDate());
      if (nextBday <= calc) nextBday.setFullYear(nextBday.getFullYear() + 1);
      const daysUntil = Math.ceil((nextBday - calc) / 86400000);
      const bmonth = nextBday.toLocaleString('default',{month:'long'});
      document.getElementById('nextBday').innerHTML =
        '<strong>Next Birthday:</strong> ' + bmonth + ' ' + nextBday.getDate() + ', ' + nextBday.getFullYear() +
        ' — <strong>' + daysUntil + ' days away</strong>';

      document.getElementById('bigAge').style.display = 'block';
      document.getElementById('resultPanel').style.display = 'block';
    }
  </script>
