<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Grade Calculator</h2>
        <p>Calculate your weighted course grade from assignments, tests, and exams.</p>
      </div>
      <div class="layout2">
        <div class="panel">
          <h3>Assignments</h3>
          <div class="col-header"><span>Name</span><span>Score</span><span>Max</span><span>Weight %</span><span></span></div>
          <div class="assignment-list" id="assignList"></div>
          <button class="add-btn" onclick="addAssignment()">+ Add Assignment</button>
          <button class="atlas-btn" onclick="calculate()">Calculate Grade</button>
        </div>
        <div>
          <div class="grade-display" id="gradeDisplay">
            <div class="grade-big" id="gradePct">—</div>
            <div class="grade-letter" id="gradeLetter"></div>
            <div class="grade-desc" id="gradeDesc">Enter assignments to calculate</div>
          </div>
          <div class="panel">
            <h3>Breakdown</h3>
            <div class="breakdown-list" id="breakdownList"></div>
          </div>
          <div class="panel">
            <div class="what-if">
              <h4>What grade do I need?</h4>
              <div class="wi-row">
                <label>Final exam weight:</label>
                <input type="number" id="wiWeight" value="30" min="0" max="100"> %
              </div>
              <div class="wi-row">
                <label>Target grade:</label>
                <input type="number" id="wiTarget" value="90" min="0" max="100"> %
              </div>
              <button class="atlas-btn" style="padding:9px 16px;font-size:14px" onclick="whatIf()">Calculate</button>
              <div class="wi-result" id="wiResult" style="display:none"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/function/scripts/atlas.js"></script>
  <script>
    loadSnippets('Grade Calculator');

    let assignments = [
      {name:'Homework 1', score:88, max:100, weight:10},
      {name:'Quiz 1', score:75, max:100, weight:10},
      {name:'Midterm Exam', score:82, max:100, weight:30},
      {name:'Project', score:90, max:100, weight:20},
    ];

    function renderList() {
      const list = document.getElementById('assignList');
      list.innerHTML = '';
      assignments.forEach((a, i) => {
        const row = document.createElement('div');
        row.className = 'assignment-row';
        row.innerHTML = `
          <input type="text" value="${a.name}" placeholder="Name" oninput="assignments[${i}].name=this.value">
          <input type="number" value="${a.score}" min="0" oninput="assignments[${i}].score=parseFloat(this.value)||0">
          <input type="number" value="${a.max}" min="1" oninput="assignments[${i}].max=parseFloat(this.value)||100">
          <input type="number" value="${a.weight}" min="0" max="100" oninput="assignments[${i}].weight=parseFloat(this.value)||0">
          <button onclick="removeAssignment(${i})">×</button>
        `;
        list.appendChild(row);
      });
      calculate();
    }

    function addAssignment() { assignments.push({name:'',score:0,max:100,weight:10}); renderList(); }
    function removeAssignment(i) { assignments.splice(i,1); renderList(); }

    function letterGrade(pct) {
      if(pct>=97) return 'A+'; if(pct>=93) return 'A'; if(pct>=90) return 'A-';
      if(pct>=87) return 'B+'; if(pct>=83) return 'B'; if(pct>=80) return 'B-';
      if(pct>=77) return 'C+'; if(pct>=73) return 'C'; if(pct>=70) return 'C-';
      if(pct>=67) return 'D+'; if(pct>=63) return 'D'; if(pct>=60) return 'D-';
      return 'F';
    }

    function calculate() {
      const validAss = assignments.filter(a=>a.max>0);
      if (!validAss.length) return;

      const totalWeight = validAss.reduce((s,a)=>s+a.weight,0);
      let weightedSum = 0;
      validAss.forEach(a => {
        const pct = (a.score/a.max)*100;
        weightedSum += pct * (a.weight/(totalWeight||1));
      });

      const pct = weightedSum;
      const letter = letterGrade(pct);

      document.getElementById('gradePct').textContent = pct.toFixed(1)+'%';
      document.getElementById('gradeLetter').textContent = letter;
      document.getElementById('gradeDesc').textContent = totalWeight!==100 ? 'Note: weights total '+totalWeight+'% (not 100%)' : '';

      document.getElementById('breakdownList').innerHTML = validAss.map(a=>{
        const p=(a.score/a.max*100).toFixed(1);
        return `<div class="breakdown-row"><span class="cat">${a.name||'Assignment'}</span><span class="score">${p}% (${a.weight}% weight)</span></div>`;
      }).join('');
    }

    function whatIf() {
      const finalWeight = parseFloat(document.getElementById('wiWeight').value)||30;
      const target = parseFloat(document.getElementById('wiTarget').value)||90;
      const validAss = assignments.filter(a=>a.max>0);
      const currentWeight = validAss.reduce((s,a)=>s+a.weight,0);
      const currentWeightedSum = validAss.reduce((s,a)=>s+(a.score/a.max*100)*(a.weight/100),0);
      const needed = (target - currentWeightedSum*(100/(100))) / (finalWeight/100);
      const result = document.getElementById('wiResult');
      result.style.display='block';
      if (needed>100) result.textContent='You need more than 100% on the final — not possible without extra credit.';
      else if (needed<0) result.textContent='You already have your target grade — you can score 0% on the final!';
      else result.textContent='You need at least ' + needed.toFixed(1) + '% on the final exam to reach ' + target + '%.';
    }

    renderList();
  </script>
<script src="/pergamon-data/indexing/generator.js"></script><script src="/pergamon-data/indexing/auto-atlas.js"></script>
</body>
