        <p>Work in focused 25-minute sprints. Short breaks keep you sharp. Long breaks recharge you.</p>
      </div>
      <div class="layout2">
        <div class="panel">
          <div class="mode-tabs">
            <button class="mode-tab active" id="tab-work" onclick="switchMode('work')">Focus</button>
            <button class="mode-tab" id="tab-short" onclick="switchMode('short')">Short Break</button>

          </div>

            <svg viewBox="0 0 260 260" width="260" height="260">
              <circle class="bg" cx="130" cy="130" r="110"/>
              <circle class="progress" id="progressCircle" cx="130" cy="130" r="110" stroke-dasharray="691" stroke-dashoffset="0"/>
            </svg>
            <div class="timer-display">
              <div class="timer-time" id="timerTime">25:00</div>
              <div class="timer-label" id="timerLabel">Focus Time</div>
            </div>
          </div>
          <div class="btn-row">
            <button class="atlas-btn secondary" onclick="resetTimer()">Reset</button>

            <div class="settings-field"><label>Focus (minutes)</label><input type="number" id="setWork" value="25" min="1" max="60"></div>
            <div class="settings-field"><label>Short Break (minutes)</label><input type="number" id="setShort" value="5" min="1" max="30"></div>
            <div class="settings-field"><label>Long Break (minutes)</label><input type="number" id="setLong" value="15" min="1" max="60"></div>
            <button class="atlas-btn primary" style="width:100%;margin-top:4px" onclick="applySettings()">Apply</button>
          </div>

            <div class="stat-row"><span>Focus Sessions</span><span id="statSessions">0</span></div>
            <div class="stat-row"><span>Total Focus Time</span><span id="statTime">0 min</span></div>
            <div class="stat-row"><span>Breaks Taken</span><span id="statBreaks">0</span></div>
          </div>
          <div class="panel">
            <h3>Session Log</h3>

  <script>
    loadSnippets('Pomodoro Timer');

    const CIRCUMFERENCE = 2 * Math.PI * 110;
    let durations = {work:25*60, short:5*60, long:15*60};
    let mode = 'work';
    let timeLeft = durations.work;
    let running = false;
    let interval = null;
    let sessions = 0, breaks = 0, totalFocusSecs = 0;
    let sessionFocusSecs = 0;
    let log = [];

    const modeLabels = {work:'Focus Time', short:'Short Break', long:'Long Break'};
    const modeColors = {work:'#c28a2b', short:'#4caf50', long:'#2196f3'};

    function switchMode(m) {
      clearInterval(interval); running = false;
      mode = m;
      timeLeft = durations[m];
      sessionFocusSecs = 0;
      ['work','short','long'].forEach(t=>{
        document.getElementById('tab-'+t).classList.toggle('active',t===m);
      });
      document.querySelector('.progress').style.stroke = modeColors[m];
      document.getElementById('startBtn').textContent = 'Start';
      render();
    }

    function render() {
      const total = durations[mode];
      const pct = timeLeft / total;
      document.querySelector('.progress').style.strokeDashoffset = CIRCUMFERENCE * (1-pct);
      const m = String(Math.floor(timeLeft/60)).padStart(2,'0');
      const s = String(timeLeft%60).padStart(2,'0');
      document.getElementById('timerTime').textContent = m+':'+s;
      document.getElementById('timerLabel').textContent = modeLabels[mode];
      document.title = m+':'+s + ' — Pomodoro';
    }

    function toggleTimer() {
      if (running) {
        clearInterval(interval); running = false;
        document.getElementById('startBtn').textContent = 'Resume';
      } else {
        running = true;
        document.getElementById('startBtn').textContent = 'Pause';
        interval = setInterval(() => {
          timeLeft--;
          if (mode === 'work') sessionFocusSecs++;
          render();
          if (timeLeft <= 0) sessionComplete();
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(interval); running = false;
      timeLeft = durations[mode];
      sessionFocusSecs = 0;
      document.getElementById('startBtn').textContent = 'Start';
      render();
    }

    function skipSession() { sessionComplete(); }

    function sessionComplete() {
      clearInterval(interval); running = false;
      if (mode === 'work') {
        sessions++;
        totalFocusSecs += sessionFocusSecs;
        log.unshift({type:'work', label:'Focus Session', duration: Math.round(sessionFocusSecs/60)+'m'});
      } else {
        breaks++;
        log.unshift({type:'break', label:mode==='short'?'Short Break':'Long Break', duration:Math.round((durations[mode]-timeLeft)/60)+'m'});
      }
      updateStats(); renderLog();
      try { new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAA').play(); } catch(e){}
      alert(mode==='work' ? 'Focus session complete! Take a break.' : 'Break over! Ready to focus?');
      switchMode(mode==='work' ? (sessions%4===0?'long':'short') : 'work');
    }

    function updateStats() {
      document.getElementById('statSessions').textContent = sessions;
      document.getElementById('statTime').textContent = Math.round(totalFocusSecs/60) + ' min';
      document.getElementById('statBreaks').textContent = breaks;
    }

    function renderLog() {
      if (!log.length) return;
      const time = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      document.getElementById('sessionLog').innerHTML = log.slice(0,20).map(l=>
        `<div class="log-item"><span class="log-type ${l.type}">${l.label}</span><span>${l.duration} · ${time}</span></div>`
      ).join('');
    }

    function applySettings() {
      durations.work = parseInt(document.getElementById('setWork').value)*60||25*60;
      durations.short = parseInt(document.getElementById('setShort').value)*60||5*60;
      durations.long = parseInt(document.getElementById('setLong').value)*60||15*60;
      switchMode(mode);
    }

    render();
  </script>
