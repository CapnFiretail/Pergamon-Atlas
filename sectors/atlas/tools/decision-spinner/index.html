<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612" crossorigin="anonymous"></script>
  <title>Pergamon Atlas | Decision Spinner</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/function/styles/header.css">
  <link rel="stylesheet" href="/function/styles/sidebar.css">
  <link rel="stylesheet" href="/function/styles/main.css">
  <link rel="stylesheet" href="/function/styles/footer.css">
  <style>
    .tool-hero{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);color:white;border:2px solid #8a611c;border-radius:16px;padding:28px;margin-bottom:24px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
    .tool-hero h2{margin:0 0 10px;font-size:clamp(28px,4vw,42px);color:#f0d39b}
    .tool-hero p{margin:0;font-size:17px;line-height:1.7;color:#f3f3f3}
    .layout2{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
    .panel{background:white;border:2px solid #000;border-radius:16px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:16px}
    .panel h3{margin:0 0 14px;font-size:22px}
    .wheel-wrap{position:relative;display:flex;justify-content:center;align-items:center;margin-bottom:20px}
    canvas{border-radius:50%;display:block}
    .pointer{position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;border-right:24px solid #111}
    .result-banner{background:#111;color:#f0d39b;border-radius:12px;padding:20px;text-align:center;margin-bottom:14px;min-height:64px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
    .atlas-btn{width:100%;border:none;border-radius:10px;padding:13px;font-size:16px;font-family:Georgia,serif;cursor:pointer;transition:.15s;margin-bottom:10px}
    .atlas-btn.primary{background:#000;color:white}
    .atlas-btn.primary:hover{background:#222}
    .option-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
    .option-row{display:flex;gap:8px;align-items:center}
    .option-row input{flex:1;padding:10px;border:1.5px solid #ccc;border-radius:9px;font-size:15px;font-family:Georgia,serif}
    .option-row input:focus{outline:none;border-color:#8a611c}
    .option-row button{background:none;border:1.5px solid #ccc;border-radius:8px;padding:8px 11px;font-size:15px;cursor:pointer;color:#888}
    .option-row button:hover{border-color:#c00;color:#c00}
    .add-btn{border:1.5px dashed #ccc;border-radius:9px;padding:9px;width:100%;font-size:14px;font-family:Georgia,serif;background:none;cursor:pointer;transition:.15s}
    .add-btn:hover{border-color:#8a611c;color:#8a611c}
    @media(max-width:900px){.layout2{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Decision Spinner</h2>
        <p>Can't decide? Add your options and spin the wheel.</p>
      </div>
      <div class="layout2">
        <div>
          <div class="panel">
            <div class="wheel-wrap">
              <canvas id="wheel" width="320" height="320"></canvas>
              <div class="pointer"></div>
            </div>
            <div class="result-banner" id="result">Spin to decide!</div>
            <button class="atlas-btn primary" id="spinBtn" onclick="spin()">Spin!</button>
          </div>
        </div>
        <div class="panel">
          <h3>Options</h3>
          <div class="option-list" id="optionList"></div>
          <button class="add-btn" onclick="addOption()">+ Add Option</button>
        </div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/function/scripts/atlas.js"></script>
  <script>
    loadSnippets('Decision Spinner');

    const COLORS = ['#c28a2b','#111','#8a611c','#2d2d2d','#e0b35a','#444','#f0d39b','#1a1a1a','#6b4c1e','#333'];
    let options = ['Pizza','Tacos','Sushi','Burger','Pasta'];
    let spinning = false;
    let currentAngle = 0;

    function renderOptions() {
      const list = document.getElementById('optionList');
      list.innerHTML = '';
      options.forEach((opt, i) => {
        const row = document.createElement('div');
        row.className = 'option-row';
        const input = document.createElement('input');
        input.type = 'text'; input.value = opt; input.placeholder = 'Option ' + (i+1);
        input.oninput = () => { options[i] = input.value; drawWheel(); };
        const del = document.createElement('button');
        del.textContent = '×';
        del.onclick = () => { if(options.length>2){options.splice(i,1);renderOptions();drawWheel();} };
        row.appendChild(input); row.appendChild(del);
        list.appendChild(row);
      });
    }

    function addOption() {
      if (options.length >= 12) return;
      options.push('Option ' + (options.length+1));
      renderOptions(); drawWheel();
    }

    function drawWheel(highlightIdx = -1) {
      const canvas = document.getElementById('wheel');
      const ctx = canvas.getContext('2d');
      const cx = 160, cy = 160, r = 150;
      const n = options.length;
      const arc = (2*Math.PI)/n;
      ctx.clearRect(0,0,320,320);

      options.forEach((opt, i) => {
        const startAngle = currentAngle + i*arc - Math.PI/2;
        const endAngle = startAngle + arc;
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,r,startAngle,endAngle);
        ctx.closePath();
        ctx.fillStyle = i===highlightIdx ? '#f0d39b' : COLORS[i%COLORS.length];
        ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

        ctx.save();
        ctx.translate(cx,cy);
        ctx.rotate(startAngle+arc/2);
        ctx.textAlign = 'right';
        ctx.fillStyle = i===highlightIdx ? '#111' : (i%2===0?'#fff':'#f0d39b');
        const maxLen = 14;
        const label = opt.length > maxLen ? opt.slice(0,maxLen)+'…' : opt;
        ctx.font = 'bold ' + (n<=6?'14px':'12px') + ' Georgia, serif';
        ctx.fillText(label, r-10, 5);
        ctx.restore();
      });

      // center circle
      ctx.beginPath();
      ctx.arc(cx,cy,22,0,2*Math.PI);
      ctx.fillStyle='#111'; ctx.fill();
      ctx.strokeStyle='#f0d39b'; ctx.lineWidth=3; ctx.stroke();
    }

    function spin() {
      if (spinning || options.filter(o=>o.trim()).length < 2) return;
      spinning = true;
      document.getElementById('spinBtn').disabled = true;
      document.getElementById('result').textContent = 'Spinning...';

      const n = options.length;
      const extraSpins = (5 + Math.floor(Math.random()*5)) * 2*Math.PI;
      const targetSlice = Math.floor(Math.random()*n);
      const arc = 2*Math.PI/n;
      const targetAngle = extraSpins - (targetSlice * arc);
      const startAngle = currentAngle;
      const totalRotation = targetAngle + (arc/2);
      const duration = 3000 + Math.random()*1500;
      const startTime = performance.now();

      function easeOut(t) { return 1-(1-t)*(1-t)*(1-t); }

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed/duration, 1);
        currentAngle = startAngle + totalRotation * easeOut(progress);
        drawWheel();
        if (progress < 1) { requestAnimationFrame(animate); return; }

        // find winner: pointer is at right (0 deg = right, but we offset by -PI/2)
        const normalizedAngle = ((-currentAngle % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
        const winnerIdx = Math.floor(normalizedAngle / arc) % n;
        const winner = options[winnerIdx]||options[0];
        drawWheel(winnerIdx);
        document.getElementById('result').textContent = winner + '!';
        spinning = false;
        document.getElementById('spinBtn').disabled = false;
      }
      requestAnimationFrame(animate);
    }

    renderOptions(); drawWheel();
  </script>
<script src="/pergamon-data/indexing/generator.js"></script><script src="/pergamon-data/indexing/auto-atlas.js"></script>
</body>
</html>
