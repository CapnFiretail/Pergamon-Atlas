<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="tool-hero">
        <h2>Number Base Converter</h2>
        <p>Convert numbers between Binary, Octal, Decimal, Hexadecimal, and any custom base.</p>
      </div>
      <div class="panel">
        <h3>Convert</h3>
        <div class="base-grid">
          <div class="base-box" id="box-2">
            <div class="base-label"><span class="base-name">Binary</span><span class="base-num">Base 2</span></div>
            <input class="base-input" id="inp-2" type="text" placeholder="e.g. 1010" oninput="convertFrom(2)">
            <button class="copy-btn" onclick="copyVal('inp-2')">Copy</button>
          </div>
          <div class="base-box" id="box-8">
            <div class="base-label"><span class="base-name">Octal</span><span class="base-num">Base 8</span></div>
            <input class="base-input" id="inp-8" type="text" placeholder="e.g. 12" oninput="convertFrom(8)">
            <button class="copy-btn" onclick="copyVal('inp-8')">Copy</button>
          </div>
          <div class="base-box" id="box-10">
            <div class="base-label"><span class="base-name">Decimal</span><span class="base-num">Base 10</span></div>
            <input class="base-input" id="inp-10" type="text" placeholder="e.g. 255" oninput="convertFrom(10)">
            <button class="copy-btn" onclick="copyVal('inp-10')">Copy</button>
          </div>
          <div class="base-box" id="box-16">
            <div class="base-label"><span class="base-name">Hexadecimal</span><span class="base-num">Base 16</span></div>
            <input class="base-input" id="inp-16" type="text" placeholder="e.g. FF" oninput="convertFrom(16)">
            <button class="copy-btn" onclick="copyVal('inp-16')">Copy</button>
          </div>
        </div>
        <div id="errorMsg" class="error"></div>
        <div class="custom-row">
          <div class="field"><label>Custom Input</label><input type="text" id="custInput" placeholder="Value"></div>
          <div class="field"><label>From Base</label><input type="number" id="custFrom" value="10" min="2" max="36" style="width:70px"></div>
          <div class="field"><label>To Base</label><input type="number" id="custTo" value="2" min="2" max="36" style="width:70px"></div>
          <button class="atlas-btn" onclick="customConvert()">Convert</button>
          <div id="custResult" style="align-self:flex-end;font-size:20px;font-family:monospace;font-weight:700;color:#111"></div>
        </div>
      </div>

  <script src="/function/scripts/atlas.js"></script>
  <script>
    loadSnippets('Number Base Converter');

    const bases = [2, 8, 10, 16];

    function convertFrom(fromBase) {
      const val = document.getElementById('inp-'+fromBase).value.trim().toUpperCase();
      document.getElementById('errorMsg').textContent = '';
      bases.forEach(b => document.getElementById('box-'+b).classList.toggle('active-input', b===fromBase));

      if (!val) { bases.filter(b=>b!==fromBase).forEach(b=>document.getElementById('inp-'+b).value=''); return; }

      const decimal = parseInt(val, fromBase);
      if (isNaN(decimal)) {
        document.getElementById('errorMsg').textContent = 'Invalid value for base ' + fromBase;
        return;
      }
      bases.forEach(b => {
        if (b !== fromBase) {
          const el = document.getElementById('inp-'+b);
          el.value = decimal.toString(b).toUpperCase();
        }
      });
    }

    function copyVal(id) {
      const val = document.getElementById(id).value;
      if (!val) return;
      navigator.clipboard.writeText(val);
    }

    function customConvert() {
      const val = document.getElementById('custInput').value.trim().toUpperCase();
      const fromBase = parseInt(document.getElementById('custFrom').value);
      const toBase = parseInt(document.getElementById('custTo').value);
      if (!val) return;
      const dec = parseInt(val, fromBase);
      if (isNaN(dec)) { document.getElementById('custResult').textContent = 'Invalid'; return; }
      document.getElementById('custResult').textContent = dec.toString(toBase).toUpperCase();
    }
  </script>
