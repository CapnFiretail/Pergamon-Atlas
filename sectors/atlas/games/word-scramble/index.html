  <style>
    .game-hero{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);color:white;border:2px solid #8a611c;border-radius:16px;padding:28px;margin-bottom:24px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
    .game-hero h2{margin:0 0 8px;font-size:clamp(28px,4vw,42px);color:#f0d39b}
    .game-hero p{margin:0;font-size:16px;color:#ccc}
    .panel{background:white;border:2px solid #000;border-radius:16px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:20px;text-align:center}
    .hud{display:flex;justify-content:center;gap:28px;margin-bottom:16px;font-size:15px;font-weight:700}
    .hud .val{font-size:28px;display:block;color:#8a611c;font-family:monospace}
    .scrambled{font-size:clamp(32px,7vw,52px);font-weight:900;letter-spacing:8px;color:#111;margin:24px 0 8px;font-family:monospace;text-transform:uppercase}
    .hint-text{font-size:14px;color:#888;margin-bottom:20px;min-height:20px}
    .field{display:flex;justify-content:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
    .field input{padding:14px;border:2px solid #ccc;border-radius:10px;font-size:20px;font-family:monospace;text-align:center;width:200px;text-transform:uppercase;outline:none;transition:border .15s}
    .field input:focus{border-color:#8a611c}
    .field input.correct{border-color:#2a9d3a;background:#e9fbe9}
    .field input.wrong{border-color:#c0392b;background:#fdf0f0;animation:shake .3s}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    .btn-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
    .atlas-btn{border:none;border-radius:10px;padding:11px 22px;font-size:15px;font-family:Georgia,serif;cursor:pointer;background:#000;color:white;transition:.15s}
    .atlas-btn:hover{background:#222}
    .atlas-btn.outline{background:white;color:#111;border:2px solid #ccc}
    .atlas-btn.outline:hover{background:#f7f7f7}
    .feedback{font-size:17px;font-weight:800;min-height:26px;margin-bottom:8px}
    .feedback.win{color:#2a9d3a}
    .feedback.lose{color:#c0392b}
    .progress-row{display:flex;justify-content:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
    .prog-dot{width:12px;height:12px;border-radius:50%;background:#eee;border:1px solid #ddd}
    .prog-dot.done{background:#2a9d3a}
    .prog-dot.wrong{background:#c0392b}

<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="game-hero">
        <h2>Word Scramble</h2>
        <p>Unscramble the jumbled word as fast as you can</p>
      </div>
      <div class="panel">
        <div class="hud">
          <span><span class="val" id="scoreVal">0</span>Score</span>
          <span><span class="val" id="roundVal">1/10</span>Round</span>
          <span><span class="val" id="timeVal">15</span>Secs</span>
        </div>
        <div class="progress-row" id="progressRow"></div>
        <div class="scrambled" id="scrambled">?????</div>
        <div class="hint-text" id="hintText"></div>
        <div class="feedback" id="feedback"></div>
        <div class="field">
          <input type="text" id="answer" placeholder="Your answer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkAnswer()">
        </div>
        <div class="btn-row">
          <button class="atlas-btn" onclick="checkAnswer()">Submit</button>
          <button class="atlas-btn outline" onclick="showHint()">Hint</button>
          <button class="atlas-btn outline" onclick="skipWord()">Skip</button>
        </div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/function/scripts/atlas.js"></script>
  <script>
    loadSnippets('Word Scramble');

    const WORDS=[
      {word:'elephant',hint:'Large grey animal with a trunk'},
      {word:'calendar',hint:'Helps you track days and months'},
      {word:'mountain',hint:'Very tall landform'},
      {word:'umbrella',hint:'Used in the rain'},
      {word:'keyboard',hint:'You type on this'},
      {word:'dolphins',hint:'Intelligent ocean mammals'},
      {word:'hospital',hint:'Where you go when sick'},
      {word:'triangle',hint:'Shape with three sides'},
      {word:'language',hint:'A system of communication'},
      {word:'backpack',hint:'You carry this on your back'},
      {word:'champion',hint:'Winner of a competition'},
      {word:'treasure',hint:'Hidden valuables or riches'},
      {word:'absolute',hint:'Complete, total, without exception'},
      {word:'behavior',hint:'How you act or conduct yourself'},
      {word:'children',hint:'Young humans'},
    ];

    let round,score,secret,timer,timerInt,hintShown,results;

    function scramble(w){
      let arr=w.split('');
      do{arr.sort(()=>Math.random()-.5);}while(arr.join('')===w);
      return arr.join('').toUpperCase();
    }

    function startGame(){
      const pool=[...WORDS].sort(()=>Math.random()-.5).slice(0,10);
      round=0;score=0;results=[];
      window._pool=pool;
      buildProgress();
      nextWord();
    }

    function buildProgress(){
      document.getElementById('progressRow').innerHTML=Array(10).fill('<div class="prog-dot"></div>').join('');
    }

    function nextWord(){
      clearInterval(timerInt);hintShown=false;
      if(round>=10){endGame();return;}
      secret=window._pool[round].word;
      document.getElementById('scrambled').textContent=scramble(secret);
      document.getElementById('hintText').textContent='';
      document.getElementById('feedback').textContent='';
      document.getElementById('feedback').className='feedback';
      document.getElementById('answer').value='';document.getElementById('answer').className='';
      document.getElementById('answer').disabled=false;
      document.getElementById('roundVal').textContent=(round+1)+'/10';
      timer=15;document.getElementById('timeVal').textContent=timer;
      timerInt=setInterval(()=>{
        timer--;document.getElementById('timeVal').textContent=timer;
        if(timer<=0){clearInterval(timerInt);handleResult(false,'Time up! The word was: '+secret.toUpperCase());}
      },1000);
      document.getElementById('answer').focus();
    }

    function checkAnswer(){
      const ans=document.getElementById('answer').value.trim().toLowerCase();
      if(!ans) return;
      if(ans===secret) handleResult(true,'Correct!');
      else{
        const inp=document.getElementById('answer');
        inp.classList.add('wrong');
        setTimeout(()=>inp.classList.remove('wrong'),400);
        document.getElementById('feedback').textContent='Try again!';
        document.getElementById('feedback').className='feedback lose';
      }
    }

    function handleResult(correct,msg){
      clearInterval(timerInt);
      document.getElementById('answer').disabled=true;
      if(correct){
        score+=hintShown?5:10;
        document.getElementById('scoreVal').textContent=score;
        document.getElementById('feedback').textContent=msg;
        document.getElementById('feedback').className='feedback win';
        document.getElementById('answer').className='correct';
      } else {
        document.getElementById('feedback').textContent=msg;
        document.getElementById('feedback').className='feedback lose';
      }
      const dots=document.getElementById('progressRow').children;
      if(dots[round]) dots[round].className='prog-dot '+(correct?'done':'wrong');
      results.push(correct);
      round++;
      setTimeout(nextWord,1200);
    }

    function showHint(){
      if(hintShown) return;
      hintShown=true;
      document.getElementById('hintText').textContent='Hint: '+window._pool[round].hint;
    }

    function skipWord(){handleResult(false,'Skipped. Word was: '+secret.toUpperCase());}

    function endGame(){
      document.getElementById('scrambled').textContent='Done!';
      document.getElementById('hintText').textContent='';
      document.getElementById('roundVal').textContent='10/10';
      document.getElementById('timeVal').textContent='—';
      const correct=results.filter(Boolean).length;
      document.getElementById('feedback').textContent=`Final score: ${score} pts — ${correct}/10 correct`;
      document.getElementById('feedback').className='feedback win';
      document.getElementById('answer').style.display='none';
      setTimeout(()=>{document.getElementById('answer').style.display='';startGame();},4000);
    }

    startGame();
  </script>
<script src="/pergamon-data/indexing/generator.js"></script><script src="/pergamon-data/indexing/auto-atlas.js"></script>
