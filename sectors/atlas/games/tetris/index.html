  <script>
  const COLS=10,ROWS=20,CELL=30;
  const COLORS=['#c28a2b','#8a611c','#d4a03a','#a07820','#f0d070','#6a4a10','#b08030'];
  const PIECES=[
    [[0,0],[0,1],[0,2],[0,3]],   // I
    [[0,0],[0,1],[1,0],[1,1]],   // O
    [[0,0],[0,1],[0,2],[1,1]],   // T
    [[0,1],[0,2],[1,0],[1,1]],   // S
    [[0,0],[0,1],[1,1],[1,2]],   // Z
    [[0,0],[1,0],[1,1],[1,2]],   // J
    [[0,2],[1,0],[1,1],[1,2]]    // L
  ];

  const canvas=document.getElementById('tetCanvas');
  const ctx=canvas.getContext('2d');
  const nCanvas=document.getElementById('nextCanvas');
  const nCtx=nCanvas.getContext('2d');

  let board,piece,pieceType,pieceColor,nextType,nextColor,score,lines,level,paused,gameRunning,dropInt;

  function rotate(cells){
    const maxR=Math.max(...cells.map(c=>c[0]));
    return cells.map(([r,c])=>[c,maxR-r]);
  }

  function newPiece(){
    pieceType=nextType;pieceColor=nextColor;
    const shape=PIECES[pieceType].map(c=>[...c]);
    piece={cells:shape,r:0,c:Math.floor((COLS-4)/2)};
    nextType=Math.floor(Math.random()*PIECES.length);
    nextColor=COLORS[nextType];
    drawNext();
  }

  function startGame(){
    board=Array(ROWS).fill(null).map(()=>Array(COLS).fill(0));
    score=0;lines=0;level=1;paused=false;gameRunning=true;
    nextType=Math.floor(Math.random()*PIECES.length);
    nextColor=COLORS[nextType];
    newPiece();
    document.getElementById('tetOverlay').classList.add('hidden');
    clearInterval(dropInt); dropInt=setInterval(drop,getSpeed());
    updateStats(); draw();
  }

  function getSpeed(){return Math.max(100,700-level*60);}

  function valid(cells,dr,dc,rot){
    return cells.every(([r,c])=>{
      const nr=r+(rot?0:dr),nc=c+(rot?0:dc);
      if(rot){const [rr,rc]=rot;return rr+piece.r>=0&&rr+piece.r<ROWS&&rc+piece.c>=0&&rc+piece.c<COLS&&!board[rr+piece.r][rc+piece.c];}
      return nr+piece.r>=0&&nr+piece.r<ROWS&&nc+piece.c>=0&&nc+piece.c<COLS&&!board[nr+piece.r][nc+piece.c];
    });
  }

  function canPlace(cells,pr,pc){
    return cells.every(([r,c])=>{
      const nr=r+pr,nc=c+pc;
      return nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&!board[nr][nc];
    });
  }

  function drop(){
    if(!gameRunning||paused)return;
    if(canPlace(piece.cells,piece.r+1,piece.c)){piece.r++;}
    else{lock();newPiece();if(!canPlace(piece.cells,piece.r,piece.c)){endGame();return;}}
    draw();
  }

  function lock(){
    piece.cells.forEach(([r,c])=>board[r+piece.r][c+piece.c]=pieceColor);
    clearLines();
  }

  function clearLines(){
    let cleared=0;
    for(let r=ROWS-1;r>=0;r--){
      if(board[r].every(c=>c)){board.splice(r,1);board.unshift(Array(COLS).fill(0));cleared++;r++;}
    }
    if(cleared){
      const pts=[0,100,300,500,800];
      score+=pts[cleared]*level;
      lines+=cleared;
      level=Math.floor(lines/10)+1;
      clearInterval(dropInt);dropInt=setInterval(drop,getSpeed());
      updateStats();
    }
  }

  function hardDrop(){
    while(canPlace(piece.cells,piece.r+1,piece.c))piece.r++;
    lock();newPiece();
    if(!canPlace(piece.cells,piece.r,piece.c)){endGame();return;}
    draw();
  }

  function endGame(){
    gameRunning=false;clearInterval(dropInt);
    const ov=document.getElementById('tetOverlay');
    ov.classList.remove('hidden');
    ov.innerHTML=`<h3>Game Over</h3><p>Score: ${score} | Lines: ${lines}</p>`;
  }

  function togglePause(){
    if(!gameRunning)return;
    paused=!paused;
    if(paused)clearInterval(dropInt);
    else dropInt=setInterval(drop,getSpeed());
  }

  function updateStats(){
    document.getElementById('scoreEl').textContent=score;
    document.getElementById('linesEl').textContent=lines;
    document.getElementById('levelEl').textContent=level;
  }

  function ghostRow(){
    let gr=piece.r;
    while(canPlace(piece.cells,gr+1,piece.c))gr++;
    return gr;
  }

  function draw(){
    ctx.fillStyle='#111';ctx.fillRect(0,0,canvas.width,canvas.height);
    // Board
    board.forEach((row,r)=>row.forEach((col,c)=>{
      if(col){ctx.fillStyle=col;ctx.fillRect(c*CELL+1,r*CELL+1,CELL-2,CELL-2);}
    }));
    // Grid lines
    ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=1;
    for(let r=0;r<ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*CELL);ctx.lineTo(COLS*CELL,r*CELL);ctx.stroke();}
    for(let c=0;c<COLS;c++){ctx.beginPath();ctx.moveTo(c*CELL,0);ctx.lineTo(c*CELL,ROWS*CELL);ctx.stroke();}
    // Ghost
    const gr=ghostRow();
    piece.cells.forEach(([r,c])=>{
      ctx.fillStyle='rgba(255,255,255,.1)';
      ctx.fillRect((c+piece.c)*CELL+1,(r+gr)*CELL+1,CELL-2,CELL-2);
    });
    // Piece
    piece.cells.forEach(([r,c])=>{
      ctx.fillStyle=pieceColor;
      ctx.fillRect((c+piece.c)*CELL+1,(r+piece.r)*CELL+1,CELL-2,CELL-2);
    });
  }

  function drawNext(){
    nCtx.fillStyle='#1a1a1a';nCtx.fillRect(0,0,100,100);
    const cells=PIECES[nextType];
    const nc=25;
    cells.forEach(([r,c])=>{
      nCtx.fillStyle=nextColor;
      nCtx.fillRect(c*nc+12,r*nc+25,nc-2,nc-2);
    });
  }

  document.addEventListener('keydown',e=>{
    if(!gameRunning||paused)return;
    if(e.key==='ArrowLeft'){if(canPlace(piece.cells,piece.r,piece.c-1))piece.c--;draw();}
    else if(e.key==='ArrowRight'){if(canPlace(piece.cells,piece.r,piece.c+1))piece.c++;draw();}
    else if(e.key==='ArrowDown'){drop();}
    else if(e.key==='ArrowUp'||e.key==='z'){
      const rot=rotate(piece.cells);
      if(canPlace(rot,piece.r,piece.c)){piece.cells=rot;}
      draw();
    }
    else if(e.key===' '){e.preventDefault();hardDrop();}
  });
  </script>
