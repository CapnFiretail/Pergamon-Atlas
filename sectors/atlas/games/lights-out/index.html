  <script>
  const SIZE=5;
  let grid,moves,won;

  function newGame(){
    grid=Array(SIZE).fill(null).map(()=>Array(SIZE).fill(false));
    // Generate by applying 8–14 random clicks from solved state
    const clicks=8+Math.floor(Math.random()*7);
    for(let i=0;i<clicks;i++)toggle(Math.floor(Math.random()*SIZE),Math.floor(Math.random()*SIZE));
    moves=0;won=false;
    document.getElementById('loMsg').textContent='';
    document.getElementById('movesEl').textContent='0';
    render();
  }

  function toggle(r,c){
    [[r,c],[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([x,y])=>{
      if(x>=0&&x<SIZE&&y>=0&&y<SIZE)grid[x][y]=!grid[x][y];
    });
  }

  function handleClick(r,c){
    if(won)return;
    toggle(r,c);
    moves++;
    document.getElementById('movesEl').textContent=moves;
    const lit=grid.flat().filter(Boolean).length;
    document.getElementById('litEl').textContent=lit;
    if(lit===0){won=true;document.getElementById('loMsg').textContent=`All out in ${moves} moves!`;}
    render();
  }

  function render(){
    const g=document.getElementById('loGrid');
    g.innerHTML='';
    let lit=0;
    grid.forEach((row,r)=>row.forEach((on,c)=>{
      const d=document.createElement('div');
      d.className='lo-cell '+(on?'on':'off');
      if(on)lit++;
      d.onclick=()=>handleClick(r,c);
      g.appendChild(d);
    }));
    document.getElementById('litEl').textContent=lit;
  }

  newGame();
  </script>
