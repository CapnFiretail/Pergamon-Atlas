<body>

    <main class="main-content">
      <div class="game-hero">
        <h2>Typing Practice</h2>
        <p>Type the passage as accurately as you can. Track your WPM and accuracy.</p>
      </div>
      <div class="tp-card">
        <div class="tp-passage" id="tpPassage"></div>
        <textarea class="tp-input" id="tpInput" placeholder="Start typing here..." oninput="onInput()" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
        <div class="tp-stats">
          <div class="tp-stat"><div class="val" id="wpmEl">0</div><div class="lbl">WPM</div></div>
          <div class="tp-stat"><div class="val" id="accEl">100%</div><div class="lbl">Accuracy</div></div>
          <div class="tp-stat"><div class="val" id="timeEl">0s</div><div class="lbl">Time</div></div>
          <div class="tp-stat"><div class="val" id="errEl">0</div><div class="lbl">Errors</div></div>
        </div>
        <div class="tp-result" id="tpResult"></div>
        <div class="tp-btns">
          <button class="tp-btn" onclick="newPassage()">New Passage</button>
          <button class="tp-btn" onclick="restart()">Restart</button>
        </div>
      </div>
    </main>
  </div>

  <script>loadSnippets('Typing Practice');</script>
  <script>
  const PASSAGES=[
    "The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs.",
    "All that glitters is not gold, and not all those who wander are lost in the shadows of time.",
    "To be, or not to be — that is the question. Whether tis nobler in the mind to suffer the slings and arrows.",
    "A journey of a thousand miles begins with a single step. Patience and persistence conquer all things.",
    "In the middle of difficulty lies opportunity. Every great dream begins with a dreamer.",
    "The only way to do great work is to love what you do. Stay hungry, stay foolish, stay curious.",
    "Not all those who wander are lost. Some are simply taking the scenic route through life.",
    "It always seems impossible until it is done. Success is not final, failure is not fatal.",
  ];
  let passage,startTime,timerInt,done,typed='';

  function newPassage(){
    passage=PASSAGES[Math.floor(Math.random()*PASSAGES.length)];
    restart();
  }

  function restart(){
    clearInterval(timerInt); startTime=null; done=false; typed='';
    document.getElementById('tpInput').value='';
    document.getElementById('tpInput').disabled=false;
    document.getElementById('tpInput').focus();
    document.getElementById('wpmEl').textContent='0';
    document.getElementById('accEl').textContent='100%';
    document.getElementById('timeEl').textContent='0s';
    document.getElementById('errEl').textContent='0';
    document.getElementById('tpResult').style.display='none';
    renderPassage('');
  }

  function onInput(){
    if(done)return;
    const val=document.getElementById('tpInput').value;
    if(!startTime&&val.length>0){
      startTime=Date.now();
      timerInt=setInterval(updateStats,200);
    }
    typed=val;
    renderPassage(val);
    updateStats();
    if(val.length>=passage.length){finishGame();}
  }

  function renderPassage(val){
    const el=document.getElementById('tpPassage');
    el.innerHTML=passage.split('').map((ch,i)=>{
      let cls='tp-char ';
      if(i<val.length)cls+=val[i]===ch?'correct':'incorrect';
      else if(i===val.length)cls+='current';
      else cls+='pending';
      return`<span class="${cls}">${ch==' '?'&nbsp;':ch}</span>`;
    }).join('');
  }

  function countErrors(val){
    let e=0;
    for(let i=0;i<Math.min(val.length,passage.length);i++)if(val[i]!==passage[i])e++;
    return e;
  }

  function updateStats(){
    if(!startTime)return;
    const sec=(Date.now()-startTime)/1000;
    const words=typed.trim().split(/\s+/).length;
    const wpm=sec>0?Math.round(words/(sec/60)):0;
    const errors=countErrors(typed);
    const acc=typed.length>0?Math.round((1-errors/typed.length)*100):100;
    document.getElementById('wpmEl').textContent=wpm;
    document.getElementById('accEl').textContent=Math.max(0,acc)+'%';
    document.getElementById('timeEl').textContent=Math.round(sec)+'s';
    document.getElementById('errEl').textContent=errors;
  }

  function finishGame(){
    done=true; clearInterval(timerInt);
    document.getElementById('tpInput').disabled=true;
    updateStats();
    const sec=((Date.now()-startTime)/1000).toFixed(1);
    const errors=countErrors(typed);
    const acc=Math.max(0,Math.round((1-errors/passage.length)*100));
    const wpm=Math.round((passage.split(' ').length/(sec/60)));
    const res=document.getElementById('tpResult');
    res.style.display='block';
    res.textContent=`Done! ${wpm} WPM · ${acc}% accuracy · ${sec}s`;
  }

  newPassage();
  </script>
