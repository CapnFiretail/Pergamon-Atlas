<html lang="en">
<head>

  <title>Pergamon Atlas | Color Match</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/function/styles/header.css">
  <link rel="stylesheet" href="/function/styles/sidebar.css">
  <link rel="stylesheet" href="/function/styles/main.css">
  <link rel="stylesheet" href="/function/styles/footer.css">
  <style>
    .game-hero{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);color:white;border:2px solid #8a611c;border-radius:16px;padding:28px;margin-bottom:24px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
    .game-hero h2{margin:0 0 8px;font-size:clamp(28px,4vw,42px);color:#f0d39b}
    .game-hero p{margin:0;font-size:16px;color:#ccc}
    .panel{background:white;border:2px solid #000;border-radius:16px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:20px;text-align:center}
    .hud{display:flex;justify-content:center;gap:24px;margin-bottom:14px;font-size:15px;font-weight:700}
    .hud .val{font-size:28px;display:block;color:#8a611c;font-family:monospace}
    .color-display{width:200px;height:200px;border-radius:20px;margin:0 auto 20px;border:4px solid #111;transition:background .3s}
    .hex-label{font-size:22px;font-weight:900;font-family:monospace;margin-bottom:16px;color:#111;letter-spacing:2px}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:360px;margin:0 auto 12px}
    .choice-btn{padding:18px;border-radius:12px;border:3px solid transparent;cursor:pointer;font-size:13px;font-weight:800;font-family:monospace;transition:.12s;color:transparent}
    .choice-btn:hover{border-color:#111;transform:scale(1.03)}
    .choice-btn.correct{border-color:#2a9d3a!important;box-shadow:0 0 0 3px #2a9d3a}
    .choice-btn.wrong{border-color:#c0392b!important;box-shadow:0 0 0 3px #c0392b;opacity:.6}
    .feedback{font-size:17px;font-weight:800;min-height:26px;margin-bottom:10px}
    .feedback.win{color:#2a9d3a}.feedback.lose{color:#c0392b}
    .progress-bar{height:8px;background:#eee;border-radius:999px;overflow:hidden;margin-bottom:14px;max-width:380px;margin-left:auto;margin-right:auto}
    .progress-fill{height:100%;background:#8a611c;border-radius:999px;transition:.3s}
    .atlas-btn{border:none;border-radius:10px;padding:12px 28px;font-size:15px;font-family:Georgia,serif;cursor:pointer;background:#000;color:white;transition:.15s}
    .atlas-btn:hover{background:#222}
    .mode-row{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
    .mode-btn{padding:7px 14px;border:2px solid #ccc;border-radius:8px;background:white;font-size:13px;font-family:Georgia,serif;cursor:pointer;font-weight:700;transition:.15s}
    .mode-btn.active{background:#111;color:white;border-color:#111}
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="game-hero">
        <h2>Color Match</h2>
        <p>Which swatch matches the HEX code? Test your color eye!</p>
      </div>
      <div class="panel">
        <div class="mode-row">
          <button class="mode-btn active" onclick="setMode('hex',this)">HEX → Color</button>
          <button class="mode-btn" onclick="setMode('color',this)">Color → HEX</button>
        </div>
        <div class="hud">
          <span><span class="val" id="scoreVal">0</span>Score</span>
          <span><span class="val" id="roundVal">1/10</span>Round</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:10%"></div></div>
        <div id="hexLabel" class="hex-label">#FFFFFF</div>
        <div id="colorDisplay" class="color-display" style="background:#fff"></div>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback"></div>
        <button class="atlas-btn" id="nextBtn" onclick="nextRound()" style="display:none">Next →</button>
        <button class="atlas-btn" id="startBtn" onclick="startGame()">Start Game</button>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/function/scripts/atlas.js"></script>
  <script>
    loadSnippets('Color Match');

    let round,score,mode,correctHex,gameOver;
    mode='hex';

    function setMode(m,btn){mode=m;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}

    function randHex(){
      return '#'+Array.from({length:3},()=>Math.floor(Math.random()*200+28).toString(16).padStart(2,'0')).join('').toUpperCase();
    }

    function startGame(){
      round=0;score=0;gameOver=false;
      document.getElementById('scoreVal').textContent=0;
      document.getElementById('startBtn').style.display='none';
      nextRound();
    }

    function nextRound(){
      round++;
      if(round>10){endGame();return;}
      document.getElementById('roundVal').textContent=round+'/10';
      document.getElementById('progFill').style.width=(round/10*100)+'%';
      document.getElementById('feedback').textContent='';
      document.getElementById('nextBtn').style.display='none';

      correctHex=randHex();
      const opts=[correctHex,...Array.from({length:3},()=>randHex())].sort(()=>Math.random()-.5);

      if(mode==='hex'){
        // Show hex, guess the color
        document.getElementById('hexLabel').style.display='block';
        document.getElementById('colorDisplay').style.display='none';
        document.getElementById('hexLabel').textContent=correctHex;
        document.getElementById('choices').innerHTML=opts.map(h=>
          `<button class="choice-btn" style="background:${h}" onclick="answer('${h}','${correctHex}')">&nbsp;</button>`
        ).join('');
      } else {
        // Show color, guess the hex
        document.getElementById('hexLabel').style.display='none';
        document.getElementById('colorDisplay').style.display='block';
        document.getElementById('colorDisplay').style.background=correctHex;
        document.getElementById('choices').innerHTML=opts.map(h=>
          `<button class="choice-btn" style="background:#f7f7f7;color:#111;font-size:15px" onclick="answer('${h}','${correctHex}')">${h}</button>`
        ).join('');
      }
    }

    function answer(chosen,correct){
      document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
      const btns=document.querySelectorAll('.choice-btn');
      btns.forEach(b=>{
        const bg=b.style.background;
        const txt=b.textContent.trim();
        const id=mode==='hex'?bg.toUpperCase():txt;
        if(id===correct||bg===correct) b.classList.add('correct');
      });
      const fb=document.getElementById('feedback');
      if(chosen===correct){score++;document.getElementById('scoreVal').textContent=score;fb.textContent='Correct!';fb.className='feedback win';}
      else{fb.textContent='Wrong! That was '+correct;fb.className='feedback lose';}
      document.getElementById('nextBtn').style.display=round<10?'inline-block':'none';
      if(round>=10) setTimeout(endGame,1000);
    }

    function endGame(){
      document.getElementById('hexLabel').textContent='Game Over!';
      document.getElementById('hexLabel').style.display='block';
      document.getElementById('colorDisplay').style.display='none';
      document.getElementById('choices').innerHTML='';
      document.getElementById('feedback').textContent=`You scored ${score}/10`;
      document.getElementById('feedback').className='feedback win';
      document.getElementById('nextBtn').style.display='none';
      document.getElementById('startBtn').textContent='Play Again';
      document.getElementById('startBtn').style.display='inline-block';
    }
  </script>
<script src="/pergamon-data/indexing/generator.js"></script><script src="/pergamon-data/indexing/auto-atlas.js"></script>
</body>
</html>
