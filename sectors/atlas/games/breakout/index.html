<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="game-hero">
        <h2>Breakout</h2>
        <p>Smash all the bricks with your ball</p>
      </div>
      <div class="panel">

          <span><span class="val" id="scoreVal">0</span>Score</span>
          <span><span class="val" id="livesVal">3</span>Lives</span>
          <span><span class="val" id="levelVal">1</span>Level</span>
        </div>
        <canvas id="c" width="480" height="360"></canvas>
        <div class="controls">
          <button class="atlas-btn" id="startBtn" onclick="startGame()">Start</button>
          <button class="atlas-btn" style="background:#555" onclick="togglePause()">Pause</button>

  <script>
    loadSnippets('Breakout');

    const cv=document.getElementById('c'),ctx=cv.getContext('2d');
    const W=480,H=360;
    const COLS=10,ROWS=5;
    const BRICK_W=W/COLS-4,BRICK_H=16,BRICK_PAD=4,BRICK_TOP=40;
    const PAD_H=10,PAD_W=64,BALL_R=7;

    let px,bx,by,bdx,bdy,bricks,score,lives,level,raf,paused,running,launched;
    let leftKey=false,rightKey=false;

    const COLORS=['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db'];

    function makeBricks(){
      bricks=[];
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
        bricks.push({x:c*(BRICK_W+BRICK_PAD)+BRICK_PAD/2,y:BRICK_TOP+r*(BRICK_H+BRICK_PAD),alive:true,color:COLORS[r%COLORS.length],pts:(ROWS-r)*10});
      }
    }

    function startGame(){
      px=W/2-PAD_W/2;score=0;lives=3;level=1;
      makeBricks();resetBall();
      paused=false;running=true;launched=false;
      document.getElementById('startBtn').textContent='Restart';
      updateHud();cancelAnimationFrame(raf);loop();
    }

    function resetBall(){bx=W/2;by=H-PAD_H-BALL_R-20;bdx=(Math.random()<.5?1:-1)*(2.5+level*.3);bdy=-(3+level*.3);launched=false;}

    function togglePause(){paused=!paused;if(!paused&&running)loop();}

    function loop(){
      if(paused||!running)return;
      update();draw();raf=requestAnimationFrame(loop);
    }

    function update(){
      // Paddle
      if(leftKey&&px>0) px-=6;
      if(rightKey&&px<W-PAD_W) px+=6;

      if(!launched){bx=px+PAD_W/2;return;}

      bx+=bdx;by+=bdy;

      // Wall bounces
      if(bx<=BALL_R){bx=BALL_R;bdx=Math.abs(bdx);}
      if(bx>=W-BALL_R){bx=W-BALL_R;bdx=-Math.abs(bdx);}
      if(by<=BALL_R){by=BALL_R;bdy=Math.abs(bdy);}

      // Paddle
      if(by>=H-PAD_H-BALL_R&&by<=H-BALL_R&&bx>=px&&bx<=px+PAD_W){
        const rel=(bx-(px+PAD_W/2))/(PAD_W/2);
        const ang=rel*(Math.PI/3);
        const spd=Math.sqrt(bdx*bdx+bdy*bdy);
        bdx=spd*Math.sin(ang);bdy=-spd*Math.cos(ang);
        by=H-PAD_H-BALL_R;
      }

      // Out
      if(by>H+BALL_R){lives--;updateHud();if(lives<=0){endGame();}else resetBall();return;}

      // Bricks
      for(const b of bricks){
        if(!b.alive)continue;
        if(bx+BALL_R>b.x&&bx-BALL_R<b.x+BRICK_W&&by+BALL_R>b.y&&by-BALL_R<b.y+BRICK_H){
          b.alive=false;score+=b.pts;updateHud();
          const overlapX=Math.min(bx+BALL_R-b.x,b.x+BRICK_W-(bx-BALL_R));
          const overlapY=Math.min(by+BALL_R-b.y,b.y+BRICK_H-(by-BALL_R));
          if(overlapX<overlapY)bdx=-bdx;else bdy=-bdy;
          break;
        }
      }

      if(bricks.every(b=>!b.alive)){level++;makeBricks();resetBall();updateHud();}
    }

    function endGame(){
      running=false;cancelAnimationFrame(raf);
      ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#f0d39b';ctx.font='bold 32px monospace';ctx.textAlign='center';
      ctx.fillText(lives<=0?'Game Over':'You Win!',W/2,H/2-20);
      ctx.font='20px Georgia';ctx.fillText('Score: '+score,W/2,H/2+20);
    }

    function updateHud(){
      document.getElementById('scoreVal').textContent=score;
      document.getElementById('livesVal').textContent=lives;
      document.getElementById('levelVal').textContent=level;
    }

    function draw(){
      ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
      // Bricks
      bricks.forEach(b=>{
        if(!b.alive)return;
        ctx.fillStyle=b.color;ctx.beginPath();ctx.roundRect(b.x,b.y,BRICK_W,BRICK_H,4);ctx.fill();
      });
      // Paddle
      ctx.fillStyle='#f0d39b';ctx.beginPath();ctx.roundRect(px,H-PAD_H,PAD_W,PAD_H,4);ctx.fill();
      // Ball
      ctx.beginPath();ctx.arc(bx,by,BALL_R,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();
      if(!launched){ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='14px Georgia';ctx.textAlign='center';ctx.fillText('Click or Space to launch',W/2,H-30);}
    }

    cv.addEventListener('mousemove',e=>{
      const rect=cv.getBoundingClientRect();const mx=(e.clientX-rect.left)*(W/rect.width);
      px=Math.max(0,Math.min(W-PAD_W,mx-PAD_W/2));
    });
    cv.addEventListener('click',()=>{if(!launched&&running){launched=true;}});
    document.addEventListener('keydown',e=>{
      if(e.key==='ArrowLeft')leftKey=true;
      if(e.key==='ArrowRight')rightKey=true;
      if(e.key===' '&&running&&!launched){e.preventDefault();launched=true;}
    });
    document.addEventListener('keyup',e=>{
      if(e.key==='ArrowLeft')leftKey=false;
      if(e.key==='ArrowRight')rightKey=false;
    });

    ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f0d39b';ctx.font='bold 22px Georgia';ctx.textAlign='center';
    ctx.fillText('Press Start to play',W/2,H/2);
  </script>
