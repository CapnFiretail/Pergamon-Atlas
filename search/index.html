  <!-- Deferred to DOMContentLoaded: the indexer clusters PergamonVisibility
       and entries.js in the late script block, after this tag. -->
  <script>
   document.addEventListener('DOMContentLoaded', function () {
    const input  = document.getElementById('searchInput');
    const btn    = document.getElementById('searchBtn');
    const header = document.getElementById('resultsHeader');
    const list   = document.getElementById('resultsList');

    function getQuery() {
      return new URLSearchParams(window.location.search).get('q') || '';
    }

    function showEmptyState() {
      header.innerHTML = '';
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-label">Browse the Atlas</div>
          <div class="catalog-links">
            <a href="/tools" class="catalog-link">
              <span class="catalog-link-icon">🔧</span>
              <div>
                <div>Tools</div>
                <span class="catalog-link-sub">Calculators, utilities &amp; more</span>
              </div>
            </a>
            <a href="/games" class="catalog-link">
              <span class="catalog-link-icon">🎮</span>
              <div>
                <div>Games</div>
                <span class="catalog-link-sub">Arcade, puzzles &amp; classics</span>
              </div>
            </a>
          </div>
          <div class="archive-note">
            Looking for something older? Archived artifacts are not searchable here —
            visit the <a href="/archives">Archives</a> to browse them directly.
          </div>
        </div>`;
    }

    async function runSearch(q) {
      const term = q.trim().toLowerCase();
      if (!term) { showEmptyState(); return; }

      const entries = window.atlasEntries || { tools: [], games: [] };
      const visibleTools = window.PergamonVisibility
        ? await window.PergamonVisibility.getVisibleEntries(entries.tools || [])
        : (entries.tools || []);
      const visibleGames = window.PergamonVisibility
        ? await window.PergamonVisibility.getVisibleEntries(entries.games || [])
        : (entries.games || []);

      const tools = visibleTools.filter(e => e.name.toLowerCase().includes(term));
      const games = visibleGames.filter(e => e.name.toLowerCase().includes(term));
      const all = [
        ...tools.map(e => ({ ...e, kind: 'Tool' })),
        ...games.map(e => ({ ...e, kind: 'Game' }))
      ];

      const count = all.length;
      header.innerHTML = count > 0
        ? `Showing <strong>${count}</strong> result${count !== 1 ? 's' : ''} for <strong>"${q.trim()}"</strong>`
        : '';

      if (count === 0) {
        list.innerHTML = `<div class="no-results"><strong>No results found</strong>No tools or games matched "${q.trim()}". Try a different search.</div>`;
        return;
      }

      list.innerHTML = all.map(e => `
        <a class="result-card" href="${e.path}">
          <span class="result-name">${e.name}</span>
          <span class="result-type${e.kind === 'Game' ? ' game' : ''}">${e.kind}</span>
        </a>
      `).join('');
    }

    function submitSearch() {
      const q = input.value.trim();
      if (!q) return;
      const url = new URL(window.location.href);
      url.searchParams.set('q', q);
      window.history.replaceState(null, '', url);
      runSearch(q);
    }

    btn.addEventListener('click', submitSearch);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submitSearch(); });

    const initialQuery = getQuery();
    if (initialQuery) {
      input.value = initialQuery;
      runSearch(initialQuery);
    } else {
      showEmptyState();
    }
   });
  </script>
