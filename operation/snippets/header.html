<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand">
      <div class="logo-box">
        <img src="/images/logo.png" alt="Pergamon Atlas Logo">
      </div>

      <h1 class="header-title">
        <span class="site-title">Pergamon Atlas</span>
        <span class="page-title-text"></span>
      </h1>
    </a>

    <div class="header-actions">
      <button type="button" id="pergamon-view-toggle" class="view-toggle-btn" data-visibility="admin">Admin View</button>

      <form class="search-wrap" action="/search" method="get">
        <a href="/search" class="search-icon-btn" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </a>
        <input type="text" name="q" placeholder="Search">
      </form>

      <a href="/search" class="mobile-search-btn" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </a>

      <a href="/account" class="account-btn">Account</a>
    </div>
  </div>
</header>
