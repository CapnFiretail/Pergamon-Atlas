    .stroop-word{font-size:clamp(52px,10vw,84px);font-weight:900;margin:28px 0;min-height:100px;display:flex;align-items:center;justify-content:center;letter-spacing:2px}

<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="game-hero">
        <h2>Stroop Test</h2>
        <p>Click the COLOR the word is written in — not what the word says. Brain challenge!</p>
      </div>
      <div class="panel" id="gamePanel">
        <div id="startScreen" class="start-overlay">
          <p style="font-size:16px;color:#555;margin-bottom:20px">You'll see color words displayed in a different ink color.<br>Click the <strong>ink color</strong>, not the word!</p>
          <button class="atlas-btn" onclick="startGame()">Start (20 rounds)</button>
        </div>
        <div id="playScreen" style="display:none">
          <div class="stats-row">
            <span><span class="val" id="scoreVal">0</span>Score</span>
            <span><span class="val" id="roundVal">1</span>/ 20</span>
            <span><span class="val" id="streakVal">0</span>Streak</span>
          </div>
          <div class="progress-wrap">
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:5%"></div></div>
          </div>
          <div class="instruction">What COLOR is this word written in?</div>
          <div class="stroop-word" id="stroopWord">RED</div>
          <div class="color-btns" id="colorBtns"></div>
          <div class="feedback-bar"><div class="feedback-fill" id="feedbackFill"></div></div>
        </div>
        <div id="resultScreen" style="display:none" class="result-screen">
          <div class="result-big" id="resultBig">0/20</div>
          <div class="result-sub" id="resultSub"></div>
          <button class="atlas-btn" style="margin-top:20px" onclick="startGame()">Play Again</button>
        </div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/operation/scripts/atlas.js"></script>
  <script>
    loadSnippets('Stroop Test');

    const COLORS = [
      {name:'RED',   hex:'#e74c3c'},
      {name:'BLUE',  hex:'#2980b9'},
      {name:'GREEN', hex:'#27ae60'},
      {name:'YELLOW',hex:'#f39c12'},
      {name:'PURPLE',hex:'#8e44ad'},
      {name:'ORANGE',hex:'#e67e22'},
    ];

    let round, score, streak, answerColor;

    function startGame(){
      round=0;score=0;streak=0;
      document.getElementById('startScreen').style.display='none';
      document.getElementById('resultScreen').style.display='none';
      document.getElementById('playScreen').style.display='block';
      nextRound();
    }

    function nextRound(){
      round++;
      if(round>20){endGame();return;}
      document.getElementById('roundVal').textContent=round;
      document.getElementById('progressFill').style.width=(round/20*100)+'%';
      document.getElementById('feedbackFill').className='feedback-fill';
      document.getElementById('feedbackFill').style.width='0%';

      const wordColor = COLORS[Math.floor(Math.random()*COLORS.length)];
      answerColor = COLORS[Math.floor(Math.random()*COLORS.length)];
      document.getElementById('stroopWord').textContent=wordColor.name;
      document.getElementById('stroopWord').style.color=answerColor.hex;

      // Shuffle 4 choices including the correct one
      let choices=[answerColor];
      const others=COLORS.filter(c=>c.name!==answerColor.name);
      while(choices.length<4){const r=others[Math.floor(Math.random()*others.length)];if(!choices.find(c=>c.name===r.name))choices.push(r);}
      choices=choices.sort(()=>Math.random()-.5);

      document.getElementById('colorBtns').innerHTML=choices.map(c=>
        `<button class="color-btn" style="background:${c.hex};color:white" onclick="answer('${c.name}')">${c.name}</button>`
      ).join('');
    }

    function answer(name){
      document.getElementById('colorBtns').querySelectorAll('button').forEach(b=>b.disabled=true);
      const correct=name===answerColor.name;
      const fill=document.getElementById('feedbackFill');
      fill.style.width='100%';
      if(correct){score++;streak++;fill.className='feedback-fill correct';}
      else{streak=0;fill.className='feedback-fill wrong';}
      document.getElementById('scoreVal').textContent=score;
      document.getElementById('streakVal').textContent=streak;
      setTimeout(nextRound,600);
    }

    function endGame(){
      document.getElementById('playScreen').style.display='none';
      document.getElementById('resultScreen').style.display='block';
      document.getElementById('resultBig').textContent=score+'/20';
      const pct=Math.round(score/20*100);
      const msg=pct>=90?'Incredible focus!':pct>=70?'Great job!':pct>=50?'Not bad!':'Keep practicing!';
      document.getElementById('resultSub').textContent=pct+'% correct — '+msg;
    }
  </script>
