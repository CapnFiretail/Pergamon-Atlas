  <link rel="stylesheet" href="/operation/styles/sidebar.css">

  <style>
    .game-hero{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);color:white;border:2px solid #8a611c;border-radius:16px;padding:28px;margin-bottom:24px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
    .game-hero h2{margin:0 0 8px;font-size:clamp(28px,4vw,42px);color:#f0d39b}
    .game-hero p{margin:0;font-size:16px;color:#ccc}
    .panel{background:white;border:2px solid #000;border-radius:16px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:20px;text-align:center}
    .hud{display:flex;justify-content:center;gap:28px;margin-bottom:16px;font-size:16px;font-weight:700}
    .hud .val{font-size:30px;display:block;color:#8a611c;font-family:monospace}
    .time-bar{height:10px;background:#eee;border-radius:999px;overflow:hidden;margin-bottom:16px}
    .time-fill{height:100%;background:#8a611c;border-radius:999px;transition:.1s linear}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:360px;margin:0 auto 16px}
    .hole{aspect-ratio:1;background:#2d1a0a;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,7vw,48px);transition:background .15s;border:4px solid #1a0a00;overflow:hidden;position:relative;user-select:none}
    .hole .mole{position:absolute;bottom:-100%;transition:bottom .15s;font-size:clamp(28px,7vw,48px);line-height:1}
    .hole.active .mole{bottom:10%}
    .hole:active{transform:scale(.93)}
    .hole.whacked .mole{bottom:-100%;transition:bottom .08s}
    .diff-row{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
    .diff-btn{padding:7px 14px;border:2px solid #ccc;border-radius:8px;background:white;font-size:13px;font-family:Georgia,serif;cursor:pointer;font-weight:700;transition:.15s}
    .diff-btn.active{background:#111;color:white;border-color:#111}
    .atlas-btn{border:none;border-radius:10px;padding:12px 28px;font-size:15px;font-family:Georgia,serif;cursor:pointer;background:#000;color:white;transition:.15s}
    .atlas-btn:hover{background:#222}
    .score-popup{position:absolute;font-size:22px;font-weight:900;color:#f0d39b;pointer-events:none;animation:floatup .6s forwards}
    @keyframes floatup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="game-hero">
        <h2>Whack-a-Mole</h2>
        <p>Click the moles as fast as they pop up!</p>
      </div>
      <div class="panel">
        <div class="diff-row">
          <button class="diff-btn" onclick="setDiff('easy',this)">Easy</button>
          <button class="diff-btn active" onclick="setDiff('medium',this)">Medium</button>
          <button class="diff-btn" onclick="setDiff('hard',this)">Hard</button>
        </div>
        <div class="hud">
          <span><span class="val" id="scoreVal">0</span>Score</span>
          <span><span class="val" id="missVal">0</span>Missed</span>
          <span><span class="val" id="timeVal">30</span>Secs</span>
        </div>
        <div class="time-bar"><div class="time-fill" id="timeFill" style="width:100%"></div></div>
        <div class="grid" id="grid"></div>
        <button class="atlas-btn" id="startBtn" onclick="startGame()">Start</button>
        <div style="font-size:14px;color:#aaa;margin-top:8px" id="endMsg"></div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/operation/scripts/atlas.js"></script>
  <script>
    loadSnippets('Games');

    const MOLES=['🐭','🐹','🐰','🐻','🦔'];
    let score,misses,timeLeft,gameInt,moleInt,activeMoles,duration,speed,diffKey;
    diffKey='medium';

    const DIFFS={easy:{dur:30,speed:1200},medium:{dur:30,speed:800},hard:{dur:30,speed:500}};

    function setDiff(k,btn){diffKey=k;document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}

    function buildGrid(){
      const g=document.getElementById('grid');g.innerHTML='';
      for(let i=0;i<9;i++){
        const h=document.createElement('div');h.className='hole';h.id='h'+i;
        const m=document.createElement('div');m.className='mole';m.textContent=MOLES[i%MOLES.length];
        h.appendChild(m);
        h.onclick=()=>whack(i);
        g.appendChild(h);
      }
    }

    function startGame(){
      const cfg=DIFFS[diffKey];
      score=0;misses=0;timeLeft=cfg.dur;activeMoles=new Set();
      document.getElementById('scoreVal').textContent=0;
      document.getElementById('missVal').textContent=0;
      document.getElementById('timeVal').textContent=timeLeft;
      document.getElementById('timeFill').style.width='100%';
      document.getElementById('endMsg').textContent='';
      document.getElementById('startBtn').textContent='Restart';
      buildGrid();
      clearInterval(gameInt);clearInterval(moleInt);

      gameInt=setInterval(()=>{
        timeLeft--;
        document.getElementById('timeVal').textContent=timeLeft;
        document.getElementById('timeFill').style.width=(timeLeft/cfg.dur*100)+'%';
        if(timeLeft<=0){endGame();return;}
      },1000);

      moleInt=setInterval(()=>{
        if(activeMoles.size>0){
          // Expire oldest active mole if not whacked
          const oldest=activeMoles.values().next().value;
          const hole=document.getElementById('h'+oldest);
          if(hole){hole.classList.remove('active');misses++;document.getElementById('missVal').textContent=misses;}
          activeMoles.delete(oldest);
        }
        // Spawn new mole
        let idx;
        do{idx=Math.floor(Math.random()*9);}while(activeMoles.has(idx));
        activeMoles.add(idx);
        document.getElementById('h'+idx).classList.add('active');
      },cfg.speed);
    }

    function whack(i){
      const hole=document.getElementById('h'+i);
      if(!hole.classList.contains('active')) return;
      hole.classList.remove('active');hole.classList.add('whacked');
      activeMoles.delete(i);
      score++;document.getElementById('scoreVal').textContent=score;
      setTimeout(()=>hole.classList.remove('whacked'),200);
      // Popup
      const popup=document.createElement('div');popup.className='score-popup';popup.textContent='+1';
      popup.style.cssText='position:fixed;pointer-events:none;font-size:22px;font-weight:900;color:#f0d39b;animation:floatup .6s forwards;z-index:999';
      document.body.appendChild(popup);
      const rect=hole.getBoundingClientRect();
      popup.style.left=(rect.left+rect.width/2-12)+'px';popup.style.top=(rect.top+rect.height/2)+'px';
      setTimeout(()=>popup.remove(),600);
    }

    function endGame(){
      clearInterval(gameInt);clearInterval(moleInt);
      document.querySelectorAll('.hole').forEach(h=>h.classList.remove('active'));
      activeMoles.clear();
      document.getElementById('endMsg').textContent=`Game over! Score: ${score}, Missed: ${misses}`;
    }

    buildGrid();
  </script>
