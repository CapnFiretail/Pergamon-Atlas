  <style>
    .game-hero{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);color:white;border:2px solid #8a611c;border-radius:16px;padding:28px;margin-bottom:24px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
    .game-hero h2{margin:0 0 8px;font-size:clamp(28px,4vw,42px);color:#f0d39b}
    .game-hero p{margin:0;font-size:16px;color:#ccc}
    .panel{background:white;border:2px solid #000;border-radius:16px;padding:20px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:20px;text-align:center}
    .hud{display:flex;justify-content:center;gap:24px;margin-bottom:12px;font-size:15px;font-weight:700}

    .board{display:inline-grid;gap:2px;margin:0 auto 12px;border:3px solid #111;border-radius:8px;padding:4px;background:#111}
    .cell{width:30px;height:30px;border-radius:4px;border:none;cursor:pointer;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:monospace;transition:background .1s;background:#ccc}

    .cell.mine{background:#c0392b;color:white}
    .cell.n1{color:#0000ff}.cell.n2{color:#008000}.cell.n3{color:#ff0000}.cell.n4{color:#000080}
    .cell.n5{color:#800000}.cell.n6{color:#008080}.cell.n7{color:#000000}.cell.n8{color:#808080}

    .diff-btn.active{background:#111;color:white;border-color:#111}
    .atlas-btn{border:none;border-radius:10px;padding:10px 22px;font-size:14px;font-family:Georgia,serif;cursor:pointer;background:#000;color:white;transition:.15s}
    .atlas-btn:hover{background:#222}

<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="game-hero">
        <h2>Minesweeper</h2>
        <p>Reveal all safe cells without hitting a mine</p>
      </div>
      <div class="panel">
        <div class="diff-row">
          <button class="diff-btn active" onclick="setDiff('easy',this)">Easy 9×9</button>
          <button class="diff-btn" onclick="setDiff('medium',this)">Medium 12×12</button>
          <button class="diff-btn" onclick="setDiff('hard',this)">Hard 16×9</button>
        </div>
        <div class="hud">
          <span><span class="val" id="minesLeft">10</span>Mines</span>
          <span><span class="val" id="timeVal">0</span>Time</span>
          <span><span class="val" id="cellsLeft">71</span>Safe left</span>
        </div>
        <div class="status-msg" id="statusMsg"></div>
        <div id="board" class="board"></div>
        <button class="atlas-btn" onclick="newGame()">New Game</button>
        <div class="hint-text">Right-click to flag a mine</div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/operation/scripts/atlas.js"></script>
  <script>
    loadSnippets('Games');

    const DIFFS={easy:{rows:9,cols:9,mines:10},medium:{rows:12,cols:12,mines:20},hard:{rows:9,cols:16,mines:23}};
    let cfg,cells,revealed,flagged,gameOver,started,timerInt,elapsed,firstClick;

    function setDiff(k,btn){cfg=DIFFS[k];document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');newGame();}

    function newGame(){
      cfg=cfg||DIFFS.easy;clearInterval(timerInt);elapsed=0;gameOver=false;started=false;firstClick=true;
      cells=Array(cfg.rows*cfg.cols).fill(null).map(()=>({mine:false,count:0}));
      revealed=new Set();flagged=new Set();
      document.getElementById('timeVal').textContent=0;
      document.getElementById('minesLeft').textContent=cfg.mines;
      document.getElementById('cellsLeft').textContent=cfg.rows*cfg.cols-cfg.mines;
      document.getElementById('statusMsg').textContent='';
      document.getElementById('statusMsg').className='status-msg';
      renderBoard();
    }

    function placeMines(safeIdx){
      let placed=0;
      while(placed<cfg.mines){
        const i=Math.floor(Math.random()*cells.length);
        if(!cells[i].mine&&i!==safeIdx){cells[i].mine=true;placed++;}
      }
      for(let i=0;i<cells.length;i++){
        if(cells[i].mine) continue;
        cells[i].count=neighbors(i).filter(n=>cells[n].mine).length;
      }
    }

    function idx(r,c){return r*cfg.cols+c;}
    function rc(i){return{r:Math.floor(i/cfg.cols),c:i%cfg.cols};}
    function neighbors(i){
      const {r,c}=rc(i),res=[];
      for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
        if(dr===0&&dc===0)continue;
        const nr=r+dr,nc=c+dc;
        if(nr>=0&&nr<cfg.rows&&nc>=0&&nc<cfg.cols)res.push(idx(nr,nc));
      }
      return res;
    }

    function reveal(i){
      if(revealed.has(i)||flagged.has(i)||gameOver) return;
      if(firstClick){firstClick=false;placeMines(i);timerInt=setInterval(()=>{elapsed++;document.getElementById('timeVal').textContent=elapsed;},1000);}
      revealed.add(i);
      if(cells[i].mine){
        gameOver=true;clearInterval(timerInt);
        cells.forEach((c,j)=>{if(c.mine)revealed.add(j);});
        renderBoard();
        document.getElementById('statusMsg').textContent='💥 Boom! Game over.';
        document.getElementById('statusMsg').className='status-msg lose';
        return;
      }
      if(cells[i].count===0)neighbors(i).forEach(n=>reveal(n));
      updateCellsLeft();
      renderBoard();
    }

    function flag(i,e){
      e.preventDefault();if(gameOver||revealed.has(i)) return;
      if(flagged.has(i))flagged.delete(i);else flagged.add(i);
      document.getElementById('minesLeft').textContent=cfg.mines-flagged.size;
      renderBoard();
    }

    function updateCellsLeft(){
      const left=cfg.rows*cfg.cols-cfg.mines-revealed.size;
      document.getElementById('cellsLeft').textContent=left;
      if(left===0){clearInterval(timerInt);gameOver=true;document.getElementById('statusMsg').textContent='🎉 You win!';document.getElementById('statusMsg').className='status-msg win';}
    }

    function renderBoard(){
      const board=document.getElementById('board');
      board.style.gridTemplateColumns=`repeat(${cfg.cols},30px)`;
      board.innerHTML='';
      cells.forEach((c,i)=>{
        const el=document.createElement('div');el.className='cell';
        if(gameOver&&c.mine&&!flagged.has(i)){el.className='cell mine';el.textContent='💣';}
        else if(flagged.has(i)){el.className='cell flagged';el.textContent='🚩';}
        else if(revealed.has(i)){
          el.className='cell revealed'+(c.count>0?' n'+c.count:'');
          el.textContent=c.count>0?c.count:'';
        }
        el.onclick=()=>reveal(i);
        el.oncontextmenu=e=>flag(i,e);
        board.appendChild(el);
      });
    }

    cfg=DIFFS.easy;newGame();
  </script>
