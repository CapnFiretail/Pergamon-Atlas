    .section-label { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #8a611c; margin: 0 0 16px; }
    .section-label::after { content: ""; flex: 1; height: 1px; background: #e0d4c4; }
    .section-gap { margin-top: 48px; }

    /* ── Featured cards ── */
    /* Light is the base/default styling — same as before — so Public
       Pergamon (which never sets data-theme="dark" on #featured-grid)
       renders correctly even before JS resolves Appearance. Dark is
       layered on via #featured-grid[data-theme="dark"], mirroring the
       Tools catalog's card theming (see tools/index.html) — same
       mechanism, admin-only, gated by PergamonVisibility.currentAppearance().
       .feat-graphic (the game preview area) is intentionally unchanged in
       both themes — it's already a dark "screen" showing each game's own
       art, not part of the card chrome being themed. */
    .featured-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-bottom: 0; }
    .feat-card { display: flex; flex-direction: column; border: 2px solid #000; border-radius: 14px; overflow: hidden; text-decoration: none; color: inherit; transition: transform .18s, box-shadow .18s, border-color .18s, background .18s; box-shadow: 0 4px 14px rgba(0,0,0,.08); }
    .feat-card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(0,0,0,.14); border-color: #8a611c; }
    .feat-graphic { background: #111; display: flex; align-items: center; justify-content: center; aspect-ratio: 1; overflow: hidden; }
    .feat-preview-frame { width: 230px; height: 230px; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .feat-info { background: white; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; transition: background .18s; }
    .feat-name { margin: 0; font-size: 15px; font-weight: 700; color: #111; transition: color .18s; }
    .feat-badge { background: #8a611c; color: #f0d39b; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0; }
    .feat-badge.arcade   { background: #c0392b; color: white; }
    .feat-badge.classic  { background: #d4a800; color: #111; }
    .feat-badge.strategy { background: #1a7a2a; color: white; }
    .feat-badge.casino   { background: #1a5fb4; color: white; }

    /* ── Dark appearance (Admin View only) ──────────────────── */
    #featured-grid[data-theme="dark"] .feat-card {
      border-color: rgba(224,179,74,0.55);
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    #featured-grid[data-theme="dark"] .feat-card:hover {
      border-color: #e0b34a;
      box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    }
    #featured-grid[data-theme="dark"] .feat-info {
      background: linear-gradient(160deg, #201c16 0%, #14110c 100%);
    }
    #featured-grid[data-theme="dark"] .feat-name {
      color: #f5efe2;
    }

    /* ── TTT mini ── */
    .cat-ttt { display: grid; grid-template-columns: repeat(3, 40px); gap: 6px; background: #111; border-radius: 10px; padding: 8px; border: 2px solid #2a2a2a; }
    .cat-ttt-cell { width: 40px; height: 40px; background: #f4f4f4; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-size: 18px; font-weight: 700; color: #111; }
    .cat-ttt-cell.dim { color: #ccc; }

    /* ── Connect Four mini ── */
    .cat-cf { display: grid; grid-template-columns: repeat(7, 22px); gap: 4px; background: #1f6fab; border-radius: 8px; padding: 6px; }
    .cat-cf-disc { width: 22px; height: 22px; background: rgba(255,255,255,0.08); border-radius: 50%; }
    .cat-cf-disc.r { background: #e63946; }
    .cat-cf-disc.y { background: #f4d03f; }

    /* ── Chess mini ── */
    .cat-ch { display: inline-grid; grid-template-columns: repeat(8, 20px); gap: 0; border: 2px solid #1a1a1a; border-radius: 3px; overflow: hidden; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
    .cat-ch-sq { width: 20px; height: 20px; }
    .cat-ch-sq.light { background: #f0d9b5; }
    .cat-ch-sq.dark  { background: #b58863; }

    /* ── Battleship mini ── */
    .cat-bt { display: grid; grid-template-columns: repeat(10, 14px); gap: 2px; background: #13578a; border-radius: 8px; padding: 5px; }
    .cat-bt-cell { width: 14px; height: 14px; border-radius: 2px; background: rgba(255,255,255,0.05); }
    .cat-bt-cell.ship { background: #6b7280; }
    .cat-bt-cell.hit  { background: #dc2626; }
    .cat-bt-cell.miss { background: #5aa0cc; }

    /* ── Blackjack mini (3×2 card grid) ── */
    .cat-bj2 { display: grid; grid-template-columns: repeat(3, 38px); gap: 5px; background: #1a1a1a; border-radius: 8px; padding: 4px; transform: scale(1.4); }
    .cat-bj2-card { width: 38px; height: 56px; border-radius: 4px; border: 1px solid #ccc; background: white; box-shadow: 0 2px 5px rgba(0,0,0,.3); display: flex; flex-direction: column; justify-content: space-between; padding: 2px 3px; font-family: Georgia, serif; font-size: 10px; font-weight: 700; line-height: 1.2; box-sizing: border-box; }
    .cat-bj2-card.fd { background: #1a3a6b; background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.06) 0 2px, transparent 2px 8px); border-color: #1a3a6b; }
    .cat-bj2-card.r { color: #c0392b; }
    .cat-bj2-card.b { color: #111; }
    .cat-bj2-bot { transform: rotate(180deg); }

    /* ── Snake mini ── */
    .cat-sn { display: grid; grid-template-columns: repeat(12, 15px); gap: 2px; background: #111; border-radius: 8px; padding: 6px; border: 2px solid #2a2a2a; transform: scale(0.9); }
    .cat-sn-cell { width: 15px; height: 15px; border-radius: 3px; background: #1e1e1e; }
    .cat-sn-cell.body { background: #8a611c; }
    .cat-sn-cell.head { background: #f0d39b; }
    .cat-sn-cell.food { background: #e74c3c; border-radius: 50%; }

    /* ── Breakout mini (5×6 brick grid) ── */
    .cat-bk2 { display: inline-flex; flex-direction: column; background: #111; border: 2px solid #2a2a2a; border-radius: 8px; padding: 5px; transform: scale(1.5); }
    .cat-bk2-bricks { display: grid; grid-template-columns: repeat(5, 20px); gap: 3px; }
    .cat-bk2-brick { height: 9px; border-radius: 2px; }
    .cat-bk2-brick.r0 { background: #e74c3c; }
    .cat-bk2-brick.r1 { background: #e67e22; }
    .cat-bk2-brick.r2 { background: #f1c40f; }
    .cat-bk2-brick.r3 { background: #2ecc71; }
    .cat-bk2-brick.r4 { background: #3498db; }
    .cat-bk2-brick.r5 { background: #9b59b6; }
    .cat-bk2-brick.dead { background: transparent; }
    .cat-bk2-field { position: relative; width: 112px; height: 40px; margin-top: 5px; }
    .cat-bk2-ball { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: white; box-shadow: 0 0 4px rgba(255,255,255,0.5); }
    .cat-bk2-paddle { position: absolute; height: 6px; border-radius: 3px; background: #f0d39b; bottom: 0; }

    /* ── Pong mini ── */
    .cat-pong { position: relative; width: 130px; height: 110px; background: #111; border: 2px solid #2a2a2a; border-radius: 6px; overflow: hidden; box-sizing: border-box; transform: scale(1.5); }
    .cat-pong-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.25) 0 6px, transparent 6px 12px); }
    .cat-pong-paddle { position: absolute; width: 6px; height: 28px; background: #f0d39b; border-radius: 3px; }
    .cat-pong-left  { left: 8px; top: 30px; }
    .cat-pong-right { right: 8px; top: 52px; }
    .cat-pong-ball { position: absolute; width: 8px; height: 8px; background: white; border-radius: 50%; left: 62px; top: 48px; box-shadow: 0 0 6px rgba(255,255,255,0.6); }
    .cat-pong-score { position: absolute; top: 6px; font-family: Georgia, serif; font-size: 18px; font-weight: 700; color: rgba(255,255,255,0.4); }
    .cat-pong-score.left  { left: 38px; }
    .cat-pong-score.right { right: 38px; }

    /* ── All Games grid ── */
    .games-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
    .game-card { background: white; border: 2px solid #000; border-radius: 14px; padding: 18px 16px; text-decoration: none; color: inherit; box-shadow: 0 4px 14px rgba(0,0,0,.08); transition: transform .18s, box-shadow .18s, border-color .18s; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
    .game-card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(0,0,0,.12); border-color: #8a611c; }
    .game-icon { font-size: 34px; line-height: 1; }
    .game-card h3 { margin: 0; font-size: 17px; color: #111; font-weight: 700; }

    @media(max-width:1050px) { .games-grid { grid-template-columns: repeat(3,1fr); } }
    @media(max-width:700px)  { .games-grid { grid-template-columns: repeat(2,1fr); } .featured-grid { grid-template-columns: repeat(2,1fr); } }
    @media(max-width:400px)  { .games-grid { grid-template-columns: 1fr; } .featured-grid { grid-template-columns: 1fr; } }
  </style>

<script>
  // Deferred to DOMContentLoaded: script tag position on this page doesn't
  // guarantee PergamonVisibility/entries.js have executed yet.
  //
  // The matching Atlas entry (entries.js) is the sole source of truth for
  // visibility here — cards are matched to their entry by href, and carry
  // no visibility of their own, rather than duplicating a value that
  // could drift out of sync with entries.js.
  document.addEventListener('DOMContentLoaded', async function () {
    if (!window.PergamonVisibility) return;

    var atlasGames = (window.atlasEntries && window.atlasEntries.games) || [];
    var byPath = {};
    atlasGames.forEach(function (g) { byPath[g.path] = g; });

    var cards = Array.prototype.slice.call(document.querySelectorAll('.featured-grid .feat-card'));
    var results = await Promise.all([
      Promise.all(cards.map(function (card) {
        var path = card.getAttribute('href').replace(/\/$/, '');
        return window.PergamonVisibility.isVisibleInCurrentView(byPath[path]);
      })),
      window.PergamonVisibility.currentAppearance()
    ]);
    var checks = results[0];
    var theme = results[1];

    var grid = document.getElementById('featured-grid');
    if (grid) grid.dataset.theme = theme;

    var visibleCount = 0;
    cards.forEach(function (card, i) {
      if (checks[i]) { visibleCount++; }
      else { card.style.display = 'none'; }
    });

    var countEl = document.querySelector('.catalog-count-num');
    if (countEl) countEl.textContent = String(visibleCount);
  });
</script>
