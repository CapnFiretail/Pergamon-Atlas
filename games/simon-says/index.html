  <style>
    .game-hero{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);color:white;border:2px solid #8a611c;border-radius:16px;padding:28px;margin-bottom:24px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}

    .simon-btn{height:120px;border-radius:12px;border:4px solid #111;cursor:pointer;transition:filter .1s;opacity:.7}
    .simon-btn:hover{opacity:.85}

    .spd-btn.active{background:#111;color:white;border-color:#111}

<body>

        <div class="hud">
          <span><span class="val" id="roundVal">0</span>Round</span>
          <span><span class="val" id="bestVal">0</span>Best</span>
        </div>
        <div class="speed-row">
          <button class="spd-btn active" onclick="setSpeed(600,'slow',this)">Slow</button>
          <button class="spd-btn" onclick="setSpeed(400,'med',this)">Medium</button>
          <button class="spd-btn" onclick="setSpeed(250,'fast',this)">Fast</button>
        </div>
        <div class="simon-board">
          <button class="simon-btn disabled" id="btn0" onclick="playerPress(0)"></button>
          <button class="simon-btn disabled" id="btn1" onclick="playerPress(1)"></button>
          <button class="simon-btn disabled" id="btn2" onclick="playerPress(2)"></button>
          <button class="simon-btn disabled" id="btn3" onclick="playerPress(3)"></button>
        </div>
        <div class="status" id="status">Press Start to play</div>
        <button class="atlas-btn" id="startBtn" onclick="startGame()">Start</button>
      </div>
    </main>

  <script src="/operation/scripts/atlas.js"></script>
  <script>
    loadSnippets('Simon Says');

    let sequence=[],playerSeq,round,speed,best,accepting;
    best=parseInt(localStorage.getItem('simon_best')||0);
    document.getElementById('bestVal').textContent=best;
    speed=600;

    function setSpeed(ms,lbl,btn){speed=ms;document.querySelectorAll('.spd-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}

    function startGame(){
      sequence=[];round=0;document.getElementById('startBtn').textContent='Restart';
      nextRound();
    }

    function nextRound(){
      accepting=false;playerSeq=[];round++;
      document.getElementById('roundVal').textContent=round;
      setStatus('Watch the sequence...');
      setPlayerMode(false);
      sequence.push(Math.floor(Math.random()*4));
      setTimeout(()=>playSequence(0),600);
    }

    function playSequence(i){
      if(i>=sequence.length){setTimeout(()=>{setStatus('Your turn!');setPlayerMode(true);accepting=true;},300);return;}
      flashBtn(sequence[i]);
      setTimeout(()=>playSequence(i+1),speed+150);
    }

    function flashBtn(idx){
      const btn=document.getElementById('btn'+idx);
      btn.classList.add('active');
      setTimeout(()=>btn.classList.remove('active'),speed*0.8);
    }

    function setPlayerMode(on){
      document.querySelectorAll('.simon-btn').forEach(b=>{
        b.classList.toggle('disabled',!on);
      });
    }

    function playerPress(idx){
      if(!accepting) return;
      flashBtn(idx);
      playerSeq.push(idx);
      const pos=playerSeq.length-1;
      if(playerSeq[pos]!==sequence[pos]){
        accepting=false;setPlayerMode(false);
        if(round-1>best){best=round-1;localStorage.setItem('simon_best',best);document.getElementById('bestVal').textContent=best;}
        setStatus('Wrong! Round '+round+', sequence: '+round+'. Game over!');
        setTimeout(()=>setStatus('Press Start to try again'),1200);
        return;
      }
      if(playerSeq.length===sequence.length){accepting=false;setTimeout(nextRound,600);}
    }

    function setStatus(msg){document.getElementById('status').textContent=msg;}
  </script>

<script src="/data/pergamon-address.js"></script>
