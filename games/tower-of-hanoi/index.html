  <style>
    .game-hero{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);color:white;border:2px solid #8a611c;border-radius:16px;padding:28px;margin-bottom:24px;box-shadow:0 6px 18px rgba(0,0,0,.18)}

    .game-hero p{margin:0;font-size:16px;color:#ccc}
    .toh-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
    .toh-area{background:#1a1a1a;border-radius:14px;border:2px solid #8a611c;padding:24px;width:min(100%,660px);box-sizing:border-box}
    .toh-pegs{display:flex;justify-content:space-around;align-items:flex-end;height:220px;position:relative}
    .toh-peg{display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;width:32%;padding-bottom:12px}
    .toh-peg .peg-pole{width:6px;height:180px;background:#8a611c;border-radius:3px;position:absolute;bottom:12px}

    .toh-peg .peg-lbl{position:absolute;bottom:-22px;font-size:13px;color:#c28a2b;font-weight:700}

    .toh-peg.selected .peg-pole{background:#f0d39b;}
    .toh-peg.selected .peg-base{background:#f0d39b;}

    .toh-stat .val{font-size:26px;font-weight:800;color:#f0d39b;font-family:monospace;text-align:center}
    .toh-stat .lbl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px;text-align:center}

<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="game-hero">
        <h2>Tower of Hanoi</h2>
        <p>Move all disks from the left peg to the right peg. You can only move one disk at a time, and a larger disk cannot sit on a smaller one.</p>
      </div>
      <div class="toh-wrap">
        <div class="toh-stats">
          <div class="toh-stat"><div class="val" id="movesEl">0</div><div class="lbl">Moves</div></div>
          <div class="toh-stat"><div class="val" id="minEl">0</div><div class="lbl">Min Moves</div></div>
        </div>
        <div class="toh-area">
          <div class="toh-pegs" id="tohPegs">
            <div class="toh-peg" id="peg0" onclick="clickPeg(0)"><div class="peg-pole"></div><div class="peg-base"></div><div class="disks" id="disks0"></div><div class="peg-lbl">A</div></div>
            <div class="toh-peg" id="peg1" onclick="clickPeg(1)"><div class="peg-pole"></div><div class="peg-base"></div><div class="disks" id="disks1"></div><div class="peg-lbl">B</div></div>
            <div class="toh-peg" id="peg2" onclick="clickPeg(2)"><div class="peg-pole"></div><div class="peg-base"></div><div class="disks" id="disks2"></div><div class="peg-lbl">C</div></div>
          </div>
        </div>
        <div class="toh-msg" id="tohMsg">Click a peg to select the top disk, then click destination.</div>
        <div class="toh-btns">
          <label style="color:#444;font-size:14px">Disks:
            <select class="toh-select" id="diskCount">
              <option value="3">3</option><option value="4" selected>4</option>
              <option value="5">5</option><option value="6">6</option><option value="7">7</option>
            </select>
          </label>
          <button class="toh-btn" onclick="newGame()">New Game</button>
        </div>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/operation/scripts/atlas.js"></script>
  <script>loadSnippets('Games');</script>
  <script>
  const DISK_COLORS=['#c28a2b','#8a611c','#d4a03a','#a07820','#f0d070','#6a4a10','#b08030'];
  let pegs,selectedPeg,moves,numDisks,won;

  function newGame(){
    numDisks=parseInt(document.getElementById('diskCount').value);
    pegs=[[],[],[]];
    for(let i=numDisks;i>=1;i--)pegs[0].push(i);
    selectedPeg=null; moves=0; won=false;
    document.getElementById('movesEl').textContent='0';
    document.getElementById('minEl').textContent=Math.pow(2,numDisks)-1;
    document.getElementById('tohMsg').textContent='Click a peg to select the top disk.';
    render();
  }

  function clickPeg(p){
    if(won)return;
    if(selectedPeg===null){
      if(pegs[p].length===0){document.getElementById('tohMsg').textContent='That peg is empty.';return;}
      selectedPeg=p;
      document.getElementById('tohMsg').textContent='Now click a destination peg.';
    }else{
      if(p===selectedPeg){selectedPeg=null;document.getElementById('tohMsg').textContent='Cancelled.';render();return;}
      const disk=pegs[selectedPeg][pegs[selectedPeg].length-1];
      if(pegs[p].length>0&&pegs[p][pegs[p].length-1]<disk){
        document.getElementById('tohMsg').textContent='Cannot place a larger disk on a smaller one.';
        selectedPeg=null; render(); return;
      }
      pegs[p].push(pegs[selectedPeg].pop());
      moves++; document.getElementById('movesEl').textContent=moves;
      selectedPeg=null;
      if(pegs[2].length===numDisks){
        won=true;
        document.getElementById('tohMsg').textContent=`Solved in ${moves} moves! Min: ${Math.pow(2,numDisks)-1}`;
      }else{
        document.getElementById('tohMsg').textContent='Click a peg to move the top disk.';
      }
    }
    render();
  }

  function render(){
    for(let p=0;p<3;p++){
      const el=document.getElementById('disks'+p);
      el.innerHTML='';
      const maxW=pegs[0].length+pegs[1].length+pegs[2].length;
      pegs[p].forEach(d=>{
        const div=document.createElement('div');
        div.className='toh-disk';
        const pct=Math.round(30+((numDisks-d)/(numDisks-1||1))*55);
        div.style.width=pct+'%'; div.style.maxWidth='170px';
        div.style.background=DISK_COLORS[(d-1)%DISK_COLORS.length];
        div.textContent=d;
        el.appendChild(div);
      });
      document.getElementById('peg'+p).classList.toggle('selected',selectedPeg===p);
    }
  }

  newGame();
  </script>
