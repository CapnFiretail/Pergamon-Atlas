  <script>
    const canvas  = document.getElementById('sn-canvas');
    const ctx     = canvas.getContext('2d');
    const W = 400, H = 400, COLS = 20, ROWS = 20, CELL = 20;

    const SPEEDS  = { slow: 200, medium: 130, fast: 70 };
    let speed     = 'medium';
    let snake, dir, nextDir, food, score, running, paused, gameLoop;
    let highScore = parseInt(localStorage.getItem('sn-hi') || '0');

    const scoreEl  = document.getElementById('sn-score');
    const bestEl   = document.getElementById('sn-best');
    const startBtn = document.getElementById('sn-start');
    const pauseBtn = document.getElementById('sn-pause');
    bestEl.textContent = highScore;

    /* ── Speed buttons ── */
    document.querySelectorAll('.sn-speed-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.sn-speed-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        speed = btn.dataset.speed;
        if (running && !paused) {
          clearInterval(gameLoop);
          gameLoop = setInterval(tick, SPEEDS[speed]);
        }
      });
    });

    /* ── Start / Restart ── */
    startBtn.addEventListener('click', startGame);

    /* ── Pause / Resume ── */
    pauseBtn.addEventListener('click', () => {
      if (!running) return;
      paused = !paused;
      pauseBtn.textContent = paused ? 'Resume' : 'Pause';
      if (paused) {
        clearInterval(gameLoop);
      } else {
        gameLoop = setInterval(tick, SPEEDS[speed]);
      }
    });

    /* ── Game init ── */
    function startGame() {
      snake   = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
      dir     = {x:1,y:0};
      nextDir = {x:1,y:0};
      food    = randomFood();
      score   = 0;
      running = true;
      paused  = false;
      scoreEl.textContent = '0';
      startBtn.textContent = 'Restart';
      pauseBtn.disabled    = false;
      pauseBtn.textContent = 'Pause';
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, SPEEDS[speed]);
      draw();
    }

    function randomFood() {
      let pos;
      do {
        pos = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      return pos;
    }

    /* ── Game tick ── */
    function tick() {
      dir = nextDir;
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { endGame(); return; }
      if (snake.slice(0, -1).some(s => s.x === head.x && s.y === head.y)) { endGame(); return; }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        food = randomFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function endGame() {
      running = false;
      clearInterval(gameLoop);
      pauseBtn.disabled    = true;
      pauseBtn.textContent = 'Pause';

      const isNewBest = score > highScore;
      if (isNewBest) {
        highScore = score;
        localStorage.setItem('sn-hi', highScore);
        bestEl.textContent = highScore;
      }

      drawGameOver(isNewBest);
    }

    /* ── Drawing ── */
    function drawBackground() {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= W; x += CELL) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
      for (let y = 0; y <= H; y += CELL) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.arcTo(x + w, y,     x + w, y + r,     r);
      ctx.lineTo(x + w, y + h - r);
      ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
      ctx.lineTo(x + r, y + h);
      ctx.arcTo(x,     y + h, x,     y + h - r, r);
      ctx.lineTo(x, y + r);
      ctx.arcTo(x,     y,     x + r, y,         r);
      ctx.closePath();
      ctx.fill();
    }

    function draw() {
      drawBackground();

      /* food */
      ctx.fillStyle    = '#e74c3c';
      ctx.shadowColor  = 'rgba(231,76,60,0.55)';
      ctx.shadowBlur   = 8;
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL/2, food.y * CELL + CELL/2, CELL/2 - 2, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;

      /* body segments */
      ctx.fillStyle = '#8a611c';
      for (let i = snake.length - 1; i >= 1; i--) {
        const s = snake[i];
        roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 3);
      }

      /* head */
      ctx.fillStyle = '#f0d39b';
      roundRect(snake[0].x * CELL + 1, snake[0].y * CELL + 1, CELL - 2, CELL - 2, 4);
    }

    function drawGameOver(isNewBest) {
      draw();
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign  = 'center';
      ctx.textBaseline = 'middle';

      ctx.fillStyle = '#f0d39b';
      ctx.font      = 'bold 36px Georgia, serif';
      ctx.fillText('GAME OVER', W/2, H/2 - 36);

      ctx.fillStyle = '#ddd';
      ctx.font      = '18px Georgia, serif';
      ctx.fillText('Score: ' + score, W/2, H/2 + 2);

      if (isNewBest && score > 0) {
        ctx.fillStyle = '#f0d39b';
        ctx.font      = 'bold 14px Georgia, serif';
        ctx.fillText('New Best!', W/2, H/2 + 28);
      }

      ctx.fillStyle = '#777';
      ctx.font      = '14px Georgia, serif';
      ctx.fillText('Press Start to play again', W/2, H/2 + (isNewBest && score > 0 ? 56 : 40));

      ctx.textBaseline = 'alphabetic';
    }

    function drawIdle() {
      drawBackground();
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle    = 'rgba(255,255,255,0.35)';
      ctx.font         = '20px Georgia, serif';
      ctx.fillText('Press Start to play', W/2, H/2);
      ctx.textBaseline = 'alphabetic';
    }

    /* ── Keyboard controls ── */
    document.addEventListener('keydown', e => {
      const arrows = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
      if (arrows.includes(e.key) && running) e.preventDefault();
      if (!running) return;

      if ((e.key === 'ArrowUp'    || e.key === 'w') && dir.y !==  1) nextDir = {x: 0, y:-1};
      if ((e.key === 'ArrowDown'  || e.key === 's') && dir.y !== -1) nextDir = {x: 0, y: 1};
      if ((e.key === 'ArrowLeft'  || e.key === 'a') && dir.x !==  1) nextDir = {x:-1, y: 0};
      if ((e.key === 'ArrowRight' || e.key === 'd') && dir.x !== -1) nextDir = {x: 1, y: 0};
    });

    /* ── Swipe controls ── */
    let touchOrigin = null;

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      touchOrigin = {x: e.touches[0].clientX, y: e.touches[0].clientY};
    }, {passive: false});

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
    }, {passive: false});

    canvas.addEventListener('touchend', e => {
      if (!touchOrigin || !running) { touchOrigin = null; return; }
      const dx  = e.changedTouches[0].clientX - touchOrigin.x;
      const dy  = e.changedTouches[0].clientY - touchOrigin.y;
      const adx = Math.abs(dx), ady = Math.abs(dy);
      touchOrigin = null;

      if (Math.max(adx, ady) < 20) return;

      if (adx > ady) {
        if (dx > 0 && dir.x !== -1) nextDir = {x: 1, y: 0};
        else if (dx < 0 && dir.x !== 1) nextDir = {x:-1, y: 0};
      } else {
        if (dy > 0 && dir.y !== -1) nextDir = {x: 0, y: 1};
        else if (dy < 0 && dir.y !== 1) nextDir = {x: 0, y:-1};
      }
    }, {passive: false});

    drawIdle();
  </script>

</body>
</html>
