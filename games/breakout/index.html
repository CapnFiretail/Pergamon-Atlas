<script>
loadSnippets('Games');

const canvas=document.getElementById('bkCanvas');
const ctx=canvas.getContext('2d');

const CW=480, CH=360;
const ROWS=5, COLS=10;
const BRICK_W=42, BRICK_H=14, BRICK_GAP=4;
const BRICK_TOP=40, BRICK_LEFT=9;
const PAD_H=10, PAD_W=72;
const BALL_R=7;
const BRICK_COLORS=['#e63946','#e67e22','#f4d03f','#2ecc71','#1d7fb9'];

let score,level,lives,bricks,ball,pad,raf,state,keys;

function initLevel(lvl){
  bricks=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    bricks.push({r,c,alive:true});
  }
  const spd=3.5+lvl*0.4;
  ball={x:CW/2,y:CH*0.65,dx:spd*(Math.random()<.5?1:-1),dy:-spd,r:BALL_R,launched:false};
  pad={x:CW/2-PAD_W/2,y:CH-28};
}

function bkStart(){
  score=0;level=1;lives=3;
  initLevel(1);
  state='playing';
  document.getElementById('bkBtn').style.display='none';
  document.getElementById('bkMsg').textContent='';
  updateHUD();
  if(raf) cancelAnimationFrame(raf);
  lastTime=0; raf=requestAnimationFrame(loop);
}

function updateHUD(){
  document.getElementById('bkScore').textContent=score;
  document.getElementById('bkLevel').textContent=level;
  document.getElementById('bkLives').textContent='❤'.repeat(lives);
}

let lastTime=0;
function loop(ts=0){
  if(state!=='playing'){return;}
  if(ts-lastTime<16){raf=requestAnimationFrame(loop);return;}
  lastTime=ts;
  update();
  draw();
  raf=requestAnimationFrame(loop);
}

let mouseX=null;
canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  const scaleX=CW/rect.width;
  mouseX=(e.clientX-rect.left)*scaleX-PAD_W/2;
});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const scaleX=CW/rect.width;
  mouseX=(e.touches[0].clientX-rect.left)*scaleX-PAD_W/2;
},{passive:false});
canvas.addEventListener('click',()=>{if(state==='idle')bkStart();else{ball.launched=true;}});
canvas.addEventListener('touchstart',()=>{if(state==='idle')bkStart();else{ball.launched=true;}});

keys={left:false,right:false};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
  if(e.key===' '){e.preventDefault();ball.launched=true;}
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
});

function update(){
  const spd=8;
  if(keys.left) pad.x-=spd;
  if(keys.right) pad.x+=spd;
  if(mouseX!==null) pad.x=mouseX;
  pad.x=Math.max(0,Math.min(CW-PAD_W,pad.x));

  if(!ball.launched){
    ball.x=pad.x+PAD_W/2;
    return;
  }

  ball.x+=ball.dx;
  ball.y+=ball.dy;

  if(ball.x-BALL_R<0){ball.x=BALL_R;ball.dx=Math.abs(ball.dx);}
  if(ball.x+BALL_R>CW){ball.x=CW-BALL_R;ball.dx=-Math.abs(ball.dx);}
  if(ball.y-BALL_R<0){ball.y=BALL_R;ball.dy=Math.abs(ball.dy);}

  if(ball.y+BALL_R>=pad.y&&ball.y-BALL_R<=pad.y+PAD_H&&ball.x+BALL_R>=pad.x&&ball.x-BALL_R<=pad.x+PAD_W&&ball.dy>0){
    const hit=(ball.x-(pad.x+PAD_W/2))/(PAD_W/2);
    const angle=hit*1.1;
    const spd=Math.sqrt(ball.dx*ball.dx+ball.dy*ball.dy);
    ball.dx=spd*Math.sin(angle);
    ball.dy=-spd*Math.cos(angle);
    ball.y=pad.y-BALL_R;
  }

  if(ball.y-BALL_R>CH){
    lives--;
    updateHUD();
    if(lives<=0){
      state='gameover';
      document.getElementById('bkMsg').textContent='Game Over — Score: '+score;
      document.getElementById('bkBtn').style.display='';
      document.getElementById('bkBtn').textContent='Play Again';
      draw();return;
    }
    ball.launched=false;
    ball.x=pad.x+PAD_W/2;
    ball.y=pad.y-BALL_R-2;
    const s=3.5+level*0.4;
    ball.dx=s*(Math.random()<.5?1:-1);
    ball.dy=-s;
  }

  for(const b of bricks){
    if(!b.alive) continue;
    const bx=BRICK_LEFT+b.c*(BRICK_W+BRICK_GAP);
    const by=BRICK_TOP+b.r*(BRICK_H+BRICK_GAP);
    if(ball.x+BALL_R>bx&&ball.x-BALL_R<bx+BRICK_W&&ball.y+BALL_R>by&&ball.y-BALL_R<by+BRICK_H){
      b.alive=false;
      score+=10*(level);
      updateHUD();
      const overlapL=ball.x+BALL_R-bx,overlapR=bx+BRICK_W-(ball.x-BALL_R);
      const overlapT=ball.y+BALL_R-by,overlapB=by+BRICK_H-(ball.y-BALL_R);
      const minH=Math.min(overlapL,overlapR),minV=Math.min(overlapT,overlapB);
      if(minH<minV) ball.dx=-ball.dx; else ball.dy=-ball.dy;
      break;
    }
  }

  if(bricks.every(b=>!b.alive)){
    level++;
    initLevel(level);
    updateHUD();
    document.getElementById('bkMsg').textContent='Level '+level+'!';
    setTimeout(()=>{if(state==='playing')document.getElementById('bkMsg').textContent='';},1500);
  }
}

function draw(){
  ctx.clearRect(0,0,CW,CH);

  for(const b of bricks){
    if(!b.alive) continue;
    const bx=BRICK_LEFT+b.c*(BRICK_W+BRICK_GAP);
    const by=BRICK_TOP+b.r*(BRICK_H+BRICK_GAP);
    ctx.fillStyle=BRICK_COLORS[b.r%BRICK_COLORS.length];
    ctx.beginPath();ctx.roundRect(bx,by,BRICK_W,BRICK_H,3);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.18)';
    ctx.fillRect(bx+2,by+2,BRICK_W-4,3);
  }

  const grad=ctx.createLinearGradient(pad.x,pad.y,pad.x,pad.y+PAD_H);
  grad.addColorStop(0,'#f0d39b');grad.addColorStop(1,'#b8860b');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.roundRect(pad.x,pad.y,PAD_W,PAD_H,5);ctx.fill();

  ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);
  ctx.fillStyle='white';ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.beginPath();ctx.arc(ball.x-2,ball.y-2,BALL_R*0.4,0,Math.PI*2);ctx.fill();
}

state='idle';
initLevel(1);
draw();
</script>
