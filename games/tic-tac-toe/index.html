<body>
<div id="header-placeholder"></div>
<div class="layout">

<main class="main-content">
  <div class="game-hero">
    <h2>Tic Tac Toe</h2>
    <p>Classic X's and O's — challenge a friend or face an unbeatable AI</p>
  </div>
  <div class="panel">
    <div class="mode-row">
      <button class="mode-btn active" id="modeAI" onclick="setMode('ai')">vs AI</button>
      <button class="mode-btn" id="mode2P" onclick="setMode('2p')">2 Players</button>
    </div>
    <div class="score-row">
      <div class="score-item"><div class="lbl" id="p1lbl">You (X)</div><div class="val" id="scoreX">0</div></div>
      <div class="score-item"><div class="lbl">Draws</div><div class="val" id="scoreDraw">0</div></div>
      <div class="score-item"><div class="lbl" id="p2lbl">AI (O)</div><div class="val" id="scoreO">0</div></div>
    </div>
    <div class="status" id="status"></div>
    <div class="ttt-grid" id="grid"></div>
    <button class="atlas-btn" onclick="newGame()">New Game</button>
  </div>
</main>
</div>
<div id="footer-placeholder"></div>
<script src="/operation/scripts/atlas.js"></script>
<script>
loadSnippets('Games');

let board, currentPlayer, gameActive, mode = 'ai';
let scores = {X:0, O:0, draw:0};
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function setMode(m) {
  mode = m;
  document.getElementById('modeAI').classList.toggle('active', m==='ai');
  document.getElementById('mode2P').classList.toggle('active', m==='2p');
  document.getElementById('p2lbl').textContent = m==='ai' ? 'AI (O)' : 'Player 2 (O)';
  document.getElementById('p1lbl').textContent = m==='ai' ? 'You (X)' : 'Player 1 (X)';
  newGame();
}

function newGame() {
  board = Array(9).fill(null);
  currentPlayer = 'X';
  gameActive = true;
  render();
  setStatus(mode==='2p' ? "X's turn" : 'Your turn (X)', '');
}

function setStatus(msg, color) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.style.color = color;
}

function checkWinner(b) {
  for (const [a,bb,c] of LINES) {
    if (b[a] && b[a]===b[bb] && b[a]===b[c]) return {winner:b[a], line:[a,bb,c]};
  }
  return b.every(c=>c) ? {winner:'draw'} : null;
}

function minimax(b, isMax, depth) {
  const r = checkWinner(b);
  if (r) return r.winner==='O' ? 10-depth : r.winner==='X' ? depth-10 : 0;
  const moves = b.map((_,i)=>i).filter(i=>!b[i]);
  if (!moves.length) return 0;
  let best = isMax ? -Infinity : Infinity;
  for (const i of moves) {
    b[i] = isMax ? 'O' : 'X';
    const s = minimax(b, !isMax, depth+1);
    b[i] = null;
    best = isMax ? Math.max(best,s) : Math.min(best,s);
  }
  return best;
}

function bestMove() {
  let best = -Infinity, move = -1;
  for (let i=0;i<9;i++) {
    if (!board[i]) {
      board[i]='O';
      const s = minimax(board,false,0);
      board[i]=null;
      if (s>best) { best=s; move=i; }
    }
  }
  return move;
}

function handleClick(i) {
  if (!gameActive || board[i]) return;
  if (mode==='ai' && currentPlayer==='O') return;
  board[i] = currentPlayer;
  const r = checkWinner(board);
  render();
  if (r) { endGame(r); return; }
  if (mode==='2p') {
    currentPlayer = currentPlayer==='X' ? 'O' : 'X';
    setStatus(`${currentPlayer}'s turn`, '');
  } else {
    currentPlayer = 'O';
    setStatus('AI is thinking…', '#888');
    setTimeout(() => {
      const m = bestMove();
      if (m!==-1) board[m]='O';
      render();
      const r2 = checkWinner(board);
      if (r2) { endGame(r2); return; }
      currentPlayer = 'X';
      setStatus('Your turn (X)', '');
    }, 300);
  }
}

function endGame(r) {
  gameActive = false;
  render(r.line);
  if (r.winner==='draw') { scores.draw++; setStatus('Draw!', '#888'); }
  else {
    scores[r.winner]++;
    if (mode==='ai') setStatus(r.winner==='X' ? 'You win! 🎉' : 'AI wins!', r.winner==='X' ? '#2a9d3a' : '#c0392b');
    else setStatus(`${r.winner} wins! 🎉`, '#2a9d3a');
  }
  document.getElementById('scoreX').textContent = scores.X;
  document.getElementById('scoreO').textContent = scores.O;
  document.getElementById('scoreDraw').textContent = scores.draw;
}

function render(winLine) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  board.forEach((val,i) => {
    const btn = document.createElement('button');
    btn.className = 'ttt-cell'+(val?' taken '+val.toLowerCase():'')+(winLine&&winLine.includes(i)?' win':'');
    btn.textContent = val||'';
    btn.onclick = ()=>handleClick(i);
    grid.appendChild(btn);
  });
}

newGame();
</script>
