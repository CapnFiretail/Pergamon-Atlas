  <style>
    .ph-shell { max-width: 100%; margin: 0 auto; }

    .bj-hero {
      --hero-gold: #bf7d08;
      --hero-gold-bright: #e2ad35;

      display: grid;
      position: relative;
      box-sizing: border-box;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      grid-template-columns: minmax(0, 190px) minmax(0, 68px) minmax(0, 1fr) minmax(0, 300px);
      align-items: center;
      min-height: 210px;
      padding: 20px 36px;

      background:
        radial-gradient(circle at 18% 50%, rgba(184, 136, 26, 0.06), transparent 29%),
        radial-gradient(circle at 54% 48%, rgba(255, 255, 255, 0.032), transparent 31%),
        linear-gradient(135deg, #111 0%, #151515 45%, #0d0d0d 100%);
      border: 1.5px solid rgba(191, 125, 8, 0.95);
      border-radius: 20px;
      box-shadow:
        inset 0 0 0 1px rgba(184, 136, 26, 0.16),
        inset 0 0 0 8px rgba(0, 0, 0, 0.16),
        inset 0 0 40px rgba(255, 255, 255, 0.028),
        0 8px 22px rgba(0, 0, 0, 0.56);
    }

    .bj-hero::after {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 7px;
      border: 1px solid rgba(191, 125, 8, 0.62);
      border-radius: 14px;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.035), transparent 12%, transparent 88%, rgba(255,255,255,0.035)),
        repeating-linear-gradient(105deg, rgba(255,255,255,0.016) 0 1px, transparent 1px 5px);
      pointer-events: none;
    }

    .bj-hero .game-hero-corner { display: none; }
    .bj-hero > * { position: relative; z-index: 2; min-width: 0; }

    .bj-hero .game-hero-emblem {
      place-self: center;
      width: 182px; height: 182px;
      background: transparent; border: 0; border-radius: 0; box-shadow: none; overflow: visible; margin: 0;
    }

    .bj-hero .game-hero-emblem img {
      width: 100%; height: 100%; object-fit: contain; display: block;
      filter: drop-shadow(0 0 8px rgba(184, 136, 26, 0.18));
    }

    .bj-hero .game-hero-sep {
      align-self: stretch; width: 100%; font-size: 22px; color: var(--hero-gold-bright);
    }

    .bj-hero .game-hero-sep::before,
    .bj-hero .game-hero-sep::after { background: rgba(191, 125, 8, 0.86); }
    .bj-hero .game-hero-sep::before { top: 24px; height: calc(50% - 36px); }
    .bj-hero .game-hero-sep::after  { bottom: 24px; height: calc(50% - 36px); }

    .bj-hero .game-hero-title {
      overflow: hidden; min-width: 0; padding: 0 24px 4px; container-type: inline-size;
    }

    .bj-hero .game-hero-title h2 {
      margin: 0 0 18px;
      font-size: clamp(32px, 9cqi, 68px);
      color: #f7f7f7;
      text-shadow: 0 2px 0 rgba(0,0,0,0.65), 0 0 14px rgba(255,255,255,0.18);
      overflow: hidden;
    }

    .bj-hero .game-hero-sub {
      gap: 18px; color: var(--hero-gold-bright); font-size: 15px; font-weight: 700; letter-spacing: 0.15em;
    }

    .bj-hero .game-hero-sub-line {
      flex: 1; max-width: 100px; background: rgba(191, 125, 8, 0.95); position: relative;
    }

    .bj-hero .game-hero-sub-line::before,
    .bj-hero .game-hero-sub-line::after {
      content: ""; position: absolute; top: 50%; width: 5px; height: 5px;
      background: var(--hero-gold-bright); border-radius: 50%; transform: translateY(-50%);
    }

    .bj-hero .game-hero-sub-line::before { left: 0; }
    .bj-hero .game-hero-sub-line::after  { right: 0; }

    .bj-artifact {
      align-self: center; width: 100%; min-height: 82px;
      border: 1px solid rgba(191, 125, 8, 0.95); border-radius: 8px;
      color: #f7f7f7; text-decoration: none; display: grid;
      grid-template-columns: 40px 1fr; align-items: center;
      column-gap: 12px; padding: 10px 20px; position: relative;
      background: rgba(8, 8, 8, 0.26); box-shadow: inset 0 0 16px rgba(184, 136, 26, 0.04);
    }

    .bj-artifact::before, .bj-artifact::after,
    .bj-artifact-inner::before, .bj-artifact-inner::after {
      content: ""; position: absolute; width: 14px; height: 14px;
      border-color: var(--hero-gold); border-style: solid; pointer-events: none;
    }

    .bj-artifact::before       { top: 4px;    left: 4px;   border-width: 1px 0 0 1px; }
    .bj-artifact::after        { top: 4px;    right: 4px;  border-width: 1px 1px 0 0; }
    .bj-artifact-inner::before { bottom: 4px; left: 4px;   border-width: 0 0 1px 1px; }
    .bj-artifact-inner::after  { bottom: 4px; right: 4px;  border-width: 0 1px 1px 0; }

    .bj-artifact-icon { width: 34px; height: 34px; color: var(--hero-gold-bright); }
    .bj-artifact-inner { position: absolute; inset: 0; pointer-events: none; }
    .bj-artifact-text { min-width: 0; overflow: hidden; }

    .bj-artifact-label {
      color: var(--hero-gold-bright); display: block; font-size: 13px; font-weight: 700;
      line-height: 1.1; margin-bottom: 5px; text-transform: uppercase; white-space: nowrap;
    }

    .bj-artifact-code {
      color: #f7f7f7; display: block; font-size: 20px; line-height: 1;
      text-shadow: 0 1px 0 rgba(0,0,0,0.65), 0 0 10px rgba(255,255,255,0.12);
      white-space: nowrap; overflow-wrap: anywhere;
    }

    .bj-artifact:hover {
      background: rgba(184, 136, 26, 0.08);
      box-shadow: inset 0 0 20px rgba(184, 136, 26, 0.08), 0 0 16px rgba(184, 136, 26, 0.13);
    }

    /* ── Coming Soon Card ── */
    .ph-card {
      background: white; border: 2px solid #000; border-radius: 16px;
      padding: 36px 32px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); text-align: center;
    }

    /* ── Card hand graphic ── */
    .bj-hand {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 0;
      margin: 0 auto 28px;
      width: fit-content;
      height: 120px;
      position: relative;
    }

    .bj-card {
      width: 64px;
      height: 96px;
      border-radius: 8px;
      background: white;
      border: 2px solid #ccc;
      box-shadow: 1px 2px 6px rgba(0,0,0,0.18);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5px 6px;
      font-family: Georgia, serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      position: absolute;
      bottom: 0;
    }

    .bj-card .corner-b { transform: rotate(180deg); }
    .bj-card.red { color: #c0392b; }
    .bj-card.black { color: #111; }

    .bj-card.face-down {
      background: repeating-linear-gradient(
        45deg,
        #1a4a8a 0px, #1a4a8a 4px,
        #1e5299 4px, #1e5299 8px
      );
      border-color: #1a4a8a;
      color: transparent;
    }

    .ph-label {
      font-size: 22px; font-weight: 700; color: #111;
      margin: 0 0 10px; font-family: Georgia, serif;
    }

    .ph-sub {
      font-size: 16px; color: #555; line-height: 1.7;
      margin: 0 0 24px; max-width: 480px; margin-left: auto; margin-right: auto;
    }

    @media (max-width: 600px) {
      .ph-card { padding: 28px 20px; }
      .bj-card { width: 50px; height: 74px; font-size: 14px; }
      .bj-hand { height: 94px; }

    /* ── ≤1300px ── */
    @media (max-width: 1300px) {

        grid-template-columns: minmax(0, 152px) minmax(0, 52px) minmax(0, 1fr) minmax(0, 240px);

      .bj-hero .game-hero-emblem { width: 148px; height: 148px; }

      .bj-hero .game-hero-sep::after  { bottom: 20px; height: calc(50% - 30px); }
      .bj-hero .game-hero-title { padding: 0 16px 2px; }
      .bj-hero .game-hero-title h2 { font-size: clamp(24px, 9cqi, 48px); margin-bottom: 14px; }
      .bj-hero .game-hero-sub { font-size: 12px; gap: 12px; }
      .bj-hero .game-hero-sub-line { max-width: 72px; }
      .bj-artifact { min-height: 68px; grid-template-columns: 32px 1fr; column-gap: 10px; }
      .bj-artifact-icon { width: 26px; height: 26px; }
      .bj-artifact-label { font-size: 11px; }
      .bj-artifact-code { font-size: 17px; }
    }

    /* ── ≤1200px: artifact drops below ── */
    @media (max-width: 1200px) {
      .bj-hero {
        grid-template-columns: minmax(0, 134px) minmax(0, 42px) minmax(0, 1fr);
        grid-template-rows: auto auto; min-height: 0; height: auto;
        padding: 16px 20px; align-items: center; border-radius: 16px;
      }
      .bj-hero::after { inset: 5px; border-radius: 11px; }
      .bj-hero .game-hero-emblem { width: 114px; height: 114px; grid-column: 1; grid-row: 1; place-self: center; }
      .bj-hero .game-hero-sep { grid-column: 2; grid-row: 1; font-size: 16px; }
      .bj-hero .game-hero-sep::before { top: 20px; height: calc(50% - 28px); }
      .bj-hero .game-hero-sep::after  { bottom: 20px; height: calc(50% - 28px); }
      .bj-hero .game-hero-title { grid-column: 3; grid-row: 1; padding: 6px 0 8px; text-align: center; }
      .bj-hero .game-hero-title h2 { font-size: clamp(22px, 9cqi, 46px); margin-bottom: 10px; }
      .bj-hero .game-hero-sub { font-size: 11px; gap: 10px; }
      .bj-hero .game-hero-sub-line { max-width: 56px; }
      .bj-artifact {
        grid-column: 1 / 4; grid-row: 2; width: 100%; min-height: 66px; margin-top: 12px;
        grid-template-columns: 36px 1fr; column-gap: 10px; padding: 10px 18px;
      }
      .bj-artifact-icon { width: 30px; height: 30px; }
      .bj-artifact-label { font-size: 12px; margin-bottom: 5px; }
      .bj-artifact-code { font-size: 19px; }
    }

    /* ── ≤560px ── */
    @media (max-width: 560px) {
      .bj-hero {
        grid-template-columns: minmax(0, 76px) minmax(0, 1fr);
        grid-template-rows: auto auto; padding: 14px 16px; border-radius: 14px;
      }
      .bj-hero .game-hero-emblem { width: 76px; height: 76px; grid-column: 1; grid-row: 1; }
      .bj-hero .game-hero-sep { display: none; }
      .bj-hero .game-hero-title { grid-column: 2; grid-row: 1; padding: 0 0 8px; text-align: center; }
      .bj-hero .game-hero-title h2 { font-size: clamp(16px, 9cqi, 30px); margin-bottom: 8px; }
      .bj-hero .game-hero-sub { font-size: 9px; gap: 8px; }
      .bj-hero .game-hero-sub-line { max-width: 36px; }
      .bj-artifact {
        grid-column: 1 / 3; grid-row: 2; width: 100%; margin-top: 12px;
        min-height: 58px; grid-template-columns: 30px 1fr; column-gap: 10px; padding: 9px 14px;
      }
      .bj-artifact-icon { width: 26px; height: 26px; }
      .bj-artifact-label { font-size: 10px; }
      .bj-artifact-code { font-size: clamp(13px, 4vw, 17px); line-height: 1.15; white-space: normal; }
    }

    @media (max-width: 390px) {
      .bj-hero { grid-template-columns: minmax(0, 60px) minmax(0, 1fr); padding: 12px; }
      .bj-hero .game-hero-emblem { width: 60px; height: 60px; }
      .bj-hero .game-hero-title h2 { font-size: 21px; }
      .bj-hero .game-hero-sub { font-size: 8px; gap: 6px; }
      .bj-hero .game-hero-sub-line { max-width: 22px; }
      .bj-artifact { grid-template-columns: 26px minmax(0, 1fr); padding: 9px 12px; }
    }
  </style>
