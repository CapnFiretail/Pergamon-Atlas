    .ph-shell {

    .ch-hero {
      --hero-gold: #bf7d08;
      --hero-gold-bright: #e2ad35;

      display: grid;
      position: relative;
      box-sizing: border-box;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      grid-template-columns: minmax(0, 190px) minmax(0, 68px) minmax(0, 1fr) minmax(0, 300px);
      align-items: center;
      min-height: 210px;
      padding: 20px 36px;

      background:
        radial-gradient(circle at 18% 50%, rgba(184, 136, 26, 0.06), transparent 29%),
        radial-gradient(circle at 54% 48%, rgba(255, 255, 255, 0.032), transparent 31%),
        linear-gradient(135deg, #111 0%, #151515 45%, #0d0d0d 100%);
      border: 1.5px solid rgba(191, 125, 8, 0.95);
      border-radius: 20px;
      box-shadow:
        inset 0 0 0 1px rgba(184, 136, 26, 0.16),
        inset 0 0 0 8px rgba(0, 0, 0, 0.16),
        inset 0 0 40px rgba(255, 255, 255, 0.028),
        0 8px 22px rgba(0, 0, 0, 0.56);
    }

    .ch-hero::after {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 7px;
      border: 1px solid rgba(191, 125, 8, 0.62);
      border-radius: 14px;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.035), transparent 12%, transparent 88%, rgba(255,255,255,0.035)),
        repeating-linear-gradient(105deg, rgba(255,255,255,0.016) 0 1px, transparent 1px 5px);
      pointer-events: none;
    }

    .ch-hero .game-hero-corner { display: none; }

    .ch-hero > * {
      position: relative;
      z-index: 2;
      min-width: 0;
    }

    .ch-hero .game-hero-emblem {
      place-self: center;
      width: 182px;
      height: 182px;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      overflow: visible;
      margin: 0;
    }

    .ch-hero .game-hero-emblem img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 0 8px rgba(184, 136, 26, 0.18));
    }

    .ch-hero .game-hero-sep {
      align-self: stretch;
      width: 100%;
      font-size: 22px;
      color: var(--hero-gold-bright);
    }

    .ch-hero .game-hero-sep::before,
    .ch-hero .game-hero-sep::after {
      background: rgba(191, 125, 8, 0.86);
    }

    .ch-hero .game-hero-sep::before { top: 24px; height: calc(50% - 36px); }
    .ch-hero .game-hero-sep::after  { bottom: 24px; height: calc(50% - 36px); }

    .ch-hero .game-hero-title {
      overflow: hidden;
      min-width: 0;
      padding: 0 24px 4px;
      container-type: inline-size;
    }

    .ch-hero .game-hero-title h2 {
      margin: 0 0 18px;
      font-size: clamp(32px, 9cqi, 68px);
      color: #f7f7f7;
      text-shadow: 0 2px 0 rgba(0,0,0,0.65), 0 0 14px rgba(255,255,255,0.18);
      overflow: hidden;
    }

    .ch-hero .game-hero-sub {
      gap: 18px;
      color: var(--hero-gold-bright);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.15em;
    }

    .ch-hero .game-hero-sub-line {
      flex: 1;
      max-width: 100px;
      background: rgba(191, 125, 8, 0.95);
      position: relative;
    }

    .ch-hero .game-hero-sub-line::before,
    .ch-hero .game-hero-sub-line::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 5px;
      height: 5px;
      background: var(--hero-gold-bright);
      border-radius: 50%;
      transform: translateY(-50%);
    }

    .ch-hero .game-hero-sub-line::before { left: 0; }
    .ch-hero .game-hero-sub-line::after  { right: 0; }

    .ch-artifact {
      align-self: center;
      width: 100%;
      min-height: 82px;
      border: 1px solid rgba(191, 125, 8, 0.95);
      border-radius: 8px;
      color: #f7f7f7;
      text-decoration: none;
      display: grid;
      grid-template-columns: 40px 1fr;
      align-items: center;
      column-gap: 12px;
      padding: 10px 20px;
      position: relative;
      background: rgba(8, 8, 8, 0.26);
      box-shadow: inset 0 0 16px rgba(184, 136, 26, 0.04);
    }

    .ch-artifact::before,
    .ch-artifact::after,
    .ch-artifact-inner::before,
    .ch-artifact-inner::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--hero-gold);
      border-style: solid;
      pointer-events: none;
    }

    .ch-artifact::before       { top: 4px;    left: 4px;   border-width: 1px 0 0 1px; }
    .ch-artifact::after        { top: 4px;    right: 4px;  border-width: 1px 1px 0 0; }
    .ch-artifact-inner::before { bottom: 4px; left: 4px;   border-width: 0 0 1px 1px; }
    .ch-artifact-inner::after  { bottom: 4px; right: 4px;  border-width: 0 1px 1px 0; }

    .ch-artifact-icon {
      width: 34px;
      height: 34px;
      color: var(--hero-gold-bright);
    }

    .ch-artifact-inner {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .ch-artifact-text {
      min-width: 0;
      overflow: hidden;
    }

    .ch-artifact-label {
      color: var(--hero-gold-bright);
      display: block;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .ch-artifact-code {
      color: #f7f7f7;
      display: block;
      font-size: 20px;
      line-height: 1;
      text-shadow: 0 1px 0 rgba(0,0,0,0.65), 0 0 10px rgba(255,255,255,0.12);
      white-space: nowrap;
      overflow-wrap: anywhere;
    }

    .ch-artifact:hover {
      background: rgba(184, 136, 26, 0.08);
      box-shadow: inset 0 0 20px rgba(184, 136, 26, 0.08), 0 0 16px rgba(184, 136, 26, 0.13);

      .ch-artifact {

      .ch-artifact-icon { width: 26px; height: 26px; }
      .ch-artifact-label { font-size: 10px; }
      .ch-artifact-code { font-size: clamp(13px, 4vw, 17px); line-height: 1.15; white-space: normal; }

    @media (max-width: 390px) {
      .ch-hero { grid-template-columns: minmax(0, 60px) minmax(0, 1fr); padding: 12px; }

      .ch-hero .game-hero-sub-line { max-width: 22px; }
      .ch-artifact { grid-template-columns: 26px minmax(0, 1fr); padding: 9px 12px; }
    }
