          <div></div><button class="dpad-btn" onclick="move('up')">▲</button><div></div>

      </div>

  <script src="/operation/scripts/atlas.js"></script>
  <script>
    loadSnippets('Games');

    let grid,score,best,gameOver,won;
    best=parseInt(localStorage.getItem('2048_best')||0);
    document.getElementById('bestVal').textContent=best;

    function newGame(){
      grid=Array.from({length:4},()=>Array(4).fill(0));
      score=0;gameOver=false;won=false;
      addRandom();addRandom();
      render();document.getElementById('status').textContent='';
    }

    function addRandom(){
      const empty=[];
      for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(grid[r][c]===0)empty.push([r,c]);
      if(!empty.length) return;
      const [r,c]=empty[Math.floor(Math.random()*empty.length)];
      grid[r][c]=Math.random()<.9?2:4;
    }

    function slide(row){
      let arr=row.filter(v=>v);
      for(let i=0;i<arr.length-1;i++)if(arr[i]===arr[i+1]){arr[i]*=2;score+=arr[i];arr.splice(i+1,1);i++;}
      while(arr.length<4)arr.push(0);
      return arr;
    }

    function transpose(){grid=grid[0].map((_,c)=>grid.map(r=>r[c]));}
    function reverseRows(){grid=grid.map(r=>[...r].reverse());}

    function move(dir){
      if(gameOver) return;
      const prev=JSON.stringify(grid);
      if(dir==='left')grid=grid.map(r=>slide(r));
      if(dir==='right'){reverseRows();grid=grid.map(r=>slide(r));reverseRows();}
      if(dir==='up'){transpose();grid=grid.map(r=>slide(r));transpose();}
      if(dir==='down'){transpose();reverseRows();grid=grid.map(r=>slide(r));reverseRows();transpose();}
      if(JSON.stringify(grid)===prev) return;
      addRandom();
      if(score>best){best=score;localStorage.setItem('2048_best',best);}
      render();checkEnd();
    }

    function checkEnd(){
      const flat=grid.flat();
      if(flat.includes(2048)&&!won){won=true;document.getElementById('status').textContent='You reached 2048.';document.getElementById('status').className='status win';}
      if(!flat.includes(0)){
        for(let r=0;r<4;r++)for(let c=0;c<4;c++){
          if(c<3&&grid[r][c]===grid[r][c+1]) return;
          if(r<3&&grid[r][c]===grid[r+1][c]) return;
        }
        if(!won){gameOver=true;document.getElementById('status').textContent='Game over! No moves left.';document.getElementById('status').className='status lose';}
      }
    }

    function render(){
      document.getElementById('scoreVal').textContent=score;
      document.getElementById('bestVal').textContent=best;
      document.getElementById('board').innerHTML=grid.flat().map(v=>`<div class="tile${v?' t'+v:''}">${v||''}</div>`).join('');
    }

    document.addEventListener('keydown',e=>{
      if(e.key==='ArrowLeft'){e.preventDefault();move('left');}
      if(e.key==='ArrowRight'){e.preventDefault();move('right');}
      if(e.key==='ArrowUp'){e.preventDefault();move('up');}
      if(e.key==='ArrowDown'){e.preventDefault();move('down');}
    });

    // Touch support
    let tx,ty;
    document.getElementById('board').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
    document.getElementById('board').addEventListener('touchend',e=>{
      const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
      if(Math.abs(dx)>Math.abs(dy)){move(dx>0?'right':'left');}else move(dy>0?'down':'up');
    });

    newGame();
  </script>
