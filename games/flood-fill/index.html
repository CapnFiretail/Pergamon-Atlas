  <script>
  const SIZE=12, MAX_MOVES=25;
  const COLORS=['#c28a2b','#5a8a3a','#3a6aaa','#aa3a3a','#8a3aaa','#c8a048'];
  let grid,moves,won;

  function newGame(){
    grid=Array(SIZE).fill(null).map(()=>Array(SIZE).fill(0).map(()=>Math.floor(Math.random()*COLORS.length)));
    moves=0; won=false;
    document.getElementById('movesEl').textContent='0';
    document.getElementById('leftEl').textContent=MAX_MOVES;
    document.getElementById('ffMsg').textContent='Choose a color to flood fill.';
    buildColors(); render();
  }

  function buildColors(){
    const el=document.getElementById('ffColors');
    el.innerHTML='';
    COLORS.forEach((col,i)=>{
      const b=document.createElement('button');
      b.className='ff-color-btn'; b.style.background=col;
      b.title='Color '+(i+1); b.onclick=()=>flood(i);
      el.appendChild(b);
    });
  }

  function flood(colorIdx){
    if(won||moves>=MAX_MOVES)return;
    const oldColor=grid[0][0];
    if(oldColor===colorIdx)return;
    function fill(r,c){
      if(r<0||r>=SIZE||c<0||c>=SIZE||grid[r][c]!==oldColor)return;
      grid[r][c]=colorIdx;
      fill(r+1,c);fill(r-1,c);fill(r,c+1);fill(r,c-1);
    }
    fill(0,0); moves++;
    const left=MAX_MOVES-moves;
    document.getElementById('movesEl').textContent=moves;
    document.getElementById('leftEl').textContent=left;
    // Update color button highlight
    document.querySelectorAll('.ff-color-btn').forEach((b,i)=>b.classList.toggle('active',i===colorIdx));
    // Check win
    const allSame=grid.flat().every(v=>v===colorIdx);
    if(allSame){won=true;document.getElementById('ffMsg').textContent=`Filled in ${moves} moves!`;}
    else if(left===0){document.getElementById('ffMsg').textContent='Out of moves. Try again!';}
    else document.getElementById('ffMsg').textContent=`${left} moves left.`;
    render();
  }

  function render(){
    const el=document.getElementById('ffGrid');
    el.style.gridTemplateColumns=`repeat(${SIZE},1fr)`;
    el.innerHTML='';
    grid.forEach(row=>row.forEach(v=>{
      const d=document.createElement('div');
      d.className='ff-cell'; d.style.background=COLORS[v];
      el.appendChild(d);
    }));
  }

  newGame();
  </script>
