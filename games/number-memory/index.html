<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612" crossorigin="anonymous"></script>
  <title>Pergamon Atlas | Number Memory</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/styles/header.css">
  <link rel="stylesheet" href="/styles/sidebar.css">
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/footer.css">
  <style>
    .game-hero{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);color:white;border:2px solid #8a611c;border-radius:16px;padding:28px;margin-bottom:24px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
    .game-hero h2{margin:0 0 8px;font-size:clamp(28px,4vw,42px);color:#f0d39b}
    .game-hero p{margin:0;font-size:16px;color:#ccc}
    .panel{background:white;border:2px solid #000;border-radius:16px;padding:32px 24px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:20px;text-align:center}
    .big-number{font-size:clamp(36px,10vw,72px);font-weight:900;font-family:monospace;color:#111;letter-spacing:4px;margin:24px 0;min-height:90px;display:flex;align-items:center;justify-content:center}
    .phase-label{font-size:15px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
    .progress-bar{height:8px;background:#eee;border-radius:999px;overflow:hidden;margin:8px auto 20px;max-width:300px}
    .progress-fill{height:100%;background:#8a611c;border-radius:999px;transition:.1s linear}
    .input-wrap{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    .num-input{padding:14px;border:2px solid #ccc;border-radius:10px;font-size:24px;font-family:monospace;text-align:center;width:220px;outline:none;letter-spacing:3px;transition:border .15s}
    .num-input:focus{border-color:#8a611c}
    .num-input.correct{border-color:#2a9d3a;background:#e9fbe9}
    .num-input.wrong{border-color:#c0392b;background:#fdf0f0}
    .status{font-size:18px;font-weight:800;min-height:26px;margin-bottom:12px}
    .status.win{color:#2a9d3a}.status.lose{color:#c0392b}
    .atlas-btn{border:none;border-radius:10px;padding:12px 28px;font-size:15px;font-family:Georgia,serif;cursor:pointer;background:#000;color:white;transition:.15s}
    .atlas-btn:hover{background:#222}
    .level-badge{display:inline-block;background:#111;color:#f0d39b;border-radius:8px;padding:6px 16px;font-size:16px;font-weight:800;margin-bottom:16px;font-family:monospace}
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="game-hero">
        <h2>Number Memory</h2>
        <p>Memorize the number, then type it back. Each round gets longer!</p>
      </div>
      <div class="panel">
        <div class="level-badge" id="levelBadge">Level 1</div>
        <div class="phase-label" id="phaseLabel">Memorize this number</div>
        <div class="big-number" id="bigNum">?</div>
        <div class="progress-bar" id="progressWrap"><div class="progress-fill" id="progressFill" style="width:100%"></div></div>
        <div id="inputWrap" class="input-wrap" style="display:none">
          <input class="num-input" id="numInput" type="text" inputmode="numeric" placeholder="Type the number" autocomplete="off" onkeydown="if(event.key==='Enter')checkAnswer()">
        </div>
        <div class="status" id="status"></div>
        <button class="atlas-btn" id="mainBtn" onclick="handleBtn()">Start</button>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/scripts/atlas.js"></script>
  <script>
    loadSnippets('Number Memory');

    let level,secret,phase,timerInt,best;
    best=parseInt(localStorage.getItem('numem_best')||0);
    phase='idle';

    function handleBtn(){
      if(phase==='idle'||phase==='feedback') nextLevel();
      else if(phase==='memorize') skipToInput();
      else if(phase==='input') checkAnswer();
    }

    function nextLevel(){
      if(phase==='idle') level=1;
      secret=Array.from({length:level+1},()=>Math.floor(Math.random()*10)).join('');
      phase='memorize';
      document.getElementById('levelBadge').textContent='Level '+level;
      document.getElementById('bigNum').textContent=secret;
      document.getElementById('phaseLabel').textContent='Memorize this number';
      document.getElementById('inputWrap').style.display='none';
      document.getElementById('progressWrap').style.display='block';
      document.getElementById('status').textContent='';
      document.getElementById('numInput').className='num-input';
      document.getElementById('numInput').value='';
      document.getElementById('mainBtn').textContent='Skip →';
      // Countdown
      const dur=Math.min(3000,1000+level*400);
      let elapsed=0;
      clearInterval(timerInt);
      timerInt=setInterval(()=>{elapsed+=100;document.getElementById('progressFill').style.width=(100-elapsed/dur*100)+'%';if(elapsed>=dur){clearInterval(timerInt);showInput();}},100);
    }

    function skipToInput(){clearInterval(timerInt);showInput();}

    function showInput(){
      phase='input';
      document.getElementById('bigNum').textContent='?';
      document.getElementById('phaseLabel').textContent='What was the number?';
      document.getElementById('progressWrap').style.display='none';
      document.getElementById('inputWrap').style.display='flex';
      document.getElementById('mainBtn').textContent='Submit';
      document.getElementById('numInput').focus();
    }

    function checkAnswer(){
      const ans=document.getElementById('numInput').value.trim();
      phase='feedback';
      clearInterval(timerInt);
      if(ans===secret){
        document.getElementById('numInput').className='num-input correct';
        document.getElementById('bigNum').textContent=secret;
        document.getElementById('status').textContent='Correct! +1 level';
        document.getElementById('status').className='status win';
        if(level>best){best=level;localStorage.setItem('numem_best',best);}
        level++;
        document.getElementById('mainBtn').textContent='Next Level →';
      } else {
        document.getElementById('numInput').className='num-input wrong';
        document.getElementById('bigNum').textContent=secret;
        document.getElementById('status').textContent='Wrong! The number was: '+secret+' | Best: Level '+best;
        document.getElementById('status').className='status lose';
        document.getElementById('mainBtn').textContent='Try Again';
        level=1;
      }
    }
  </script>
</body>
</html>
