  <script>
  const BASE=[
    [1,2,3,4,5,6,7,8,9],[4,5,6,7,8,9,1,2,3],[7,8,9,1,2,3,4,5,6],
    [2,3,4,5,6,7,8,9,1],[5,6,7,8,9,1,2,3,4],[8,9,1,2,3,4,5,6,7],
    [3,4,5,6,7,8,9,1,2],[6,7,8,9,1,2,3,4,5],[9,1,2,3,4,5,6,7,8]
  ];
  let solved,puzzle,userGrid,given,selected,difficulty='easy',mistakes=0,timerSec=0,timerInt;

  function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

  function generateSolved(){
    const nums=shuffle([1,2,3,4,5,6,7,8,9]);
    let b=BASE.map(r=>r.map(n=>nums[n-1]));
    for(let band=0;band<3;band++){
      const rows=shuffle([0,1,2]);
      const saved=[b[band*3].slice(),b[band*3+1].slice(),b[band*3+2].slice()];
      for(let i=0;i<3;i++)b[band*3+i]=saved[rows[i]];
    }
    let t=b[0].map((_,c)=>b.map(row=>row[c]));
    for(let s=0;s<3;s++){
      const cols=shuffle([0,1,2]);
      const saved=[t[s*3].slice(),t[s*3+1].slice(),t[s*3+2].slice()];
      for(let i=0;i<3;i++)t[s*3+i]=saved[cols[i]];
    }
    return t[0].map((_,c)=>t.map(row=>row[c]));
  }

  function makePuzzle(s,remove){
    const p=s.map(r=>r.slice());
    shuffle([...Array(81).keys()]).slice(0,remove).forEach(i=>{p[Math.floor(i/9)][i%9]=0;});
    return p;
  }

  function newGame(diff){
    difficulty=diff;
    ['dEasy','dMed','dHard'].forEach(id=>document.getElementById(id).classList.remove('active'));
    document.getElementById({easy:'dEasy',medium:'dMed',hard:'dHard'}[diff]).classList.add('active');
    solved=generateSolved();
    const remove={easy:36,medium:48,hard:55}[diff];
    puzzle=makePuzzle(solved,remove);
    userGrid=puzzle.map(r=>r.slice());
    given=puzzle.map(r=>r.map(v=>v!==0));
    selected=null; mistakes=0; timerSec=0;
    clearInterval(timerInt);
    timerInt=setInterval(()=>{timerSec++;document.getElementById('timerEl').textContent=Math.floor(timerSec/60)+':'+(timerSec%60+'').padStart(2,'0');},1000);
    document.getElementById('mistakesEl').textContent='0';
    document.getElementById('sdkMsg').textContent='';
    render(); buildNumpad();
  }

  function buildNumpad(){
    const np=document.getElementById('numpad');
    np.innerHTML='';
    [1,2,3,4,5,6,7,8,9].forEach(n=>{
      const b=document.createElement('button');
      b.className='sdk-num';b.textContent=n;b.onclick=()=>fillCell(n);np.appendChild(b);
    });
    const e=document.createElement('button');
    e.className='sdk-num erase';e.textContent='Erase';e.onclick=()=>fillCell(0);np.appendChild(e);
  }

  function fillCell(n){
    if(!selected)return;
    const[r,c]=selected;
    if(given[r][c])return;
    userGrid[r][c]=n;
    if(n!==0&&n!==solved[r][c]){mistakes++;document.getElementById('mistakesEl').textContent=mistakes;}
    checkWin(); render();
  }

  function checkWin(){
    for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(userGrid[r][c]!==solved[r][c])return;
    clearInterval(timerInt);
    document.getElementById('sdkMsg').textContent='Solved! Well done.';
  }

  function checkBoard(){
    let ok=true;
    for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(userGrid[r][c]!==0&&userGrid[r][c]!==solved[r][c])ok=false;
    document.getElementById('sdkMsg').textContent=ok?'No errors found.':'Some cells are incorrect.';
    setTimeout(()=>document.getElementById('sdkMsg').textContent='',2500);
  }

  function getConflicts(){
    const bad=new Set();
    for(let r=0;r<9;r++)for(let c=0;c<9;c++){
      const v=userGrid[r][c];if(!v)continue;
      for(let k=0;k<9;k++){
        if(k!==c&&userGrid[r][k]===v)bad.add(r*9+c);
        if(k!==r&&userGrid[k][c]===v)bad.add(r*9+c);
      }
      const br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
      for(let dr=0;dr<3;dr++)for(let dc=0;dc<3;dc++){
        const nr=br+dr,nc=bc+dc;
        if((nr!==r||nc!==c)&&userGrid[nr][nc]===v)bad.add(r*9+c);
      }
    }
    return bad;
  }

  function getPeers(r,c){
    const p=new Set();
    for(let k=0;k<9;k++){p.add(r*9+k);p.add(k*9+c);}
    const br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
    for(let dr=0;dr<3;dr++)for(let dc=0;dc<3;dc++)p.add((br+dr)*9+(bc+dc));
    return p;
  }

  function render(){
    const board=document.getElementById('sdkBoard');
    board.innerHTML='';
    const conflicts=getConflicts();
    const peers=selected?getPeers(...selected):new Set();
    for(let r=0;r<9;r++)for(let c=0;c<9;c++){
      const cell=document.createElement('div');
      const idx=r*9+c;
      let cls='sdk-cell';
      if(given[r][c])cls+=' given'; else cls+=' user';
      if(selected&&selected[0]===r&&selected[1]===c)cls+=' selected';
      else if(peers.has(idx))cls+=' peer';
      if(conflicts.has(idx))cls+=' conflict';
      if(c===2||c===5)cls+=' bdr';
      if(r===2||r===5)cls+=' bdb';
      cell.className=cls;
      if(userGrid[r][c])cell.textContent=userGrid[r][c];
      cell.onclick=()=>{if(!given[r][c]){selected=[r,c];render();}else{selected=[r,c];render();}};
      board.appendChild(cell);
    }
  }

  newGame('easy');
  </script>
