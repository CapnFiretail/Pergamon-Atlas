<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4717716734064612" crossorigin="anonymous"></script>
  <title>Pergamon Atlas | Memory Match</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/styles/header.css">
  <link rel="stylesheet" href="/styles/sidebar.css">
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/footer.css">
  <style>
    .game-hero{background:linear-gradient(135deg,#111 0%,#1a1a1a 100%);color:white;border:2px solid #8a611c;border-radius:16px;padding:28px;margin-bottom:24px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
    .game-hero h2{margin:0 0 8px;font-size:clamp(28px,4vw,42px);color:#f0d39b}
    .game-hero p{margin:0;font-size:16px;color:#ccc}
    .panel{background:white;border:2px solid #000;border-radius:16px;padding:20px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:20px;text-align:center}
    .hud{display:flex;justify-content:center;gap:28px;margin-bottom:14px;font-size:15px;font-weight:700}
    .hud .val{font-size:26px;display:block;color:#8a611c;font-family:monospace}
    .grid{display:grid;gap:8px;max-width:480px;margin:0 auto 16px}
    .card{aspect-ratio:1;border:2px solid #ccc;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,5vw,36px);background:#f7f7f7;transition:transform .15s,background .15s;user-select:none}
    .card:hover:not(.flipped):not(.matched){border-color:#8a611c;background:#fdf6e9}
    .card.flipped{background:#111;border-color:#8a611c;color:#f0d39b;transform:scale(1.04)}
    .card.matched{background:#e9fbe9;border-color:#2a9d3a;cursor:default}
    .card.wrong{background:#fdf0f0;border-color:#c0392b;animation:shake .3s}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
    .diff-row{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
    .diff-btn{padding:7px 16px;border:2px solid #ccc;border-radius:8px;background:white;font-size:13px;font-family:Georgia,serif;cursor:pointer;font-weight:700;transition:.15s}
    .diff-btn.active{background:#111;color:white;border-color:#111}
    .atlas-btn{border:none;border-radius:10px;padding:10px 22px;font-size:14px;font-family:Georgia,serif;cursor:pointer;background:#000;color:white;transition:.15s}
    .atlas-btn:hover{background:#222}
    .win-msg{font-size:20px;font-weight:800;color:#2a9d3a;min-height:28px}
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="layout">
    <div id="sidebar-placeholder"></div>
    <main class="main-content">
      <div class="game-hero">
        <h2>Memory Match</h2>
        <p>Flip cards to find matching pairs</p>
      </div>
      <div class="panel">
        <div class="diff-row">
          <button class="diff-btn active" onclick="startGame(4,this)">4×4</button>
          <button class="diff-btn" onclick="startGame(5,this)">5×4</button>
          <button class="diff-btn" onclick="startGame(6,this)">6×4</button>
        </div>
        <div class="hud">
          <span><span class="val" id="movesVal">0</span>Moves</span>
          <span><span class="val" id="pairsVal">0/0</span>Pairs</span>
          <span><span class="val" id="timeVal">0:00</span>Time</span>
        </div>
        <div class="grid" id="grid"></div>
        <div class="win-msg" id="winMsg"></div>
        <button class="atlas-btn" onclick="startGame(currentCols,null)">New Game</button>
      </div>
    </main>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/scripts/atlas.js"></script>
  <script>
    loadSnippets('Memory Match');

    const EMOJIS='🐶🐱🐭🐹🐰🦊🐻🐼🐨🐯🦁🐮🐸🐵🐔🐧🦋🌺🌸🍎🍕🚀⭐🎸🎭🎪🏆🎯🎲🎡';
    let flipped=[],matched=0,moves=0,total,locked,timer,elapsed,currentCols;

    function startGame(cols,btn){
      if(btn){document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
      currentCols=cols||currentCols||4;
      const rows=4;total=(currentCols*rows)/2;
      clearInterval(timer);elapsed=0;moves=0;matched=0;flipped=[];locked=false;
      document.getElementById('movesVal').textContent=0;
      document.getElementById('pairsVal').textContent='0/'+total;
      document.getElementById('timeVal').textContent='0:00';
      document.getElementById('winMsg').textContent='';

      const symbols=EMOJIS.slice(0,total).split('');
      const deck=[...symbols,...symbols].sort(()=>Math.random()-.5);
      const grid=document.getElementById('grid');
      grid.style.gridTemplateColumns=`repeat(${currentCols},1fr)`;
      grid.innerHTML=deck.map((s,i)=>`<div class="card" data-idx="${i}" data-sym="${s}" onclick="flip(this)">?</div>`).join('');

      timer=setInterval(()=>{elapsed++;const m=Math.floor(elapsed/60),s=elapsed%60;document.getElementById('timeVal').textContent=m+':'+(s<10?'0':'')+s;},1000);
    }

    function flip(card){
      if(locked||card.classList.contains('flipped')||card.classList.contains('matched')) return;
      card.textContent=card.dataset.sym;card.classList.add('flipped');
      flipped.push(card);
      if(flipped.length===2){
        locked=true;moves++;document.getElementById('movesVal').textContent=moves;
        if(flipped[0].dataset.sym===flipped[1].dataset.sym){
          flipped.forEach(c=>c.classList.replace('flipped','matched'));
          matched++;document.getElementById('pairsVal').textContent=matched+'/'+total;
          flipped=[];locked=false;
          if(matched===total){clearInterval(timer);document.getElementById('winMsg').textContent=`You win! ${moves} moves, ${document.getElementById('timeVal').textContent}`;}
        } else {
          flipped.forEach(c=>c.classList.add('wrong'));
          setTimeout(()=>{flipped.forEach(c=>{c.classList.remove('flipped','wrong');c.textContent='?';});flipped=[];locked=false;},900);
        }
      }
    }

    startGame(4,null);
  </script>
</body>
</html>
