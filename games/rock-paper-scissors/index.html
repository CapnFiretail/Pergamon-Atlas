          <div class="arena-side"><div class="who">CPU</div><div class="arena-emoji" id="emojiCPU">❓</div></div>

        <div class="choices">
          <button class="choice-btn" onclick="play('rock')" title="Rock">🪨</button>
          <button class="choice-btn" onclick="play('paper')" title="Paper">📄</button>
          <button class="choice-btn" onclick="play('scissors')" title="Scissors">✂️</button>

  <script src="/function/scripts/atlas.js"></script>
  <script>
    loadSnippets('Rock Paper Scissors');

    const emojis = {rock:'🪨', paper:'📄', scissors:'✂️'};
    const moves = ['rock','paper','scissors'];
    let scores = {you:0,tie:0,ai:0};
    let history = [];

    function beats(a, b) {
      return (a==='rock'&&b==='scissors')||(a==='paper'&&b==='rock')||(a==='scissors'&&b==='paper');
    }

    function play(choice) {
      const cpu = moves[Math.floor(Math.random()*3)];
      document.getElementById('emojiYou').textContent = emojis[choice];
      document.getElementById('emojiCPU').textContent = emojis[cpu];

      const msg = document.getElementById('resultMsg');
      let result;
      if(choice===cpu){scores.tie++;msg.className='result-msg tie';msg.textContent='Tie!';result='t';}
      else if(beats(choice,cpu)){scores.you++;msg.className='result-msg win';msg.textContent='You win!';result='w';}
      else{scores.ai++;msg.className='result-msg lose';msg.textContent='CPU wins!';result='l';}

      document.getElementById('scoreYou').textContent=scores.you;
      document.getElementById('scoreTie').textContent=scores.tie;
      document.getElementById('scoreAI').textContent=scores.ai;

      history.unshift({y:emojis[choice],c:emojis[cpu],r:result});
      if(history.length>20) history.pop();
      document.getElementById('histRow').innerHTML=history.map(h=>
        `<div class="hist-chip ${h.r}">${h.y}vs${h.c}</div>`).join('');
    }

    function reset(){scores={you:0,tie:0,ai:0};history=[];document.getElementById('scoreYou').textContent=0;document.getElementById('scoreTie').textContent=0;document.getElementById('scoreAI').textContent=0;document.getElementById('emojiYou').textContent='❓';document.getElementById('emojiCPU').textContent='❓';document.getElementById('resultMsg').className='result-msg';document.getElementById('resultMsg').textContent='Choose your move!';document.getElementById('histRow').innerHTML='';}
  </script>
