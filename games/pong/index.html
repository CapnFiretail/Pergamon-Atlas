<body>
<div id="header-placeholder"></div>
<div class="layout">

<main class="main-content">
  <div class="game-hero">
    <h2>Pong</h2>
    <p>First to 7 wins — classic arcade paddle battle</p>
  </div>
  <div class="panel">
    <div class="diff-row">
      <button class="diff-btn" id="dEasy"   onclick="setDiff('easy')">Easy</button>
      <button class="diff-btn active" id="dMed" onclick="setDiff('medium')">Medium</button>
      <button class="diff-btn" id="dHard"   onclick="setDiff('hard')">Hard</button>
    </div>
    <canvas id="pongCanvas" width="520" height="340"></canvas>
    <div class="pong-msg" id="pongMsg">Click or tap to start</div>
    <button class="atlas-btn" id="pongBtn" onclick="pongStart()">Start Game</button>
    <div class="pong-hint">W/S or ↑/↓ to move — or drag the paddle on touch</div>
  </div>

<script>
loadSnippets('Games');

const canvas=document.getElementById('pongCanvas');
const ctx=canvas.getContext('2d');
const CW=520,CH=340;
const PAD_W=10,PAD_H=64,BALL_S=9;
const WIN_SCORE=7;

let state='idle';
let difficulty='medium';
let ball,p1,p2,raf;
let keys={};
let touchY=null;

function setDiff(d){
  difficulty=d;
  document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('d'+d.charAt(0).toUpperCase()+d.slice(1)).classList.add('active');
}

function aiSpeed(){return{easy:2.2,medium:3.5,hard:5.2}[difficulty];}

function resetBall(dir){
  const spd=5;
  const angle=(Math.random()*0.6-0.3);
  ball={x:CW/2,y:CH/2,dx:dir*spd*Math.cos(angle),dy:spd*Math.sin(angle),r:BALL_S/2};
}

function pongStart(){
  p1={x:14,y:CH/2-PAD_H/2,score:0};
  p2={x:CW-14-PAD_W,y:CH/2-PAD_H/2,score:0};
  resetBall(1);
  state='playing';
  document.getElementById('pongBtn').style.display='none';
  document.getElementById('pongMsg').textContent='';
  if(raf) cancelAnimationFrame(raf);
  loop();
}

function loop(){
  if(state!=='playing') return;
  update();
  draw();
  raf=requestAnimationFrame(loop);
}

document.addEventListener('keydown',e=>{keys[e.key]=true;});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(state==='idle'){pongStart();return;}
  touchY=e.touches[0].clientY;
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(touchY===null) return;
  const rect=canvas.getBoundingClientRect();
  const scaleY=CH/rect.height;
  const ny=(e.touches[0].clientY-rect.top)*scaleY;
  p1.y=Math.max(0,Math.min(CH-PAD_H,ny-PAD_H/2));
  touchY=e.touches[0].clientY;
},{passive:false});

function update(){
  const pspd=6;
  if(keys['w']||keys['W']||keys['ArrowUp']){p1.y=Math.max(0,p1.y-pspd);}
  if(keys['s']||keys['S']||keys['ArrowDown']){p1.y=Math.min(CH-PAD_H,p1.y+pspd);}

  const target=ball.y-PAD_H/2+ball.r;
  const diff=target-p2.y;
  const as=aiSpeed();
  p2.y+=Math.max(-as,Math.min(as,diff));
  p2.y=Math.max(0,Math.min(CH-PAD_H,p2.y));

  ball.x+=ball.dx;
  ball.y+=ball.dy;

  if(ball.y-ball.r<=0){ball.y=ball.r;ball.dy=Math.abs(ball.dy);}
  if(ball.y+ball.r>=CH){ball.y=CH-ball.r;ball.dy=-Math.abs(ball.dy);}

  if(ball.dx<0&&ball.x-ball.r<=p1.x+PAD_W&&ball.x+ball.r>=p1.x&&ball.y+ball.r>=p1.y&&ball.y-ball.r<=p1.y+PAD_H){
    const hit=(ball.y-(p1.y+PAD_H/2))/(PAD_H/2);
    const spd=Math.sqrt(ball.dx*ball.dx+ball.dy*ball.dy)*1.04;
    const ang=hit*1.1;
    ball.dx=Math.abs(spd*Math.cos(ang));
    ball.dy=spd*Math.sin(ang);
    ball.x=p1.x+PAD_W+ball.r;
  }

  if(ball.dx>0&&ball.x+ball.r>=p2.x&&ball.x-ball.r<=p2.x+PAD_W&&ball.y+ball.r>=p2.y&&ball.y-ball.r<=p2.y+PAD_H){
    const hit=(ball.y-(p2.y+PAD_H/2))/(PAD_H/2);
    const spd=Math.sqrt(ball.dx*ball.dx+ball.dy*ball.dy)*1.04;
    const ang=hit*1.1;
    ball.dx=-Math.abs(spd*Math.cos(ang));
    ball.dy=spd*Math.sin(ang);
    ball.x=p2.x-ball.r;
  }

  if(ball.x-ball.r<0){
    p2.score++;
    if(p2.score>=WIN_SCORE){endGame('ai');return;}
    resetBall(1);
  }
  if(ball.x+ball.r>CW){
    p1.score++;
    if(p1.score>=WIN_SCORE){endGame('player');return;}
    resetBall(-1);
  }
}

function endGame(who){
  state='over';
  cancelAnimationFrame(raf);
  draw();
  if(who==='player') document.getElementById('pongMsg').textContent='You win! 🎉';
  else document.getElementById('pongMsg').textContent='AI wins!';
  document.getElementById('pongBtn').style.display='';
  document.getElementById('pongBtn').textContent='Play Again';
}

function draw(){
  ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,CW,CH);

  ctx.setLineDash([8,8]);
  ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(CW/2,0);ctx.lineTo(CW/2,CH);ctx.stroke();
  ctx.setLineDash([]);

  ctx.font='bold 42px Georgia';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.fillText(p1?p1.score:0,CW/4,54);
  ctx.fillText(p2?p2.score:0,CW*3/4,54);

  ctx.fillStyle='#f0d39b';
  ctx.beginPath();ctx.roundRect(p1.x,p1.y,PAD_W,PAD_H,4);ctx.fill();
  ctx.beginPath();ctx.roundRect(p2.x,p2.y,PAD_W,PAD_H,4);ctx.fill();

  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fillStyle='white';ctx.fill();
}

state='idle';
p1={x:14,y:CH/2-PAD_H/2,score:0};
p2={x:CW-14-PAD_W,y:CH/2-PAD_H/2,score:0};
ball={x:CW/2,y:CH/2,dx:0,dy:0,r:BALL_S/2};
draw();
</script>
