<script>
loadSnippets('Games');

const SHIPS=[{name:'Carrier',size:5},{name:'Battleship',size:4},{name:'Cruiser',size:3},{name:'Submarine',size:3},{name:'Destroyer',size:2}];
let phase='placement';
let playerBoard,enemyBoard,playerShips,enemyShips;
let aiQueue,aiLastHit;
let scores={p:0,a:0};

function emptyBoard(){return Array.from({length:10},()=>Array(10).fill(0));}

function canPlace(b,r,c,size,h){
  for(let i=0;i<size;i++){
    const nr=h?r:r+i, nc=h?c+i:c;
    if(nr<0||nr>9||nc<0||nc>9||b[nr][nc]) return false;
  }
  return true;
}

function placeShip(b,r,c,size,h,id){
  for(let i=0;i<size;i++){const nr=h?r:r+i,nc=h?c+i:c; b[nr][nc]=id;}
}

function randomFleet(b){
  const ships=[];
  let id=1;
  for(const s of SHIPS){
    let placed=false;
    while(!placed){
      const h=Math.random()<.5,r=Math.floor(Math.random()*10),c=Math.floor(Math.random()*10);
      if(canPlace(b,r,c,s.size,h)){placeShip(b,r,c,s.size,h,id);ships.push({...s,id,hits:0});placed=true;}
    }
    id++;
  }
  return ships;
}

function randomizePlayer(){
  if(phase==='battle') return;
  playerBoard=emptyBoard();
  playerShips=randomFleet(playerBoard);
  renderPlayerGrid();
  updateFleetInfo();
}

function readyOrNew(){
  if(phase==='placement'){
    if(!playerShips||!playerShips.length) randomizePlayer();
    enemyBoard=emptyBoard();
    enemyShips=randomFleet(enemyBoard);
    aiQueue=[];
    aiLastHit=null;
    phase='battle';
    document.getElementById('btnRandom').disabled=true;
    document.getElementById('btnReady').textContent='New Game';
    setStatus('Your turn — click the enemy waters!');
    renderEnemyGrid(true);
    updateFleetInfo();
  } else {
    phase='placement';
    document.getElementById('btnRandom').disabled=false;
    document.getElementById('btnReady').textContent='Ready!';
    randomizePlayer();
    enemyBoard=emptyBoard();
    renderEnemyGrid(false);
    setStatus('Press Random Fleet then Ready to start');
    updateFleetInfo();
  }
}

function setStatus(msg){document.getElementById('bsStatus').textContent=msg;}

function playerFire(r,c){
  if(phase!=='battle') return;
  const v=enemyBoard[r][c];
  if(v==='H'||v==='M'||v==='S') return;
  if(v!==0){
    const ship=enemyShips.find(s=>s.id===v);
    ship.hits++;
    enemyBoard[r][c]='H';
    if(ship.hits===ship.size){markSunk(enemyBoard,enemyShips,ship);setStatus(`Hit! You sank their ${ship.name}!`);}
    else setStatus('Hit! Fire again!');
    renderEnemyGrid(true);
    updateFleetInfo();
    if(allSunk(enemyShips)){endGame('p');return;}
  } else {
    enemyBoard[r][c]='M';
    setStatus("Miss. AI's turn…");
    renderEnemyGrid(true);
  }
  setTimeout(aiTurn,700);
}

function markSunk(board,ships,ship){
  for(let r=0;r<10;r++)for(let c=0;c<10;c++)if(board[r][c]===ship.id)board[r][c]='S';
}

function allSunk(ships){return ships.every(s=>s.hits>=s.size);}

function aiPick(){
  if(aiQueue.length){
    while(aiQueue.length){
      const [r,c]=aiQueue.shift();
      const v=playerBoard[r][c];
      if(v!=='H'&&v!=='M'&&v!=='S') return [r,c];
    }
  }
  let r,c;
  do{r=Math.floor(Math.random()*10);c=Math.floor(Math.random()*10);}
  while(playerBoard[r][c]==='H'||playerBoard[r][c]==='M'||playerBoard[r][c]==='S');
  return [r,c];
}

function aiTurn(){
  if(phase!=='battle') return;
  const [r,c]=aiPick();
  const v=playerBoard[r][c];
  if(v!==0&&v!=='H'&&v!=='M'&&v!=='S'){
    const ship=playerShips.find(s=>s.id===v);
    ship.hits++;
    playerBoard[r][c]='H';
    for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<=9&&nc>=0&&nc<=9){const nv=playerBoard[nr][nc];if(nv!=='H'&&nv!=='M'&&nv!=='S')aiQueue.push([nr,nc]);}
    }
    if(ship.hits===ship.size){markSunk(playerBoard,playerShips,ship);aiQueue=[];setStatus(`AI sank your ${ship.name}!`);}
    else setStatus(`AI hit your ${ship.name}!`);
  } else {
    playerBoard[r][c]='M';
    setStatus("AI missed. Your turn!");
  }
  renderPlayerGrid();
  updateFleetInfo();
  if(allSunk(playerShips)){endGame('a');}
}

function endGame(who){
  phase='over';
  if(who==='p'){scores.p++;setStatus('You win! All enemy ships destroyed!');}
  else{scores.a++;setStatus('AI wins! Your fleet has been sunk.');}
  document.getElementById('scoreP').textContent=scores.p;
  document.getElementById('scoreA').textContent=scores.a;
  renderEnemyGrid(false);
  renderPlayerGrid();
}

function renderPlayerGrid(){
  const el=document.getElementById('playerGrid');el.innerHTML='';
  for(let r=0;r<10;r++)for(let c=0;c<10;c++){
    const btn=document.createElement('button');
    btn.className='bs-cell';
    const v=playerBoard[r][c];
    if(v==='H')btn.className+=' hit';
    else if(v==='M')btn.className+=' miss';
    else if(v==='S')btn.className+=' sunk';
    else if(v!==0)btn.className+=' ship';
    el.appendChild(btn);
  }
}

function renderEnemyGrid(interactive){
  const el=document.getElementById('enemyGrid');el.innerHTML='';
  for(let r=0;r<10;r++)for(let c=0;c<10;c++){
    const btn=document.createElement('button');
    btn.className='bs-cell';
    const v=enemyBoard[r][c];
    if(v==='H')btn.className+=' hit';
    else if(v==='M')btn.className+=' miss';
    else if(v==='S')btn.className+=' sunk';
    if(interactive&&phase==='battle'&&v!=='H'&&v!=='M'&&v!=='S'){
      btn.className+=' attackable';
      const rr=r,cc=c;btn.onclick=()=>playerFire(rr,cc);
    }
    el.appendChild(btn);
  }
}

function updateFleetInfo(){
  const el=document.getElementById('fleetInfo');el.innerHTML='';
  if(!enemyShips||!enemyShips.length) return;
  for(const s of enemyShips){
    const badge=document.createElement('span');
    badge.className='ship-badge'+(s.hits>=s.size?' sunk':'');
    badge.textContent=s.name+' ('+s.size+')';
    el.appendChild(badge);
  }
}

playerBoard=emptyBoard();enemyBoard=emptyBoard();
renderPlayerGrid();renderEnemyGrid(false);
</script>

<script src="/data/entries.js"></script>
