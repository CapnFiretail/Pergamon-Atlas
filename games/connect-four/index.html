  <script>
    loadSnippets('Connect Four');

    const ROWS=6,COLS=7;
    let grid,turn,gameOver,mode,scores;
    scores={p1:0,p2:0,tie:0};mode='2p';

    function setMode(m){mode=m;document.getElementById('btn2p').classList.toggle('active',m==='2p');document.getElementById('btnAI').classList.toggle('active',m==='ai');reset();}

    function reset(){
      grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));
      turn=1;gameOver=false;
      setStatus();renderBoard();buildColBtns();
    }

    function setStatus(){
      const el=document.getElementById('status');
      if(!gameOver) el.textContent=(turn===1?'🔴 Player 1':'🟡 '+(mode==='ai'?'Computer':'Player 2'))+"'s turn";
    }

    function buildColBtns(){
      const row=document.getElementById('colBtns');
      row.innerHTML=Array.from({length:COLS},(_,c)=>
        `<button class="col-btn" onclick="drop(${c})">${turn===1?'🔴':'🟡'}</button>`).join('');
    }

    function drop(col){
      if(gameOver) return;
      const row=getRow(col);if(row===-1) return;
      grid[row][col]=turn;
      renderBoard();
      const win=checkWin(row,col,turn);
      if(win){gameOver=true;highlightWin(win);scores['p'+turn]++;updateScores();
        document.getElementById('status').textContent=(turn===1?'🔴 Player 1':'🟡 '+(mode==='ai'?'Computer':'Player 2'))+' wins!';return;}
      if(grid[0].every(c=>c!==0)){gameOver=true;scores.tie++;updateScores();document.getElementById('status').textContent="It's a tie!";return;}
      turn=turn===1?2:1;
      setStatus();buildColBtns();
      if(mode==='ai'&&turn===2) setTimeout(aiMove,400);
    }

    function getRow(col){for(let r=ROWS-1;r>=0;r--)if(grid[r][col]===0)return r;return -1;}

    function aiMove(){
      // Try to win, block player, else pick best column
      const best=findBestMove(2)||findBestMove(1)||getCenterOrRandom();
      if(best!==null) drop(best);
    }

    function findBestMove(player){
      for(let c=0;c<COLS;c++){const r=getRow(c);if(r===-1)continue;grid[r][c]=player;const w=checkWin(r,c,player);grid[r][c]=0;if(w)return c;}
      return null;
    }

    function getCenterOrRandom(){
      if(getRow(3)!==-1) return 3;
      const valid=[];for(let c=0;c<COLS;c++)if(getRow(c)!==-1)valid.push(c);
      return valid[Math.floor(Math.random()*valid.length)]??null;
    }

    function checkWin(r,c,p){
      const dirs=[[0,1],[1,0],[1,1],[1,-1]];
      for(const [dr,dc] of dirs){
        const line=[[r,c]];
        for(const s of[-1,1])for(let i=1;i<4;i++){const nr=r+dr*i*s,nc=c+dc*i*s;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr][nc]===p)line.push([nr,nc]);else break;}
        if(line.length>=4)return line.slice(0,4);
      }
      return null;
    }

    function highlightWin(cells){
      renderBoard();
      cells.forEach(([r,c])=>{
        const discs=document.getElementById('board').children;
        discs[r*COLS+c].classList.add('win');
      });
    }

    function renderBoard(){
      const b=document.getElementById('board');b.innerHTML='';
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
        const d=document.createElement('div');d.className='disc'+(grid[r][c]===1?' p1':grid[r][c]===2?' p2':'');
        b.appendChild(d);
      }
    }

    function updateScores(){document.getElementById('scoreP1').textContent=scores.p1;document.getElementById('scoreP2').textContent=scores.p2;document.getElementById('scoreTie').textContent=scores.tie;}

    reset();
  </script>
