<script>
loadSnippets('Games');

const ROWS=6, COLS=7;
let board, gameActive, playerTurn;
let scores={p:0,a:0,d:0};

function newGame() {
  board = Array.from({length:ROWS},()=>Array(COLS).fill(0));
  gameActive = true;
  playerTurn = true;
  render();
  setStatus('Your turn 🔴','');
}

function setStatus(msg,color){
  const el=document.getElementById('status');
  el.textContent=msg; el.style.color=color;
}

function dropPiece(col,player) {
  for(let r=ROWS-1;r>=0;r--) {
    if(!board[r][col]) { board[r][col]=player; return r; }
  }
  return -1;
}

function colFull(col) { return board[0][col]!==0; }

function checkWin(r,c,player) {
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(const [dr,dc] of dirs) {
    let cells=[[r,c]];
    for(let s=1;s<4;s++){const nr=r+dr*s,nc=c+dc*s;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc]===player)cells.push([nr,nc]);else break;}
    for(let s=1;s<4;s++){const nr=r-dr*s,nc=c-dc*s;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc]===player)cells.push([nr,nc]);else break;}
    if(cells.length>=4) return cells.slice(0,4);
  }
  return null;
}

function isDraw() { return board[0].every(c=>c!==0); }

function aiMove() {
  // Win if possible
  for(let c=0;c<COLS;c++) {
    if(colFull(c)) continue;
    for(let r=ROWS-1;r>=0;r--) { if(!board[r][c]){board[r][c]=2;const w=checkWin(r,c,2);board[r][c]=0;if(w)return c;break;} }
  }
  // Block player win
  for(let c=0;c<COLS;c++) {
    if(colFull(c)) continue;
    for(let r=ROWS-1;r>=0;r--) { if(!board[r][c]){board[r][c]=1;const w=checkWin(r,c,1);board[r][c]=0;if(w)return c;break;} }
  }
  // Prefer center columns
  const order=[3,2,4,1,5,0,6];
  for(const c of order) { if(!colFull(c)) return c; }
  return 0;
}

function handleDrop(col) {
  if(!gameActive||!playerTurn||colFull(col)) return;
  const r=dropPiece(col,1);
  render();
  const w=checkWin(r,col,1);
  if(w) { endGame('p',w); return; }
  if(isDraw()) { endGame('d'); return; }
  playerTurn=false;
  setStatus('AI thinking…','#888');
  setTimeout(()=>{
    const ac=aiMove();
    const ar=dropPiece(ac,2);
    const aw=checkWin(ar,ac,2);
    if(aw) { render(); endGame('a',aw); return; }
    if(isDraw()) { render(); endGame('d'); return; }
    playerTurn=true;
    render();
    setStatus('Your turn 🔴','');
  },400);
}

function endGame(who,winCells) {
  gameActive=false;
  if(who==='p'){scores.p++;setStatus('You win! 🎉','#2a9d3a');}
  else if(who==='a'){scores.a++;setStatus('AI wins! 🟡','#c0392b');}
  else{scores.d++;setStatus('Draw!','#888');}
  document.getElementById('scoreP').textContent=scores.p;
  document.getElementById('scoreA').textContent=scores.a;
  document.getElementById('scoreD').textContent=scores.d;
  render(winCells);
}

function render(winCells) {
  // Drop buttons
  const drops=document.getElementById('drops');
  drops.innerHTML='';
  for(let c=0;c<COLS;c++) {
    const btn=document.createElement('button');
    btn.className='cf-drop'; btn.textContent='▼';
    btn.disabled=!gameActive||!playerTurn||colFull(c);
    btn.onclick=()=>handleDrop(c);
    drops.appendChild(btn);
  }
  // Board
  const brd=document.getElementById('board');
  brd.innerHTML='';
  const winSet=winCells?new Set(winCells.map(([r,c])=>r*COLS+c)):new Set();
  for(let r=0;r<ROWS;r++) {
    for(let c=0;c<COLS;c++) {
      const div=document.createElement('div');
      div.className='cf-cell'+(board[r][c]===1?' r':board[r][c]===2?' y':'')+(winSet.has(r*COLS+c)?' win':'');
      brd.appendChild(div);
    }
  }
}

newGame();
</script>
