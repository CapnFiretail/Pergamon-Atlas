  <script>
    const CDN = 'https://lichess1.org/assets/piece/cburnett/';
    const PM = {
      '♔':'wK','♕':'wQ','♖':'wR','♗':'wB','♘':'wN','♙':'wP',
      '♚':'bK','♛':'bQ','♜':'bR','♝':'bB','♞':'bN','♟':'bP',
    };
    const el = document.getElementById('csBoard');
    const pos = [
      '♜','♞','♝','♛','♚','♝','♞','♜',
      '♟','♟','♟','♟','♟','♟','♟','♟',
      '','','','','','','','',
      '','','','','','','','',
      '','','','','','','','',
      '','','','','','','','',
      '♙','♙','♙','♙','♙','♙','♙','♙',
      '♖','♘','♗','♕','♔','♗','♘','♖',
    ];
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const sq = document.createElement('div');
        sq.className = 'ch2-sq ' + ((r + c) % 2 === 0 ? 'l' : 'd');
        const p = pos[r * 8 + c];
        if (p && PM[p]) {
          const img = document.createElement('img');
          img.src = CDN + PM[p] + '.svg';
          img.alt = p; img.draggable = false;
          sq.appendChild(img);
        }
        el.appendChild(sq);
      }
    }
